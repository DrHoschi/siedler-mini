<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siedler-Mini · DOT/Graphviz Editor PRO</title>
  <style>
    :root { --bg:#0f1115; --panel:#151823; --fg:#e6e6e6; --muted:#9aa3b2; --border:#23283b; --btn:#22273a; }
    *{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}
    header{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
    .wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;height:calc(100% - 48px)}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-height:0}
    .panel>h2{margin:0;padding:10px 12px;border-bottom:1px solid var(--border);font-size:14px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:8px 12px;border-top:1px dashed var(--border)}
    button{background:var(--btn);color:var(--fg);border:1px solid var(--border);padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
    textarea{width:100%;height:100%;border:0;outline:none;background:#0e1220;color:#eaeef7;padding:10px;font-family:ui-monospace,Consolas,Menlo,monospace;font-size:13px}
    #stage{position:relative;overflow:hidden;background:#0b0e17}
    #viewport{transform-origin:0 0;will-change:transform}
    .status{padding:8px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
    @media (max-width:1100px){.wrap{grid-template-columns:1fr}}
  </style>
<script src="tools/dot-editor/vendor/viz/viz.js"></script>
<script src="tools/dot-editor/vendor/viz/lite.render.js"></script>
</head>
<body>
<header>
  <strong>DOT Editor PRO</strong>
  <span style="font-size:12px;color:#9aa3b2">Ctrl/Cmd+Enter: Render · Maus: Ziehen = Pan · Strg/Pinch = Zoom</span>
</header>
<div class="wrap">
  <section class="panel">
    <h2>Editor</h2>
    <textarea id="src"></textarea>
    <div class="toolbar">
      <button id="btnRender">Rendern</button>
      <button id="btnOrtho">Layout-Optimieren (orthogonal)</button>
      <button id="btnMini">Mini</button>
      <button id="btnFull">Projekt</button>
      <button id="btnSVG">SVG export</button>
      <button id="btnPNG">PNG export</button>
      <span style="flex:1"></span>
      <span id="msg" style="font-size:12px;color:#9aa3b2">Bereit.</span>
    </div>
  </section>
  <section class="panel">
    <h2>Vorschau</h2>
    <div id="stage"><div id="viewport"></div></div>
    <div class="status">Zoom: Ctrl + Mausrad / Pinch · Pan: Maus ziehen</div>
  </section>
</div>
<script>
const DOT_FULL = `<?dot
REPLACE_WITH_DOT_CONTENT
?>`;
const DOT_MINI = `digraph G {
  rankdir=LR; splines=ortho; nodesep=0.6; ranksep=1.4;
  node [shape=rect, style="rounded,filled", color="#999", fillcolor="#f7f7f7", fontname="Helvetica"];
  "index.html" -> "boot.js" [label="Start"];
  "boot.js" -> "core/asset.js" [label="Preload"];
  "boot.js" -> "map-runtime.js" [label="Map laden"];
  "map-runtime.js" -> "game.js" [label="init(map)"];
  "ui-build.js" -> "game.js" [label="Aktionen"];
  "inspector.js" -> "game.js" [label="Toggles"];
  "game.js" -> "index.html" [label="render"];
}`;

const el={src:document.getElementById('src'),view:document.getElementById('viewport'),msg:document.getElementById('msg'),stage:document.getElementById('stage')};
function status(s){el.msg.textContent=s}
function render(){status('Rendern…'); new Viz().renderSVGElement(el.src.value).then(svg=>{el.view.innerHTML='';el.view.appendChild(svg);status('OK')}).catch(e=>status('Fehler: '+e.message))}
function ortho(){let t=el.src.value;if(!/splines=/.test(t))t=t.replace(/digraph[^{]+{/,m=>m+"\n  splines=ortho; rankdir=LR;");el.src.value=t;render();}
document.getElementById('btnRender').onclick=render;
document.getElementById('btnOrtho').onclick=ortho;
document.getElementById('btnMini').onclick=()=>{el.src.value=DOT_MINI;render();}
document.getElementById('btnFull').onclick=()=>{el.src.value=DOT_FULL;render();}
document.getElementById('btnSVG').onclick=()=>{const svg=el.view.querySelector('svg');if(!svg)return;const xml=new XMLSerializer().serializeToString(svg);const a=document.createElement('a');a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);a.download='diagramm.svg';a.click();}
document.getElementById('btnPNG').onclick=()=>{const svg=el.view.querySelector('svg');if(!svg)return;const xml=new XMLSerializer().serializeToString(svg);const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download='diagramm.png';a.click();URL.revokeObjectURL(url);});};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);}
el.src.value=DOT_FULL; render();
</script>
</body>
</html>
