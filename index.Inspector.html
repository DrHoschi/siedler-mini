<!doctype html>
 <!-- inspektor testseite V1.1.1
      data-theme="dark oder light / wood -->
<html lang="de" data-theme="light">
<head>
  <!-- =========================================================
       META / BASIS
       ========================================================= -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f1f23">
  <title>Neue Siedler – Inspector Test</title>

  <!-- =========================================================
       STYLES
       - ui.css optional (Grundlayout), Inspector-CSS Pflicht
       ========================================================= -->
  <link rel="stylesheet" href="ui/css/ui.css">
  <link rel="stylesheet" href="ui/css/ui-inspector.css">
 <!-- 
 <link rel="stylesheet" href="ui/css/ui-inspector.clean.css">
 <link rel="stylesheet" href="ui/css/ui-inspector.final.css">
 -->
  <style>
    /* Testseite: neutraler Hintergrund + Canvas-Größe */
    html, body { height: 100%; margin: 0; background:#111; color:#eee; }
    #game-canvas { display:block; margin: 24px auto; background:#181a1d; width: 402px; height: 780px; }
    #ui-root, #hud-root { position:relative; z-index:10; }
    /* FAB sichtbar unten rechts (falls CSS fehlt) */
    #btn-inspector{ position:fixed; right:12px; bottom:12px; z-index:99999; }
  </style>
</head>

<body>
  <!-- =========================================================
       SPIEL-PLATZHALTER (verliert nichts, aber minimal)
       ========================================================= -->
  <canvas id="game-canvas" aria-label="Spielfeld" width="402" height="780"></canvas>
  <div id="ui-root"  aria-live="polite"></div>
  <div id="hud-root" aria-live="polite"></div>

  <!-- =========================================================
       INSPECTOR HOST + FAB
       - Host bleibt initial verborgen (aria-hidden="true")
       - FAB toggelt den Inspector
       ========================================================= -->
  <div id="inspector" aria-hidden="true"></div>
  <button id="btn-inspector" aria-label="Inspector öffnen/schließen" title="Inspector">🛠️</button>

  <!-- =========================================================
       SCRIPTS – REIHENFOLGE (nur das Nötigste!)
       ========================================================= -->

  <!-- (1) Optional: leichter Eventbus/Polyfills – falls vorhanden
       (nicht nötig für den Test; einkommentieren, wenn du willst)
  <script defer src="core/eventbus.js?v=25.10.31"></script>
  -->

  <!-- (2) NEUER INSPECTOR (Core → Content), beides mit defer -->
  <script defer src="inspector/ui-inspector-v1.js"></script>
  <script defer src="inspector/ui-inspector.content-v1.js"></script>
<script defer src="ui/inspector/inspector.logs.js?v=18.14.5"></script>
<script defer src="ui/inspector/inspector.build.js?v=18.15.1"></script>
<script defer src="ui/inspector/inspector.paths.js?v=18.15.0"></script>
<script defer src="ui/inspector/inspector.resources.js?v=18.15.1"></script>
<script defer src="ui/inspector/inspector.tests.js?v=18.15.0"></script>
  <!-- (3) TEST-EVENTS: speisen Ressourcen/Build in den Inspector -->
  <script defer src="tools/test-insp-events.js?v=25.10.31"></script>

  <!-- (4) iOS/GitHub-Pages „Airbag“ (nur falls Safari externes JS ignoriert):
       – injiziert Tabs, WENN keine .insp-shell existiert.
       – kannst du später löschen, wenn alles zuverlässig extern läuft. -->
  <script>
  (function inspContentBootstrap(){
    try{
      var h = document.querySelector('#inspector,#inspector-overlay');
      if(!h || h.querySelector('.insp-shell')) return;
      h.innerHTML =
        '<div class="insp-shell" role="dialog" aria-label="Inspector">'
      + '  <div class="insp-header"><div class="insp-tabs" role="tablist">'
      + '    <button class="insp-tab active" data-insp-tab="logs" role="tab" aria-selected="true">Logs</button>'
      + '    <button class="insp-tab" data-insp-tab="build" role="tab" aria-selected="false">Build</button>'
      + '    <button class="insp-tab" data-insp-tab="resources" role="tab" aria-selected="false">Ressourcen</button>'
      + '    <button class="insp-tab" data-insp-tab="paths" role="tab" aria-selected="false">Pfade</button>'
      + '    <button class="insp-tab" data-insp-tab="tests" role="tab" aria-selected="false">Tests</button>'
      + '  </div></div>'
      + '  <div class="insp-content">'
      + '    <section data-panel="logs">'
      + '      <div class="toolbar"><strong>Konsole</strong> <button id="insp-clear-log">Leeren</button></div>'
      + '      <table class="inspector-table" id="insp-log-table"><thead><tr><th>Zeit</th><th>Typ</th><th>Nachricht</th></tr></thead><tbody></tbody></table>'
      + '    </section>'
      + '    <section data-panel="build" hidden><div class="pad muted">Build-Infos</div></section>'
      + '    <section data-panel="resources" hidden><table class="inspector-table" id="insp-res-table"><thead><tr><th>Ressource</th><th>Menge</th></tr></thead><tbody></tbody></table></section>'
      + '    <section data-panel="paths" hidden><div class="pad muted">Pfade: Platzhalter</div></section>'
      + '    <section data-panel="tests" hidden><div class="pad">Tests</div></section>'
      + '  </div>'
      + '</div>';
      console.log('[insp-airbag] UI injiziert (Fallback).');
    }catch(e){ console.error('[insp-airbag] Fehler:', e); }
  })();
  </script>

  <!-- =========================================================
       WICHTIG: KEINE ALTEN INSPECTOR-DATEIEN LADEN!
       Entfernt aus deiner Vorlage:
       - ui/inspector/inspector.ui.js (v18.x)
       - ui/inspector/inspector.core.final.js
       - ui/inspector/inspector.*.js (logs/build/paths/resources/tests)
       - overlay.hooks.js, inspector.button-bind.js
       Diese alten Dateien verursachten deine roten Fehler (const doppelt,
       container.appendChild auf null). Jetzt raus – sauberer Stand.  -->
</body>
</html>
