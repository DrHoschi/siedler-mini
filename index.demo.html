<!-- =====================================================================
     Inspector Host Guard (Demo/Fail-Safe)
     Version : v25.10.31-guard1
     Zweck   : Erstellt #inspector bei Bedarf + verdrahtet open/close/toggle
               (funktioniert parallel zu core/ui/bind – greift nur, wenn nötig)
===================================================================== -->
<style>
  /* Sichtbarkeit-Fallback, falls ui-inspector.css gerade nicht greift */
  #inspector { display:none; position:fixed; inset:0; z-index:9999;
               background: rgba(18,18,20,.96); }
  body.is-inspector #inspector { display:block; }
</style>
<script>
(function(){
  const HOST_A = 'inspector';
  const HOST_B = 'inspector-overlay';

  function ensureHost(){
    let host = document.getElementById(HOST_A) || document.getElementById(HOST_B);
    if(!host){
      host = document.createElement('div');
      host.id = HOST_A;            // Standard-ID
      host.setAttribute('role','dialog');
      host.style.display = 'none'; // Sichtbar per Body-Klasse
      host.style.position = 'fixed';
      host.style.inset = '0';
      host.style.zIndex = '9999';
      // Root für UI-Inhalt (Tabs etc.)
      const root = document.createElement('div');
      root.setAttribute('data-insp-root','');
      host.appendChild(root);
      document.body.appendChild(host);
      console.info('[insp-guard] host created #' + host.id);
      // Signal an evtl. wartende UI-Module
      dispatchEvent(new CustomEvent('cb:insp:host-ready',{detail:{el:host}}));
    }
    return host;
  }

  function openInsp(){
    const host = ensureHost();
    document.body.classList.add('is-inspector');
    host.style.display = 'block';
    console.info('[insp-guard] geöffnet ✓');
  }
  function closeInsp(){
    const host = ensureHost();
    document.body.classList.remove('is-inspector');
    host.style.display = 'none';
    console.info('[insp-guard] geschlossen ✓');
  }

  addEventListener('req:insp:open',   openInsp);
  addEventListener('req:insp:close',  closeInsp);
  addEventListener('req:insp:toggle', () => {
    const host = ensureHost();
    const isOpen = getComputedStyle(host).display !== 'none';
    (isOpen ? closeInsp : openInsp)();
  });

  // Diagnose-Helfer
  window.__forceInspectorDiag = () => ({
    bodyClasses: [...document.body.classList],
    host: document.getElementById(HOST_A) || document.getElementById(HOST_B),
    hostPresent: !!(document.getElementById(HOST_A) || document.getElementById(HOST_B))
  });

  // Bessere Fehlerlogs (statt "Script error. 0")
  window.addEventListener('error',   e => console.log('[diag:error]', e.message, e.filename, e.lineno, e.colno));
  window.addEventListener('unhandledrejection', e => console.log('[diag:promise]', e.reason));
})();
</script>
  <script>
/* ============================================================================
 * Datei   : ui/inspector/inspector.miniview.js  (Inline-Demo)
 * Zweck   : Wenn der Inspector geöffnet wird und noch kein UI montiert ist,
 *           setzen wir ein einfaches UI-Skelett ein (Header + Body).
 *           → Arbeitet MIT deinem Host-Guard & mit ui-inspector.js zusammen.
 *           → Greift nur, wenn noch nichts im Root liegt.
 * Version : v25.10.31-mini1
============================================================================ */
(function(){
  const SEL = '#inspector, #inspector-overlay';
  function getHost(){ return document.querySelector(SEL); }
  function getRoot(host){
    return host.querySelector('[data-insp-root]') || host; // Fallback: host selbst
  }
  function mountOnce(){
    const host = getHost();
    if(!host) return;
    const root = getRoot(host);
    // Schon etwas drin? Dann nichts tun.
    if(root.querySelector('[data-insp-mounted]')) return;

    // --- Minimal-UI einsetzen ---
    const wrap = document.createElement('div');
    wrap.setAttribute('data-insp-mounted','');
    wrap.innerHTML = `
      <div class="insp-header">
        Inspector <button class="insp-close" title="Schließen">×</button>
      </div>
      <div class="insp-body">
        <p><strong>Status:</strong> UI-Mock aktiv (Mini-Renderer).</p>
        <p>Hotkeys: <code>I</code> toggelt – Buttons/Events funktionieren.</p>
        <div style="margin-top:10px; padding:10px; background:#0f0f12; border:1px solid #2a2a2e; border-radius:8px">
          <div>Build-Menü: <span id="mini-bm">unbekannt</span></div>
          <div>FPS-Overlay: <span id="mini-fps">unbekannt</span></div>
        </div>
      </div>
    `;
    root.appendChild(wrap);

    // Close-Button verdrahten
    wrap.querySelector('.insp-close')?.addEventListener('click', () => {
      dispatchEvent(new CustomEvent('req:insp:close'));
    });

    // Kleine Live-Probe (falls globale Flags vorhanden sind)
    try {
      const bm = document.getElementById('mini-bm');
      const fps = document.getElementById('mini-fps');
      // Beispiel: lies irgendwas aus deinem globalen State, wenn vorhanden:
      bm && (bm.textContent = window?.UI_BUILD?.ready ? 'bereit' : 'n/a');
      fps && (fps.textContent = document.body.classList.contains('show-fps') ? 'an' : 'aus');
    } catch(e){ console.info('[miniview] probe skipped', e); }

    console.info('[miniview] UI montiert');
  }

  // Wenn Host bereits existiert und offen → sofort montieren
  mountOnce();

  // Bei Host-Ready-Event (vom Guard) oder beim Öffnen erneut prüfen
  addEventListener('cb:insp:host-ready', mountOnce);
  addEventListener('req:insp:open',      () => setTimeout(mountOnce, 0));
})();
</script>
  <script>
/* ============================================================================
 * Datei   : ui/inspector/inspector.autoload.js
 * Zweck   : Echte Inspector-Tabs nachladen, sobald Host + Core bereit sind
 * Version : v25.10.31-auto1
============================================================================ */
(function(){
  const ready = () =>
    document.querySelector('#inspector [data-insp-root]') !== null &&
    typeof window.InspectorUI === 'object';

  function mountReal(){
    if(!ready()) return;
    try{
      window.InspectorUI.mount?.();
      console.info('[insp-auto] echte Inspector-UI montiert');
    }catch(e){
      console.warn('[insp-auto] UI mount fehlgeschlagen', e);
    }
  }

  addEventListener('cb:insp:host-ready', () => setTimeout(mountReal, 50));
  addEventListener('req:insp:open',      () => setTimeout(mountReal, 50));

  // Falls Core schon fertig ist:
  setTimeout(mountReal, 200);
})();
</script>
  <script>
/* ============================================================================
 * Datei   : ui/inspector/inspector.bridge.mount.js (inline)
 * Zweck   : Echte Inspector-UI in allen Generationen mounten (v18.x / v25.x)
 * Wirkung : Ruft .mount(host) ODER .init() auf, je nachdem was vorhanden ist;
 *           entfernt dabei den Mini-Mock, sobald echte UI montiert ist.
 * Version : v25.10.31-bridge1
============================================================================ */
(function(){
  const SEL = '#inspector, #inspector-overlay';
  function getHost(){ return document.querySelector(SEL); }
  function killMini(){ document.querySelector('#inspector [data-insp-mounted]')?.remove(); }

  function tryMount(){
    const host = getHost();
    if(!host) return;

    // Kandidaten: alt (Inspector), neu (InspectorUI)
    const CANDIDATES = [
      {obj: window.InspectorUI, fn: 'mount'},
      {obj: window.Inspector,   fn: 'mount'},
      {obj: window.InspectorUI, fn: 'init'},
      {obj: window.Inspector,   fn: 'init'},
    ].filter(x => x.obj && typeof x.obj[x.fn] === 'function');

    if (CANDIDATES.length){
      const {obj, fn} = CANDIDATES[0];
      try{
        // Wenn die Funktion Parameter akzeptiert, host übergeben
        (obj[fn].length >= 1) ? obj[fn].call(obj, host) : obj[fn].call(obj);
        killMini();
        console.info('[insp-bridge] real UI mounted via', fn);
      }catch(e){
        console.warn('[insp-bridge] mount failed', e);
      }
    } else {
      // Legacy-Event-Fallbacks (ältere Builds lauschen darauf)
      dispatchEvent(new CustomEvent('req:insp:ui:mount',   {detail:{host}}));
      dispatchEvent(new CustomEvent('req:inspector:mount', {detail:{host}}));
      setTimeout(killMini, 50);
      console.info('[insp-bridge] fired legacy mount events');
    }
  }

  // Mount-Versuche auslösen, wenn Host bereit/ geöffnet ist
  addEventListener('cb:insp:host-ready', () => setTimeout(tryMount, 0));
  addEventListener('req:insp:open',      () => setTimeout(tryMount, 0));

  // Falls alles schon da ist:
  setTimeout(tryMount, 100);
})();
</script>
