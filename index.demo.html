<!doctype html>
<html lang="de" data-theme="wood">
<head>
  <!-- =========================================================================
       PROJEKT: Neue Siedler
       DATEI  : index.html
       ZWECK  : Minimaler Live-Test (Spiel sichtbar + neuer Inspector)
       HINWEIS: Start-BG bleibt sichtbar, bis Spiel auf "is-playing" schaltet.
       ========================================================================= -->

  <!-- ===== Basis-Meta ===== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f1f23">
  <title>Neue Siedler</title>

  <!-- ===== Styles (Reihenfolge: global → start → inspector → HUD/Build → layout) ===== -->
  <link rel="stylesheet" href="ui/css/ui.css?v=25.10.19-final2">
  <link rel="stylesheet" href="ui/css/ui-start.css?v=25.10.19-final2">
  <link rel="stylesheet" href="ui/css/ui-inspector.css?v=1.0.0">      <!-- Neuer Inspector -->
  <link rel="stylesheet" href="ui/css/ui-hud.clean.css?v=25.10.19-final2">
  <link rel="stylesheet" href="ui/css/ui-build.clean.css?v=25.10.19-final2">
  <link rel="stylesheet" href="ui/css/ui-layout.css?v=25.10.19-final2"> <!-- greift erst mit .is-playing -->
</head>

<body>
  <!-- =========================================================================
     WICHTIG: Diese Container erwartet der Code (Lastenheft 3.1 / 4.2–4.3)
     - data-ui: damit der Inspector-Tab "UI" Elemente findet
     ========================================================================= -->
  <canvas id="game-canvas" data-ui="canvas" aria-label="Spielfeld"></canvas>
  <div id="ui-root"   data-ui="root"   aria-live="polite"></div>

  <!-- HUD + BuildDock Platzhalter -->
  <div id="hud-root"  data-ui="hud"    aria-live="polite" hidden></div>
  <div id="build-dock" data-ui="build" hidden></div>
  <button id="btn-build" aria-label="Bau-Menü" hidden></button>

  <!-- Inspector-FAB (Zahnrad) – bleibt unten rechts; Beibehaltung gewünscht -->
  <button id="inspector-fab" aria-label="Inspector öffnen" title="Inspector">
    🛠️
  </button>
  <!-- Optional: <span class="lbl">Inspector</span> -->

  <!-- =========================================================================
       SCRIPTS – LADEREIHENFOLGE (kritisch!)
       ========================================================================= -->

  <!-- 1) Logging/Polyfills (falls vorhanden) -->
  <script src="core/cblog.polyfill.js?v=25.10.19-final2"></script>

  <!-- 2) Optionaler Mini-EventBus (falls vorhanden) -->
  <script src="core/eventbus.js?v=25.10.19-final2"></script>

  <!-- 3) NEUER INSPECTOR (Core + Tabs; alter Inspector KOMPLETT ENTFERNT)
         - hookt console/CBLog früh
         - bleibt geschlossen, bis per Button geöffnet
         - benutzt body-Klasse: .is-inspector
  -->
  <script src="inspector/inspector.core.js?v=1.0.0" defer></script>
  <script src="inspector/inspector.tabs.js?v=1.0.0" defer></script>
  <script>
    // Bootstrap minimal & Safari-sicher (ohne Auto-Open)
    window.addEventListener('DOMContentLoaded', () => {
      if (window.Inspector && !window.Inspector.initialized) {
        window.Inspector.init({
          mount: document.body,
          autoOpen: false,
          useBodyClass: 'is-inspector',
          selectors: { uiScan: '[data-ui]' } // UI-Tab findet Canvas/HUD/etc.
        });
      }
      // FAB koppeln (bestehende Optik beibehalten)
      const fab = document.getElementById('inspector-fab');
      fab?.addEventListener('click', () => window.Inspector?.toggle(true));
      // Sicherheit: nicht offen starten
      document.body.classList.remove('is-inspector');
    });
  </script>

  <!-- 4) Loader, die READY-Events feuern -->
  <script src="core/asset.js?v=25.10.19-final2"></script>    <!-- dispatch: cb:assets-ready -->
  <script src="core/registry.js?v=25.10.19-final2"></script> <!-- dispatch: cb:registry:ready -->

  <!-- 5) UI: Startscreen/Panel (erzeugt Startpanel, emittiert 'cb:ui-ready') -->
  <script src="ui/ui-start.js?v=25.10.19-final2"></script>

  <!-- 6) UI: HUD & BuildDock -->
  <script src="ui/ui-hud.js?v=25.10.19-final2"></script>
  <script src="ui/ui-build.js?v=25.10.19-final2"></script>

  <!-- 7) Debug-Overlay für Pfade/Heatmap (vom Inspector steuerbar) -->
  <script src="core/path-overlay.js?v=25.10.19-final2"></script>

  <!-- 8) Boot + Spiel -->
  <script src="core/boot.js?v=25.10.19-final2"></script>
  <script src="core/game.bootstrap.js?v=25.10.19-final2"></script>
  <script src="core/game.js?v=25.10.19-final2"></script>

  <!-- 9) Layout-Glue: schaltet NACH Spielstart auf Spiel-Layout -->
  <script src="ui/ui-layout.js?v=25.10.19-final2"></script>

  <!-- 10) Mini-Diagnose + Bridges (öffnet NICHT automatisch) -->
  <script>
    (window.CBLog?.info || console.info)('[index] geladen v25.10.19-final2');

    // HARTE ABSICHERUNG: Inspector-Host nie "offen" starten
    document.body.classList.remove('is-inspector');

    // === Inspector ↔ PathOverlay Bridge (Buttons "Overlay/Heatmap an/aus") ===
    window.addEventListener('cb:path:overlay:on',  () => window.PathOverlay?.toggle(true));
    window.addEventListener('cb:path:overlay:off', () => window.PathOverlay?.toggle(false));
    window.addEventListener('cb:path:heatmap:on',  () => window.PathOverlay?.setHeatmap(true));
    window.addEventListener('cb:path:heatmap:off', () => window.PathOverlay?.setHeatmap(false));

    // Für leeren Teststand: „paths:ready“, damit der Tests-Tab grün meldet
    window.dispatchEvent(new CustomEvent('paths:ready'));
  </script>
</body>
</html>
