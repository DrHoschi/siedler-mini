<!doctype html>
<html lang="de">
<head>
  <!-- =========================================================
       META / BASIS
       Datei   : index.demo.html
       Projekt : Neue Siedler – Demo / Inspector-Test
       Version : v25.10.31-final-compat
       Zweck   : Aktuelle Boot-/UI-Struktur (v25.x) +
                 kompatibler Inspector (v18.16-Reihe)
       ========================================================= -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f1f23">
  <title>Neue Siedler – Demo</title>

  <!-- =========================================================
       STYLES (Global → UI → Inspector)
       ========================================================= -->
  <link rel="stylesheet" href="ui/css/ui.css?v=25.10.31">
  <link rel="stylesheet" href="ui/css/ui-hud.css?v=25.10.31">
  <link rel="stylesheet" href="ui/css/ui-build.css?v=25.10.31">
  <link rel="stylesheet" href="ui/css/ui-layout.css?v=25.10.31">
  <link rel="stylesheet" href="ui/css/ui-inspector.css?v=18.16.5"><!-- kompatible Inspector-CSS -->

  <!-- =========================================================
       CORE-MODULE (aktueller Monolith v25.x)
       ========================================================= -->
  <script defer src="core/boot.js?v=25.10.31"></script>
  <script defer src="core/asset.js?v=25.10.31"></script>
  <script defer src="core/registry.js?v=25.10.31"></script>
  <script defer src="core/game.js?v=25.10.31"></script>

  <!-- =========================================================
       UI-MODULE (aktuelle HUD-/Build-UI)
       ========================================================= -->
  <script defer src="ui/ui-hud.js?v=25.10.31"></script>
  <script defer src="ui/ui-build.js?v=25.10.31"></script>
  <script defer src="ui/ui-start.js?v=25.10.31"></script>
</head>

<body>
  <!-- =========================================================
       GRUNDSTRUKTUR / HOSTS
       ========================================================= -->
  <div id="game-root"></div>

  <!-- Inspector-Button -->
  <button id="btn-inspector" aria-label="Inspector"
          title="Inspector öffnen/schließen">⚙️ Inspector</button>

  <!-- Fallback-Host (wird vom Core oder Guard ersetzt) -->
  <div id="inspector" style="display:none"></div>

  <!-- =========================================================
       INSPECTOR-MODULE (stabile v18.16.x-Kombination)
       ========================================================= -->
  <script defer src="ui/inspector/inspector.core.js?v=18.16.5"></script>
  <script defer src="ui/inspector/inspector.ui.js?v=18.16.5"></script>
  <script defer src="ui/inspector/inspector.logs.js?v=18.16.5"></script>
  <script defer src="ui/inspector/inspector.paths.js?v=18.16.5"></script>
  <script defer src="ui/inspector/inspector.resources.js?v=18.16.5"></script>
  <script defer src="ui/inspector/inspector.tests.js?v=18.16.5"></script>
  <script defer src="ui/inspector/inspector.build.js?v=18.16.5"></script>
  <script defer src="ui/inspector/inspector.button-bind.js?v=18.16.5"></script>

  <!-- =========================================================
       SICHERUNGEN / KOMPATIBILITÄT
       ========================================================= -->

  <!-- Host-Guard: erzeugt #inspector, falls fehlend -->
  <script>
  (function(){
    const id="inspector";
    if(!document.getElementById(id)){
      const d=document.createElement("div");
      d.id=id; d.style.display="none"; document.body.appendChild(d);
      console.info("[insp-guard] Host auto-created");
    }
  })();
  </script>

  <!-- Kompatibilitäts-Bridge: für neue/alte APIs -->
  <script>
  (function(){
    function safe(fn){try{fn();}catch(e){console.warn(e);}}
    window.addEventListener("req:insp:open",()=>{
      document.body.classList.add("is-inspector");
      safe(()=>window.Inspector?.init?.());
      safe(()=>window.InspectorUI?.mount?.());
      console.info("[insp-bridge] Inspector geöffnet");
    });
    window.addEventListener("req:insp:close",()=>{
      document.body.classList.remove("is-inspector");
      console.info("[insp-bridge] Inspector geschlossen");
    });
  })();
  </script>

  <!-- =========================================================
       DIAGNOSE / LOG (optional)
       ========================================================= -->
  <script>
  console.info("[index.demo] geladen v25.10.31-final-compat");
  </script>
</body>
</html>
