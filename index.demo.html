<!-- Inspector Content (Inline-Bootstrap, Safari-sicher) -->
<script>
(function inspContentBootstrap(){
  try{
    var host = document.querySelector('#inspector, #inspector-overlay');
    if(!host){ console.warn('[insp-content] Kein Host (#inspector/#inspector-overlay) gefunden.'); return; }
    if(host.querySelector('.insp-shell')){ console.log('[insp-content] Shell existiert bereits.'); return; }

    host.innerHTML =
      '<div class="insp-shell" role="dialog" aria-label="Inspector">'
    + '  <div class="insp-header">'
    + '    <div class="insp-tabs" role="tablist" aria-label="Inspector Tabs">'
    + '      <button class="insp-tab active" data-insp-tab="logs" role="tab" aria-selected="true">Logs</button>'
    + '      <button class="insp-tab" data-insp-tab="build" role="tab" aria-selected="false">Build</button>'
    + '      <button class="insp-tab" data-insp-tab="resources" role="tab" aria-selected="false">Ressourcen</button>'
    + '      <button class="insp-tab" data-insp-tab="paths" role="tab" aria-selected="false">Pfade</button>'
    + '      <button class="insp-tab" data-insp-tab="tests" role="tab" aria-selected="false">Tests</button>'
    + '    </div>'
    + '  </div>'
    + '  <div class="insp-content">'
    + '    <section data-panel="logs">'
    + '      <div class="toolbar"><strong>Konsole</strong> <button id="insp-clear-log">Leeren</button> <span class="hint muted">console.log/warn/error + cb:*</span></div>'
    + '      <table class="inspector-table" id="insp-log-table"><thead><tr><th style="width:110px">Zeit</th><th style="width:70px">Typ</th><th>Nachricht</th></tr></thead><tbody></tbody></table>'
    + '    </section>'
    + '    <section data-panel="build" hidden><div class="pad muted">Build: wartet auf Events …</div></section>'
    + '    <section data-panel="resources" hidden><table class="inspector-table" id="insp-res-table"><thead><tr><th>Ressource</th><th>Menge</th></tr></thead><tbody></tbody></table></section>'
    + '    <section data-panel="paths" hidden><div class="pad muted">Pfade: Platzhalter</div></section>'
    + '    <section data-panel="tests" hidden>'
    + '      <div class="toolbar"><strong>Tests</strong> <button id="insp-test-open">Open</button> <button id="insp-test-close">Close</button> <button id="insp-test-toggle">Toggle</button></div>'
    + '      <div class="pad" id="insp-test-info">Bereit.</div>'
    + '    </section>'
    + '  </div>'
    + '</div>';

    // Tabs & Log-Hooks:
    var $ = function(s, r){ return (r||document).querySelector(s); };
    var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
    var logTBody = $('#insp-log-table tbody', host);
    function time(){ var d=new Date(),p=n=>(''+n).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'.'+(''+d.getMilliseconds()).padStart(3,'0'); }
    function pushLog(type, msg){
      if(!logTBody) return;
      var tr=document.createElement('tr');
      tr.innerHTML = '<td>'+time()+'</td><td class="'+type+'">'+type+'</td><td>'+msg+'</td>';
      logTBody.appendChild(tr);
      var sc = logTBody.parentElement && logTBody.parentElement.parentElement;
      sc && sc.scrollTo && sc.scrollTo(0, sc.scrollHeight);
    }

    (function hookConsole(){
      var c=window.console, orig={log:c.log&&c.log.bind(c), warn:c.warn&&c.warn.bind(c), error:c.error&&c.error.bind(c)};
      c.log=function(){ try{ pushLog('info', Array.prototype.map.call(arguments,String).join(' ')); }catch(e){}; orig.log&&orig.log.apply(c, arguments); };
      c.warn=function(){ try{ pushLog('warn', Array.prototype.map.call(arguments,String).join(' ')); }catch(e){}; orig.warn&&orig.warn.apply(c, arguments); };
      c.error=function(){ try{ pushLog('error',Array.prototype.map.call(arguments,String).join(' ')); }catch(e){}; orig.error&&orig.error.apply(c, arguments); };
    })();

    host.addEventListener('click', function(ev){
      var btn = ev.target && ev.target.closest && ev.target.closest('.insp-tab'); if(!btn) return;
      var tab = btn.getAttribute('data-insp-tab');
      $$('.insp-tab', host).forEach(function(b){
        var active = (b===btn); b.classList.toggle('active', active); b.setAttribute('aria-selected', active?'true':'false');
      });
      $$('.insp-content > section', host).forEach(function(sec){
        sec.toggleAttribute('hidden', sec.getAttribute('data-panel') !== tab);
      });
      window.dispatchEvent(new CustomEvent('cb:insp:tab:change', { detail:{ tab: tab }}));
      pushLog('info', 'Tab → '+tab);
    }, { passive:true });

    $('#insp-clear-log', host) && $('#insp-clear-log', host).addEventListener('click', function(){ if(logTBody) logTBody.innerHTML=''; });
    $('#insp-test-open', host)   && $('#insp-test-open', host).addEventListener('click', function(){ window.UIInspector && window.UIInspector.open(); });
    $('#insp-test-close', host)  && $('#insp-test-close', host).addEventListener('click', function(){ window.UIInspector && window.UIInspector.close(); });
    $('#insp-test-toggle', host) && $('#insp-test-toggle', host).addEventListener('click', function(){ window.UIInspector && window.UIInspector.toggle(); });

    // Ressourcen-Updates (falls gesendet)
    window.addEventListener('cb:res:change', function(e){
      try{
        var list = (e && e.detail && (e.detail.list||e.detail)) || {};
        var tb = $('#insp-res-table tbody', host); if(!tb) return;
        tb.innerHTML = '';
        Object.keys(list).forEach(function(k){
          var tr=document.createElement('tr'); tr.innerHTML='<td>'+k+'</td><td>'+list[k]+'</td>'; tb.appendChild(tr);
        });
      }catch(_){}
    });

    console.log('[insp-content] UI injiziert ✔');
  }catch(err){
    console.error('[insp-content] Bootstrap-Fehler:', err && err.message || err);
  }
})();
</script>
