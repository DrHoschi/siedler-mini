  <!-- =========================================================
       SICHERUNGEN / KOMPATIBILITÄT
       ========================================================= -->

  <!-- [A] Früher Click-Puffer: Klicks/Zahnräder werden gebuffert, bis alles ready. -->
  <script>
  (function(){
    const MOD='[index.demo/click-buffer]';
    const btn = document.getElementById('btn-inspector');
    window.__inspClickBuffer__ = { pending:0, ready:false };

    function wantToggle(){ 
      // Wenn noch nicht ready: nur zählen (keine No-Op-Klicks mehr)
      if(!window.__inspClickBuffer__.ready){
        window.__inspClickBuffer__.pending++;
        console.info(MOD,'pende=', window.__inspClickBuffer__.pending);
        return;
      }
      // Ready → echtes Toggle-Event
      dispatchEvent(new CustomEvent('req:insp:toggle'));
    }
    btn?.addEventListener('click', wantToggle, {passive:true});

    // Hotkey I ebenfalls puffern
    addEventListener('keydown', (e)=>{
      if((e.key||'').toLowerCase()==='i'){
        wantToggle();
        e.preventDefault();
      }
    }, {passive:false});
  })();
  </script>

  <!-- [B] Host-Guard: garantiert #inspector vorhanden (einmalig) -->
  <script>
  (function(){
    if(!document.getElementById('inspector')){
      const d=document.createElement('div');
      d.id='inspector'; d.style.display='none'; document.body.appendChild(d);
      console.info('[insp-guard] Host auto-created');
    }
  })();
  </script>

  <!-- [C] Deterministischer Mount + „Ready“-Freigabe für den Click-Puffer -->
  <script>
  (function(){
    const MOD='[index.demo/insp-mount]';
    // Helper: prüfe, ob v18.16-UI vorhanden ist
    function hasLegacyUI(){
      return !!(window.Inspector || window.__INSPECTOR__ || window.__INSPECTOR_CORE__);
    }
    // Body-Flag für Sichtbarkeit (Kompatibel zu deiner CSS-Logik)
    function openFlag(on){ document.body.classList.toggle('is-inspector', !!on); } // v18.16 nutzt diese Klasse.  [oai_citation:2‡CODES_MONOLITH_start.txt](file-service://file-AXPetqYG6sBnccZAuAaVH7)
    // Safe-Mount: ruft die gängigen Initializer in alter + neuer API
    function safeMount(){
      try { window.InspectorUI?.mount?.(document.getElementById('inspector')); } catch(e){}
      try { window.Inspector?.mount?.(document.getElementById('inspector')); }    catch(e){}
      try { window.InspectorUI?.init?.(); } catch(e){}
      try { window.Inspector?.init?.(); }    catch(e){}
      console.info(MOD,'mount attempts fired');
    }
    // Toggle-Events → Body-Flag setzen
    addEventListener('req:insp:open',  ()=> openFlag(true));
    addEventListener('req:insp:close', ()=> openFlag(false));
    addEventListener('req:insp:toggle',()=>{
      openFlag(!document.body.classList.contains('is-inspector'));
    });

    // Wenn alle Inspector-Skripte geladen sind → mounten & Click-Puffer leeren
    window.addEventListener('load', ()=>{
      // Kurzer Delay, bis defer-Skripte durch sind
      setTimeout(()=>{
        if(!hasLegacyUI()){
          console.warn(MOD,'Inspector-UI nicht gefunden – prüfen: Pfade/404?');
        }
        safeMount();
        // Freigabe
        window.__inspClickBuffer__.ready = true;
        // Offene Wünsche abarbeiten (z. B. 2 frühe Klicks = togglen)
        for(let i=0;i<window.__inspClickBuffer__.pending;i++){
          dispatchEvent(new CustomEvent('req:insp:toggle'));
        }
        window.__inspClickBuffer__.pending = 0;
        console.info(MOD,'ready ✓, pending flushed');
      }, 60);
    });
  })();
  </script>

  <!-- =========================================================
       DIAGNOSE / SMOKE
       ========================================================= -->
  <script>
    (window.CBLog?.info||console.info)('[index.demo] geladen v25.10.31-final-compat2');
