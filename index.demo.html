<!doctype html>
<html lang="de" data-theme="wood">
<head>
  <!-- =========================================================================
   * Datei   : index.demo.html
   * Version : v25.11.01-final
   * Zweck   : Minimaler Live-Test – Spiel + NEUER Inspector (Tabs)
   ========================================================================= -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f1f23">
  <title>Neue Siedler</title>

  <!-- Styles -->
  <link rel="stylesheet" href="ui/css/ui.css?v=25.10.19-final2">
  <link rel="stylesheet" href="ui/css/ui-start.css?v=25.10.19-final2">
  <link rel="stylesheet" href="inspector/ui-inspector-v1.css?v=25.11.01-final">
  <link rel="stylesheet" href="ui/css/ui-hud.clean.css?v=25.10.19-final2">
  <link rel="stylesheet" href="ui/css/ui-build.clean.css?v=25.10.19-final2">
  <link rel="stylesheet" href="ui/css/ui-layout.css?v=25.10.19-final2">
</head>

<body>
  <!-- Spiel-Container -->
  <canvas id="game" data-ui="canvas" aria-label="Spielfeld"></canvas>
  <div id="ui-root"    data-ui="root"   aria-live="polite"></div>
  <div id="hud-root"   data-ui="hud"    aria-live="polite" hidden></div>
  <div id="build-dock" data-ui="build"  hidden></div>
  <button id="btn-build" aria-label="Bau-Menü" hidden></button>

  <!-- Inspector Host + FAB -->
  <div id="inspector" class="inspector-host" aria-hidden="true"></div>
  <button id="inspector-fab" aria-label="Inspector" title="Inspector">⚙️</button>

  <!-- Scripts: Polyfills/EventBus -->
  <script src="core/cblog.polyfill.js?v=25.10.19-final2"></script>
  <script src="core/eventbus.js?v=25.10.19-final2"></script>
<!-- Spiel -->
  <script src="core/asset.js?v=25.10.19-final2"></script>
  <script src="core/registry.js?v=25.10.19-final2"></script>
  <script src="core/path-overlay.js"></script>
  <script src="core/boot.js?v=25.10.19-final2"></script>
  <script src="core/game.bootstrap.js?v=25.10.19-final2"></script>
  <script src="core/game.js?v=25.10.19-final2"></script>
  
  <!-- Inspector Core + Content + Tabs -->
  <script src="inspector/ui-inspector-v1.js?v=25.11.01-final" defer></script>
  <script src="inspector/ui-inspector.content-v1.js?v=1.0.0" defer></script>
  <script src="inspector/inspector.tabs.adapter.js?v=1.0.0"></script>
  <!-- Bridges zentral (du sagtest: bereits eingefügt – lassen wir so) -->
  <script src="inspector/inspector.bridges.js?v=1.0.0" defer></script>
  <script src="core/path-overlay.js"></script>
  <script src="inspector/inspector.bridges.game.js?v=1.0.0"></script>
  
  <script src="inspector/tabs/inspector.tab.logs-v1.js?v=1.0.0" defer></script>
  <script src="inspector/tabs/inspector.tab.build-v1.js?v=1.0.0" defer></script>
  <script src="inspector/tabs/inspector.tab.resources-v1.js?v=1.0.0" defer></script>
  <script src="inspector/tabs/inspector.tab.paths-v1.js?v=1.0.0" defer></script>
  <script src="inspector/tabs/inspector.tab.tests-v1.js?v=1.0.0" defer></script>
  <script src="inspector/tabs/inspector.tab.ui-v1.js?v=1.0.0" defer></script>
  <script src="inspector/tabs/inspector.tab.checker-v1.js?v=1.0.0" defer></script>
  <script src="inspector/tabs/inspector.tab.editor-v1.js?v=1.0.0" defer></script>
  <!-- Loader & UI -->
  <script src="ui/ui-start.js?v=25.10.19-final2"></script>
  <script src="ui/ui-hud.js?v=25.10.19-final2"></script>
  <script src="ui/ui-build.js?v=25.10.19-final2"></script>
  
  <!-- Layout zuletzt -->
  <script src="ui/ui-layout.js?v=25.10.19-final2"></script>

  <!-- Bootstrap (schlank, ohne Hacks) -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Inspector initialisieren (falls Core nicht schon auto-init gemacht hat)
      if (!window.Inspector?.initialized) {
        window.Inspector?.init({ mount: document.getElementById('inspector'), autoOpen:false });
      }
      // FAB toggelt offen/zu
      document.getElementById('inspector-fab')?.addEventListener('click', () => window.Inspector?.toggle());
    });
  </script>
</body>
</html>
