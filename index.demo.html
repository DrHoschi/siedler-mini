<!doctype html>
<html lang="de">
<head>
  <!-- =========================================================
       META / BASIS
       ========================================================= -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f1f23">
  <title>Neue Siedler</title>

  <link rel="stylesheet" href="ui/css/ui-layout.css?v=25.10.30">

  <!-- 2. Button-Bind + Hotkey -->
  <script src="ui/inspector/inspector.button-bind.js?v=25.10.30" defer></script>

  <script src="manifest_start.json?v=25.10.30" type="application/json" defer></script>
