<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171b20">
  <meta name="robots" content="noindex,nofollow">
  <title>Neue Siedler – IM-21A Responsive Game Shell / HUD</title>
  <link rel="stylesheet" href="src/ui/app.css?v=im21a-1">
</head>
<body>
  <main id="app" class="app-shell" data-ui-shell="player">
    <header class="player-topbar" data-ui-region="topbar">
      <strong class="game-title">Neue Siedler</strong>
      <div class="runtime-hud" data-ui-region="hud" aria-label="Siedlungsstatus">
        <span class="hud-chip" data-hud-resource="wood"><b>Holz</b><output id="hud-wood">—</output></span>
        <span class="hud-chip" data-hud-resource="stone"><b>Stein</b><output id="hud-stone">—</output></span>
        <span class="hud-chip" data-hud-resource="gold"><b>Gold</b><output id="hud-gold">—</output></span>
        <span class="hud-chip" data-hud-resource="population"><b>Bev.</b><output id="hud-population">—</output></span>
      </div>
      <div class="player-shell-actions" aria-label="Spielaktionen">
        <button type="button" class="shell-action" data-player-entry="build" aria-label="Bauen">Bauen</button>
        <button type="button" class="shell-action" data-player-entry="system" aria-label="Systemmenü">Menü</button>
      </div>
      <span id="runtime-status" class="runtime-status">BOOTING</span>
    </header>

    <section class="player-stage" data-ui-region="world" aria-label="Spielwelt">
      <canvas id="game-canvas" aria-label="Neue Siedler Spielwelt"></canvas>
      <canvas id="diagnostic-overlay-canvas" aria-label="Read-only World Diagnostic Overlay"></canvas>
      <canvas id="player-placement-preview-canvas" aria-label="Player Placement Preview"></canvas>
    </section>

    <footer class="player-action-region" data-ui-region="actions" aria-label="Spieleraktionsbereich">
      <div class="selection-context" data-ui-region="context" aria-label="Auswahlkontext" aria-live="polite">
        <span id="context-kind" class="context-kind" data-selection="none">Keine Auswahl</span>
        <span id="context-detail" class="context-detail" data-selection-id="">Weltobjekt antippen</span>
      </div>
      <span class="surface-note">IM-21A · Responsive Game Shell / HUD</span>
      <div class="player-building-selection" data-im16f-controls="true" aria-label="Gebäude für Platzierung auswählen">
        <button type="button" data-im16f-definition-id="HQ">Hauptquartier</button>
        <button type="button" data-im16f-definition-id="WOODCUTTER">Holzfäller</button>
        <button type="button" data-im16f-definition-id="STOREHOUSE">Lagerhaus</button>
        <output id="im16f-selection-result">Gebäude wählen</output>
      </div>
      <div class="player-placement-actions" data-im16e-controls="true" aria-label="Player Placement Actions">
        <button type="button" data-im16e-action="CONFIRM" disabled>Bestätigen</button>
        <button type="button" data-im16e-action="CANCEL" disabled>Abbrechen</button>
        <output id="im16e-action-result">Placement inaktiv</output>
      </div>
      <output data-im16g-result="true" aria-live="polite">Noch kein autoritatives Bauergebnis</output>
    </footer>
  </main>

  <script type="module" src="src/main.js?v=im21a-1"></script>
  <script type="module" src="src/ui/runtime-hud-projection.js?v=im21a-1"></script>
  <script type="module" src="src/ui/world-selection-context-projection.js?v=im16g-1"></script>
  <script type="module" src="src/ui/player-camera-controls-integration.js?v=im16g-1"></script>
  <script type="module" src="src/ui/player-placement-interaction-state-world-target.js?v=im16g-1"></script>
  <script type="module" src="src/ui/player-placement-preview-validity-projection.js?v=im16g-1"></script>
  <script type="module" src="src/ui/player-placement-confirm-cancel-interaction.js?v=im16g-1"></script>
  <script type="module" src="src/ui/player-building-selection-placement-activation.js?v=im16g-1"></script>
  <script type="module" src="src/ui/authoritative-construction-result-player-ui-projection.js?v=im16g-1"></script>
  <script type="module" src="src/im16g-runtime-evidence.js?v=im20c-verification-ownership-3"></script>
</body>
</html>
