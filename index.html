      <div class="actions">
        <button id="btn-new"        class="btn main">Neues Spiel</button>
        <button id="btn-continue"   class="btn ghost">Weiterspielen</button>
        <button id="btn-fullscreen" class="btn">Vollbild</button>
        <button id="btn-reset"      class="btn">Reset</button>
        <button id="btn-inspector"  class="btn">Inspector</button>
      </div>
      <!-- Kompatibilität: manche ältere Boots hörten auf #btn-start -->
      <button id="btn-start" style="display:none" aria-hidden="true" tabindex="-1">Start hidden</button>
    </div>

    <!-- =========================================================================

    ========================================================================= -->

          <img src="assets/icons/resources/wood.png" alt=""> Holz: <b id="hud-wood">0</b>
        </span>
        <span class="hud-item">
          <img src="assets/icons/resources/fish.png" alt=""> Fisch: <b id="hud-fish">0</b>
        </span>
        <span class="hud-item">
          <img src="assets/icons/resources/stone.png" alt=""> Stein: <b id="hud-stone">0</b>
        </span>
      </div>
    </div>

    <!-- =========================================================================
         [05] BUILD-DOCK (unten links) – Grid wird von ui/ui-build.js gerendert
    ========================================================================= -->
    <div id="build-dock" class="ui-panel ui-panel--dark hidden" aria-label="Bau-Dock"></div>
    <button id="btn-build" class="ui-btn-build" aria-expanded="false" title="Bauen">Bauen</button>
    <aside id="build-panel" class="build-panel"></aside>

    <!-- =========================================================================

    ========================================================================= -->

<!-- [08.03] Start-UI Logik – blendet Start-BG/-Panel aus, Canvas/HUD/Build an -->

  <!-- =========================================================================
       [11] INLINE-WIRING (leichtgewichtig)
       • Lässt Boot die Hauptarbeit machen (kein doppeltes Hiding).
       • Schaltet Inspector-Panel & Build-Dock; feuert UI-Events.
  ========================================================================= -->
  <script>
    (function(){
      'use strict';
      const $insp     = document.getElementById('inspector');
      const $dock     = document.getElementById('build-dock');
      const $btnBuild = document.getElementById('btn-build');
      const $btnNew   = document.getElementById('btn-new');
      const $btnStart = document.getElementById('btn-start');

      function fire(type, detail){ window.dispatchEvent(new CustomEvent(type, { detail: detail||{} })); }

      // [11.01] Neues Spiel → nur Events feuern; Boot übernimmt Hides/Shows/Start
      $btnNew?.addEventListener('click', function(){
        $btnStart?.click();       // Fallback für Alt-Boots
        fire('cb:start:new');
      });

      // [11.02] Inspector Toggle (sichtbar/versteckt) + Event
      document.getElementById('btn-inspector')?.addEventListener('click', function(){
        $insp?.classList.toggle('hidden');
        fire('req:inspector:toggle');
      });

      // [11.03] Vollbild an/aus (best effort, iOS/WebKit tolerant)
      document.getElementById('btn-fullscreen')?.addEventListener('click', function(){
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        try { (!document.fullscreenElement && !document.webkitFullscreenElement) ? req?.call(el) : exit?.call(el); }
        catch(e){ try{ console.warn('[index] fullscreen failed', e); }catch(_){} }
        fire('cb:start:fullscreen');
      });

      // [11.04] Build-Dock Toggle
      $btnBuild?.addEventListener('click', function(){
        const isOpen = !$dock?.classList.contains('hidden');
        if (isOpen){
          $dock?.classList.add('hidden');
          $btnBuild.setAttribute('aria-expanded', 'false');
          fire('cb:build:close');
        } else {
          $dock?.classList.remove('hidden');
          $btnBuild.setAttribute('aria-expanded', 'true');
          fire('cb:build:open');
        }
      });

      // [11.05] UI ready
      fire('cb:ui-ready');
    })();
  </script>

  <!-- =========================================================================
       [12] HINWEIS
       • Das Platzier-Ghost-Overlay (.place-overlay) wird NICHT im HTML angelegt.
         Es wird von ui/ui-build.js dynamisch erzeugt (genau EIN Overlay).
  ========================================================================= -->
