<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CityBuilder Mini</title>

  <!-- =========================================================
       UI / Version-Badge / Basis-Styles
       Hinweis: Styles so belassen, Inspector bringt seine eigenen mit.
       ========================================================= -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./styles.css" />
  <!-- Build-UI (Buttons unten wie „Straße / Weg / …“) -->
  <link rel="stylesheet" href="./assets/ui/ui-build.css" />

  <style>
    /* --- kleine Hilfen: Version-Badge oben links --- */
    .ui-version-badge {
      position: fixed; top: 12px; left: 12px; z-index: 1200;
      padding: 4px 8px; border-radius: 10px;
      font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: rgba(0,0,0,.35); color: #fff; backdrop-filter: blur(4px);
      pointer-events: none;
    }
    /* Platzhalter fürs Canvas (wird von game.js angelegt/geresized) */
    #game-root { position: relative; width: 100vw; height: 100vh; overflow: hidden; background:#0e3b26; }
  </style>

  <!-- =========================================================
       Version-Info, damit alles im Log auftaucht
       ========================================================= -->
  <script>
    window.AppVersion = {
      index: "16.1.4",
      note:  "Inspector+Logs integriert"
    };
  </script>
</head>
<body>
  <div id="game-root"></div>
  <div class="ui-version-badge" id="uiVersionBadge">UI v16.1.4</div>

  <!-- =========================================================
       SPIEL-SCRIPTS
       Reihenfolge: Boot → Kern → Spiel → UI
       ========================================================= -->
  <script src="./boot.js" defer></script>
  <script src="./core/asset.js" defer></script>
  <script src="./core/terrain.js" defer></script>
  <script src="./core/camera.js" defer></script>
  <script src="./core/actor.js" defer></script>
  <script src="./core/asset.items.js" defer></script>
  <script src="./core/path-index.js" defer></script>
  <script src="./core/path-overlay.js" defer></script>
  <script src="./render.js" defer></script>
  <script src="./world.js" defer></script>
  <script src="./game.js" defer></script>
  <script src="./input.js" defer></script>
  <script src="./ui-build.js" defer></script>

  <!-- =========================================================
       Inspector – jetzt inkl. Log-Konsole & Cache-Booster
       Toggle-Button bleibt stets sichtbar, Panel ausblendbar
       ========================================================= -->
  <script>
    // Minimaler Log-Helper (wird von inspector aufgegriffen)
    (function(){
      const q = [];
      const api = {
        push(level, msg){
          q.push({ts:new Date(), level, msg});
          window.dispatchEvent(new CustomEvent("game:log",{detail:{level,msg}}));
        },
        drain(){ return q.splice(0,q.length); }
      };
      window.TestLog = window.TestLog || api;
      // kleine Startmeldung
      api.push("ok", `UI ready (index v${(window.AppVersion||{}).index||"?"})`);
    })();
  </script>
  <script src="./assets/inspector/inspector.js" defer></script>
</body>
</html>
