<!doctype html>
<html lang="de">
<head>
  <!-- =========================================================================
       Datei    : index.html (Root)
       Projekt  : Neue Siedler
       Version  : v19.0.0 (2025-10-05)
       Zweck    : Einstiegspunkt – Startpanel → Boot → HUD/Build
       Leitplanken:
         - Reihenfolge: Core/Registry → Engine → UI → Boot
         - Startfenster zuerst, HUD/Build funktionsfähig
  ========================================================================= -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neue Siedler – Epoche 1</title>

  <!-- Styles -->
  <link rel="stylesheet" href="ui/css/ui.css">
  <link rel="stylesheet" href="ui/css/ui-start.css">
  <link rel="stylesheet" href="ui/css/ui-hud.css">
  <link rel="stylesheet" href="ui/css/ui-build.css">
  <link rel="stylesheet" href="ui/css/ui-place.css">
  <link rel="stylesheet" href="ui/css/ui-dialog.css">
  <link rel="stylesheet" href="ui/css/ui-tooltip.css">
  <link rel="stylesheet" href="ui/css/inspector.css">

  <style>
    :root { --bg:#1e1e1e; --fg:#f0f0f0; --accent:#4da3ff; }
    html,body{ margin:0; padding:0; background:var(--bg); color:var(--fg);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    #overlay-paths, #overlay-units { position:absolute; left:0; top:0; z-index:40; pointer-events:none; }
    .hud-bar { display:flex; gap:18px; align-items:center; }
    .hud-item img { width:18px; height:18px; vertical-align:-3px; margin-right:6px; }
    .build-panel { position:fixed; left:16px; bottom:16px; z-index:45; }
  </style>
</head>

<body>
  <div id="app" aria-label="Spiel-Container">
    <!-- Spielfeld -->
    <canvas id="game" width="1280" height="720" data-map="data/maps/map-mini.json"></canvas>

    <!-- Overlays -->
    <canvas id="overlay-paths" width="1280" height="720" aria-label="Path Overlay"></canvas>
    <canvas id="overlay-units" width="1280" height="720" aria-label="Units Overlay"></canvas>

    <!-- Start-Hintergrund -->
    <div id="bg-start" aria-hidden="true"></div>

    <!-- Startpanel -->
    <div id="start-panel" class="ui-panel ui-panel--light visible" aria-label="Startfenster">
      <h1>Neue Siedler</h1>
      <div class="actions">
        <button id="btn-new"        class="btn main">Neues Spiel</button>
        <button id="btn-continue"   class="btn ghost">Weiterspielen</button>
        <button id="btn-fullscreen" class="btn">Vollbild</button>
        <button id="btn-reset"      class="btn">Reset</button>
        <button id="btn-inspector"  class="btn">Inspector</button>
      </div>
      <!-- Kompatibilität: Boot.js lauscht ggf. auf #btn-start -->
      <button id="btn-start" style="display:none" aria-hidden="true" tabindex="-1">Start hidden</button>
    </div>

    <!-- HUD (Ressourcenanzeige) -->
    <div id="hud-top" class="ui-panel ui-panel--dark hidden" aria-label="Ressourcen-HUD">
      <div class="hud-bar">
        <span class="hud-item">
          <img src="assets/icons/resources/wood.png" alt=""> Holz: <b id="hud-wood">0</b>
        </span>
        <span class="hud-item">
          <img src="assets/icons/resources/fish.png" alt=""> Fisch: <b id="hud-fish">0</b>
        </span>
        <span class="hud-item">
          <img src="assets/icons/resources/stone.png" alt=""> Stein: <b id="hud-stone">0</b>
        </span>
      </div>
    </div>

    <!-- Build-Dock (Grid rendert ui/ui-build.js) -->
    <div id="build-dock" class="ui-panel ui-panel--dark hidden" aria-label="Bau-Dock"></div>
    <button id="btn-build" class="ui-btn-build" aria-expanded="false" title="Bauen">Bauen</button>
    <aside id="build-panel" class="build-panel"></aside>

    <!-- Inspector -->
    <div id="inspector" class="ui-panel ui-panel--dark hidden" aria-label="Inspector"></div>
  </div>

  <!-- SCRIPTS – Minimalkette, nur vorhandene Module -->
  <script src="core/registry.js"></script>
  <script src="core/game.js"></script>
  <script src="core/carrier.js"></script>

  <script src="ui/ui-build.js"></script>
  <script src="ui/ui-hud.js"></script>
  <script src="core/boot.js"></script>

  <!-- Inline-Wiring (Startpanel + Dock) -->
  <script>
    (function(){
      'use strict';
      const $start    = document.getElementById('start-panel');
      const $insp     = document.getElementById('inspector');
      const $dock     = document.getElementById('build-dock');
      const $btnBuild = document.getElementById('btn-build');
      const $btnNew   = document.getElementById('btn-new');
      const $btnStart = document.getElementById('btn-start');

      function fire(type, detail){ window.dispatchEvent(new CustomEvent(type, { detail: detail||{} })); }

      // Neues Spiel → Boot-Kette anstoßen (Kompatibilität: boot.js könnte #btn-start brauchen)
      $btnNew?.addEventListener('click', function(){
        $start.classList.add('hidden');
        $btnStart?.click();                 // falls boot.js darauf hört
        fire('cb:start:new');               // Event-basiert für spätere Hooks
      });

      // Inspector & Fullscreen
      document.getElementById('btn-inspector')?.addEventListener('click', function(){
        $insp.classList.toggle('hidden'); fire('req:inspector:toggle');
      });
      document.getElementById('btn-fullscreen')?.addEventListener('click', function(){
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        try { (!document.fullscreenElement && !document.webkitFullscreenElement) ? req?.call(el) : exit?.call(document); }
        catch(e){ (console.warn)('[index] fullscreen failed', e); }
        fire('cb:start:fullscreen');
      });

      // Build-Dock Toggle
      $btnBuild?.addEventListener('click', function(){
        const isOpen = !$dock.classList.contains('hidden');
        if (isOpen){
          $dock.classList.add('hidden');  $btnBuild.setAttribute('aria-expanded', 'false'); fire('cb:build:close');
        } else {
          $dock.classList.remove('hidden');$btnBuild.setAttribute('aria-expanded', 'true');  fire('cb:build:open');
        }
      });

      // UI ready
      fire('cb:ui-ready');
    })();
  </script>
</body>
</html>
