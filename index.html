  <!-- ===== Zentraler Inspector-Toggle-Controller (idempotent) ===== -->
  <script>
  (function InspectorToggleController(){
    if (window.__insp_toggle_wired) return;
    window.__insp_toggle_wired = true;
    window.INSP_AUTO_OPEN = false;

    const LOG = (...a)=> (window.CBLog?.info||console.log)('[insp-toggle]', ...a);
    let transitioning = false;
    const T_DEBOUNCE = 120;

    const host = ()=> document.getElementById('inspector');
    const isOpen = ()=> host()?.dataset.open === '1';

    function setOpenState(open){
      const el = host(); if(!el) return false;
      const target = open ? '1' : '0';
      if (el.dataset.open === target) return false;
      el.dataset.open = target;
      el.setAttribute('aria-hidden', open ? 'false' : 'true');
      document.body.classList.toggle('inspector-open', open);
      return true;
    }
    function open(detail={}){
      if (transitioning || isOpen()) return;
      transitioning = true;
      if (setOpenState(true)) {
        window.dispatchEvent(new CustomEvent('cb:insp:open', {detail}));
        LOG('open');
      }
      setTimeout(()=>transitioning=false, T_DEBOUNCE);
    }
    function close(){
      if (transitioning || !isOpen()) return;
      transitioning = true;
      if (setOpenState(false)) {
        window.dispatchEvent(new CustomEvent('cb:insp:close'));
        LOG('close');
      }
      setTimeout(()=>transitioning=false, T_DEBOUNCE);
    }
    function toggle(detail={}){ isOpen() ? close() : open(detail); }

    window.addEventListener('req:insp:open',  e => open(e?.detail||{}));
    window.addEventListener('req:insp:close', () => close());
    window.addEventListener('req:insp:toggle', e => toggle(e?.detail||{}));

    window.addEventListener('cb:insp:ready', () => { if (isOpen()) close(); });

    document.addEventListener('keydown', (ev)=>{ if(ev.key === 'Escape') close(); });

    document.addEventListener('click', (ev)=>{
      const el = host();
      if (!isOpen() || !el) return;
      if (ev.target && ev.target.getAttribute && ev.target.getAttribute('data-backdrop') === '1') {
        close();
      }
    });

    document.getElementById('inspector-fab')?.addEventListener('click', () => {
      window.dispatchEvent(new CustomEvent('req:insp:toggle', { detail:{ tab:'logs' }}));
    });

    LOG('controller bereit');
  })();
  </script>

  <!-- ===== Smoke-Events + Splash ausblenden ===== -->
  <script>
  (function smoke(){
    const on = (n)=>window.addEventListener(n, e=>CBLog.info(`[event] ${n}`, e.detail));
    ['cb:ui-ready','cb:assets-ready','cb:registry:ready','cb:hud-ready',
     'cb:build:ready','cb:game:start','cb:insp:ready','cb:path:overlay:ready']
      .forEach(on);
    window.addEventListener('cb:ui-ready', ()=>{
      document.documentElement.classList.add('splash-done');
    }, { once:true });
  })();
  </script>

    if (!window.GameCamera) miss.push('GameCamera');  // statt __CAM

  </script>

  <!-- ===== iOS-Start-Bug – Karte auf volle Größe bringen ===== -->
  <script>
  (function(){
    const TAG = '[layout-fix]';

    function fireResize(reason){
      try {
        const ev = new Event('resize');
        ev.detail = { reason };
        window.dispatchEvent(ev);
        (window.CBLog?.info || console.info)(TAG, 'resize ausgelöst →', reason);
      } catch(e){
        console.warn(TAG, 'resize-Event fehlgeschlagen', e);
      }
    }

    window.addEventListener('cb:game:start', () => {
      fireResize('cb:game:start:0ms');
      setTimeout(() => fireResize('cb:game:start:150ms'), 150);
      setTimeout(() => fireResize('cb:game:start:400ms'), 400);
    }, { once:true });
  })();
 </script>
