<script>
(function(){
  const dpr = window.devicePixelRatio || 1;

  function resizeCanvasByCssAndDpr(canvas){
    // Sichtbare Größe: per CSS (100vw/100vh) – wir lesen sie aus:
    const rect = canvas.getBoundingClientRect();
    // Interner Buffer: an DPR anpassen (scharf)
    const w = Math.max(1, Math.round(rect.width  * dpr));
    const h = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== w)   canvas.width  = w;
    if (canvas.height !== h)  canvas.height = h;
  }

  function resizeAll(){
    const canvases = [
      document.getElementById('game'),
      document.getElementById('overlay-paths'),
      document.getElementById('overlay-units'),
    ].filter(Boolean);
    canvases.forEach(resizeCanvasByCssAndDpr);
  }

  // Initial + bei Resize/Orientation
  window.addEventListener('resize', resizeAll);
  window.addEventListener('orientationchange', resizeAll);
  document.addEventListener('DOMContentLoaded', resizeAll);
})();
</script>
  
  <!-- [26] INLINE-WIRING – schlank halten: nur Start der Boot-Kette -->
  <script>
  /* ======================================================================
   * Inline-Wiring (minimal):
   *  – Startfenster zuerst sichtbar lassen
   *  – Auf Assets/Registry warten → HUD + Build-Dock aktivieren
   *  – Inspector-Button toggelt insp‑Root
   * ====================================================================== */
  (function(){
    const $ = (sel,root=document)=>root.querySelector(sel);
    const on = (t,ev,fn)=>t.addEventListener(ev,fn);

    const startPanel = $('#start-panel');
    const hud        = $('#hud-top');
    const buildDock  = $('#build-dock');
    const btnBuild   = $('#btn-build');
    const btnInsp    = $('#btn-inspector');
    const inspRoot   = $('#inspector-root');

    // Boot-Einstieg (wartet auf cb:registry:ready & cb:assets-ready)
    document.addEventListener('cb:registry:ready',  ()=>{ /* Registry OK */ });
    document.addEventListener('cb:assets-ready',    ()=>{ /* Assets OK */ });

    // Nach "Spiel starten": Startpanel schließen, HUD + Build anzeigen
    on($('#btn-new'), 'click', ()=>{
      startPanel.classList.add('u-hidden');
      hud.classList.remove('hidden');
      buildDock.classList.remove('hidden');
      // Game-Init anstoßen (falls nicht bereits geschehen)
      document.dispatchEvent(new CustomEvent('req:game:start'));
    });

    // Inspector ein/aus
    on(btnInsp, 'click', ()=>{
      const isHidden = inspRoot.hasAttribute('hidden');
      if(isHidden){
        inspRoot.removeAttribute('hidden');
        inspRoot.classList.remove('u-hidden');
      }else{
        inspRoot.setAttribute('hidden','');
        inspRoot.classList.add('u-hidden');
      }
      document.dispatchEvent(new CustomEvent('req:inspector:toggle', { detail: !isHidden }));
    });

    // Build-Button toggelt Dock
    on(btnBuild, 'click', ()=>{
      const isHidden = buildDock.classList.contains('hidden');
      buildDock.classList.toggle('hidden', !isHidden);
      btnBuild.setAttribute('aria-expanded', String(isHidden));
      document.dispatchEvent(new CustomEvent('req:build:toggle', { detail: isHidden }));
    });
  })();
  </script>
