<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Siedler-Mini v16.1.1</title>

  <!--
    Siedler-Mini – Bootstrap-UI
    v16.1.1 (2025-08-27)

    WICHTIG:
    - Jede Script/CSS-URL hat ?v=16.1.1 als Cache-Buster.
    - Log zeigt die geladene Version jeder Datei, damit man Cache-Probleme sofort sieht.
    - UI: Log-Panel lässt sich ein/ausblenden (🧾), Build-Button rechts unten (🛠️).
  -->

  <style>
    :root {
      --bg:#0e2a1f; --panel:#132f24; --text:#c7f7d0; --muted:#86c9a3;
      --ok:#34d399; --warn:#f59e0b; --err:#ef4444; --chip:#0f3a2d;
      --btn:#134e4a; --btn2:#1f6f67; --btnTxt:#e6ffef;
    }
    html,body { margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; }
    #root { position:relative; height:100%; overflow:hidden; }
    canvas { display:block; width:100%; height:100%; background:#285a37; }

    /* Floating toolbar (top-right) */
    .toolbar { position:absolute; top:10px; right:10px; display:flex; gap:8px; z-index:30; }
    .chip { background:var(--chip); border:1px solid #1a4b3b; color:var(--muted);
      padding:6px 10px; border-radius:10px; font-size:12px; }

    /* Buttons */
    .btn { background:var(--btn); color:var(--btnTxt); border:1px solid #1b5a51;
      padding:8px 12px; border-radius:10px; cursor:pointer; }
    .btn:hover { filter:brightness(1.08); }
    .btn.ghost { background:transparent; border-color:#2a6e61; color:#aef1ce; }

    /* Log panel */
    #logWrap { position:absolute; left:10px; bottom:10px; width:min(640px, calc(100% - 20px));
      max-height:42vh; z-index:25; }
    #logHead { display:flex; gap:8px; align-items:center; margin:0 0 6px 0; }
    #logPanel { background:var(--panel); border:1px solid #214c3b; border-radius:16px; padding:12px 12px 6px 12px; overflow:auto; max-height:36vh; }
    #logPanel pre { margin:0; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; color:#b9ffd1; }
    .hidden { display:none !important; }

    /* Build menu bottom sheet */
    #buildSheet { position:absolute; left:0; right:0; bottom:0; z-index:28;
      background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(19,47,36,.85) 18%, rgba(19,47,36,.92) 100%);
      padding:10px; backdrop-filter: blur(4px); }
    #buildBar { display:flex; gap:10px; overflow:auto; padding:8px 2px; }
    .tool { min-width:120px; flex:0 0 auto; background:var(--btn2); border:1px solid #2c8c82;
      border-radius:14px; padding:10px; text-align:center; }
    .tool small { display:block; color:#cfeee5; opacity:.85; }
    .pill { padding:3px 8px; border-radius:999px; background:#0e3b32; color:#baf3e1; font-size:12px; display:inline-block; margin-bottom:6px; }

    /* Floating round build toggle */
    #fabBuild { position:absolute; right:14px; bottom:14px; z-index:29; width:54px; height:54px; border-radius:50%; background:#1a6f65; color:#eafff6; border:1px solid #2a8e83; font-size:20px; display:grid; place-items:center; box-shadow:0 6px 20px rgba(0,0,0,.35); }
    #fabBuild:hover { filter:brightness(1.1); }

    /* Toast stripe (top) */
    #toast { position:absolute; left:50%; transform:translateX(-50%); top:56px; z-index:31;
      background:#0f3a2d; color:#d7ffe9; border:1px solid #1f6a57; border-radius:12px;
      padding:8px 12px; font-size:13px; display:none; }
  </style>
</head>
<body>
  <div id="root">
    <canvas id="game"></canvas>

    <!-- Toolbar -->
    <div class="toolbar">
      <span class="chip" id="chipBuild">CityBuilder v16.1.1</span>
      <button class="btn ghost" id="btnLog">🧾 Log</button>
      <button class="btn ghost" id="btnCache">🧹 Cache</button>
      <button class="btn ghost" id="btnEditor">🧩 Editor</button>
      <button class="btn ghost" id="btnInspector">🔎 Inspector</button>
      <button class="btn" id="btnStart">▶️ Start</button>
    </div>

    <!-- Log -->
    <div id="logWrap">
      <div id="logHead">
        <strong>Log</strong>
        <span class="chip" id="chipVersions">index v16.1.1</span>
        <button class="btn ghost" id="btnCopy">Kopieren</button>
        <button class="btn ghost" id="btnClear">Leeren</button>
      </div>
      <div id="logPanel"><pre id="log"></pre></div>
    </div>

    <!-- Build sheet -->
    <div id="buildSheet" class="hidden" aria-live="polite">
      <div class="pill">Bauen (v16.1.1)</div>
      <div id="buildBar">
        <!-- Basistools -->
        <div class="tool" data-tool="road">🛣️<small>Straße</small></div>
        <div class="tool" data-tool="path">🚶<small>Weg</small></div>
        <div class="tool" data-tool="bulldoze">🧹<small>Abreißen</small></div>

        <!-- Lumberjack – aus Atlas -->
        <div class="tool" data-tool="lumberjack_ug0">🪵<small>Holzfäller (T1)</small></div>
        <div class="tool" data-tool="lumberjack_ug1">🪓<small>Holzfäller (T2)</small></div>

        <div class="tool" data-tool="cancel">⛔<small>Abbrechen</small></div>
      </div>
    </div>

    <!-- Floating Build Button -->
    <button id="fabBuild" title="Bauen">🛠️</button>

    <div id="toast"></div>
  </div>

  <!-- CORE Module -->
  <script>window.__APP_VERSION__="16.1.1";</script>
  <script src="./game.js?v=16.1.1"></script>
  <script src="./ui-build.js?v=16.1.1"></script>
  <script src="./buildings.lumberjack.js?v=16.1.1"></script>
  <script type="module" src="./core/path-overlay.js"></script>
  
  <script>
    // ---------- Page bootstrap ----------
    (function(){
      const $ = sel => document.querySelector(sel);
      const log = (...a)=>window.Log.write(...a);

      // Wire buttons
      $("#btnLog").onclick=()=>$("#logWrap").classList.toggle("hidden");
      $("#btnCache").onclick = async ()=>{
        try{
          if ('caches' in window) {
            const names = await caches.keys();
            for (const n of names) await caches.delete(n);
          }
          localStorage.clear(); sessionStorage.clear();
          log("✅ (ok) Cache/Storage geleert – Seite ggf. neu laden");
          toast("Cache geleert");
        }catch(e){ log("❌ (err) Konnte Cache nicht leeren: "+e.message); }
      };
      $("#btnEditor").onclick = ()=> {
        if (window.GameEditor?.open) { window.GameEditor.open(); }
        else log("⚠️ (warn) Editor ist (noch) nicht eingebunden – window.GameEditor.open() fehlt.");
      };
      $("#btnInspector").onclick = ()=> {
        if (window.GameInspector?.toggle) { window.GameInspector.toggle(); }
        else log("⚠️ (warn) Inspector ist (noch) nicht eingebunden – window.GameInspector.toggle() fehlt.");
      };
      $("#btnCopy").onclick = ()=>window.Log.copy();
      $("#btnClear").onclick = ()=>window.Log.clear();
      $("#btnStart").onclick = ()=> startGame("./assets/maps/map-mini.json");
      $("#fabBuild").onclick = ()=> document.getElementById("buildSheet").classList.toggle("hidden");

      const toast = (t)=>{ const n=$("#toast"); n.textContent=t; n.style.display="block"; setTimeout(()=>n.style.display="none",1400); };

      // Initial log
      log(`✅ (ok) UI ready (index v${window.__APP_VERSION__})`);
      const cvs = document.getElementById('game');
      const dpr = Math.max(1, Math.floor(window.devicePixelRatio||1));
      cvs.width = Math.floor(cvs.clientWidth * dpr);
      cvs.height= Math.floor(cvs.clientHeight* dpr);
      log(`✅ (ok) Canvas ${cvs.width}x${cvs.height} dpr:${dpr}`);

      // Build UI init
      window.UIBuild?.init?.();

      // Versionsanzeige anderer Dateien
      const versions = [];
      if (window.Game?.version) versions.push(`game.js v${window.Game.version}`);
      if (window.UIBuild?.version) versions.push(`ui-build.js v${window.UIBuild.version}`);
      if (window.Buildings?.Lumberjack?.version) versions.push(`lumberjack v${window.Buildings.Lumberjack.version}`);
      document.getElementById("chipVersions").textContent = ["index v"+window.__APP_VERSION__].concat(versions).join(" | ");
      if (versions.length) log(`✅ (ok) Module: ${versions.join(" | ")}`);

      // Autostart erst nach kurzer Zeit (oder per Button)
      async function startGame(path){
        if (!window.GameLoader?.start) {
          log("❌ (err) GameLoader.start ist nicht verfügbar – game.js noch nicht initialisiert?");
          return;
        }
        log(`✅ (ok) Start gedrückt → ${path}`);
        try { await window.GameLoader.start(path); }
        catch(e){ log("❌ (err) Start fehlgeschlagen: "+(e?.message||"Unbekannter Fehler")); }
      }

      window.__startGame = startGame;
    })();
  </script>
</body>
</html>
