<!doctype html>
<html lang="de">
<head>
  <!-- =========================================================================
       Datei: index.html (Root)
       Projekt: Neue Siedler
       Version: v18.7.0 (2025-09-25)
       Zweck: Core + Inspector + UI korrekt einbinden (Startfenster zuerst)
       Leitplanken: Core→Boot→Inspector→UI; Registry-/cb:* Events; Debug/Logs
          (1) META & TITL
          (2) STYLES: Projekt + Inspector
          (3) MINI CBLog SHIM (sichert Logs/Events für Inspector)
          (4) START-PANEL (immer zuerst sichtbar)
          (5) FABs: Build / Inspector
          (6) UI – CORE-Bau-Menü (sichtbarer Dock, von UI-Build gefüllt)
          (7) CANVAS: Spielfeld (Map-Quelle über data-map)
          (8) CORE & BOOT
          (9) INSPECTOR (Split-Load)
          (10) UI-LAYER
          (11) PAGE-SCRIPTS: Startpanel, Build-Guard, Hotkeys, Logs
     ========================================================================= -->

  <!-- (1) META & TITLE ======================================================= -->
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0d">
  <title>Neue Siedler</title>

  <!-- (2) STYLES: Projekt + Inspector ======================================= -->
  <link rel="stylesheet" href="ui/css/ui.css">
  <link rel="stylesheet" href="ui/css/ui-start.css">
  <link rel="stylesheet" href="ui/css/ui-hud.css">
  <link rel="stylesheet" href="ui/css/ui-tooltip.css">
  <link rel="stylesheet" href="ui/css/inspector.css"><!-- Standard-Pfad -->

  <style>
    /* (2.1) Global + Layout -------------------------------------------------- */
    html, body { height:100%; margin:0; background:#0b0f0d; color:#eaeaea; }
    #game { display:block; width:100vw; height:100vh; touch-action:none; position:relative; z-index:0; }

    /* (2.2) Floating Action Buttons (Build/Inspector) ------------------------ */
    .ui-fab { position:fixed; z-index:2147483647 !important; pointer-events:auto !important; }
    #btn-build { left:16px; bottom:16px; }
    #btn-inspector { right:16px; bottom:16px; }
    .ui-fab button{
      width:52px; height:52px; border:none; border-radius:50%;
      background:#2a2d31; color:#fff; font-size:22px;
      box-shadow:0 10px 28px rgba(0,0,0,.35); backdrop-filter:blur(6px); cursor:pointer;
      pointer-events:auto !important;
    }

    /* (2.3) Build-Dock Sichtbarkeit/Animation -------------------------------- */
    body.has-build-open #btn-build,
    body.has-build-open #btn-inspector { bottom: calc(40vh + 16px); }

    :root {
      /* zentrale Stellschraube – Icon-Größe im Baumenü */
      --build-icon-size: 48px; /* z.B. 40px, 48px, 56px */
    }
    /* KORREKTUR: vorher fehlten Semikolons/Properties waren auskommentiert */
    #build-dock .build-item img,
    #build-dock img.build-icon {
      width: var(--build-icon-size);
      height: var(--build-icon-size);
      max-width: var(--build-icon-size);
      max-height: var(--build-icon-size);
      object-fit: contain;
      image-rendering: auto;      /* für “weiche” UI-Icons; bei Pixelart: pixelated */
      margin-bottom: 4px;
    }
  </style>

  <!-- (3) MINI CBLog SHIM (sichert Logs/Events für Inspector) ================ -->
  <script>
    (function(){
      if (window.CBLog && typeof CBLog.ok === 'function') return;
      const emit = (level, msg) => {
        try {
          window.dispatchEvent(new CustomEvent('cb:log', { detail: { level, msg, t: Date.now() }}));
        } catch(e){}
        const fn = (level==='error'?'error': level==='warn'?'warn':'log');
        console[fn]((level?`[${level}] `:'') + msg);
      };
      window.CBLog = {
        ok:   (m)=>emit('ok', m),
        info: (m)=>emit('info', m),
        warn: (m)=>emit('warn', m),
        error:(m)=>emit('error', m)
      };
      CBLog.info("[cb] CBLog Shim aktiv");
    })();
  </script>
</head>
<body>

  <!-- (4) START-PANEL (immer zuerst sichtbar) ================================ -->
  <div id="start-panel" class="ui-start" aria-label="Startmenü">
    <div class="ui-start-bg" role="img" aria-label="Hintergrund"></div>
    <div class="ui-start-card" role="dialog" aria-modal="true">
      <h1>Neue Siedler</h1>
      <div class="actions">
        <button id="btnStartNew" class="btn main">Neues Spiel</button>
        <button id="btnStartResume" class="btn">Weiterspielen</button>
        <button id="btnStartReset" class="btn ghost">Reset</button>
        <button id="btnStartFullscreen" class="btn ghost">Fullscreen</button>
      </div>
    </div>
  </div>

  <!-- (5) FABs: Build / Inspector =========================================== -->
  <div id="btn-build" class="ui-fab" title="Bau-Menü öffnen/schließen">
    <button type="button" aria-label="Bau-Menü"
      onclick="try{GameUI?.toggleBuild();}catch(e){console.warn('[ui] Build-Toggle nicht verfügbar',e);}">🏠</button>
  </div>
  <div id="btn-inspector" class="ui-fab" title="Inspector öffnen/schließen">
    <button type="button" aria-label="Inspector"
      onclick="try{ InspectorAPI.toggle(); }catch(e){ console.warn('[ui] InspectorAPI.toggle() nicht verfügbar', e); }">🩺</button>
  </div>

  <!-- (6) UI – CORE-Bau-Menü (sichtbarer Dock, von UI-Build gefüllt) ========= -->
  <!-- Hinweis: Build-Dock bleibt bis zum ersten Öffnen hidden -->
  <div id="hud" class="ui-hud" hidden></div>
  <div id="build-dock" class="ui-build" hidden aria-live="polite"></div>

  <!-- (7) CANVAS: Spielfeld (Map-Quelle über data-map) ======================= -->
  <canvas id="game" data-map="data/maps/map-mini.json" aria-label="Spielfeld"></canvas>

  <!-- (8) CORE & BOOT ======================================================== -->
  <script src="core/asset.js"></script>
  <script src="core/registry.js"></script>
  <script src="core/game.js"></script>
  <script src="core/path-overlay.js"></script>
  <script src="core/boot.js"></script>

  <!-- (9) INSPECTOR (Split-Load) ============================================ -->
  <script defer src="assets/inspector/inspector.core.js"></script>
  <script defer src="assets/inspector/inspector.logs.js"></script>
  <script defer src="assets/inspector/overlay.hooks.js"></script>
  <script defer src="assets/inspector/inspector.paths.js"></script>
  <script defer src="assets/inspector/inspector.tests.js"></script>
  <script defer src="assets/inspector/inspector.resources.js"></script>
  <script defer src="assets/inspector/inspector.api-compat.js"></script>
  <script defer src="assets/inspector/inspector.api-bridge.js"></script>

  <!-- (10) UI-LAYER ========================================================== -->
  <script src="ui/ui-events.js"></script>
  <script src="ui/ui-bridge.js"></script>
  <script src="ui/ui-build.categories.js"></script>
  <script src="ui/ui-build.js"></script>
  <script src="ui/ui-hud.js"></script>
  <script src="ui/ui-tooltip.js"></script>
  <script src="ui/ui-start.js"></script>
  <script src="ui/ui-inspector-bridge.js"></script>
  <script src="ui/ui-inspector.js"></script>

  <!-- (11) PAGE-SCRIPTS: Startpanel, Build-Guard, Hotkeys, Logs ============== -->
  <script>
    (function () {
      window.__cb = window.__cb || {};
      window.__cb.indexVersion = "v18.7.0";
      (window.CBLog?.info || console.log)(`[index] UI bereit (${window.__cb.indexVersion})`);
      window.dispatchEvent(new CustomEvent('cb:ui-ready')); // Vorgabe: UI meldet sich.  [oai_citation:0‡Lastenheft_NeueSiedler_Vollversion v1.0.pdf](file-service://file-3LhVFNfaWzhV5CMo8PkBF7)

      /* --- Startpanel Buttons -> Game-Start Flow --------------------------- */
      const $ = (id) => document.getElementById(id);
      const startPanel = $('start-panel');
      function hideStart(){ startPanel?.classList.add('hide'); startPanel?.setAttribute('hidden',''); }
      function showStart(){ startPanel?.classList.remove('hide'); startPanel?.removeAttribute('hidden'); }

      $('btnStartNew')?.addEventListener('click', () => {
        try { window.Game?.start?.(); } catch(e){ /* Fallback-Events feuern */ }
        window.dispatchEvent(new CustomEvent('cb:start:new'));
        hideStart();
      });
      $('btnStartResume')?.addEventListener('click', () => {
        window.dispatchEvent(new CustomEvent('cb:start:continue'));
        hideStart();
      });
      $('btnStartReset')?.addEventListener('click', () => {
        try { localStorage.clear(); } catch(e){}
        window.dispatchEvent(new CustomEvent('cb:start:reset'));
        location.reload();
      });
      $('btnStartFullscreen')?.addEventListener('click', () => {
        // Fullscreen nur nach User-Gesture (Vorgabe)  [oai_citation:1‡Lastenheft_NeueSiedler_Vollversion v1.0.pdf](file-service://file-3LhVFNfaWzhV5CMo8PkBF7)
        const el = document.documentElement;
        const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (fn) try { fn.call(el); } catch(e){}
        window.dispatchEvent(new CustomEvent('cb:start:fullscreen'));
      });

      // Wenn das Spiel startet -> HUD zeigen, Build freigeben
      window.addEventListener('cb:game-start', () => {
        document.body.classList.add('game-started');
        document.getElementById('hud')?.removeAttribute('hidden');
      });

      /* --- Build-Dock: erst nach Spielstart öffnen ------------------------- */
      function gameStarted(){
        return document.body.classList.contains('game-started') || !!(window.GameCore?.state?.ui?.started);
      }
      function setOpen(){
        if (!gameStarted()){
          (window.CBLog?.warn || console.warn)("Bau-Menü erst nach Spielstart verfügbar.");
          return;
        }
        document.body.classList.add('has-build-open');
        document.getElementById('build-dock')?.removeAttribute('hidden');
      }
      function setClose(){
        document.body.classList.remove('has-build-open');
      }
      addEventListener('cb:build:open',  setOpen);
      addEventListener('cb:build:close', setClose);
      addEventListener('cb:build-open',  setOpen);   // Legacy
      addEventListener('cb:build-close', setClose);  // Legacy

      window.GameUI = {
        toggleBuild(){
          if (!gameStarted()){
            (window.CBLog?.warn || console.warn)("Bitte zuerst das Spiel starten (Startpanel) – dann Baumenü öffnen.");
            return;
          }
          const isOpen = !document.body.classList.contains('has-build-open');
          if (isOpen) setOpen(); else setClose();
          dispatchEvent(new CustomEvent(isOpen ? 'cb:build:open' : 'cb:build:close'));
          if (isOpen && window.UIBuild?.rerender) window.UIBuild.rerender();
        }
      };

      /* --- Hotkeys: B = Build, I = Inspector -------------------------------- */
      addEventListener('keydown', function(ev){
        if (ev.repeat) return;
        if (ev.key === 'b' || ev.key === 'B') { ev.preventDefault(); window.GameUI.toggleBuild(); }
        if (ev.key === 'i' || ev.key === 'I') {
          ev.preventDefault();
          try { InspectorAPI.toggle(); } catch(e) { /* ignore */ }
        }
      });

      /* --- Sichtbares Test-Log, um Inspector-Verkabelung zu prüfen --------- */
      (window.CBLog?.ok || console.log)("[index] Smoke-Test: Logs an Inspector gesendet");
    })();
  </script>
</body>
</html>
