<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0f3a2f">
  <title>Neue Siedler – City-Builder</title>

  <!-- CORE CSS -->
  <link rel="stylesheet" href="style.css?v=16.3.6">
  <link rel="stylesheet" href="ui-start.css?v=16.3.6">
  <link rel="stylesheet" href="assets/ui/ui-build.css?v=16.3.6">

  <!-- kleine Basishilfen für Fixed-UI -->
  <style>
    html,body{height:100%;overflow:hidden;background:#0f3a2f;}
    /* Canvas-Stage */
    #game{display:block;touch-action:none}
    /* FABs (rund) – Grundlayout; Details in ui-build.css ergänzt */
    .fab{
      position:fixed; z-index:1100; width:64px; height:64px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:rgba(27,33,31,.92); box-shadow:0 6px 24px rgba(0,0,0,.35);
      backdrop-filter:saturate(120%) blur(6px); -webkit-backdrop-filter:saturate(120%) blur(6px);
      color:#e7e7e7; border:1px solid rgba(255,255,255,.08); user-select:none;
      touch-action:manipulation;
    }
    #fab-build{left:16px; bottom:16px}
    #fab-inspector{right:16px; bottom:16px}
    /* Wenn das Baumenü offen ist, heben wir die FABs höher an */
    .fab--raised{ transform:translateY(-120px) }
    /* versteckt bis Game gestartet ist */
    .fab--hide{opacity:0; pointer-events:none}
  </style>
</head>
<body>

  <!-- Stage -->
  <canvas id="game" aria-label="Game Stage"></canvas>

  <!-- Startpanel + Build-Bar werden von ihren Modulen selbst erzeugt -->

  <!-- Floating-Buttons (nur die Trigger, Logik in ui-bridge.js) -->
  <button id="fab-build" class="fab fab--hide" aria-label="Bau-Menü"
          title="Bau-Menü öffnen/schließen">🧱</button>
  <button id="fab-inspector" class="fab fab--hide" aria-label="Inspector"
          title="Inspector öffnen/schließen">🛠️</button>

  <!-- SCRIPT LADEREIHENFOLGE — v16.3.6 -->
  <!-- Boot/Kompatibilität vor dem Game, damit globales Boot-API da ist -->
  <script src="boot.compat.js?v=16.3.6"></script>
  <script src="boot.js?v=16.3.6"></script>

  <!-- Engine/Game -->
  <script src="game.js?v=16.3.6"></script>

  <!-- UI-Module -->
  <script src="assets/ui/ui-start.js?v=16.3.6"></script>
  <script src="assets/ui/ui-build.js?v=16.3.6"></script>

  <!-- Inspector -->
  <script src="assets/inspector/inspector.js?v=16.3.6"></script>

  <!-- Bridge zwischen Game/Start/Build/Inspector -->
  <script src="assets/ui/ui-bridge.js?v=16.3.6"></script>
</body>
</html>
