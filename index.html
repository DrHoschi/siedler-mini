<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>City Builder – Start (v16.1.14)</title>

  <!--
    =======================================================================
    CityBuilder Start-UI (Nur Oberfläche, keine Engine)
    - Bitte Layout NICHT ändern; nur Logik in game.js / inspector.js anfassen.
    - Versionen: index v16.1.14  · ui-build.js separat  · inspector separat
    - Wichtig: Script-Ladereihenfolge unten einhalten!
    =======================================================================
  -->

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
  <link rel="stylesheet" href="./css/desktop.css" />
  <link rel="stylesheet" href="./css/platform.css" />

  <style>
    /* ---- Startpanel & Buttons – Layout wie gehabt -------------------- */
    :root { --panel-bg: #0f1716; --panel-fg:#e8f4ef; --chip:#1f2b29; --ok:#26c281; --warn:#ffc044; --err:#ff6b6b; }
    body { margin:0; background:#0a2018; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:#cfe7df; }
    .hidden { display:none !important; }

    #startPanel {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(740px, 92vw); background: #0b0f0e; border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45); padding: 22px 22px 18px;
    }
    .titleRow { display:flex; align-items:center; gap:12px; margin:0 0 14px; }
    .titleRow h1 { font-size: 24px; margin:0; letter-spacing:.2px; }
    .chip { font-size:12px; background:#15211f; color:#a3c7be; padding:6px 10px; border-radius:14px; }
    .row { display:flex; gap:14px; align-items:center; flex-wrap: wrap; }
    .row + .row { margin-top: 12px; }

    select, button {
      border: 0; border-radius: 12px; padding: 10px 14px; font-size: 16px;
      background:#121a18; color:#def3ec; outline: none;
    }
    select { flex:1; min-width: 260px; background:#0f1514; }
    .btn-primary { background:#1a6b3f; }
    .btn-primary:active { transform: translateY(1px); }
    .btn-warn { background:#ffcc00; color:#1a1a1a; }
    .btn-ghost { background:#101514; color:#d6eae3; }
    .note { background:#0e1413; border-radius:12px; padding:12px 14px; color:#cbe3db; }
    .badge { background:#13201d; padding:4px 8px; border-radius:10px; font-size:12px; color:#9bc9bd; }

    /* Floating Buttons unten links/rechts */
    .fab { position: fixed; bottom: 16px; width: 60px; height: 60px; border-radius: 50%;
           display:grid; place-items:center; box-shadow: 0 10px 28px rgba(0,0,0,.35);
           background: rgba(28,40,37,.85); backdrop-filter: blur(6px); }
    #btnInspector { right: 16px; }       /* immer sichtbar */
    #btnBuild { left: 16px; display:none; }  /* erst nach Game-Start sichtbar */

    /* Inspector-Overlay (UI selbst kommt aus assets/inspector/inspector.js) */
    #inspectorHost { position: fixed; inset: 0; display:none; z-index: 40; }
    #inspectorBackdrop { position:absolute; inset:0; background:rgba(0,0,0,.55); }
    #inspectorPanel { position:absolute; inset: 0; display:flex; }

    /* Toasts (Log) – werden vom Inspector genutzt */
    #toastArea { position: fixed; left: 50%; transform: translateX(-50%);
                 bottom: 16px; display:grid; gap: 8px; z-index: 35; }
    .toast { background:#101514; color:#d9efe7; padding:10px 12px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    .toast.ok { border-left: 6px solid var(--ok); }
    .toast.warn { border-left: 6px solid var(--warn); }
    .toast.err { border-left: 6px solid var(--err); }
  </style>
</head>

<body>

  <!-- ======================== Start-Panel ============================= -->
  <section id="startPanel" aria-label="CityBuilder Start">
    <div class="titleRow">
      <h1>City Builder – Start</h1>
      <span class="badge">index v16.1.14</span>
    </div>

    <!-- Karten-Auswahl -->
    <div class="row" aria-label="Karte wählen">
      <label for="mapSelect" style="font-weight:600">Karte wählen:</label>
      <select id="mapSelect">
        <!-- Falls du Maps anpassen willst: einfach hier Einträge ergänzen -->
        <option value="./assets/maps/map-mini.json">map-mini.json (16×10)</option>
        <option value="./assets/maps/map-pro.json">map-pro.json (20×12)</option>
        <option value="./assets/maps/map-demo.json">map-demo.json</option>
        <option value="./assets/maps/map-test-all.json">map-test-all.json</option>
      </select>
    </div>

    <div class="row">
      <div class="note" style="flex:1">
        <strong>Hinweis</strong> · Spiel lädt die gewählte Karte nach „Start“.
      </div>
    </div>

    <!-- Start / Neu / Log / Cache -->
    <div class="row">
      <button id="btnStart" class="btn-primary">▶ Start</button>
      <button id="btnRestart" class="btn-warn">⟲ Neu-Start</button>
      <button id="btnLogCopy" class="btn-ghost">📋 Log kopieren</button>
    </div>

    <div class="row">
      <button id="btnCache" class="btn-ghost">🧹 Cache-Booster</button>
    </div>
  </section>

  <!-- ===================== Floating Buttons =========================== -->
  <button id="btnBuild" class="fab" title="Bau-Menü öffnen" aria-label="Bau-Menü">
    🧱
  </button>

  <button id="btnInspector" class="fab" title="Inspector öffnen" aria-label="Inspector">
    🛠️
  </button>

  <!-- ===================== Inspector Host ============================ -->
  <div id="inspectorHost" aria-hidden="true">
    <div id="inspectorBackdrop"></div>
    <div id="inspectorPanel"></div>
  </div>

  <!-- Toasts (für kurze Hinweise) -->
  <div id="toastArea"></div>

  <!-- ==================================================================
       SCRIPTS — Reihenfolge WICHTIG!
       1) Engine/Runtime (deine bestehenden Dateien)
       2) Inspector-UI (zeichnet Logs/Overlay)
       3) Build-UI (Bau-Menü)
       4) game.js (dieses Projekt – Start-Logik & Hook)
      ================================================================== -->

  <!-- (1) Engine / Runtime -->
  <script src="./app-v11.1r6.js"></script>
  <script src="./main.js"></script>
  <script src="./render.js"></script>
  <script src="./world.js"></script>
  <script src="./textures.js"></script>
  <script src="./buildingData.js"></script>
  <script src="./game.js"></script>

  <!-- (2) Inspector-UI -->
  <script src="./assets/inspector/inspector.js"></script>

  <!-- (3) Bau-Menü -->
  <script src="./assets/ui/ui-build.js"></script>

  <!-- (4) Start-/UI-Fassade -->
  <!--  WICHTIG: Diese Datei MUSS NACH den obigen Scripts kommen,
        damit der Hook auf GameLoader.start greifen kann. -->
  <script src="./game.js"></script> <!-- belassen, falls du Double-include vermeiden willst, diesen zweiten Eintrag entfernen -->

  <script>
    /* Falls der Build-Prozess die doppelte Einbindung vermeiden soll:
       Du kannst die obere game.js-Zeile aus der Engine-Liste entfernen und
       NUR die untere (hier) behalten. Wichtig ist: game.js zuletzt laden. */
  </script>
</body>
</html>
