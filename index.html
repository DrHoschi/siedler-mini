<!doctype html>
<html lang="de">
<head>
  <!-- =========================================================
       City Builder Test-UI — index.html
       Version: v16.1.13
       Zweck: Start-Screen, Inspector-/Bau-Menü-Buttons, Logging-Hooks
       WICHTIG:
       - Der Build-Button erscheint erst, sobald das Spiel gestartet ist.
       - Inspector-Button ist immer sichtbar (rechts unten), öffnet Vollbild-Inspector.
       - Logs gehen per Events an inspector.js (ui:log, inspector:log).
       ========================================================= -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>City Builder – v16.1.13</title>

  <!-- Basis-Styles -->
  <link rel="preload" href="css/base.css?v=16.1.13" as="style">
  <link rel="stylesheet" href="css/base.css?v=16.1.13">
  <link rel="stylesheet" href="assets/ui/ui-build.css?v=16.1.13">

  <style>
    /* ===== UI: feste Buttons unten links / rechts ===== */
    .floating-btn {
      position: fixed; z-index: 10000;
      width: 54px; height: 54px; border-radius: 999px;
      display:flex; align-items:center; justify-content:center;
      border: 0; outline: 0; cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
      background: #111; color: #fff; font-size: 24px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #btnInspector { right: 14px; bottom: 14px; }
    #btnBuild    { left:  14px; bottom: 14px; display: none; } /* erst nach Start sichtbar */

    /* kleines Badge mit Version */
    .version-pill {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 14px; background: rgba(0,0,0,.6); color:#fff;
      padding: 4px 10px; border-radius: 999px; font: 12px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial;
      z-index: 9999; pointer-events: none;
    }

    /* Start-Overlay */
    #startOverlay {
      position: fixed; inset: 0; z-index: 9000; background: #0b1320;
      color: #fff; display:flex; align-items:center; justify-content:center;
    }
    #startCard {
      width: min(92vw, 520px);
      background: #121a2e; border: 1px solid #1e2a4a; border-radius: 14px;
      padding: 18px; box-shadow: 0 14px 40px rgba(0,0,0,.45);
      font: 14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
    #startCard h1 { margin: 0 0 12px; font-size: 18px; }
    #startCard .row { display:flex; gap: 10px; align-items:center; margin: 12px 0; }
    #startCard select, #startCard button {
      flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #2a3a66;
      background: #0f1730; color: #eaf0ff;
    }
    #startCard button.primary { background:#2b64ff; border-color:#2b64ff; color:#fff; font-weight:600; }
    #startCard .muted { opacity:.75; font-size: 12px; }

    /* Canvas füllt Hintergrund */
    #gameRoot { position: fixed; inset: 0; background: #0b1320; }
    #gameCanvas { display:block; width:100%; height:100%; }

    /* Inspector Vollbild wird von inspector.js verwaltet */
  </style>
</head>
<body>
  <!-- ======= Spiel-Hintergrund ======= -->
  <div id="gameRoot">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- ======= Start-Overlay ======= -->
  <div id="startOverlay" aria-modal="true" role="dialog">
    <div id="startCard">
      <h1>City Builder starten</h1>
      <div class="row">
        <label for="mapSel" class="muted" style="min-width:84px;">Karte</label>
        <select id="mapSel">
          <!-- HINWEIS: Pfade an deine Maps angepasst -->
          <option value="./assets/maps/map-mini.json">map-mini</option>
          <option value="./assets/maps/map-pro.json">map-pro</option>
          <option value="./assets/maps/map-demo.json">map-demo</option>
          <option value="./assets/maps/map-test-all.json">map-test-all</option>
        </select>
      </div>
      <div class="row">
        <button id="btnReset">Neu starten</button>
        <button id="btnCache">Cache leeren</button>
        <button id="btnStart" class="primary">Start</button>
      </div>
      <div id="startProgress" class="muted">Bereit. (index v16.1.13)</div>
    </div>
  </div>

  <!-- ======= Floating Buttons ======= -->
  <button id="btnBuild" class="floating-btn" title="Bau-Menü">
    🛠️
  </button>
  <button id="btnInspector" class="floating-btn" title="Inspector">
    🧰
  </button>

  <!-- Version-Badge -->
  <div class="version-pill">index v16.1.13</div>

  <!-- ======= Scripts: Engine / UI ======= -->
  <!-- WICHTIG: game.js muss vor ui-build/inspector geladen werden -->
  <script src="game.js?v=16.1.13"></script>
  <script src="assets/ui/ui-build.js?v=16.1.13"></script>
  <script src="assets/inspector/inspector.js?v=16.1.13"></script>

  <script>
  /* ============================================================
     Frontend-Glue für Start/Inspector/Bau-Menü — v16.1.13
     ============================================================ */

  // --------- Logging-Brücke -> Inspector ---------
  // Ein einfacher Logger, der sowohl Console als auch Inspector-Event nutzt
  (function(){
    const LEVELS = { ok:'✅ (ok)', warn:'⚠️ (warn)', err:'❌ (err)' };
    function emit(level, msg) {
      const line = `[${LEVELS[level]||level}] ${msg}`;
      console[(level==='err'?'error':level==='warn'?'warn':'log')](line);

      // an Inspector weiterreichen (beide Kanäle bedienen)
      const detail = { level, line, ts: Date.now(), src: 'index v16.1.13' };
      window.dispatchEvent(new CustomEvent('ui:log', { detail }));
      window.dispatchEvent(new CustomEvent('inspector:log', { detail }));
    }
    window.UILog = {
      ok:  (m)=>emit('ok',   m),
      warn:(m)=>emit('warn', m),
      err: (m)=>emit('err',  m),
      raw: (level, m)=>emit(level, m)
    };
    UILog.ok('UI bereit (index v16.1.13)');
  })();

  // --------- GameUI: zentrale Hooks, die game.js auch nutzen darf ---------
  window.GameUI = {
    version: 'v16.1.13',
    started: false,
    // von game.js oder index aufgerufen: Spiel wirklich gestartet
    onGameStarted() {
      this.started = true;
      // Build-Button freischalten
      const b = document.getElementById('btnBuild');
      b.style.display = 'flex';
      UILog.ok('Game gestartet');
      // Event an evtl. weitere Module
      window.dispatchEvent(new CustomEvent('cb:game-started'));
    },
    // Bau-Menü öffnen (delegiert an ui-build.js)
    openBuildMenu() {
      if (window.UIBuild?.open) {
        UIBuild.open();
        return true;
      }
      UILog.warn('Bau-Menü ist (noch) nicht eingebunden – window.UIBuild.open() fehlt.');
      return false;
    },
    closeBuildMenu() {
      if (window.UIBuild?.close) { UIBuild.close(); return true; }
      return false;
    }
  };

  // --------- Start-UI: Buttons & Progress ---------
  (function initStartUI(){
    const $overlay  = document.getElementById('startOverlay');
    const $progress = document.getElementById('startProgress');
    const $mapSel   = document.getElementById('mapSel');
    const $btnStart = document.getElementById('btnStart');
    const $btnReset = document.getElementById('btnReset');
    const $btnCache = document.getElementById('btnCache');

    // Fortschrittsanzeige
    function setProgress(pct, text){
      $progress.textContent = text ? text : `Start-Progress ${pct}%`;
      window.dispatchEvent(new CustomEvent('ui:log', { detail:{level:'ok', line:`[✅ (ok)] ${$progress.textContent}`, ts:Date.now()} }));
    }

    // Cache-Booster
    async function clearCaches() {
      try {
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(n => caches.delete(n)));
        }
        // Local/sessionStorage wischen
        localStorage.clear(); sessionStorage.clear();
        UILog.ok('Cache/Storage geleert – Seite ggf. neu laden');
      } catch (e) {
        UILog.err('Cache leeren fehlgeschlagen: ' + (e?.message||e));
      }
    }

    // Start
    $btnStart.addEventListener('click', async () => {
      const mapUrl = $mapSel.value;
      UILog.ok(`Start gedrückt → ${mapUrl}`);
      setProgress(10, 'Start-Progress 10% – Warte auf Engine …');

      // Prüfen, ob GameLoader vorhanden (game.js)
      const tryStart = () => {
        if (window.GameLoader?.start) return true;
        return false;
      };

      // kleine Retry-Schleife falls game.js noch initialisiert
      const started = await new Promise(async (resolve) => {
        const t0 = performance.now();
        let ok = tryStart();
        while (!ok && (performance.now()-t0) < 3000) {
          await new Promise(r => setTimeout(r, 100));
          ok = tryStart();
        }
        resolve(ok);
      });

      if (!started) {
        UILog.warn('Engine noch nicht bereit – warte auf GameLoader.start …');
      }

      if (!window.GameLoader?.start) {
        setProgress(0, 'Start-Progress 0% – Fehler beim Start');
        UILog.err('GameLoader.start ist nicht verfügbar – game.js / Engine noch nicht initialisiert?');
        return;
      }

      setProgress(40, 'Start-Progress 40% – Engine bereit – initialisiere …');

      try {
        setProgress(60, 'Start-Progress 60% – Starte Spiel …');
        await window.GameLoader.start({ mapUrl });
        setProgress(90, 'Start-Progress 90% – Karte laden …');

        // → Spiel ist gestartet
        setProgress(100, 'Start-Progress 100% – Spiel gestartet');
        $overlay.style.display = 'none';
        window.GameUI.onGameStarted();

      } catch (e) {
        UILog.err('Start fehlgeschlagen: ' + (e?.message || e));
        setProgress(0, 'Start-Progress 0% – Fehler beim Start');
      }
    });

    $btnReset.addEventListener('click', () => {
      UILog.ok('Neu-Start angefordert');
      // Einfach Start-Overlay zurückholen
      $overlay.style.display = 'flex';
      // ggf. Engine resetten, falls vorhanden
      if (window.GameLoader?.reset) window.GameLoader.reset();
    });

    $btnCache.addEventListener('click', clearCaches);
  })();

  // --------- Floating Buttons: Inspector & Build ---------
  (function initFloatingButtons(){
    const btnInspector = document.getElementById('btnInspector');
    const btnBuild     = document.getElementById('btnBuild');

    btnInspector.addEventListener('click', () => {
      // Inspector Vollbild an/auf
      if (window.GameInspector?.open) {
        window.GameInspector.open(); // Vollbild
      } else {
        UILog.warn('Inspector ist (noch) nicht eingebunden – window.GameInspector.open() fehlt.');
      }
    });

    btnBuild.addEventListener('click', () => {
      // Bau-Menü öffnen
      window.GameUI.openBuildMenu();
    });

    UILog.ok('Buttons gebunden (Inspector rechts-unten; Build links-unten, erscheint nach Start).');
  })();

  // --------- Hook: Falls game.js selbst meldet, dass gestartet wurde ---------
  window.addEventListener('cb:game-started', () => {
    // (z.B. wenn game.js das Event selbst feuert)
    if (!window.GameUI.started) window.GameUI.onGameStarted();
  });

  </script>
</body>
</html>
