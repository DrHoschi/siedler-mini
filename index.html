<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2419" />
  <title>Mini – v16.1.16</title>

  <!-- Basis-Styles (unverändert) -->
  <link rel="preload" href="./css/base.css" as="style" />
  <link rel="preload" href="./style.css" as="style" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Kleine Zusatz-Styles NUR für die zwei Schwebe-Buttons (bleiben vom Layout her minimal) -->
  <style>
    .cb-fab {
      position: fixed; z-index: 9000;
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20,20,20,.7);
      box-shadow: 0 6px 16px rgba(0,0,0,.35);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff; user-select: none; cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }
    .cb-fab:active { transform: scale(.96); }
    #btn-inspector { right: 12px; bottom: 12px; }
    #btn-build { left: 12px; bottom: 12px; opacity: 0; pointer-events: none; } /* erst nach Start sichtbar */
    #btn-build.visible { opacity: 1; pointer-events: auto; }

    /* Start-Panel: Klassen & IDs beibehalten; nur minimale, robuste Defaults */
    #start-panel { position: absolute; inset: 0; display: grid; place-items: center; }
    #start-card {
      min-width: 320px; max-width: 720px; width: 90vw;
      background: rgba(8,10,12,.85);
      color: #eee; border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.08);
      padding: 18px 18px 12px;
    }
    #start-card h1 { font-size: 22px; margin: 0 0 14px; display:flex; justify-content:space-between; align-items:center;}
    #start-card .row { display:flex; gap:12px; align-items:center; margin: 10px 0; flex-wrap:wrap; }
    #start-card select { flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:#1b2420; color:#dfe; }
    #start-card button { padding:10px 16px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:#26352c; color:#dfe; }
    .btn-primary { background:#1c7c43; }
    .btn-warn { background:#d9a000; color:#161616; }
  </style>
</head>

<body>
  <!-- ======= Start-Panel (Layout wie besprochen; bleibt bestehen) ======= -->
  <div id="start-panel" aria-label="City-Builder Start">
    <div id="start-card">
      <h1>
        <span>City-Builder – Start</span>
        <small style="opacity:.7;">index <b>v16.1.16</b></small>
      </h1>

      <!-- Kartenwahl -->
      <div class="row">
        <label for="map-select" style="min-width:100px; opacity:.9;">Karte:</label>
        <select id="map-select">
          <!-- Wenn du neue Karten hinzufügst, hier ergänzen -->
          <option value="./assets/maps/map-mini.json">map-mini.json (16×10)</option>
          <option value="./assets/maps/map-pro.json">map-pro.json (20×12)</option>
          <option value="./assets/maps/map-test-all.json">map-test-all.json</option>
          <option value="./assets/maps/map-demo.json">map-demo.json</option>
        </select>

        <!-- Start & Neu-Start -->
        <button id="btn-start" class="btn-primary">▶️ Start</button>
        <button id="btn-restart" class="btn-warn">♻️ Neu-Start</button>
      </div>

      <!-- Tools fürs Start-Panel -->
      <div class="row">
        <button id="btn-copylog">🗒️ Log kopieren</button>
        <button id="btn-cachebooster">🧹 Cache-Booster</button>
      </div>

      <!-- Kurzer Hinweis -->
      <p style="opacity:.7; margin:10px 4px 0;">
        Hinweis: Nach „Start“ verschwindet dieses Fenster automatisch.
      </p>
    </div>
  </div>

  <!-- ======= Canvas/Stage ======= -->
  <canvas id="game" width="0" height="0"></canvas>

  <!-- ======= Floating Action Buttons ======= -->
  <button id="btn-inspector" class="cb-fab" title="Inspector">🛠️</button>
  <button id="btn-build" class="cb-fab" title="Bau-Menü öffnen">🏗️</button>

  <!-- ===================== SCRIPTS ===================== -->

  <!-- Inspector (volle Datei unten) -->
  <script src="./assets/inspector/inspector.js?v=16.1.16"></script>

  <!-- Engine / Game -->
  <script src="./game.js?v=16.1.16"></script>

  <!-- Bau-Menü (deine UI) + Bridge-Hooks -->
  <script src="./assets/ui/ui-build.js?v=16.1.6"></script>
  <script src="./assets/ui/ui-bridge.js?v=16.1.16"></script>

  <!-- Start/Index-Boot: verbindet UI mit Engine & Inspector, ohne Layout zu ändern -->
  <script>
  (function(){
    const INDEX_V = "v16.1.16";
    const $ = sel => document.querySelector(sel);

    // Globale Namespace für kleine Utilities/Log
    window.__cb = window.__cb || { logs: [] };
    const log = (type, msg) => {
      window.__cb.logs.push({ t: Date.now(), type, msg });
      window.dispatchEvent(new CustomEvent('cb:log', { detail: { type, msg }}));
      console[type === 'err' ? 'error' : (type === 'warn' ? 'warn' : 'log')](`[index ${INDEX_V}] ${msg}`);
    };

    // UI ready
    log('log', `UI bereit (index ${INDEX_V})`);
    window.dispatchEvent(new CustomEvent('cb:ui-ready', { detail: { v: INDEX_V }}));

    // ===== Start-Panel Buttons =====
    const startPanel = $('#start-panel');
    const mapSelect = $('#map-select');
    $('#btn-copylog').addEventListener('click', () => {
      // Inspector hat eine Copy-Routine; zusätzlich Fallback hier:
      const txt = window.__cb.logs.map(e => new Date(e.t).toLocaleTimeString('de-DE') + " " + e.type.toUpperCase() + " " + e.msg).join("\n");
      navigator.clipboard?.writeText(txt).then(() => {
        log('log', 'Log in Zwischenablage');
      });
    });

    $('#btn-cachebooster').addEventListener('click', async () => {
      try{
        localStorage.clear?.(); sessionStorage.clear?.();
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(n => caches.delete(n)));
        }
        log('log', 'Cache/Storage geleert – Seite ggf. neu laden');
      }catch(err){
        log('warn', 'Cache-Booster: möglicherweise eingeschränkt (Safari/iOS)');
      }
    });

    // Start: ruft stabil GameLoader.start auf (wartet bis Engine ready ist)
    const callStart = async (mapUrl) => {
      // Warten, bis die Engine den Loader registriert hat
      const waitFor = (condFn, ms=4000) => new Promise((res, rej)=>{
        const t0 = performance.now();
        const tick = () => (condFn() ? res() :
          (performance.now() - t0 > ms ? rej(new Error('timeout')) : requestAnimationFrame(tick)));
        tick();
      });

      try{
        log('log', `Start gedrückt → ${mapUrl}`);
        await waitFor(() => !!(window.GameLoader && window.GameLoader.start), 5000);
        window.GameLoader.start(mapUrl); // eigentlicher Start
      }catch(e){
        log('warn', 'Engine noch nicht bereit – warte auf GameLoader.start …');
        // kleiner Retry (einmal)
        setTimeout(()=>{
          if (window.GameLoader?.start) window.GameLoader.start(mapUrl);
          else log('err', 'GameLoader.start ist nicht verfügbar – game.js / Engine noch nicht initialisiert?');
        }, 600);
      }
    };

    $('#btn-start').addEventListener('click', ()=>{
      callStart(mapSelect.value);
    });
    $('#btn-restart').addEventListener('click', ()=>{
      log('log','Neu-Start angefordert');
      callStart(mapSelect.value);
    });

    // ===== Build-Button (links unten) – erst nach Game-Start sichtbar
    const btnBuild = $('#btn-build');
    btnBuild.addEventListener('click', ()=> {
      // über Bridge geöffnet, wenn vorhanden
      if (window.GameUI?.openBuildMenu) {
        window.GameUI.openBuildMenu();
      } else {
        log('warn', 'Bau-Menü ist (noch) nicht eingebunden – window.GameUI.openBuildMenu() fehlt.');
      }
    });

    // Nach erfolgreichem Map-Start: Start-Panel schließen, Build-Button anzeigen
    window.addEventListener('cb:game-started', ()=>{
      btnBuild.classList.add('visible');
      startPanel.style.display = 'none';
    });

    // Inspector-Knopf: rechts unten (öffnet Inspector Overlay)
    $('#btn-inspector').addEventListener('click', ()=>{
      window.GameInspector?.toggle?.(true) || window.GameInspector?.open?.();
    });
  })();
  </script>
</body>
</html>
