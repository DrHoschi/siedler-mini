<!doctype html>
<!--
  Neue Siedler – Index
  Version: v17.4.1
  CODE_STYLE:
    - ?v= Versionsanhang (Cache-Buster)
    - Reihenfolge: Core → PF/Carriers → UI-Bridge → UI (Start/Build) → Inspector → Boot
    - Keine Altlasten (render.js NICHT mehr einbinden)
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0d">
  <title>Neue Siedler</title>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css?v=17.4.1">
  <link rel="stylesheet" href="ui-start.css?v=17.4.1">
  <link rel="stylesheet" href="assets/ui/ui-build.css?v=17.4.1">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    html, body { height:100%; margin:0; background:#0c120f; }
    #game { display:block; width:100vw; height:100vh; touch-action:none; }
    .ui-fab { position:fixed; z-index:100000; pointer-events:auto; user-select:none; }
    #btn-build { left:16px; bottom:16px; }
    #btn-inspector { right:16px; bottom:16px; }
    .ui-fab button{
      width:52px; height:52px; border-radius:50%; border:none;
      background:rgba(30,30,30,.92); color:#fff; font-size:22px;
      box-shadow:0 10px 28px rgba(0,0,0,.35); backdrop-filter:blur(6px);
      cursor:pointer;
    }
    body.has-build-open #btn-build,
    body.has-build-open #btn-inspector { bottom:240px; }
  </style>
</head>
<body>

  <!-- Bühne -->
  <canvas id="game" data-map="assets/maps/map-mini.json" aria-label="Spielfeld"></canvas>

  <!-- FABs -->
  <div id="btn-build" class="ui-fab" title="Bau-Menü öffnen/schließen">
    <button type="button" aria-label="Bau-Menü" onclick="try{GameUI?.toggleBuild();}catch(_){console.warn('[ui] Build-Toggle nicht verfügbar');}">🧱</button>
  </div>
  <div id="btn-inspector" class="ui-fab" title="Inspector öffnen/schließen">
    <button type="button" aria-label="Inspector" onclick="try{GameUI?.toggleInspector();}catch(_){console.warn('[ui] Inspector-Toggle nicht verfügbar');}">🛠</button>
  </div>

  <!-- Core -->
  <script src="assets/core/core.env.js?v=17.4.1"></script>
  <script src="assets/core/core.entities.js?v=17.4.1"></script>
  <script src="assets/core/core.render.js?v=17.4.1"></script>
  <script src="assets/core/core.production.js?v=17.4.1"></script>
  <script src="assets/core/core.pfglue.js?v=17.4.1"></script>
  <script src="assets/core/core.map.js?v=17.4.1"></script>
  <script src="assets/core/core.input.js?v=17.4.1"></script>
  <script src="assets/core/carriers.js?v=17.4.1"></script>
  <script src="assets/core/game.bootstrap.js?v=17.4.0"></script>

  <!-- Legacy-Fassade (falls noch genutzt) -->
  <script defer src="game.js?v=17.4.1"></script>
  <script defer src="core/pathfinder.js?v=16.5.0"></script>

  <!-- UI -->
  <script defer src="assets/ui/ui-bridge.js?v=17.4.1"></script>
  <script defer src="assets/ui/ui-start.js?v=17.4.1"></script>
  <script defer src="assets/ui/ui-build.js?v=17.4.1"></script>

  <!-- Inspector (Kombi Core+Tabs) -->
  <script defer src="assets/inspector/inspector.js?v=17.4.1"></script>

  <!-- Boot-Compat (nur Fallback, kein Doppelstart) -->
  <script defer src="boot.compat.js?v=17.4.1"></script>

  <!-- SW optional -->
  <script>
    (function(){
      if ('serviceWorker' in navigator){
        var keep = location.search.includes('keep-sw=1');
        if (keep){
          navigator.serviceWorker.register('sw.js?v=17.4.1').catch(e=>console.warn('[sw] reg fail:', e?.message));
        } else {
          navigator.serviceWorker.getRegistrations?.().then(list=>list.forEach(r=>r.unregister()));
        }
      }
      window.__cb = window.__cb||{}; window.__cb.indexVersion="v17.4.1";
      window.addEventListener('cb:build-open', ()=>document.body.classList.add('has-build-open'));
      window.addEventListener('cb:build-close', ()=>document.body.classList.remove('has-build-open'));
      console.log('UI bereit (index v17.4.1)');
    })();
  </script>
  <script>
/* Panic-Inspector v17.4.3 — öffnet IMMER, unabhängig von GameUI/Inspector */
(function(){
  var btn = document.querySelector('#btn-inspector button');
  function ensureBox(){
    var el = document.getElementById('inspector');
    if (!el){
      el = document.createElement('div');
      el.id = 'inspector';
      el.setAttribute('role','dialog');
      Object.assign(el.style,{
        position:'fixed', right:'12px', bottom:'80px',
        width:'400px', maxWidth:'90vw', maxHeight:'70vh', overflow:'auto',
        background:'rgba(20,20,20,.94)', border:'1px solid #333', borderRadius:'8px',
        boxShadow:'0 14px 40px rgba(0,0,0,.45)', backdropFilter:'blur(6px)',
        color:'#eaeaea', font:'14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
        zIndex: 100006, display:'none'
      });
      var head = document.createElement('div');
      Object.assign(head.style,{display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'10px 12px',borderBottom:'1px solid #2d2d2d'});
      var title = document.createElement('div'); title.textContent = 'Inspector (Panic)';
      title.style.fontWeight = '700';
      var close = document.createElement('button'); close.textContent = '✕';
      Object.assign(close.style,{background:'transparent',border:'1px solid #3a3a3a',
        borderRadius:'4px',color:'#ddd',cursor:'pointer'});
      close.onclick = function(){ el.style.display='none'; };
      head.appendChild(title); head.appendChild(close); el.appendChild(head);

      var body = document.createElement('div');
      body.id = 'inspector-tabs';
      body.style.padding = '8px 10px';
      body.innerHTML = '<div style="opacity:.8;margin-bottom:6px">Failsafe-Inspector aktiv.</div>'
        + '<div id="inspector-logs" style="padding:6px;font-family:monospace;font-size:12px;'
        + 'white-space:pre-wrap;max-height:200px;overflow:auto;background:rgba(0,0,0,.08);'
        + 'border:1px solid #2a2a2a;border-radius:4px">[Logs]\n</div>';
      el.appendChild(body);
      document.body.appendChild(el);

      // Log-Hook (falls vorhanden)
      try{
        if(window.CBLog && !window.__panicLogHook){
          var orig = window.CBLog.push.bind(window.CBLog);
          window.CBLog.push = function(type,msg){
            try{
              var box = document.getElementById('inspector-logs');
              if (box){ box.textContent += '['+(type||'log').toString().toUpperCase()+'] '+(msg||'')+'\n';
                        box.scrollTop = box.scrollHeight; }
            }catch(_){}
            return orig(type,msg);
          };
          window.__panicLogHook = true;
        }
      }catch(_){}
    }
    return el;
  }
  function openPanicInspector(){
    var box = ensureBox();
    box.style.display = 'block';
    // Falls der „echte“ Inspector vorhanden ist, übernimmt er sofort:
    try{ if (window.Inspector && typeof Inspector.toggle==='function') Inspector.toggle(true); }catch(_){}
  }
  // Button verdrahten (falls GameUI.toggleInspector kaputt ist)
  if (btn){
    btn.addEventListener('click', function(ev){
      try{
        if (window.GameUI && typeof GameUI.toggleInspector==='function'){
          GameUI.toggleInspector(); // normaler Weg
        } else {
          openPanicInspector();     // Fallback
        }
      }catch(e){
        console.warn('[panic-inspector] Fehler:', e && e.message);
        openPanicInspector();
      }
    }, {capture:true}); // capture, damit wir VOR defekten Handlern sind
  }
  // Zusätzlich: Tastatur-Shortcut „i“ (Desktop)
  window.addEventListener('keydown', function(e){
    if ((e.key==='i' || e.key==='I') && !e.metaKey && !e.ctrlKey){
      openPanicInspector();
    }
  });
})();
</script>
</body>
</html>
