Leitplanken:

- Bau-Menü über CORE-UI (keine zweite UI-Variante aus /assets/ui mehr).

<html lang="de">
<head>
  <!-- =======================================================================
  (1) META & BASIS
  ======================================================================== -->
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0d">
  <title>Neue Siedler</title>

  <!-- =======================================================================
  (2) STYLES – Projekt-Styles + Inspector + (optionales) UI-Build-Layout
  Hinweis: Die CORE-UI bringt eigene Minimal-Styles per <style> mit (ui-build.js),
  hier ergänzen wir nur Rahmen & Dock-Positionierung.
  ======================================================================== -->
  <link rel="stylesheet" href="assets/ui/ui-start.css?v=17.8.10"><!-- Start-Panel -->
  <link rel="stylesheet" href="css/base.css?v=20250914">
  <link rel="stylesheet" href="assets/inspector/inspector.css?v=20250914">

  <style>
    /* ---------- Bühne/Grundlayout ---------- */
    html, body { height:100%; margin:0; background:#0b0f0d; color:#eaeaea; }
    #game { display:block; width:100vw; height:100vh; touch-action:none; position:relative; z-index:0; }

    /* ---------- FABs ---------- */
    .ui-fab { position:fixed; z-index:2147483647 !important; pointer-events:auto !important; }
    #btn-build { left:16px; bottom:16px; }
    #btn-inspector { right:16px; bottom:16px; }
    .ui-fab button{
      width:52px; height:52px; border:none; border-radius:50%;
      background:#2a2d31; color:#fff; font-size:22px;
      box-shadow:0 10px 28px rgba(0,0,0,.35); backdrop-filter:blur(6px); cursor:pointer;
      pointer-events:auto !important;
    }

    /* ---------- Build-Dock Behaviors ---------- */
    /* Container, in den die CORE-UI mountet */
    #build-panel {
      position:fixed; left:0; right:0; bottom:0;
      max-height:40vh; /* Sichtfenster für 2 Zeilen + Tabs (Details steuert CORE-UI intern) */
      background:transparent; z-index:1000; pointer-events:none; /* geschlossen: kein Klickfang */
    }
    /* wenn offen → Dock klickbar machen */
    body.has-build-open #build-panel { pointer-events:auto; }
    /* geschlossen: Inhalt ausblenden */
    #build-panel .ui-build { display:none; }
    /* offen: Inhalt sichtbar */
    body.has-build-open #build-panel .ui-build { display:flex; }

    /* FABs hochsetzen, wenn Bau-Dock offen ist */
    body.has-build-open #btn-build,
    body.has-build-open #btn-inspector { bottom: calc(40vh + 16px); }
  </style>
</head>
<body>

  <!-- =======================================================================
  (3) BÜHNE: Spielfeld + Bau-Dock + Start-Panel + FABs
  ======================================================================== -->

  <!-- 3.1 Spielfeld (Canvas) -->
  <canvas id="game" data-map="assets/maps/map-mini.json" aria-label="Spielfeld"></canvas>

  <!-- 3.2 Build-Dock Mountpoint: Hier rendert die CORE-UI ihr Tab-Menü hinein -->
  <div id="build-panel" class="ui-build-dock" aria-label="Bau-Menü"></div>

  <!-- 3.3 Start-Panel -->
  <div id="start-panel" class="ui-start" aria-label="Startmenü">
    <div class="ui-start-bg" role="img" aria-label="Hintergrund"></div>
    <div class="ui-start-card" role="dialog" aria-modal="true">
      <h1>Neue Siedler</h1>
      <div class="actions">
        <button id="btnStartNew" class="btn main">Neues Spiel</button>
        <button id="btnStartResume" class="btn">Weiterspielen</button>
        <button id="btnStartReset" class="btn ghost">Reset</button>
        <button id="btnStartFullscreen" class="btn ghost">Fullscreen</button>
      </div>
    </div>
  </div>

  <!-- 3.4 FABs (Bau/Inspector) -->
  <div id="btn-build" class="ui-fab" title="Bau-Menü öffnen/schließen">
    <button type="button" aria-label="Bau-Menü"
      onclick="try{GameUI?.toggleBuild();}catch(e){console.warn('[ui] Build-Toggle nicht verfügbar',e);}">🧱</button>
  </div>
  <div id="btn-inspector" class="ui-fab" title="Inspector öffnen/schließen">
    <!-- Lastenheft: direkte API -->
    <button type="button" aria-label="Inspector"
      onclick="try{ InspectorAPI.toggle(); }catch(e){ console.warn('[ui] InspectorAPI.toggle() nicht verfügbar', e); }">🛠</button>
  </div>

  <!-- =======================================================================
  (4) CORE & ENGINE – Reihenfolge ist wichtig
  ======================================================================== -->

  <!-- 4.1 Polyfill & Env -->
  <script src="assets/core/cblog.polyfill.js?v=1.2.2"></script>
  <script src="assets/core/core.env.js?v=17.8.2"></script>

  <!-- 4.2 Registry zuerst! Dann JSON-Adapter, dann Entities-Bridge -->
  <!-- Registry / Adapter -->

  <script src="assets/core/registry.js?v=1.2.3"></script>             <!-- Cache-Bust gegenüber 1.2.0 -->
  <script src="assets/core/registry.json-adapter.js?v=1.0.2"></script>
  <!-- Entities-Bridge -->
  <script src="assets/core/entities.registry.js?v=1.1.2"></script>
  
  <!-- 4.3 Assets/Build Layer -->
  <script src="assets/core/asset.js?v=17.8.7"></script>
  <script src="assets/core/build.assets.js?v=17.8.7"></script>

  <!-- 4.4 Engine/Renderer/Input/Map -->
  <script src="assets/core/core.entities.js?v=17.6.2"></script>
  <script src="assets/core/core.production.js?v=17.8.2"></script>
  <script src="assets/core/core.pfglue.js?v=17.8.2"></script>
  <script src="assets/core/camera.js?v=17.9.5"></script>
  <script src="assets/core/core.map.js?v=17.9.1"></script>
  <script src="assets/core/core.input.js?v=17.8.2"></script>
  <script src="assets/core/overlay-hooks.js?v=17.8.2"></script>
  <script src="assets/core/core.render.js?v=17.9.5"></script>

  <!-- 4.5 Game Bootstrap -->
  <script src="assets/core/game.bootstrap.js?v=17.8.7"></script>
  <script src="assets/core/game.js?v=17.10.0"></script>

  <!-- =======================================================================
  (5) INSPECTOR (Split-Load, unverändert)
  ======================================================================== -->
  <script defer src="assets/inspector/inspector.core.js?v=18.14.5"></script>
  <script defer src="assets/inspector/inspector.logs.js?v=18.14.4"></script>
  <script defer src="assets/inspector/overlay.hooks.js?v=1.4"></script>

  <script defer src="assets/inspector/inspector.api-bridge.js?v=1.0.0"></script>

  <!-- =======================================================================
  (6) UI – CORE-Bau-Menü + Start-Panel
  Wichtig: Nur die CORE-Variante laden, keine /assets/ui/ui-build*.js mehr.
  Reihenfolge: Bridge → Kategorien → UI → Start
  ======================================================================== -->
  <script src="assets/core/ui-build.data-bridge.js?v=17.0.4"></script>
  <script src="assets/core/build.categories.js?v=17.0.3"></script>
  <script src="assets/core/ui-build.js?v=17.0.3"></script>
  <script defer src="assets/ui/ui-start.js?v=17.8.9"></script>

  <!-- =======================================================================
  (7) BOOT-COMPAT (falls du Kompat-Hooks nutzt)
  ======================================================================== -->
  <script defer src="boot.compat.js?v=17.8.2"></script>

  <!-- =======================================================================
  (8) PAGE-SCRIPTS: Marker, Body-Klassen, GameUI-Toggles (leichtgewichtig)
  ======================================================================== -->
  <script>
    (function () {
      // Marker/Version
      window.__cb = window.__cb || {};
      window.__cb.indexVersion = "v18.4.2";
      (window.CBLog?.info || console.log)("[index] UI bereit (v18.4.2)");

      // Body-Klassen bei Build-Dock open/close
      function setOpen(){ document.body.classList.add('has-build-open'); }
      function setClose(){ document.body.classList.remove('has-build-open'); }
      window.addEventListener('cb:build:open',  setOpen);
      window.addEventListener('cb:build:close', setClose);
      // Legacy
      window.addEventListener('cb:build-open',  setOpen);
      window.addEventListener('cb:build-close', setClose);

      // Kleine UI-Helfer (nur fürs Bau-Dock)
      window.GameUI = {
        toggleBuild(){
          const isOpen = document.body.classList.toggle('has-build-open');
          window.dispatchEvent(new CustomEvent(isOpen ? 'cb:build:open' : 'cb:build:close'));
          if (isOpen && window.UIBuild?.rerender) window.UIBuild.rerender();
        }
        // KEIN toggleInspector hier – Button nutzt die API direkt
      };

      // Hotkeys (B = Build, I = Inspector via API)
      window.addEventListener('keydown', function(ev){
        if (ev.repeat) return;
        if (ev.key === 'b' || ev.key === 'B') { ev.preventDefault(); window.GameUI.toggleBuild(); }
        if (ev.key === 'i' || ev.key === 'I') {
          ev.preventDefault();
          try { InspectorAPI.toggle(); } catch(e) { /* still */ }
        }
      });
    })();
  </script>
  <script>
  (function(){
    function counts(){
      var R = window.Registry || {};
      var cats = R.list?.('categories')?.length || 0;
      var blds = R.list?.('buildings') ?.length || 0;
      return {categories:cats, buildings:blds};
    }
    function fire(tag){
      if (!window.Registry) return;
      if (window.__registryReadyOnce) return;               // schon gesendet
      window.__registryReadyOnce = true;
      try { window.Registry.__ready = true; } catch(_){}
      var c = counts();
      try {
        window.dispatchEvent(new CustomEvent('cb:registry:ready', {
          detail:{ ready:true, counts:c, source:tag||'ready-kicker' }
        }));
      } catch(_){}
    }
    // Wenn das Spiel startet, spätestens dann einmal ready senden
    window.addEventListener('cb:game-start', function(){ setTimeout(function(){ fire('ready-kicker'); }, 0); }, {once:true});
  })();
</script>
<script>
/* ============================================================================
 * registry.ready-ping.js (inline) – garantiert 1x cb:registry:ready
 * ========================================================================== */
(function(){
  'use strict';
  var fired = false;

  function counts(){
    var R = window.Registry || {};
    var cats = R.list?.('categories')?.length || 0;
    var blds = R.list?.('buildings') ?.length || 0;
    return { categories: cats, buildings: blds };
  }

  function fire(tag){
    if (fired) return;
    if (!window.Registry) return;                // Registry muss existieren
    fired = true;
    try { window.Registry.__ready = true; } catch(_){}
    var c = counts();
    var detail = { ready:true, counts:c, source:tag||'ready-ping' };
    try { window.dispatchEvent(new CustomEvent('cb:registry:ready', { detail })); } catch(_){}
    try { document.dispatchEvent(new CustomEvent('cb:registry:ready', { detail })); } catch(_){}
  }

  // 1) So früh wie möglich
  setTimeout(function(){ fire('ready-ping-t0'); }, 0);

  // 2) Spätestens nach Spielstart (falls Listener erst dann aktiv wird)
  window.addEventListener('cb:game-start', function(){
    setTimeout(function(){ fire('ready-ping-game'); }, 0);
  }, { once:true });

  // 3) Kleiner Retry nach kurzer Zeit
  setTimeout(function(){ if (!fired) fire('ready-ping-t100'); }, 100);
})();
</script>
</body>
</html>
