<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Siedler-Mini • v16.0.5</title>
  <style>
    :root{
      --bg:#0f1a17; --panel:#0f1f1b; --panel2:#0b1714; --text:#d7fbe8;
      --muted:#9ac3b6; --ok:#35d07f; --warn:#ffd166; --err:#ff6b6b;
      --chip:#13231e; --btn:#1b342d; --btn2:#132a24; --glass:rgba(15,31,27,.8);
      --accent:#2ad1a2;
    }
    html,body{height:100%;margin:0;background:#142a22;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif}
    #root{position:relative;min-height:100%}
    /* Canvas area */
    #game-wrap{position:fixed;inset:0;display:grid;place-items:center}
    canvas{display:block;touch-action:none}

    /* Backdrop image (menu) */
    #backdrop{
      position:fixed;inset:0;pointer-events:none;
      background:#0f1a17 url(assets/tex/ui/fort_bg.webp) center/cover no-repeat;
      opacity:.85; transition:opacity .35s ease;
    }
    .hide{opacity:0}

    /* Start modal */
    .modal{
      position:fixed;inset:0;display:grid;place-items:center;
      background:linear-gradient(180deg,rgba(0,0,0,.0),rgba(0,0,0,.35) 30%,rgba(0,0,0,.55));
    }
    .card{
      width:min(560px,92vw); padding:20px 22px; border-radius:16px;
      background:linear-gradient(180deg,rgba(17,36,31,.92),rgba(13,28,24,.92));
      box-shadow:0 10px 40px rgba(0,0,0,.45); backdrop-filter: blur(6px);
      border:1px solid rgba(255,255,255,.06)
    }
    .title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:28px}
    .dot{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}
    .sub{opacity:.7;margin:.25rem 0 1rem;font-size:14px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .btn{
      background:var(--btn);border:1px solid rgba(255,255,255,.08);
      padding:10px 16px;border-radius:12px;color:var(--text);font-weight:600;cursor:pointer;
      transition:transform .06s ease, background .2s ease; user-select:none
    }
    .btn:active{transform:translateY(1px)}
    .btn.sec{background:var(--btn2)}
    .chip{display:inline-block;padding:6px 10px;border-radius:10px;background:var(--chip);opacity:.8;font-size:12px}
    .right{margin-left:auto}

    /* Inspector dock */
    #inspector{
      position:fixed;left:12px;right:12px;bottom:12px;z-index:20;
      display:flex;gap:12px;align-items:flex-end;pointer-events:none;
    }
    .ins-panel{
      pointer-events:auto;
      background:linear-gradient(180deg, rgba(12,26,22,.92), rgba(9,19,17,.92));
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px; padding:12px; max-width:min(760px,92vw);
      box-shadow:0 10px 24px rgba(0,0,0,.4);
    }
    .ins-toolbar{display:flex;gap:10px;align-items:center;margin:0 0 10px}
    .seg{display:flex;background:var(--panel2);border-radius:12px;overflow:auto}
    .seg button{background:transparent;border:0;color:var(--text);padding:8px 12px;opacity:.85}
    .seg button.active{background:var(--btn);opacity:1}
    .pill{min-width:70px;text-align:center;background:var(--panel2);padding:8px 12px;border-radius:12px}
    .ghost{opacity:.7}
    .logbox{
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      white-space:pre-wrap; max-height:28vh; overflow:auto;
      background:rgba(0,0,0,.25); border-radius:12px; padding:10px;
    }
    .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)}
    .muted{color:var(--muted)}

    /* Floating mini buttons (toggle inspector) */
    #miniBtns{pointer-events:auto;display:flex;flex-direction:column;gap:10px}
    .mini{
      width:44px;height:44px;border-radius:12px;background:var(--panel);
      display:grid;place-items:center;border:1px solid rgba(255,255,255,.08);cursor:pointer
    }

    /* Compact on small screens */
    @media (max-width:480px){
      .card{padding:16px}
      .title{font-size:22px}
      .logbox{max-height:40vh}
    }
  </style>
</head>
<body>
<div id="root">
  <!-- Backdrop image -->
  <div id="backdrop"></div>

  <!-- Game canvas -->
  <div id="game-wrap">
    <canvas id="gameCanvas" width="640" height="400"></canvas>
  </div>

  <!-- Start modal -->
  <div id="startModal" class="modal">
    <div class="card">
      <div class="title"><span class="dot"></span> Siedler-Mini</div>
      <div class="sub">
        Neues Spiel starten? <span class="muted">(Map: <code id="mapLabel">assets/maps/map-mini.json</code>)</span>
      </div>
      <div class="row">
        <button id="btnStart" class="btn">Start</button>
        <button id="btnEditor" class="btn sec">Editor öffnen</button>
        <span class="right chip">v16.0.5</span>
      </div>
    </div>
  </div>

  <!-- Inspector dock -->
  <div id="inspector">
    <div id="miniBtns">
      <div id="btnToggleInspector" class="mini" title="Inspector ein/aus">🪵</div>
    </div>

    <div id="insPanel" class="ins-panel" hidden>
      <div class="ins-toolbar">
        <div class="pill" id="logCount">Log 0</div>
        <div class="seg" role="tablist" aria-label="Filter">
          <button id="fAll" class="active">Alle</button>
          <button id="fOK">✅ OK</button>
          <button id="fWarn">⚠️ Warn</button>
          <button id="fErr">❌ Fehler</button>
          <button id="fGame">🎮 Game</button>
          <button id="fEditor">✏️ Editor</button>
        </div>
        <div class="right seg">
          <button id="btnCopy">Log kopieren</button>
          <button id="btnClear">Log leeren</button>
          <button id="btnCache">Cache leeren</button>
        </div>
      </div>
      <div class="logbox" id="logBox" aria-live="polite" aria-label="Debug Log"></div>
      <div class="muted ghost" id="versionLine" style="margin-top:6px"></div>
    </div>
  </div>
</div>

<!-- Game script (defer = bereit vor Start-Klick) -->
<script defer src="game.js"></script>

<script>
/* =========================
   index.html v16.0.5 – Boot & UI
   ========================= */

(function(){
  const VER = 'index v16.0.5';
  // --- light logger, routes to game logger if available
  const bootLog = [];
  function stamp(){const d=new Date(); return '['+d.toTimeString().slice(0,8)+']';}
  function push(kind, msg, scope='ui'){
    const icon = kind==='ok'?'✅':(kind==='warn'?'⚠️':'❌');
    const line = `${stamp()} ${icon} (${kind}) ${msg}`;
    bootLog.push({kind,scope,line});
    // mirror to game logger if already present
    if (window.Game && Game.log){ Game.log(kind,msg,'ui'); }
    renderLog();
  }
  // expose minimal UI logger in case game.js wants to use it early
  window._UILog = { ok:(m,s)=>push('ok',m,s), warn:(m,s)=>push('warn',m,s), err:(m,s)=>push('err',m,s), dump:()=>bootLog.slice() };

  // DOM refs
  const $ = sel => document.querySelector(sel);
  const startModal = $('#startModal');
  const backdrop = $('#backdrop');
  const btnStart = $('#btnStart');
  const btnEditor = $('#btnEditor');
  const canvas = $('#gameCanvas');
  const insPanel = $('#insPanel');
  const btnToggleInspector = $('#btnToggleInspector');
  const logBox = $('#logBox');
  const logCount = $('#logCount');
  const btnCopy = $('#btnCopy');
  const btnClear = $('#btnClear');
  const btnCache = $('#btnCache');
  const mapLabel = $('#mapLabel');
  const versionLine = $('#versionLine');

  // Inspector filters
  let filter = { ok:true, warn:true, err:true, game:true, editor:true };
  $('#fAll').onclick = ()=>{filter={ok:true,warn:true,err:true,game:true,editor:true}; renderLog(); setActive('#fAll');};
  $('#fOK').onclick = ()=>{filter={ok:true,warn:false,err:false,game:true,editor:true}; renderLog(); setActive('#fOK');};
  $('#fWarn').onclick = ()=>{filter={ok:false,warn:true,err:false,game:true,editor:true}; renderLog(); setActive('#fWarn');};
  $('#fErr').onclick = ()=>{filter={ok:false,warn:false,err:true,game:true,editor:true}; renderLog(); setActive('#fErr');};
  $('#fGame').onclick = ()=>{filter.game=!filter.game; renderLog();};
  $('#fEditor').onclick = ()=>{filter.editor=!filter.editor; renderLog();};
  function setActive(id){ document.querySelectorAll('.seg button').forEach(b=>b.classList.remove('active')); document.querySelector(id).classList.add('active'); }

  btnToggleInspector.onclick = ()=>{ insPanel.hidden = !insPanel.hidden; };

  btnCopy.onclick = async ()=>{
    const txt = logBox.textContent || '';
    try{ await navigator.clipboard.writeText(txt); push('ok','Log in Zwischenablage','ui'); }catch(e){ push('warn','Clipboard nicht verfügbar','ui');}
  };
  btnClear.onclick = ()=>{ bootLog.length=0; renderLog(); };
  btnCache.onclick = ()=>{ try{
      if(localStorage) localStorage.clear();
      if(caches?.keys){ caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))); }
      push('ok','Cache/Storage geleert – Seite ggf. neu laden','ui');
    }catch(e){ push('warn','Cache leeren nicht möglich','ui'); }
  };

  function renderLog(){
    const lines = (Game?.logger?.all() || bootLog).filter(e=>{
      if(!filter[e.kind]) return false;
      const sc = (e.scope||'').toLowerCase();
      const isGame = sc!=='editor';
      if(isGame && !filter.game) return false;
      if(!isGame && !filter.editor) return false;
      return true;
    }).map(e=>{
      const cls = e.kind==='ok'?'ok':(e.kind==='warn'?'warn':'err');
      return `<div class="${cls}">${escapeHTML(e.line||e)}</div>`;
    }).join('');
    logBox.innerHTML = lines || '<span class="muted">Keine Einträge.</span>';
    const total = Game?.logger?.size() ?? bootLog.length;
    logCount.textContent = `Log ${total}`;
    versionLine.textContent = `UI: ${VER} • game.js: ${Game?.version||'n/a'}`;
  }
  function escapeHTML(s){return (s+'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]));}

  // Start logic
  btnStart.onclick = ()=>{
    if (!window.GameLoader || typeof GameLoader.start!=='function'){
      push('err','GameLoader.start ist nicht verfügbar – game.js noch nicht initialisiert?','ui');
      alert('Fehler beim Start: GameLoader.start ist nicht verfügbar (siehe Log).');
      return;
    }
    startModal.remove(); backdrop.classList.add('hide');
    GameLoader.start({
      canvas,
      mapUrl: mapLabel.textContent.trim(),
      onReady: ()=>{ push('ok','Game started','ui'); renderLog(); }
    });
  };

  btnEditor.onclick = ()=>{
    // Hook: falls Editor angebunden, sonst Hinweis
    if (window.Editor && typeof Editor.open==='function'){
      Editor.open({ via:'menu' });
      push('ok','Editor geöffnet','ui');
    }else{
      push('warn','Editor-Start ist hier noch ein Platzhalter.','ui');
      alert('Editor-Start ist hier noch ein Platzhalter.');
    }
  };

  // Initial UI log
  push('ok',`UI ready (${VER})`,'ui');

  // Re-render logs once game.js attaches its logger
  window.addEventListener('GameLoggerReady', renderLog, {once:true});
})();
</script>
</body>
</html>
