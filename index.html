<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2419" />
  <title>Mini – v16.1.16</title>

  <!-- Basis-Styles: belassen -->
  <link rel="preload" href="./css/base.css" as="style" />
  <link rel="preload" href="./style.css" as="style" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Kleine Zusatz-Styles nur für die schwebenden Buttons (ohne Layout-Eingriff) -->
  <style>
    .cb-fab {
      position: fixed; z-index: 9000;
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20,20,20,.7);
      box-shadow: 0 6px 16px rgba(0,0,0,.35);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff; user-select: none; cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }
    .cb-fab:active { transform: scale(.96); }
    #btn-build { left: 12px; bottom: 12px; opacity: 0; pointer-events: none; }
    #btn-build.visible { opacity: 1; pointer-events: auto; }
    #btn-inspector { right: 12px; bottom: 12px; }
    /* Canvas automatisch auf volle Fläche; dein Startpanel liegt darüber */
    html,body{height:100%} body{margin:0;background:#0e2d21}
    #game{position:fixed;inset:0;display:block;width:100%;height:100%}
  </style>
</head>

<body>
  <!-- ============================================================
       Dein Start-Fenster (Layout NICHT geändert).
       WICHTIG: Bitte deine bisherige Markup-Struktur hier drin lassen.
       Das Script "inspector.js" hängt sich an Buttons/IDs.
       ============================================================ -->
  <div id="start-panel" aria-label="City-Builder Start">
    <!-- Dein bestehender Inhalt:
         - Select für Karte (map-mini.json / map-pro.json / …)
         - Buttons: Start, Neu-Start, Log kopieren, Cache-Booster
         - Hinweise etc.
         Nichts davon wird von mir umgebaut. -->
    # City-Builder starten (index v16.1.16)

    Karte:  map-mini.json map-pro.json map-demo.json map-test-all.json
    ✅ Start    ♻️ Neu-Start    Log kopieren

    Cache-Booster – löscht Storage & (Safari/GitHub)-Caches.
  </div>

  <!-- Vollbild-Canvas für Renderer/Fallback-Vorschau -->
  <canvas id="game"></canvas>

  <!-- Schwebende Buttons (UI): Inspector (falls benötigt) + Bau-Menü -->
  <button id="btn-inspector" class="cb-fab" title="Inspector">🛠️</button>
  <button id="btn-build" class="cb-fab" title="Bau-Menü öffnen">🏗️</button>

  <!-- ===================== SCRIPTS ===================== -->

  <!-- Inspector/Start-Panel-Logik (deine Datei) -->
  <script src="./assets/inspector/inspector.js"></script>

  <!-- Engine/Spiel – stellt GameLoader, Events etc. bereit -->
  <script src="./game.js"></script>

  <!-- Dein Bau-Menü (bestehende Datei) -->
  <script src="./assets/ui/ui-build.js"></script>

  <!-- Bridge (klein) für GameUI-Hooks, falls ui-build.js globale Funktionen erwartet -->
  <script>
    // Version-Badge/Log für index.html
    (function(){
      const v = "v16.1.16";
      window.__cb = window.__cb || {};
      window.__cb.indexVersion = v;
      console.log("[index %s] UI bereit", v);
      window.dispatchEvent(new CustomEvent('cb:ui-ready', { detail: { v }}));
    })();

    // Bau-Menü Button anzeigen, sobald das Spiel läuft
    window.addEventListener('cb:game-started', () => {
      const b = document.getElementById('btn-build');
      b?.classList.add('visible');
    });

    // Inspector-Button → öffnet deinen Inspector (sofern er eine API exportiert)
    document.getElementById('btn-inspector')?.addEventListener('click', () => {
      try { window.Inspector?.open?.(); } catch(_) {}
    });

    // Bau-Menü Button
    document.getElementById('btn-build')?.addEventListener('click', () => {
      // Erwartete globale Funktion aus ui-build.js:
      if (window.GameUI?.openBuildMenu) {
        window.GameUI.openBuildMenu();
      } else {
        console.warn("[index] Bau-Menü ist (noch) nicht eingebunden – window.GameUI.openBuildMenu() fehlt.");
        window.Inspector?.log?.({level:'warn',source:'index',msg:'Bau-Menü ist (noch) nicht eingebunden – window.GameUI.openBuildMenu() fehlt.'});
      }
    });
  </script>
</body>
</html>
