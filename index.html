<!doctype html>
<html lang="de">
<head>
  <!--
    Projekt:  Siedler-Mini
    Datei:    index.html
    Version:  v16.1.0
    Zweck:    Einstieg + UI + Build-Menü + Logging
    Hinweis:  Bitte Versionsnummer bei jedem Patch erhöhen (Cache-Busting).
  -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Siedler-Mini</title>

  <style>
    :root{
      --bg:#0e1a14; --panel:#0f241a; --panel2:#0b1b15; --br:14px;
      --ok:#50fa7b; --warn:#ffd166; --err:#ff6b6b; --muted:#9db2a3;
      --btn:#1c3a2b; --btn2:#12261d; --btnHi:#2f5b45;
      --logFont: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    html,body{height:100%;margin:0;background:#0f1d17;color:#dfeee5;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue","Noto Sans",sans-serif;}
    #app{position:fixed; inset:0; display:grid; grid-template-rows: 1fr auto;}
    #stage{background:#335c3a;}
    /* floating log */
    .logWrap{position:absolute; right:18px; bottom:18px; width:min(620px, 90vw); z-index:30;}
    .logBox{background:linear-gradient(180deg,var(--panel),var(--panel2)); border-radius:var(--br); padding:14px 16px; box-shadow:0 8px 22px rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.05);}
    .logHead{display:flex; gap:10px; align-items:center; margin-bottom:6px;}
    .logHead h3{margin:0; font-size:18px;}
    .logBtns button{background:var(--btn); border:1px solid rgba(255,255,255,.06); color:#cfe8d8; padding:8px 12px; border-radius:10px; cursor:pointer}
    .logBtns button:hover{background:var(--btnHi)}
    .log{font:var(--logFont); color:#bfead1; white-space:pre-wrap; max-height:40vh; overflow:auto;}
    .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)} .muted{color:var(--muted)}
    /* build bar */
    #buildBar{position:fixed; left:0; right:0; bottom:0; z-index:25; padding:12px 14px; background:linear-gradient(180deg, transparent, rgba(0,0,0,.35) 20%, rgba(0,0,0,.7));}
    .buildPanel{background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:12px; display:flex; gap:12px; overflow:auto;}
    .buildBtn{min-width:140px; display:flex; align-items:center; gap:10px; background:var(--btn2); border:1px solid rgba(255,255,255,.06); padding:10px 12px; border-radius:12px; cursor:pointer; color:#e8f6ee}
    .buildBtn:hover{background:var(--btnHi)}
    .ico{width:36px;height:36px;background-size:1024px 1024px;background-repeat:no-repeat;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
    /* Icons aus Lumberjack-Atlas */
    .atlas-lj{ background-image:url("./assets/buildings/lumberjack/lumberjack_tiers_grid.png?v=1610"); }
    /* Platzhalter für Karte */
    #stageMsg{position:absolute; left:12px; top:8px; color:rgba(255,255,255,.2); font:600 12px/1.1 ui-monospace,monospace; z-index:10}
  </style>
</head>
<body>
  <div id="app">
    <canvas id="stage"></canvas>
    <div id="stageMsg">PLACEHOLDER-RENDER (game.js)</div>

    <div class="logWrap">
      <div class="logBox">
        <div class="logHead">
          <h3>Log</h3>
          <div class="logBtns">
            <button id="btnCopy">Log kopieren</button>
            <button id="btnClear">Log leeren</button>
            <button id="btnCache">Cache leeren</button>
          </div>
        </div>
        <div id="log" class="log"></div>
      </div>
    </div>

    <div id="buildBar" hidden>
      <div class="buildPanel" id="buildPanel"></div>
    </div>
  </div>

  <!-- Scripts: Reihenfolge beachten -->
  <script>
    // ---- Mini Logger ---------------------------------------------------------
    (function(){
      const logEl = document.getElementById('log');
      function ts(){ const d=new Date(); return `[${d.toTimeString().slice(0,8)}]`; }
      function line(icon, cls, msg){ logEl.innerHTML += `${ts()} ${icon} <span class="${cls}">${msg}</span>\n`; logEl.parentElement.scrollTop = logEl.parentElement.scrollHeight; }
      window.AppLog = {
        ok:   m=>line('✅','ok',   m),
        warn: m=>line('⚠️','warn', m),
        err:  m=>line('❌','err',  m),
        note: m=>line('•','muted', m),
        copy(){ navigator.clipboard.writeText(logEl.textContent||'').then(()=>AppLog.ok('Log in Zwischenablage')); },
        clear(){ logEl.textContent=''; },
      };
      window.addEventListener('load', ()=>{
        document.getElementById('btnCopy').onclick = AppLog.copy;
        document.getElementById('btnClear').onclick = AppLog.clear;
        document.getElementById('btnCache').onclick = async ()=>{
          try{
            if('caches' in window){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
            if('serviceWorker' in navigator){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); }
            if(window.localStorage) localStorage.clear(); if(window.sessionStorage) sessionStorage.clear();
            AppLog.ok('Cache/Storage geleert – Seite ggf. neu laden');
          }catch(e){ AppLog.err('Cache/Storage leeren fehlgeschlagen'); }
        };
      });
      AppLog.ok(`UI ready (index v16.1.0)`);
    })();
  </script>

  <!-- Buildings-Atlas (neu) -->
  <script src="./src/assets.buildings.js?v=16.1.0"></script>

  <!-- Build-UI -->
  <script src="./src/ui-build.js?v=16.1.0"></script>

  <!-- Spiel-Logik (Platzhalter wie gehabt) -->
  <script src="./src/game.js?v=16.1.0"></script>
</body>
</html>
