      <div class="start-actions">
        <button id="btn-new"        class="btn main">Neues Spiel</button>
        <button id="btn-continue"   class="btn ghost">Weiterspielen</button>
        <button id="btn-fullscreen" class="btn">Vollbild</button>
        <button id="btn-reset"      class="btn">Reset</button>
        <button id="btn-inspector"  class="btn">Inspector</button>

    <!-- [14] HUD (NEU dynamisch via ui-hud.js)
         Alte statische Variante bleibt zu Referenzzwecken auskommentiert -->

      <span class="hud-item"><img src="assets/icons/resources/wood.png" alt=""> Holz: <b>0</b></span>

  <!-- [26] INLINE-SCRIPTS -->
  <script>
  /* ======================================================================
   * Canvas-Resize (HiDPI-Support)
   * ====================================================================== */
  (function(){
    const dpr = window.devicePixelRatio || 1;
    function resizeCanvasByCssAndDpr(canvas){
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(1, Math.round(rect.width  * dpr));
      const h = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== w)   canvas.width  = w;
      if (canvas.height !== h)  canvas.height = h;
    }
    function resizeAll(){
      ['game','overlay-paths','overlay-units']
        .map(id=>document.getElementById(id))
        .filter(Boolean)
        .forEach(resizeCanvasByCssAndDpr);
    }
    window.addEventListener('resize', resizeAll);
    window.addEventListener('orientationchange', resizeAll);
    document.addEventListener('DOMContentLoaded', resizeAll);
  })();
  </script>

  <script>
  /* ======================================================================
   * Inline-Wiring:
   *  – Startfenster sichtbar
   *  – Nach Klick „Neues Spiel“ → HUD aufbauen, BuildDock zeigen
   *  – Inspector & Build-Button togglen
   * ====================================================================== */
  (function(){
    const $ = (sel,root=document)=>root.querySelector(sel);
    const on = (t,ev,fn)=>t&&t.addEventListener(ev,fn);

    const startPanel = $('#start-panel');
    const buildDock  = $('#build-dock');
    const btnBuild   = $('#btn-build');
    const btnInsp    = $('#btn-inspector');
    const inspRoot   = $('#inspector-root');

    // --- NEUE HUD Initialisierung ---
    document.addEventListener('DOMContentLoaded', ()=>{
      console.log('[HUD] v1.8.1 active');
      HUD.init({
        iconBase: '../../assets/icons/resources/',
        iconMap: {
          holz:    'wood.png',       // bitte sicherstellen, dass Datei existiert!
          stein:   'ore.png',
          fisch:   'fish.png',
          nahrung: 'food.png',
          gold:    'gold.png',
          bev:     'diplomacy.png'
        }
      });
    });

    // --- Boot-Events (Registry/Assets) ---
    document.addEventListener('cb:registry:ready', ()=>{ /* optional hook */ });
    document.addEventListener('cb:assets-ready', ()=>{ /* optional hook */ });

    // --- „Neues Spiel“ ---
    on($('#btn-new'), 'click', ()=>{
      startPanel.classList.add('u-hidden');
      // HUD ist dynamisch → wird per JS eingeblendet, kein hidden-Toggle nötig
      buildDock.classList.remove('hidden');
      document.dispatchEvent(new CustomEvent('req:game:start'));
    });

    // --- Inspector-Toggle ---
    on(btnInsp, 'click', ()=>{
      const isHidden = inspRoot.hasAttribute('hidden');
      inspRoot.toggleAttribute('hidden', !isHidden);
      inspRoot.classList.toggle('u-hidden', !isHidden);
      document.dispatchEvent(new CustomEvent('req:inspector:toggle', { detail: !isHidden }));
    });

    // --- Build-Button-Toggle ---
    on(btnBuild, 'click', ()=>{
      const isHidden = buildDock.classList.contains('hidden');
      buildDock.classList.toggle('hidden', !isHidden);
      btnBuild.setAttribute('aria-expanded', String(isHidden));
      document.dispatchEvent(new CustomEvent('req:build:toggle', { detail: isHidden }));
    });
  })();
  </script>
</body>
