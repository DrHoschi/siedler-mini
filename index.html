<!-- ============================================================================
     Datei    : index.html
     Projekt  : Neue Siedler
     Version  : v25.10.17 (FINAL)
     Zweck    : Endgültiger Einstiegspunkt – minimal, robust, ein Weg zum Inspector
                - Lädt NUR die benötigten Core-Module
                - Startpanel & Hintergrundbild separat als UI-Modul
                - Inspector: fester Button (ein Weg), Vollbild-Overlay
     Hinweis  : Reihenfolge ist wichtig! (Core → UI)
============================================================================ -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
  />
  <title>Neue Siedler</title>

  <!-- ================== Styles ================== -->
  <!-- Grund-/Haupt-Styles (inkl. Startbild-Fade, Holzrahmen) -->
  <link rel="stylesheet" href="ui/css/ui.css" />
  <!-- Startpanel-spezifisch (Panel, 4 Buttons untereinander, klein) -->
  <link rel="stylesheet" href="ui/css/ui-start.css" />
  <!-- Inspector (Vollbild, Tabs wischbar, X immer sichtbar) -->
  <link rel="stylesheet" href="ui/ui-inspector.css" />

  <!-- Mini-Fallback, falls die Inspector-CSS mal nicht greift -->
  <style>
    #btn-inspector {
      position: fixed;
      right: calc(12px + env(safe-area-inset-right, 0px));
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 2147483647;
      display: inline-block;
      width: 56px; height: 56px; border-radius: 50%;
      border: 1px solid #0009; background: #2c2c30; color: #fff;
      font-size: 22px; line-height: 56px; text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4); cursor: pointer;
    }
  </style>

  <!-- ================== Core (Pflicht-Reihenfolge) ================== -->
  <script src="core/cblog.polyfill.js"></script>
  <script src="core/asset.js"></script>
  <script src="core/registry.js"></script>
  <script src="core/boot.js"></script>
  <script src="core/game.bootstrap.js"></script>
  <script src="core/game.js"></script>

  <!-- Globale Fehler leiten wir in CBLog, damit sie im Inspector landen -->
  <script>
    window.addEventListener("error", (e)=>{
      (window.CBLog?.err || console.error)(
        `[global] Uncaught Error: ${e.message} @ ${e.filename}:${e.lineno}`
      );
    });
    window.addEventListener("unhandledrejection", (e)=>{
      const msg = e?.reason?.message || String(e.reason || e);
      (window.CBLog?.err || console.error)(`[global] Unhandled Promise Rejection: ${msg}`);
    });
  </script>
</head>

<body>
  <!-- ================== Spielfeld & UI-Wurzel ================== -->
  <canvas id="game-canvas"></canvas>
  <div id="ui-root"></div>

  <!-- ================== Inspector: EIN fester Weg ================== -->
  <!-- 1) Fester Button (einziger Weg, Inspector zu öffnen) -->
  <button id="btn-inspector" aria-label="Inspector öffnen" title="Inspector" class="cb-fab cb-fab-inspector">🛠️</button>
  <!-- 2) Overlay-Host (wird von ui-inspector.js gefüllt) -->
  <div id="inspector-overlay" aria-hidden="true"></div>

  <!-- ================== UI-Module ================== -->
  <!-- Startpanel (Hintergrundbild: assets/ui/start-bg.jpg; blendet beim Start weich aus) -->
  <script src="ui/ui-start.js"></script>

  <!-- Inspector (Vollbild, Tabs wischbar, X sticky; Logs/Events-Bridge) -->
  <script src="ui/ui-inspector.js"></script>
  <script>
    // EIN Weg aktivieren: Button öffnet Inspector, fertig.
    window.addEventListener('DOMContentLoaded', () => {
      // Installiert den Inspector, bindet den vorhandenen Button (#btn-inspector) ein
      if (window.UIInspector && typeof window.UIInspector.install === 'function') {
        window.UIInspector.install();
      } else {
        // Falls Datei nicht geladen: sichtbarer Hinweis ins Log
        (window.CBLog?.warn || console.warn)("[index] ui/ui-inspector.js nicht gefunden oder fehlerhaft – bitte Pfad prüfen.");
      }
    });
  </script>

  <!-- ================== Optional: NoScript-Hinweis ================== -->
  <noscript>
    <div style="position:fixed;inset:0;background:#111;color:#fff;display:grid;place-items:center;font:16px/1.4 system-ui">
      JavaScript ist deaktiviert. Bitte aktivieren, um <b>Neue Siedler</b> zu starten.
    </div>
  </noscript>
</body>
</html>
