<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2419" />
  <title>Mini – v16.1.19</title>

  <!-- Basis-Styles (unverändert) -->
  <link rel="preload" href="./css/base.css" as="style" />
  <link rel="preload" href="./style.css" as="style" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Kleine Zusatz-Styles NUR für die Schwebe-Buttons & Build-Dock -->
  <style>
    .cb-fab{
      position:fixed; z-index:9000; width:56px; height:56px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:rgba(20,20,20,.7); color:#fff; user-select:none; cursor:pointer;
      border:1px solid rgba(255,255,255,.12); box-shadow:0 6px 16px rgba(0,0,0,.35);
      -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
      transition:transform .15s ease, opacity .15s ease;
    }
    .cb-fab:active{ transform:scale(.96); }
    #btn-build{ left:12px; bottom:12px; opacity:0; pointer-events:none; }
    #btn-build.visible{ opacity:1; pointer-events:auto; }
    #btn-inspector{ right:12px; bottom:12px; }

    /* Build-Dock (Bottom Sheet) – reine Hülle, Inhalt kommt aus ui-build.js */
    #build-dock{
      position:fixed; left:0; right:0; bottom:0; z-index:8000; display:none;
      padding:10px 12px; background:rgba(18,18,18,.85); -webkit-backdrop-filter:blur(8px);
      backdrop-filter:blur(8px); border-top:1px solid rgba(255,255,255,.08);
    }
    #build-dock.open{ display:block; }
  </style>
</head>

<body>
  <!-- Start-Panel: DEINS (Layout/Markup lässt du wie bisher). Nur die ID ist wichtig. -->
  <div id="start-panel" aria-label="City-Builder Start">
    <!-- Dein vorhandenes Start-HTML bleibt hier unverändert -->
  </div>

  <!-- Game-Canvas (deins) -->
  <canvas id="game" width="0" height="0"></canvas>

  <!-- Floating Buttons -->
  <button id="btn-inspector" class="cb-fab" title="Inspector">🛠️</button>
  <button id="btn-build" class="cb-fab" title="Bau-Menü">🏗️</button>

  <!-- Build-Dock (Bottom Sheet) – wird von ui-build.js gefüllt -->
  <div id="build-dock" aria-label="Bau-Menü"></div>

  <!-- ===================== Scripts ===================== -->

  <!-- Inspector (dein vorhandener Pfad) -->
  <script src="./assets/inspector/inspector.js"></script>

  <!-- Bridge stellt die globalen Hooks (GameUI*, GameInspector*) bereit -->
  <script src="./assets/ui/ui-bridge.js"></script>

  <!-- Engine + Build-UI + deine Boot-Logik (Reihenfolge beibehalten) -->
  <script src="./game.js"></script>
  <script src="./assets/ui/ui-build.js"></script>
  <script src="./main.js"></script>

  <!-- Index-Version ins Log + Event -->
  <script>
    (function(){
      const v="v16.1.19";
      window.__cb=window.__cb||{}; window.__cb.indexVersion=v;
      (window.CBLog?.ok||console.log)(`UI bereit (index ${v})`);
      window.dispatchEvent(new CustomEvent('cb:ui-ready',{detail:{v}}));
    })();
  </script>
</body>
</html>
