<!doctype html>
<html lang="de">
<head>
  <!-- =========================================================================
       Datei: index.html (Root)
       Projekt: Neue Siedler
       Version: v1.0.0 (2025-09-28)
       Zweck:
         - Einstiegspunkt für Spiel + UI
         - Startfenster zuerst sichtbar
         - Inspector & Debug-Tools integriert
       Struktur:
         HEAD  : Meta + CSS
         BODY  : App-Container mit Panels, HUD, Dock, Inspector
         SCRIPTS: Core → UI → Tools (Reihenfolge beachten!)
  ========================================================================= -->

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Neue Siedler – Epoche 1</title>

  <!-- ==================== CSS ==================== -->
  <!-- Zentrales UI-CSS -->
  <link rel="stylesheet" href="ui/css/ui.css">
  <link rel="stylesheet" href="ui/css/ui-start.css">
  <link rel="stylesheet" href="ui/css/ui-hud.css">
  <link rel="stylesheet" href="ui/css/ui-build.css">
  <link rel="stylesheet" href="ui/css/ui-dialog.css">
  <link rel="stylesheet" href="ui/css/ui-tooltip.css">
  <link rel="stylesheet" href="ui/css/inspector.css">

  <!-- Optional: globale Variablen / Darkmode -->
  <style>
    :root {
      --bg: #1e1e1e;
      --fg: #f0f0f0;
      --accent: #4da3ff;
    }
    body, html {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: sans-serif;
    }
  </style>
</head>

<body>
  <!-- =========================================================================
       DOM-STRUKTUR: Sichtbare Container
  ========================================================================= -->

  <div id="app">
    <!-- Spielfeld -->
        <canvas 
          id="game" 
          width="1280" 
          height="720" 
          data-map="data/maps/map-mini.json">
        </canvas>

<div id="bg-start"></div>

    <!-- Startpanel -->
    <div id="start-panel" class="panel visible">
      <h1>Neue Siedler</h1>
      <button id="btn-new">Neues Spiel</button>
      <button id="btn-continue">Weiterspielen</button>
      <button id="btn-fullscreen">Vollbild</button>
      <button id="btn-reset">Reset</button>
      <button id="btn-inspector">Inspector</button>
    </div>

    <!-- HUD -->
     <div id="hud-top" class="hidden"></div>

    <!-- Build-Dock -->
        <div id="build-dock" class="hidden"></div>

    <!-- Inspector -->
    <div id="inspector" class="hidden"></div>
  </div>


  <!-- =========================================================================
       SCRIPTS: Reihenfolge Core → UI → Tools
  ========================================================================= -->

  <!-- Core -->
  <script src="core/asset.js"></script>
  <script src="core/registry.js"></script>
  <script src="core/game.js"></script>
  <script src="core/boot.js"></script>


  <!-- UI -->
    <script src="ui/ui-start.js"></script>
  <script src="ui/ui-hud.js"></script>
  <script src="ui/ui-build.js"></script>

  <!-- Inspector -->
  <script>window.ICONS = window.ICONS || {};</script>
  <script src="ui/inspector/inspector.core.js"></script>

  <!-- Tools -->
  <!-- <script src="tools/editor/editor.core.js"></script> -->
  <!-- <script src="tools/editor/editor.js"></script> -->

  
  <!-- Debug -->
  <script src="tools/debug-tools.js"></script>

  <!-- Inline-Wiring -->
  <script>
    document.getElementById('btn-inspector').addEventListener('click', () => {
      document.getElementById('inspector').classList.toggle('hidden');
      window.dispatchEvent(new CustomEvent('req:inspector:toggle'));
    });
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });
  </script>
</body>
</html>
