<!doctype html>
<!--
  Neue Siedler – Index
  Version: v17.8.2
  Reihenfolge: Polyfill → Core → UI → Inspector (split) → BootCompat
  Hinweise:
    • Inspector- und UI-Styles nur einmal einbinden
    • Fallbacks bleiben aktiv (ui-bridge & inspector.core zeigen „Inspector lädt…“)
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0d">
  <title>Neue Siedler</title>

  <!-- Projekt-Styles -->
  <link rel="stylesheet" href="style.css?v=17.8.2">
  <!-- UI-Styles (genau 1x, aus assets/ui/) -->
  <link rel="stylesheet" href="assets/ui/ui-start.css?v=17.8.2">
  <link rel="stylesheet" href="assets/ui/ui-build.css?v=17.8.2">
  <!-- Inspector-Styles (genau 1x) -->
  <link rel="stylesheet" href="assets/inspector/inspector.css?v=18.10.6">

  <style>
    /* Basislayout + FABs */
    html, body { height:100%; margin:0; background:#0c120f; }
    #game { display:block; width:100vw; height:100vh; touch-action:none; }

    .ui-fab { position:fixed; z-index:2147483647 !important; pointer-events:auto !important; }
    #btn-build { left:16px; bottom:16px; }
    #btn-inspector { right:16px; bottom:16px; }
    .ui-fab button{
      width:52px; height:52px; border:none; border-radius:50%;
      background:rgba(30,30,30,.92); color:#fff; font-size:22px;
      box-shadow:0 10px 28px rgba(0,0,0,.35); backdrop-filter:blur(6px);
      cursor:pointer;
    }
    body.has-build-open #btn-build,
    body.has-build-open #btn-inspector { bottom:240px; }
  </style>
</head>
<body>

  <!-- Start-Panel -->
  <div id="start-panel" aria-label="Startmenü" class="ui-start">
    <div class="ui-start-bg"></div>
    <div class="ui-start-panel">
      <h1>Neue Siedler</h1>
      <button id="btnStart">Spiel starten</button>
    </div>
  </div>

  <!-- Bühne -->
  <canvas id="game" data-map="assets/maps/map-mini.json" aria-label="Spielfeld"></canvas>

  <!-- Build-Dock -->
  <div id="build-panel" aria-label="Bau-Menü"></div>

  <!-- FABs -->
  <div id="btn-build" class="ui-fab" title="Bau-Menü öffnen/schließen">
    <button type="button" aria-label="Bau-Menü"
      onclick="try{GameUI?.toggleBuild();}catch(_){console.warn('[ui] Build-Toggle nicht verfügbar');}">🧱</button>
  </div>
  <div id="btn-inspector" class="ui-fab" title="Inspector öffnen/schließen">
    <button type="button" aria-label="Inspector"
      onclick="try{GameUI?.toggleInspector();}catch(_){console.warn('[ui] Inspector-Toggle nicht verfügbar');}">🛠</button>
  </div>

  <!-- Polyfill (immer ganz oben vor Core) -->
  <script src="assets/core/cblog.polyfill.js?v=1.2.2"></script>

  <!-- Core (nur assets/core/) -->
  <script src="assets/core/core.env.js?v=17.8.2"></script>
  <script src="assets/core/core.entities.js?v=17.8.2"></script>
  <script src="assets/core/core.production.js?v=17.8.2"></script>
  <script src="assets/core/core.pfglue.js?v=17.8.2"></script>
  <script src="assets/core/core.map.js?v=17.8.2"></script>
  <script src="assets/core/core.input.js?v=17.8.2"></script>
  <script src="assets/core/carriers.js?v=17.8.2"></script>
  <script src="assets/core/overlay-hooks.js?v=17.8.2"></script>
  <script src="assets/core/core.render.js?v=17.8.2"></script>
  <script src="assets/core/game.bootstrap.js?v=17.8.2"></script>

  <!-- UI -->
  <script defer src="assets/ui/ui-bridge.js?v=17.8.2"></script>
  <script defer src="assets/ui/ui-start.js?v=17.8.2"></script>
  <script defer src="assets/ui/ui-build.js?v=17.8.2"></script>

  <!-- Inspector (Split) -->
  <script defer src="assets/inspector/inspector.core.js?v=18.10.6"></script>
  <script defer src="assets/inspector/inspector.logs.js?v=18.10.6"></script>
  <script defer src="assets/inspector/inspector.build.js?v=18.10.6"></script>
  <script defer src="assets/inspector/inspector.paths.js?v=18.10.6"></script>
  <script defer src="assets/inspector/inspector.tests.js?v=18.10.6"></script>

  <!-- Boot-Compat -->
  <script defer src="boot.compat.js?v=17.8.2"></script>

  <!-- Marker / Body-Klassen -->
  <script>
    (function(){
      window.__cb = window.__cb || {};
      window.__cb.indexVersion = "v17.8.2";
      (window.CBLog?.info || console.log)("[index] UI bereit (v17.8.2)");

      window.addEventListener('cb:build-open',  ()=>document.body.classList.add('has-build-open'));
      window.addEventListener('cb:build-close', ()=>document.body.classList.remove('has-build-open'));
    })();
  </script>
</body>
</html>
