<!doctype html>
<html lang="de">
<head>
  <!--
    CityBuilder UI – Index
    Version: v16.1.6
    Zweck:
      - Start-Fenster (Karte wählen, Start/NeuStart/Cache)
      - Inspector-Button immer sichtbar (rechts unten)
      - Bau-Menü-Button erst NACH Spielstart (links unten)
    Wichtige Hooks:
      - 'cb:game-started' (wird in game.js gefeuert)
    Cache-Booster:
      - Query-Parameter ?v=16.1.6 an CSS/JS
  -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>CityBuilder UI v16.1.6</title>
  <link rel="manifest" href="./manifest.webmanifest?v=16.1.6" />
  <link rel="stylesheet" href="./styles.css?v=16.1.6" />
  <link rel="stylesheet" href="./css/base.css?v=16.1.6" />
  <link rel="stylesheet" href="./assets/ui/ui-build.css?v=16.1.6" />
  <style>
    /* --- Mini-UI hier, damit alles in EINER Datei klar ist --- */
    :root {
      --ui-v: "v16.1.6";
      --panel-bg: rgba(20,40,30,.9);
      --panel-br: 14px;
    }
    body { margin:0; background:#0f2a20; color:#e8f4ec; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    /* Start-Panel */
    #startPanel {
      position: fixed; left: 0; right: 0; bottom: 0;
      margin: 0 auto 16px; max-width: 720px;
      background: var(--panel-bg);
      border-radius: var(--panel-br);
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
      padding: 16px;
      z-index: 1000;
    }
    #startPanel.hidden { display:none; }
    #startPanel .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    #startPanel h1 { font-size: 20px; margin: 0 0 8px; }
    .badge { background:#2e5e4b; border-radius:999px; padding:4px 10px; font-size:12px; margin-left:8px; }
    select, button {
      appearance:none; -webkit-appearance:none;
      background:#214f3d; color:#e8f4ec; border:1px solid #2c6c54;
      border-radius:12px; padding:10px 14px; font-weight:600;
    }
    button.primary { background:#236a52; }
    button.ghost { background:#1b4234; }
    button:disabled { opacity:.5; }

    /* Schwebe-Buttons unten links/rechts */
    .fab {
      position: fixed; bottom: 18px; width:56px; height:56px;
      border-radius: 50%; border:1px solid #2c6c54;
      background:#1b4234; display:grid; place-items:center;
      color:#e8f4ec; z-index: 1100;
      box-shadow: 0 6px 24px rgba(0,0,0,.35);
    }
    .fab:active { transform: translateY(1px); }
    #btnInspector { right: 18px; }  /* immer sichtbar */
    #btnBuild     { left:  18px; display:none; } /* erst nach Spielstart */

    /* Platz für Canvas */
    #gameRoot { position: fixed; inset: 0; }
  </style>
</head>
<body>

  <!-- Canvas/Spielbereich -->
  <div id="gameRoot"></div>

  <!-- Start-Panel (erscheint beim Laden / verschwindet nach Start) -->
  <section id="startPanel" aria-label="CityBuilder starten">
    <h1>CityBuilder starten <span class="badge">UI v16.1.6</span></h1>

    <div class="row" style="gap:10px 12px">
      <label for="mapSelect">Karte:</label>
      <select id="mapSelect">
        <!-- Hinweis: Einträge sind bewusst „roh“; die Engine lädt selbst -->
        <option value="./assets/maps/map-mini.json">map-mini.json (16×10)</option>
        <option value="./assets/maps/map-pro.json">map-pro.json (20×12)</option>
      </select>

      <button id="btnStart" class="primary">Start</button>
    </div>

    <div class="row" style="margin-top:10px">
      <button id="btnRestart" class="ghost">Neu starten</button>
      <button id="btnCache" class="ghost">Cache leeren</button>
      <button id="btnLogCopy" class="ghost">Log kopieren</button>
    </div>

    <details style="margin-top:12px">
      <summary>🔧 Tools hier (Start-Phase)</summary>
      <p style="opacity:.8;margin:.5em 0 0">Hinweis: Nach „Start“ verschwindet dieses Fenster automatisch.</p>
    </details>
  </section>

  <!-- Inspector-Button (immer sichtbar, rechts unten) -->
  <button id="btnInspector" class="fab" title="Inspector öffnen/schließen">🛠️</button>

  <!-- Bau-Menü-Button (links unten, NACH Spielstart sichtbar) -->
  <button id="btnBuild" class="fab" title="Bau-Menü öffnen">🏗️</button>

  <!-- Scripts (mit Cache-Booster) -->
  <!-- Reihenfolge: Inspector (UI), Build-UI, Game-UI „Wrapper“ -->
  <script src="./assets/inspector/inspector.js?v=16.1.6"></script>
  <script src="./assets/ui/ui-build.js?v=16.1.6"></script>
  <script src="./game.js?v=16.1.6"></script>
</body>
</html>
