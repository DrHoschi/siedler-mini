    #game { display:block; width:100vw; height:100vh; touch-action:none; position:relative; z-index:0; }

    .ui-fab { position:fixed; z-index:2147483647 !important; pointer-events:auto !important; }

    .ui-fab button{

    }

    /* ---------- Build-Dock Mount ---------- */
    #build-panel {
      position:fixed; left:0; right:0; bottom:0;
      max-height:40vh; background:transparent;
      z-index:1000; pointer-events:none;   /* geschlossen: kein Klickfang */

    #build-panel .ui-build { display:none; }
    body.has-build-open #build-panel { pointer-events:auto; }
    body.has-build-open #build-panel .ui-build { display:flex; }

  <!-- =======================================================================
  (8) PAGE-SCRIPTS: Marker, Body-Klassen, GameUI-Toggles
  ======================================================================== -->
  <script>
    (function () {
      // Marker/Version
      window.__cb = window.__cb || {};
      window.__cb.indexVersion = "v18.5.0";
      (window.CBLog?.info || console.log)("[index] UI bereit (v18.5.0)");

      // Body-Klassen bei Build-Dock open/close
      function setOpen(){ document.body.classList.add('has-build-open'); }
      function setClose(){ document.body.classList.remove('has-build-open'); }
      window.addEventListener('cb:build:open',  setOpen);
      window.addEventListener('cb:build:close', setClose);
      // Legacy (weiterhin bedient)
      window.addEventListener('cb:build-open',  setOpen);
      window.addEventListener('cb:build-close', setClose);

      // Kleine UI-Helfer (nur fürs Bau-Dock)
      window.GameUI = {
        toggleBuild(){
          const isOpen = document.body.classList.toggle('has-build-open');
          window.dispatchEvent(new CustomEvent(isOpen ? 'cb:build:open' : 'cb:build:close'));
          if (isOpen && window.UIBuild?.rerender) window.UIBuild.rerender();
        }
      };

      // Hotkeys (B = Build, I = Inspector via API)
      window.addEventListener('keydown', function(ev){
        if (ev.repeat) return;
        if (ev.key === 'b' || ev.key === 'B') { ev.preventDefault(); window.GameUI.toggleBuild(); }
        if (ev.key === 'i' || ev.key === 'I') {
          ev.preventDefault();
          try { InspectorAPI.toggle(); } catch(e) { /* ignore */ }
        }
      });
    })();
  </script>
