<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>City Builder</title>

  <!-- Basissyles -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/platform.css">
  <link rel="stylesheet" href="./css/mobile.css">
  <link rel="stylesheet" href="./css/ios.css">
  <link rel="stylesheet" href="./css/desktop.css">
  <!-- UI (Start-Overlay & Buttons) -->
  <link rel="stylesheet" href="./assets/ui/ui-build.css">

  <style>
    /* --- v16.1.9: Start-Overlay & HUD Buttons --------------------------- */
    :root {
      --ui-v: "v16.1.9";
      --hud-btn-size: 56px;
    }
    body { background:#0d3222; margin:0; overflow:hidden; }

    /* Fixe HUD-Buttons */
    .hud-btn {
      position: fixed; z-index: 1200;
      width: var(--hud-btn-size); height: var(--hud-btn-size);
      border-radius: 50%;
      display:flex; align-items:center; justify-content:center;
      background:rgba(20,20,20,.85); backdrop-filter: blur(6px);
      box-shadow: 0 6px 18px rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.08);
      color:#eee; font-size:24px; user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .hud-btn:hover { transform: translateY(-1px); }
    #btnInspector { right: 12px; bottom: 12px; }
    #btnBuild     { left:  12px; bottom: 12px; display:none; } /* erst nach Game-Start */

    /* Start-Overlay (zentriert) */
    #startOverlay {
      position: fixed; inset: 0; display:flex; align-items:center; justify-content:center;
      z-index: 1100;
    }
    #startCard {
      width:min(720px, 92vw);
      background: #0f1515ee; color:#e9f3ee;
      border-radius: 16px; padding: 18px 18px 12px;
      box-shadow: 0 16px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.06);
    }
    #startCard h1{
      margin:0 0 10px; font:600 22px/1.1 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial;
    }
    .version-badges{ display:flex; gap:8px; margin:4px 0 12px; }
    .badge{
      font:600 11px/1 system-ui, -apple-system;
      color:#cde7d7;
      background:#0a0f0f; border:1px solid rgba(255,255,255,.06);
      padding:6px 8px; border-radius:999px;
    }
    .row{ display:flex; gap:12px; align-items:center; margin:10px 0; }
    .row > * { flex:1 1 auto; }
    select, button, .btn {
      border-radius:12px; border:1px solid rgba(255,255,255,.08);
      background:#172322; color:#e5f5ea;
      padding:12px 14px; font:600 15px/1 system-ui, -apple-system;
    }
    button.primary { background:#1f7f46; }
    button.warn    { background:#d69b00; color:#000; }
    button.ghost   { background:#121817; color:#d7ebe2; }
    .hint { opacity:.75; font-size:14px; margin-top:8px; }
    /* Start-Overlay Log-Zeile */
    #startLogLine{
      margin-top:10px; font:600 13px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color:#cfe9dc; opacity:.95;
      white-space:pre-wrap;
      background:rgba(0,0,0,.35);
      border-radius:10px;
      padding:10px 12px;
    }

    /* Canvas füllt Seite (Game kümmert sich um Size) */
    #gameRoot, canvas { position:fixed; inset:0; display:block; }
  </style>
</head>
<body>

  <!-- Spielfläche -->
  <div id="gameRoot"><canvas id="game"></canvas></div>

  <!-- Start-Overlay -->
  <div id="startOverlay" role="dialog" aria-modal="true">
    <div id="startCard">
      <h1>City Builder · Start <small style="opacity:.65">(v16.1.9)</small></h1>

      <div class="version-badges">
        <span class="badge">Index v16.1.9</span>
        <span id="badgeGameJs" class="badge">game.js: unbekannt</span>
        <span id="badgeDPR" class="badge">dpr: <span id="dprVal">?</span></span>
      </div>

      <label for="mapSelect" style="display:block; margin:6px 0 4px; opacity:.8">Karte auswählen:</label>
      <div class="row">
        <select id="mapSelect">
          <option value="./assets/maps/map-mini.json">map-mini.json (16×10)</option>
          <option value="./assets/maps/map-pro.json">map-pro.json (20×12)</option>
          <option value="./assets/maps/map-demo.json">map-demo.json</option>
          <option value="./assets/maps/map-test-all.json">map-test-all.json</option>
        </select>
        <button id="btnStart" class="primary">▶︎ Start</button>
        <button id="btnRestart" class="warn">🗑 Neu-Start</button>
      </div>

      <div class="row">
        <button id="btnCache" class="ghost">🧹 Cache-Booster</button>
        <button id="btnCopyLog" class="ghost">📋 Log kopieren</button>
      </div>

      <div class="hint">Hinweis: Nach „Start“ verschwindet dieses Fenster automatisch.</div>

      <div id="startLogLine">—</div>
    </div>
  </div>

  <!-- HUD Buttons -->
  <button id="btnInspector" class="hud-btn" title="Inspector / Test-Cockpit">🛠</button>
  <button id="btnBuild" class="hud-btn" title="Bau-Menü">🏗</button>

  <!-- ========== Skripte laden (Reihenfolge wichtig) ===================== -->
  <!-- Core & Engine -->
  <script defer src="./app-v11.1r6.js"></script>
  <script defer src="./boot.js"></script>
  <script defer src="./main.js"></script>
  <script defer src="./render.js"></script>
  <script defer src="./world.js"></script>
  <script defer src="./input.js"></script>
  <script defer src="./game.js"></script>

  <!-- UI-Module -->
  <script defer src="./ui-build.js"></script>
  <script defer src="./assets/inspector/inspector.js"></script>

  <!-- ===== v16.1.9: Start-Logik, Engine-Waiter, Hooks =================== -->
  <script>
  (function(){
    const $ = sel => document.querySelector(sel);
    const startOverlay = $('#startOverlay');
    const startLogLine = $('#startLogLine');
    const mapSelect    = $('#mapSelect');
    const btnStart     = $('#btnStart');
    const btnRestart   = $('#btnRestart');
    const btnCache     = $('#btnCache');
    const btnCopyLog   = $('#btnCopyLog');
    const btnInspector = $('#btnInspector');
    const btnBuild     = $('#btnBuild');
    const badgeGameJs  = $('#badgeGameJs');
    $('#dprVal').textContent = String(window.devicePixelRatio || 1);

    // ---- kleines Hilfs-Log, das auch in den Inspector gespiegelt wird ----
    const log = {
      ok:   (msg) => { Inspector?.logOk?.(msg);   startLogLine.textContent = `✅ (ok) ${msg}`; },
      warn: (msg) => { Inspector?.logWarn?.(msg); startLogLine.textContent = `⚠️ (warn) ${msg}`; },
      err:  (msg) => { Inspector?.logErr?.(msg);  startLogLine.textContent = `❌ (err) ${msg}`; },
      info: (msg) => { Inspector?.log?.(msg);     startLogLine.textContent = msg; }
    };

    // ---- v16.1.9: GameLoader-Hook + Engine-Ready Event -------------------
    let hookInterval = null;
    function hookGameLoaderWhenAvailable(){
      if (window.GameLoader?.start && !window.GameLoader.__patched_v1619) {
        const orig = window.GameLoader.start;
        window.GameLoader.start = async function(mapPath){
          const r = await orig.call(this, mapPath);
          try {
            // Deine gewünschte Signalisierung:
            window.dispatchEvent(new CustomEvent('cb:game-started'));
            window.GameUI?.onGameStarted?.();
          } catch(_) {}
          return r;
        };
        window.GameLoader.__patched_v1619 = true;
        window.dispatchEvent(new CustomEvent('cb:engine-ready'));
        badgeGameJs.textContent = 'game.js: geladen';
        log.ok('Engine erkannt – GameLoader.start verfügbar');
        clearInterval(hookInterval);
      }
    }
    hookInterval = setInterval(hookGameLoaderWhenAvailable, 200);
    hookGameLoaderWhenAvailable();

    // ---- v16.1.9: Wartelogik für Start ----------------------------------
    let pendingMapPath = null;
    let waiterTimer = null;
    const MAX_WAIT_MS = 12000;

    function tryStartNow(mapPath){
      if (window.GameLoader?.start) {
        log.ok(`Start gedrückt → ${mapPath}`);
        // Starten:
        Promise.resolve()
          .then(() => window.GameLoader.start(mapPath))
          .then(() => {
            log.ok('Game gestartet');
            // UI nach Start:
            startOverlay.style.display = 'none';
            btnBuild.style.display = 'flex'; // Build-Button erst jetzt sichtbar
          })
          .catch(err => {
            log.err(`Start fehlgeschlagen: ${err?.message || err}`);
          });
        return true;
      }
      return false;
    }

    function waitForEngineAndStart(mapPath){
      pendingMapPath = mapPath;
      if (tryStartNow(mapPath)) return;

      log.warn('Engine noch nicht bereit – warte auf GameLoader.start …');
      // Falls Engine-Ready Event eintrifft → sofort starten
      const onReady = () => {
        window.removeEventListener('cb:engine-ready', onReady);
        tryStartNow(pendingMapPath);
      };
      window.addEventListener('cb:engine-ready', onReady);

      // Zusätzlich Polling + Timeout als Fallback
      const poll = setInterval(() => {
        if (tryStartNow(pendingMapPath)) {
          clearInterval(poll);
          clearTimeout(waiterTimer);
          window.removeEventListener('cb:engine-ready', onReady);
        }
      }, 300);
      waiterTimer = setTimeout(() => {
        clearInterval(poll);
        window.removeEventListener('cb:engine-ready', onReady);
        log.err('Timeout: Engine nicht bereit – game.js / Engine noch nicht initialisiert?');
      }, MAX_WAIT_MS);
    }

    // ---- Button-Events ---------------------------------------------------
    btnStart.addEventListener('click', () => {
      const mapPath = mapSelect.value;
      waitForEngineAndStart(mapPath);
    });

    btnRestart.addEventListener('click', () => {
      log.ok('Neu-Start angefordert');
      try { localStorage.clear(); sessionStorage.clear(); } catch(_) {}
      // kleine Verzögerung, damit Log sichtbar ist:
      setTimeout(() => location.reload(), 200);
    });

    btnCache.addEventListener('click', async () => {
      // einfacher Booster: Cache + Storage leeren
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        localStorage.clear(); sessionStorage.clear();
        log.ok('Cache/Storage geleert – Seite ggf. neu laden');
      } catch (e) {
        log.err('Cache-Booster Fehler: ' + (e?.message || e));
      }
    });

    btnCopyLog.addEventListener('click', () => {
      Inspector?.copyLog?.();
      log.ok('Log in Zwischenablage');
    });

    // Inspector öffnen/schließen
    btnInspector.addEventListener('click', () => Inspector?.toggle?.());
    // Bau-Menü öffnen (dieser Button wird erst nach Spielstart sichtbar)
    btnBuild.addEventListener('click', () => window.GameUI?.openBuildMenu?.());

    // Beim tatsächlichen Game-Start (aus Hook) UI anpassen
    window.addEventListener('cb:game-started', () => {
      startOverlay.style.display = 'none';
      btnBuild.style.display = 'flex';
    });

    // Erste Statusmeldungen
    Inspector?.logOk?.('UI bereit (index v16.1.9)');
    log.ok('Bau-Menü bereit (ui-build.js v' + (window.GameUI?.version || 'unbekannt') + ')');
  })();
  </script>
</body>
</html>
