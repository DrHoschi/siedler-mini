<!doctype html>
<!--
  Neue Siedler – Index
  Version: v17.4.4
  Highlights:
    • Früher SW-Killer (vor allem anderen)
    • No-Cache Metas
    • Panic-Inspector direkt am Button (Failsafe)
    • Keine Altlasten (render.js NICHT einbinden)
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0d">
  <title>Neue Siedler</title>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css?v=17.4.4">
  <link rel="stylesheet" href="ui-start.css?v=17.4.4">
  <link rel="stylesheet" href="assets/ui/ui-build.css?v=17.4.4">

  <style>
    html, body { height:100%; margin:0; background:#0c120f; }
    #game { display:block; width:100vw; height:100vh; touch-action:none; }
    .ui-fab { position:fixed; z-index:100000; pointer-events:auto; user-select:none; }
    #btn-build     { left:16px;  bottom:16px; }
    #btn-inspector { right:16px; bottom:16px; }
    .ui-fab button{
      width:52px; height:52px; border-radius:50%; border:none;
      background:rgba(30,30,30,.92); color:#fff; font-size:22px;
      box-shadow:0 10px 28px rgba(0,0,0,.35); backdrop-filter:blur(6px);
      cursor:pointer;
    }
    body.has-build-open #btn-build,
    body.has-build-open #btn-inspector { bottom:240px; }

    /* Safety: falls irgendwo display:none!important gesetzt wurde */
    #inspector { display:block !important; }
  </style>
</head>
<body>

  <!-- SW-Killer (so früh wie möglich) -->
  <script>
    (function killSW(){
      try{
        if (navigator.serviceWorker && navigator.serviceWorker.controller){
          navigator.serviceWorker.getRegistrations().then(list=>{
            list.forEach(r=>r.unregister());
            console.warn('[sw-killer] Unregistered', list.length, 'SWs');
          });
        }
      }catch(_){}
    })();
  </script>

  <!-- Bühne -->
  <canvas id="game" data-map="assets/maps/map-mini.json" aria-label="Spielfeld"></canvas>

  <!-- FAB: Build -->
  <div id="btn-build" class="ui-fab" title="Bau-Menü öffnen/schließen">
    <button type="button" aria-label="Bau-Menü"
      onclick="try{GameUI?.toggleBuild();}catch(_){console.warn('[ui] Build-Toggle nicht verfügbar');}">
      🧱
    </button>
  </div>

  <!-- FAB: Inspector (harte Failsafe-Version direkt im Button) -->
  <div id="btn-inspector" class="ui-fab" title="Inspector öffnen/schließen">
    <button type="button" aria-label="Inspector"
      onclick="(function(){
        try{
          if (window.GameUI && typeof GameUI.toggleInspector==='function'){
            GameUI.toggleInspector(); return;
          }
        }catch(_){}
        // --- PANIC-FALLBACK: Fenster erzwingen ---
        var el=document.getElementById('inspector');
        if(!el){
          el=document.createElement('div');
          el.id='inspector'; el.setAttribute('role','dialog');
          Object.assign(el.style,{
            position:'fixed', right:'12px', bottom:'80px',
            width:'400px', maxWidth:'90vw', maxHeight:'70vh', overflow:'auto',
            background:'rgba(20,20,20,.94)', border:'1px solid #333', borderRadius:'8px',
            boxShadow:'0 14px 40px rgba(0,0,0,.45)', backdropFilter:'blur(6px)',
            color:'#eaeaea', font:'14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
            zIndex:100010, display:'block'
          });
          var head=document.createElement('div');
          Object.assign(head.style,{display:'flex',alignItems:'center',justifyContent:'space-between',
            padding:'10px 12px',borderBottom:'1px solid #2d2d2d'});
          var title=document.createElement('div'); title.textContent='Inspector (Failsafe)'; title.style.fontWeight='700';
          var close=document.createElement('button'); close.textContent='✕';
          Object.assign(close.style,{background:'transparent',border:'1px solid #3a3a3a',
            borderRadius:'4px',color:'#ddd',cursor:'pointer'});
          close.onclick=function(){ el.style.display='none'; };
          head.appendChild(title); head.appendChild(close); el.appendChild(head);
          var body=document.createElement('div'); body.id='inspector-tabs'; body.style.padding='8px 10px';
          body.innerHTML='<div style=&quot;opacity:.8;margin-bottom:6px&quot;>Failsafe aktiv – Inspector-Core fehlt.</div>'
            +'<div id=&quot;inspector-logs&quot; style=&quot;padding:6px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto;background:rgba(0,0,0,.08);border:1px solid #2a2a2a;border-radius:4px&quot;>[Logs]\n</div>';
          el.appendChild(body);
          document.body.appendChild(el);
          try{
            if(window.CBLog && !window.__panicLogHook){
              var orig=window.CBLog.push.bind(window.CBLog);
              window.CBLog.push=function(type,msg){
                try{
                  var box=document.getElementById('inspector-logs');
                  if (box){ box.textContent+='['+(type||'log').toString().toUpperCase()+'] '+(msg||'')+'\n';
                            box.scrollTop=box.scrollHeight; }
                }catch(_){}
                return orig(type,msg);
              };
              window.__panicLogHook=true;
            }
          }catch(_){}
        } else {
          el.style.display = (el.style.display==='none' ? 'block' : 'none');
        }
      })(); return false;">
      🛠
    </button>
  </div>

  <!-- Core -->
  <script src="assets/core/core.env.js?v=17.4.4"></script>
  <script src="assets/core/core.entities.js?v=17.4.4"></script>
  <script src="assets/core/core.render.js?v=17.4.4"></script>
  <script src="assets/core/core.production.js?v=17.4.4"></script>
  <script src="assets/core/core.pfglue.js?v=17.4.4"></script>
  <script src="assets/core/core.map.js?v=17.4.4"></script>
  <script src="assets/core/core.input.js?v=17.4.4"></script>
  <script src="assets/core/carriers.js?v=17.4.4"></script>
  <script src="assets/core/game.bootstrap.js?v=17.4.4"></script>

  <!-- Legacy-Fassade -->
  <script defer src="game.js?v=17.4.4"></script>
  <script defer src="core/pathfinder.js?v=16.5.0"></script>

  <!-- UI -->
  <script defer src="assets/ui/ui-bridge.js?v=17.4.4"></script>
  <script defer src="assets/ui/ui-start.js?v=17.4.4"></script>
  <script defer src="assets/ui/ui-build.js?v=17.4.4"></script>

  <!-- Inspector (Kombi Core+Tabs) -->
  <script defer src="assets/inspector/inspector.js?v=17.4.4"></script>

  <!-- Boot-Compat -->
  <script defer src="boot.compat.js?v=17.4.4"></script>

  <!-- SW optional (nur wenn explizit gewünscht) -->
  <script>
    (function(){
      // NICHT automatisch registrieren – erst wenn du ?keep-sw=1 anhängst.
      if ('serviceWorker' in navigator && location.search.includes('keep-sw=1')){
        navigator.serviceWorker.register('sw.js?v=17.4.4').catch(e=>console.warn('[sw] reg fail:', e?.message));
      }
      window.__cb = window.__cb||{}; window.__cb.indexVersion="v17.4.4";
      window.addEventListener('cb:build-open', ()=>document.body.classList.add('has-build-open'));
      window.addEventListener('cb:build-close', ()=>document.body.classList.remove('has-build-open'));
      console.log('UI bereit (index v17.4.4)');
    })();
  </script>
</body>
</html>
