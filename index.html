    <h3>Diagnose</h3>
    <pre id="diaglog">…</pre>
  </div>

  <!-- 0) SW/Caches killen (außer ?keep-sw) + Diagnose-Helfer -->
  <script>
  (function(){
    var Q=Object.fromEntries(new URLSearchParams(location.search));
    var log=[]; function note(s){try{log.push(s)}catch(e){}}
    window.__DIAG_NOTE__=note;

    // globale Error-Hooks
    window.onerror=function(m,src,ln,col){note("JS-Error: "+m+" @ "+(src||'')+":"+ln+":"+col);showSoon()};
    window.addEventListener('unhandledrejection',e=>{note("Rejection: "+(e.reason && (e.reason.stack||e.reason.message)||e.reason));showSoon()});

    function show(){
      var el=document.getElementById('diag'), pre=document.getElementById('diaglog');
      if(!el||!pre) return;
      el.hidden=false; el.classList.remove('ok');
      var checks=[
        "URL: "+location.href,
        "keep-sw: "+!!Q['keep-sw'],
        "GameLoader: "+!!window.GameLoader,
        "Game: "+!!window.Game,
        "GameUI: "+!!window.GameUI,
        "InspectorReady: "+(typeof window.CBInspectorReady!=='undefined' || !!document.querySelector('[data-inspector-ready]')),
      ];
      pre.textContent=(log.join("\n")+"\n"+checks.join("\n")).trim();
    }
    var t=null; function showSoon(){ if(t) return; t=setTimeout(show,250); }

    if('serviceWorker' in navigator && !('keep-sw' in Q)){
      navigator.serviceWorker.getRegistrations().then(rs=>{
        rs.forEach(r=>r.unregister());
        if(window.caches && caches.keys) caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)));
        note("SW: unregistered + caches cleared");
      }).catch(e=>note("SW-err: "+e));
    }

    // Wenn in 2500ms kein Engine/Game-Event -> Diagnose anzeigen
    var ok=false; function ping(){ ok=true; }
    window.addEventListener('cb:engine-ready', ping, {once:true});
    window.addEventListener('cb:game-started', ping, {once:true});
    setTimeout(function(){ if(!ok) show(); }, 2500);
  })();
  </script>
