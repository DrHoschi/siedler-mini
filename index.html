<!doctype html>
<html lang="de" data-app="siedler-mini" data-version="16.0.3">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Siedler-Mini • v16.0.3</title>

  <!--
    index.html v16.0.3
    -------------------------------------------
    Ziele:
    - Stabile Boot-Sequenz mit sichtbaren Logs schon vor game.js
    - Start-Dialog (Start/Editor öffnen) mit Versionsanzeige
    - Backdrop-Hintergrund (wird nach Game-Start ausgeblendet)
    - Debug-Log-Toast unten: Zähler, "Log kopieren", "Log leeren", "Cache leeren"
    - Robuste Fallbacks: Wenn startGame() (aus game.js) fehlt → Fehlermeldung + Log
  -->

  <style>
    :root{
      --bg:#0e1418;
      --panel:#111a20;
      --panel-2:#0c1317;
      --accent:#4ea1ff;
      --accent-2:#8bdfff;
      --text:#e6edf3;
      --text-dim:#9fb1bf;
      --ok:#6ad488;
      --warn:#ffdd66;
      --err:#ff7a7a;
      --chip:#1a2430;
      --chip-2:#223042;
      --radius:16px;
      --shadow:0 8px 26px rgba(0,0,0,.35);
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--text);
      font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
    }

    /* Vollflächiger Container */
    #app{
      position:fixed; inset:0; overflow:hidden;
      display:grid; grid-template-rows: 1fr auto; /* 1) Spielfläche 2) Logbar */
    }

    /* Backdrop (Startbild) – wird nach Game-Start per Klasse ausgeblendet */
    #backdrop{
      position:absolute; inset:0;
      background:#0c1116 center / contain no-repeat;
      /* Optional: dein Startbild – kann jederzeit ersetzt werden */
      background-image:url("./assets/tex/ui/start_fort_v1.webp");
      display:grid; place-items:center;
      transition:opacity .35s ease;
      z-index:10;
    }
    #backdrop.hidden{ opacity:0; pointer-events:none; }

    /* Modal (Start-Dialog) */
    .modal{
      background:linear-gradient(180deg, var(--panel), var(--panel-2));
      border:1px solid #15222c; border-radius:var(--radius);
      box-shadow:var(--shadow);
      width:min(92vw, 640px);
      padding:18px 18px 14px;
    }
    .modal h1{
      font-size:22px; margin:0 0 6px;
      display:flex; gap:10px; align-items:center;
    }
    .modal h1 .badge{
      width:22px; height:22px; border-radius:6px;
      background:radial-gradient(circle at 30% 30%, #ff6a6a, #7a1c1c);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .modal p{ margin:0 0 14px; color:var(--text-dim) }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap }
    .btn{
      appearance:none; border:0; border-radius:12px; padding:10px 16px;
      background:#203040; color:#eaf3ff; font-weight:600; cursor:pointer;
    }
    .btn.primary{ background:#2f5eff }
    .btn:disabled{ opacity:.5; cursor:not-allowed }
    .small{ font-size:12px; color:var(--text-dim); margin-top:10px }

    /* Spielfläche/Canvas-Halter */
    #stage{
      position:relative; width:100%; height:100%;
      background:#2a4a2d; /* Fallback-Grün, falls Canvas noch nicht malt */
    }
    canvas#gameCanvas{
      position:absolute; inset:0; width:100%; height:100%;
      display:block;
      /* WICHTIG: Benutzer-Zoom/Pan im Browser nicht erwünscht */
      touch-action:none; user-select:none;
    }

    /* Debug-Toast unten */
    #logbar{
      position:relative;
      padding:10px;
      background:linear-gradient(180deg, rgba(0,0,0,.0), rgba(0,0,0,.18));
      border-top:1px solid rgba(255,255,255,.04);
      display:flex; justify-content:center;
    }
    .logbox{
      width:min(960px, 96vw);
      background:#0b1217; border:1px solid #15222c; border-radius:14px;
      box-shadow:var(--shadow);
      padding:8px; display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;
    }
    .chip{
      background:var(--chip); border:1px solid #1a2a36; color:#d5e6f7;
      padding:8px 12px; border-radius:999px; font-weight:700; min-width:56px; text-align:center;
    }
    .chip .muted{ color:var(--text-dim); font-weight:600 }
    .log-actions{ display:flex; gap:8px; flex-wrap:wrap }
    .btn.small{ padding:8px 12px; border-radius:10px; font-weight:700 }
    #debugLog{
      grid-column:1 / span 3;
      height:58px; overflow:auto; resize:vertical;
      margin:2px 0 0; padding:10px 12px;
      background:#081118; border:1px solid #14202b; border-radius:10px;
      font:12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      color:#d9e7f6;
      white-space:pre-wrap;
    }
    .ok{ color:var(--ok) } .warn{ color:var(--warn) } .err{ color:var(--err) }
  </style>
</head>
<body>

  <div id="app">

    <!-- 1) Spielfläche (Canvas-Ebene + Backdrop + Start-Dialog) -->
    <main id="stage" role="main" aria-label="Spielfeld">
      <canvas id="gameCanvas" width="800" height="600"></canvas>

      <!-- Startbild / verschwindet nach Game-Start -->
      <div id="backdrop">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="t">
          <h1 id="t"><span class="badge" aria-hidden="true"></span>Siedler-Mini</h1>
          <p>Neues Spiel starten? <span style="opacity:.7">(Map: <code>assets/maps/map-mini.json</code>)</span></p>
          <div class="row">
            <button id="btnStart" class="btn primary">Start</button>
            <button id="btnEditor" class="btn">Editor öffnen</button>
          </div>
          <div class="small">v16.0.3</div>
        </div>
      </div>
    </main>

    <!-- 2) Debug-Toast unten (Log + Aktionen) -->
    <footer id="logbar" role="contentinfo">
      <div class="logbox">
        <div class="chip"><span class="muted">Log</span> <span id="logCount">0</span></div>
        <div class="log-actions">
          <button id="btnCopyLog" class="btn small">Log kopieren</button>
          <button id="btnClearLog" class="btn small">Log leeren</button>
          <button id="btnClearCache" class="btn small">Cache leeren</button>
        </div>
        <!-- Spacer rechts -->
        <div style="width:1px;"></div>
        <pre id="debugLog" data-ui="logbox" aria-live="polite" aria-label="Debug-Ausgabe"></pre>
      </div>
    </footer>

  </div>

  <!-- Boot-Helfer: leichte Log-Infrastruktur schon VOR game.js -->
  <script>
    (function(){
      const $ = sel => document.querySelector(sel);

      // Minimaler Log-Speicher mit sicherer UI-Anbindung
      const LogStore = {
        list: [],
        push(level, msg){
          const time = new Date().toTimeString().slice(0,8);
          const line = `[${time}] (game) ${msg}`;
          this.list.push({ level, line });
          // UI aktualisieren, wenn vorhanden
          try {
            const box = $("#debugLog");
            const count = $("#logCount");
            if (box) {
              const cls = level === "ok" ? "ok" : level === "warn" ? "warn" : level === "err" ? "err" : "";
              box.insertAdjacentHTML("beforeend", `<div class="${cls}">${line}</div>`);
              box.scrollTop = box.scrollHeight;
            }
            if (count) count.textContent = String(this.list.length);
          } catch(_) { /* ignoriere UI-Probleme */ }
          // Immer zusätzlich in die Dev-Konsole
          (level === "err" ? console.error : level === "warn" ? console.warn : console.log)(line);
        },
        text(){ return this.list.map(x => x.line).join("\n"); },
        clear(){
          this.list.length = 0;
          const box = $("#debugLog");
          const count = $("#logCount");
          if (box) box.textContent = "";
          if (count) count.textContent = "0";
        }
      };

      // Öffentliche, freundliche API (wie früher verwendet)
      window.BootUI = window.BootUI || {
        log:   (m) => LogStore.push("info", m),
        logOK: (m, tag) => LogStore.push("ok",   tag ? `${m} ${tag}` : m),
        warn:  (m) => LogStore.push("warn", m),
        error: (m) => LogStore.push("err",  m),
        copyToClipboard(){
          try{
            navigator.clipboard.writeText(LogStore.text()).then(()=>{
              LogStore.push("ok","Log in Zwischenablage");
            }, e => { throw e; });
          }catch(e){
            // Fallback: Auswahl/Markieren
            const tmp = document.createElement("textarea");
            tmp.value = LogStore.text();
            tmp.style.position="fixed"; tmp.style.left="-9999px";
            document.body.appendChild(tmp); tmp.focus(); tmp.select();
            try{ document.execCommand("copy"); LogStore.push("ok","Log (Fallback) kopiert"); }
            catch{ LogStore.push("warn","Kopieren nicht erlaubt"); }
            finally{ document.body.removeChild(tmp); }
          }
        },
        clearLog(){ LogStore.clear(); },
        clearCaches(){
          // Basis: Service Worker + Storage + Cache API – best effort
          const tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(navigator.serviceWorker.getRegistrations()
              .then(regs => Promise.all(regs.map(r => r.unregister()))));
          }
          if (window.caches) tasks.push(caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))));
          if (window.indexedDB) {
            // Achtung: keine Namen bekannt → nur Hinweis
          }
          Promise.allSettled(tasks).then(()=>{
            LogStore.push("ok","Cache-Bereinigung durchgeführt (Best Effort)");
          });
        }
      };

      // UI-Knöpfe verdrahten
      window.addEventListener("DOMContentLoaded", () => {
        BootUI.logOK("UI ready","(index v16.0.3)");

        $("#btnCopyLog")?.addEventListener("click", () => BootUI.copyToClipboard());
        $("#btnClearLog")?.addEventListener("click", () => BootUI.clearLog());
        $("#btnClearCache")?.addEventListener("click", () => BootUI.clearCaches());

        // Editor-Hook (Platzhalter – tatsächliche Editor-Page später anbinden)
        $("#btnEditor")?.addEventListener("click", () => {
          BootUI.log("Editor öffnen (Hook – später verknüpfen)");
          alert("Editor-Start ist hier noch ein Platzhalter.");
        });

        // Start-Button → versucht startGame aus game.js aufzurufen
        $("#btnStart")?.addEventListener("click", () => {
          try {
            const canvas = $("#gameCanvas");
            if (typeof window.startGame === "function") {
              window.startGame({
                canvas,
                mapUrl: "./assets/maps/map-mini.json",
                onReady: () => {
                  // Backdrop sanft ausblenden
                  $("#backdrop")?.classList.add("hidden");
                },
                onLog: (line, level="info") => {
                  // Optional: game.js kann hierhin loggen
                  const fn = level==="ok" ? BootUI.logOK : level==="warn" ? BootUI.warn : level==="err" ? BootUI.error : BootUI.log;
                  fn(line);
                }
              });
            } else {
              BootUI.error("startGame() ist undefined – lädt game.js korrekt?");
              alert("Fehler beim Start: startGame ist nicht verfügbar.");
            }
          } catch (e) {
            BootUI.error("Startfehler: " + (e?.message || e));
            alert("Fehler beim Start: " + (e?.message || e));
          }
        });
      });

      // Globaler Fehlerfänger → geht immer ins Log
      window.addEventListener("error", (ev) => {
        BootUI.error(`window.onerror ${ev?.error?.message || ev?.message || ev}`);
      });
    })();
  </script>

  <!-- WICHTIG: game.js (deine Spiel-Engine) – Cache-Bust mit Version -->
  <!-- Die Datei stellt u. a. window.startGame(options) bereit. -->
  <script src="./game.js?v=16.0.3" defer onload="BootUI.logOK('script load ok','game.js 16.0.3')"
          onerror="BootUI.error('script load FAIL game.js')"></script>
</body>
</html>
