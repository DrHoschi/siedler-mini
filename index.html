    (function(){

      window.addEventListener('cb:build-open',  ()=>document.body.classList.add('has-build-open'));

    })();

  <!-- Mini-Failsafe: Falls der Split-Inspector wegen Cache nicht initialisiert,
       stellen wir nach kurzer Wartezeit eine minimale API bereit,
       damit der FAB sofort wieder funktioniert. -->
  <script>
    (function(){
      function ensureFailsafe(){
        if (window.__INSPECTOR_API__) return; // echter Inspector ist da
        const panelId = "inspector-failsafe";
        function ensurePanel(){
          let el = document.getElementById(panelId);
          if (!el){
            el = document.createElement("div");
            el.id = panelId;
            el.style.cssText =
              "position:fixed;inset:6vh 6vw;z-index:2147483646;display:none;overflow:auto;" +
              "background:rgba(18,18,20,.96);color:#e5e7eb;border:1px solid #2a2f36;border-radius:12px;" +
              "box-shadow:0 24px 80px rgba(0,0,0,.55);padding:14px";
            el.innerHTML =
              '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">' +
                '<strong style="font-size:18px">Inspector (Failsafe)</strong>' +
                '<button id="__fsClose" style="margin-left:auto;border:none;border-radius:10px;padding:8px 10px;background:#39424b;color:#fff;cursor:pointer">Schließen</button>' +
              '</div>' +
              '<pre style="margin:0;padding:10px;border-radius:10px;background:#0f1216;border:1px solid #26303a;max-height:70vh;overflow:auto">[Hinweis] Gesplittete Inspector-Dateien scheinen noch nicht geladen (Cache?).\nFallback aktiv.\n</pre>';
            document.body.appendChild(el);
            el.querySelector("#__fsClose").onclick = ()=> api.close();
          }
          return el;
        }
        const api = {
          open(){ const el = ensurePanel(); el.style.display = "block"; window.dispatchEvent(new CustomEvent("cb:inspector-open")); (window.CBLog?.info||console.log)("[inspector.failsafe] geöffnet"); },
          close(){ const el = document.getElementById(panelId); if(el){ el.style.display = "none"; } window.dispatchEvent(new CustomEvent("cb:inspector-close")); (window.CBLog?.info||console.log)("[inspector.failsafe] geschlossen"); },
          toggle(force){
            const el = document.getElementById(panelId);
            const willOpen = (force==null) ? !(el && el.style.display!=="none") : !!force;
            willOpen ? api.open() : api.close();
          }
        };
        window.__INSPECTOR_API__ = api; // stellt die API für ui-bridge bereit
        window.dispatchEvent(new CustomEvent("cb:inspector-ready",{detail:{mode:"failsafe"}}));
        (window.CBLog?.info||console.log)("[inspector.failsafe] API bereit");
      }
      // nach onload + 1.5s prüfen
      window.addEventListener("load", ()=> setTimeout(ensureFailsafe, 1500));
    })();
  </script>
