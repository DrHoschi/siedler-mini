<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Siedler-Mini</title>

  <!-- =========================================================
       Siedler-Mini • INDEX • v16.0.4
       - Start-UI mit Status-Icons ✅⚠️❌
       - Log-Overlay mit Copy/Clear/Cache
       - Robuste Startlogik: wartet auf game.js / GameLoader.start
       ========================================================= -->

  <style>
    :root{
      --bg:#0f1a17;
      --panel:#0e2923;
      --panel-2:#0b201b;
      --text:#dfe8e5;
      --muted:#9fb4ad;
      --accent:#49d39d;
      --btn:#123b32;
      --btn-h:#15463b;
      --ok:#33d17a;
      --warn:#f6d32d;
      --err:#e01b24;
      --badge:#1a3a32;
    }

    html,body{height:100%; margin:0; background:#284d2e; color:var(--text); font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;}

    /* Backdrop/Hintergrundbild – bleibt hinter UI */
    .backdrop{
      position:fixed; inset:0; background:#0b1a17;
      background-image:url("./assets/tex/backdrop_fort.jpg");
      background-position:center; background-size:contain; background-repeat:no-repeat;
      opacity:.25; pointer-events:none; z-index:0;
    }

    /* Start-Card */
    .start-wrap{
      position:fixed; inset:0; display:grid; place-items:center; z-index:3;
      background:linear-gradient(180deg, rgba(15,26,23,.65), rgba(15,26,23,.35) 30%, rgba(15,26,23,0) 75%);
    }
    .card{
      width:min(680px, 92vw);
      background:linear-gradient(180deg,var(--panel),var(--panel-2));
      border:1px solid #133d33; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.35);
      padding:20px 22px 18px 22px;
    }
    .title{
      display:flex; gap:10px; align-items:center; font-weight:800; font-size:clamp(22px,3.8vw,28px);
    }
    .dot{width:14px; height:14px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 4px rgba(73,211,157,.15);}
    .subtitle{margin-top:6px; color:var(--muted); font-size:14px;}
    .row{margin-top:16px; display:flex; gap:12px; flex-wrap:wrap}
    .btn{
      background:var(--btn); color:#e7fff6; border:1px solid #1c4a40; border-radius:12px; padding:12px 18px;
      font-weight:700; cursor:pointer; transition:.15s transform, .15s background, .15s opacity;
      user-select:none;
    }
    .btn:hover{background:var(--btn-h)}
    .btn[disabled]{opacity:.55; cursor:not-allowed}
    .ver{margin-top:10px; color:var(--muted); font-size:12px}

    /* Canvas */
    #gameCanvas{
      position:fixed; inset:0; z-index:1; display:block; width:100vw; height:100dvh;
      background:#2e5c33; /* Wiese */
    }

    /* Log-Overlay – immer OBEN */
    .log-wrap{
      position:fixed; left:10px; right:10px; bottom:10px; z-index:99999;
      display:flex; gap:12px; align-items:flex-end; pointer-events:none;
    }
    .log-panel{
      flex:1; background:rgba(8,18,16,.9); border:1px solid #12372f; border-radius:14px; padding:14px;
      backdrop-filter: blur(6px);
      pointer-events:auto;
    }
    .log-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
    .badge{background:var(--badge); padding:6px 12px; border-radius:12px; font-weight:800}
    .tools{margin-left:auto; display:flex; gap:10px}
    .log-btn{background:#112823; color:#daf6ee; border:1px solid #19483f; border-radius:10px; padding:10px 14px; cursor:pointer;}
    .log-box{max-height:28vh; overflow:auto; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; white-space:pre-wrap;}
    .log-line{padding:4px 0; border-bottom:1px dashed rgba(255,255,255,.06)}
    .m-ok{color:var(--ok)}
    .m-warn{color:var(--warn)}
    .m-err{color:var(--err)}

    /* Toast (Hinweis) */
    .toast{
      position:fixed; inset:20px auto auto 50%; transform:translateX(-50%);
      background:#0d2b24; border:1px solid #145043; color:#e8fff7; padding:10px 14px; border-radius:10px;
      z-index:9999; display:none;
    }
  </style>
</head>
<body>

  <div class="backdrop" aria-hidden="true"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- START CARD -->
  <div class="start-wrap" id="startWrap">
    <div class="card">
      <div class="title"><span class="dot"></span> Siedler-Mini</div>
      <div class="subtitle">Neues Spiel starten? <span style="opacity:.7">(Map: <code id="mapLabel">assets/maps/map-mini.json</code>)</span></div>

      <div class="row">
        <button id="btnStart" class="btn">Start</button>
        <button id="btnEditor" class="btn" title="Level-Editor öffnen">Editor öffnen</button>
      </div>

      <div class="ver">v16.0.4</div>
    </div>
  </div>

  <!-- LOG OVERLAY -->
  <div class="log-wrap" id="logWrap">
    <div class="log-panel">
      <div class="log-head">
        <div class="badge">Log</div>
        <div class="tools">
          <button class="log-btn" id="btnCopy">Log kopieren</button>
          <button class="log-btn" id="btnClear">Log leeren</button>
          <button class="log-btn" id="btnCache">Cache leeren</button>
        </div>
      </div>
      <div class="log-box" id="logBox"></div>
    </div>
  </div>

  <!-- Toast/Hinweis -->
  <div class="toast" id="toast"></div>

  <!-- game.js wird globales window.GameLoader bereitstellen -->
  <script src="./game.js" defer onload="BootUI?.logOK('game.js geladen');" onerror="BootUI?.logERR('game.js konnte nicht geladen werden');"></script>

  <script>
  /* =========================================================
     BOOT / LOGGING
     ========================================================= */
  (function(){
    const box = document.getElementById('logBox');
    const toast = document.getElementById('toast');
    const pad = n => String(n).padStart(2,'0');
    const ts = () => {
      const d = new Date();
      return `[${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}]`;
    };

    const push = (css, icon, txt) => {
      const line = document.createElement('div');
      line.className = `log-line ${css}`;
      line.textContent = `${ts()} ${icon} ${txt}`;
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
    };

    const showToast = (msg) => {
      toast.textContent = msg;
      toast.style.display = 'block';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(()=> toast.style.display='none', 4200);
    };

    window.BootUI = {
      logOK: (m)   => push('m-ok','✅', `(ok) ${m}`),
      logWARN:(m)  => push('m-warn','⚠️',`(warn) ${m}`),
      logERR:(m)   => push('m-err','❌', `(err) ${m}`),
      toast: showToast
    };

    BootUI.logOK('UI ready (index v16.0.4)');

    // Buttons Log
    document.getElementById('btnCopy').onclick = async () => {
      const text = Array.from(box.querySelectorAll('.log-line')).map(n=>n.textContent).join('\n');
      try { await navigator.clipboard.writeText(text); BootUI.logOK('Log in Zwischenablage'); }
      catch { BootUI.logERR('Clipboard fehlgeschlagen'); }
    };
    document.getElementById('btnClear').onclick = ()=> { box.innerHTML=''; };
    document.getElementById('btnCache').onclick = async ()=>{
      try{
        if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
        // Storage
        if (navigator.storage && navigator.storage.estimate) {
          // nothing to clear directly, but we show info
        }
        // Local/session
        localStorage.clear(); sessionStorage.clear();
        BootUI.logOK('Cache/Storage geleert – Seite ggf. neu laden');
      }catch(e){ BootUI.logERR('Cache löschen fehlgeschlagen: '+e); }
    };
  })();

  /* =========================================================
     START-LOGIK (wartet robust auf window.GameLoader.start)
     ========================================================= */
  (function(){
    const btnStart  = document.getElementById('btnStart');
    const btnEditor = document.getElementById('btnEditor');
    const startWrap = document.getElementById('startWrap');
    const canvas    = document.getElementById('gameCanvas');
    const mapUrl    = 'assets/maps/map-mini.json';
    document.getElementById('mapLabel').textContent = mapUrl;

    let tried = false;

    const tryStart = () => {
      if (window.GameLoader && typeof window.GameLoader.start === 'function') {
        BootUI.logOK(`GameLoader.start ${mapUrl}`);
        startWrap.style.display = 'none';
        try {
          window.GameLoader.start({
            canvas,
            mapUrl,
            onReady: ()=> BootUI.logOK('Game started')
          });
        } catch (e) {
          BootUI.logERR('Start-Laufzeitfehler: ' + e.message);
          startWrap.style.display = '';
        }
      } else {
        BootUI.logWARN('GameLoader.start noch nicht verfügbar (Game initialisiert noch?).');
      }
    };

    btnStart.addEventListener('click', ()=>{
      // 1) Sofort versuchen
      tryStart();
      if (tried) return;
      tried = true;

      // 2) Bis zu 5s pollend warten (alle 250ms), danach Fehlerhinweis
      const t0 = Date.now();
      const iv = setInterval(()=>{
        if (window.GameLoader && typeof window.GameLoader.start === 'function') {
          clearInterval(iv);
          tryStart();
        } else if (Date.now() - t0 > 5000) {
          clearInterval(iv);
          BootUI.logERR('GameLoader.start nicht gefunden – Start deaktiviert.');
          BootUI.toast('Fehler beim Start: GameLoader.start ist nicht verfügbar (siehe Log).');
        }
      }, 250);
    });

    btnEditor.addEventListener('click', ()=>{
      BootUI.logOK('Editor öffnen (Hook – später verknüpfen)');
      BootUI.toast('Editor-Start ist hier noch ein Platzhalter.');
    });
  })();
  </script>
</body>
</html>
