<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2419" />
  <title>Mini – v16.1.16</title>

  <!-- ===== Bestehende Styles beibehalten ===== -->
  <link rel="preload" href="./css/base.css" as="style" />
  <link rel="preload" href="./style.css" as="style" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./style.css" />

  <!-- FAB-Styles: belassen, falls du sie schon hast; minimal für Build/Inspector-Button -->
  <style>
    .cb-fab {
      position: fixed; z-index: 9000; width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20,20,20,.7); box-shadow: 0 6px 16px rgba(0,0,0,.35);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.12); color: #fff; user-select: none;
      cursor: pointer; transition: transform .15s ease, opacity .15s ease;
    }
    .cb-fab:active { transform: scale(.96); }
    #btn-build   { left: 12px;  bottom: 12px; opacity: 0; pointer-events: none; }
    #btn-build.visible { opacity: 1; pointer-events: auto; }
    #btn-inspector { right: 12px; bottom: 12px; }
  </style>

  <!-- ============================================================= -->
  <!-- 1) SHIM: GameLoader-Queue (verhindert "start nicht verfügbar") -->
  <!--     - Start-Aufrufe werden gepuffert, bis game.js die Engine   -->
  <!--       initialisiert und _flush() aufruft.                      -->
  <!-- ============================================================= -->
  <script>
    (function(){
      // globaler Log-Helper (falls bereits vorhanden: beibehalten)
      window.CBLog = window.CBLog || (function(){
        const buffer = [];
        const subs = new Set();
        function push(level, msg){
          const line = { t: new Date(), level, msg: String(msg) };
          buffer.push(line);
          try { console[level === 'err' ? 'error' : level === 'warn' ? 'warn' : 'log'](msg); } catch(_){}
          subs.forEach(fn=>{ try{ fn(line); }catch(_){ } });
        }
        return {
          buffer,
          push,
          ok:   (m)=>push('ok', m),
          warn: (m)=>push('warn', m),
          err:  (m)=>push('err', m),
          clear: ()=>{ buffer.length = 0; },
          exportText: ()=>buffer.map(l=>{
            const pad=n=>String(n).padStart(2,'0');
            const t=l.t, ts=`${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
            const pref = l.level==='ok'?'✅ (ok) ':l.level==='warn'?'⚠️ (warn) ':l.level==='err'?'❌ (err) ':'';
            return `[${ts}] ${pref}${l.msg}`;
          }).join('\n'),
          on: (fn)=>subs.add(fn),
          off:(fn)=>subs.delete(fn)
        };
      })();

      // Früh da: UI bereit Marker
      const INDEX_VERSION = 'v16.1.16';
      window.__cb = window.__cb || {};
      window.__cb.indexVersion = INDEX_VERSION;
      CBLog.ok(`UI bereit (index ${INDEX_VERSION})`);
      window.dispatchEvent(new CustomEvent('cb:ui-ready', { detail: { v: INDEX_VERSION }}));

      // ---- GameLoader-Queue/Proxy ----
      const GL = window.GameLoader = window.GameLoader || {};
      const queue = [];
      let ready = false;

      // öffentliche Start-API (wird schon vor Engine-Aufbau geklickt)
      GL.start = function(mapUrl){
        if (!ready){
          queue.push(mapUrl);
          CBLog.warn('Engine noch nicht bereit – warte auf GameLoader.start …');
          return;
        }
        return GL._start ? GL._start(mapUrl) : CBLog.err('GameLoader._start fehlt.');
      };

      // wird von game.js aufgerufen, sobald Engine initialisiert
      GL._flush = function(){
        ready = true;
        while(queue.length){
          const url = queue.shift();
          try { GL._start && GL._start(url); }
          catch(e){ CBLog.err('Start fehlgeschlagen: '+e.message); }
        }
      };
    })();
  </script>

  <!-- 2) Kleine Bridge für Bau-Menü (falls deine ui-build.js noch keine globale API setzt) -->
  <script>
    (function(){
      // Nur anlegen, wenn nicht bereits vorhanden:
      if (!window.GameUI){
        window.GameUI = {
          openBuildMenu(){ try{
            // Versuche bekannte Hooks deiner ui-build.js:
            if (window.UIBuild && typeof UIBuild.open==='function') return UIBuild.open();
            // Fallback: Panel per ID ein-/ausblenden
            const el = document.getElementById('buildPanel') || document.getElementById('uiBuild');
            el && el.classList.add('show');
          }catch(e){ CBLog?.err('BuildMenu öffnen fehlgeschlagen: '+e.message); }},
          closeBuildMenu(){ try{
            if (window.UIBuild && typeof UIBuild.close==='function') return UIBuild.close();
            const el = document.getElementById('buildPanel') || document.getElementById('uiBuild');
            el && el.classList.remove('show');
          }catch(e){ CBLog?.err('BuildMenu schließen fehlgeschlagen: '+e.message); }},
          setTool(id){ try{
            // Event für deine Tool-Logik
            window.dispatchEvent(new CustomEvent('cb:set-tool',{detail:{id}}));
            CBLog?.ok('Tool gesetzt: '+id);
          }catch(e){ CBLog?.err('Tool setzen fehlgeschlagen: '+e.message); }}
        };
      }
    })();
  </script>
</head>

<body>
  <!-- ========================================================= -->
  <!-- Dein bestehendes Layout bleibt erhalten.                  -->
  <!-- Wenn du ein Start-Panel hast: NICHT geändert.             -->
  <!-- Canvas-Element, Buttons etc.: NICHT gelöscht.             -->
  <!-- ========================================================= -->

  <!-- Fallback-Inspector-Button (falls du schon einen hast, bleibt deiner aktiv) -->
  <button id="btn-inspector" class="cb-fab" title="Inspector" aria-label="Inspector öffnen">🛠️</button>
  <!-- Build-Button: wird erst nach "cb:game-started" eingeblendet -->
  <button id="btn-build" class="cb-fab" title="Bau-Menü" aria-label="Bau-Menü öffnen">🏗️</button>

  <!-- ===================== SCRIPTS ===================== -->
  <!-- Inspector (deine Datei im Repo) -->
  <script src="./assets/inspector/inspector.js"></script>
  <!-- Engine/Spiel -->
  <script src="./game.js"></script>
  <!-- UI Build (deine Datei) -->
  <script src="./assets/ui/ui-build.js"></script>

  <!-- Start-/Button-Verkabelung OHNE Layout-Änderung -->
  <script>
    (function(){
      const btnInsp  = document.getElementById('btn-inspector');
      const btnBuild = document.getElementById('btn-build');

      btnInsp?.addEventListener('click', ()=> window.GameInspector?.toggle?.());

      btnBuild?.addEventListener('click', ()=>{
        if (!window.GameUI?.openBuildMenu) {
          CBLog?.warn('Bau-Menü ist (noch) nicht eingebunden – window.GameUI.openBuildMenu() fehlt.');
          return;
        }
        window.GameUI.openBuildMenu();
      });

      // Nach Game-Start: Build-Button sichtbar machen
      window.addEventListener('cb:game-started', ()=>{
        btnBuild?.classList.add('visible');
      });
    })();
  </script>
</body>
</html>
