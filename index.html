<!DOCTYPE html>
<html lang="de">
<head>
  <!--
  ================================================
  Datei: index.html
  Projekt: Siedler-Mini
  Version: v16.1.19
  Zweck: Einstieg/DOM-Struktur + Lade-Reihenfolge
  ================================================
  -->

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Siedler-Mini – v16.1.19</title>

  <!-- 2) Imports / Einbindungen (Reihenfolge wichtig)
       1. Basis-CSS
       2. UI/Build-CSS
  -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/platform.css">
  <link rel="stylesheet" href="./css/mobile.css">
  <link rel="stylesheet" href="./css/ios.css">
  <link rel="stylesheet" href="./ui-build.css"> <!-- UI-Start/Build Styles -->

  <style>
    /* Kleiner Schutz: dunkler Hintergrund wie bisher */
    html,body{height:100%} body{margin:0;background:#093c2f;}
  </style>
</head>
<body>
  <!--
  6) UI / DOM-Struktur (Reihenfolge fix gemäß Vorgaben)
  - Start-Panel (id="start-panel")
  - Canvas (id="game")
  - FAB-Buttons (Inspektor/Build)
  - Build-Dock (id="build-dock")
  -->
  <div id="start-panel" aria-label="Startfenster" style="display:none"></div>

  <canvas id="game" aria-label="Spielfeld" width="0" height="0"></canvas>

  <!-- Inspector-FAB (rechts unten) -->
  <button id="btn-inspector" aria-label="Inspektor öffnen" style="
      position:fixed; right:16px; bottom:16px; width:64px; height:64px;
      border-radius:50%; border:none; background:rgba(0,0,0,.35); backdrop-filter: blur(4px);
      cursor:pointer;">🛠️</button>

  <!-- Optionales Build-Dock -->
  <div id="build-dock" aria-label="Baumenü" style="display:none"></div>

  <!-- 2) Imports / Einbindungen (Scripts) -->
  <!-- 1. Extern (keine) -->

  <!-- 2. Eigene Core-Module -->
  <script src="./core/asset.js"></script>
  <script src="./core/asset.items.js"></script>
  <script src="./core/terrain.js"></script>
  <script src="./core/actor.js"></script>

  <!-- 3. UI/Debug/Tools  (Inspector NUR HIER vorher laden!) -->
  <script src="./tools/debug-tools.js"></script>
  <script src="./tools/dev-inspector.js"></script>
  <script src="./assets/ui/ui-bridge.js"></script>
  <script src="./ui-start.js"></script>   <!-- Start-UI (zeigt das gewünschte Fenster) -->
  <script src="./ui-build.js"></script>   <!-- Baumenü/Buttons etc. -->

  <!-- 4. Start-/Main-Logik -->
  <script src="./boot.js"></script>
  <script src="./game.js"></script>
  <script src="./main.js"></script>

  <!-- 7) Logs & Event-Hooks -->
  <script>
    /* 3) Globale Konstanten & Meta */
    window.__cb = window.__cb || {};
    window.__cb.indexVersion = "v16.1.19";

    /* 8) Event: UI ready */
    document.addEventListener('DOMContentLoaded', () => {
      (window.CBLog?.ok || console.log)(`[index] UI bereit (index ${window.__cb.indexVersion})`);
      // Normiertes UI-Ready-Event für alle Module
      window.dispatchEvent(new CustomEvent('cb:ui-ready', { detail:{ version: window.__cb.indexVersion }}));

      // Start-Panel öffnen (falls UI-Modul es anbietet)
      window.GameUI?.openStartPanel?.({
        maps: [
          {label:'map-mini.json (16×)', url:'./assets/maps/map-mini.json'},
          {label:'map-pro.json', url:'./assets/maps/map-pro.json'},
          {label:'map-demo.json', url:'./assets/maps/map-demo.json'}
        ]
      });

      // FAB -> Inspector toggeln (Fallback-Log)
      document.getElementById('btn-inspector')?.addEventListener('click', () => {
        if (window.GameInspector?.toggle) {
          window.GameInspector.toggle();
        } else {
          (window.CBLog?.warn || console.warn)("Inspector (Fallback) – kein GameInspector.toggle() gefunden.");
        }
      });
    });
  </script>
</body>
</html>
