<!doctype html>
<html lang="de">
<head>
  <!--
    Siedler-Mini / CityBuilder – Index
    Version: v16.0.9
    Zweck:
      - Minimaler Frame für Canvas-Spiel
      - Log-Konsole mit Status-Icons ✅⚠️❌
      - Cache-Booster (Storage + origin-private Cache löschen)
      - Editor-/Inspector-Hooks
      - Bau-Menü-Toggle
    Cache-Hinweis:
      - Skripte werden mit query (?v=16.0.9) geladen, damit Safari-GitHub-Caches einfacher brechen.
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Siedler-Mini v16.0.9</title>
  <style>
    :root { --bg:#0d1f19; --panel:#0f2a23; --panel2:#0b241e; --txt:#b9f6ca; --dim:#6fa38b; --btn:#14372e; --btnHi:#175344; --error:#ff6b6b; --warn:#ffd166; --ok:#8ef6a0; }
    html,body { height:100%; margin:0; background:#0b2a22; color:var(--txt); font:15px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #app { position:fixed; inset:0; display:grid; grid-template-rows: 1fr auto; }
    /* Spielfläche */
    #stageWrap{ position:relative; overflow:hidden; background:#1c3c30; }
    #stage{ position:absolute; inset:0; width:100%; height:100%; display:block; background:#2a5a46; }
    /* HUD: Top-Buttons */
    #hud { position:absolute; top:8px; right:8px; display:flex; gap:8px; z-index:10; }
    .btn { background:var(--btn); border:1px solid #13342b; color:#d9ffe2; padding:8px 12px; border-radius:10px; cursor:pointer; }
    .btn:hover { background:var(--btnHi); }
    /* Log-Konsole */
    #logDock { background:linear-gradient(180deg, var(--panel), var(--panel2)); border-top:1px solid #123b30; padding:14px; }
    #logHeader { display:flex; gap:12px; align-items:center; margin-bottom:8px; }
    #logBox { background:#071d18; border:1px solid #103a30; border-radius:12px; padding:12px; max-height:30vh; overflow:auto; }
    .pill { padding:8px 14px; background:#0a342a; border:1px solid #144539; color:#cafde0; border-radius:12px; }
    .row { white-space:pre; }
    .ok   { color:var(--ok); }
    .warn { color:var(--warn); }
    .err  { color:var(--error); }
    /* Build-Bar (unten über Canvas) */
    #buildBar { position:absolute; left:0; right:0; bottom:0; padding:10px; background:rgba(7,29,24,0.82); border-top:1px solid #0e3a30; display:none; z-index:9; }
    #buildRow { display:flex; gap:10px; overflow:auto; }
    .tool { flex:0 0 auto; min-width:140px; text-align:center; padding:10px; border-radius:12px; background:#0f3a30; border:1px solid #144b3e; }
    .tool.active { outline:2px solid #6ff0b2; }
    .tool b { display:block; font-size:22px; margin-bottom:6px; }
    /* kleines Badge links oben mit Version */
    #badge { position:absolute; top:8px; left:8px; background:#0a3329; border:1px solid #174a3d; padding:6px 10px; border-radius:10px; color:#9be5c1; z-index:10; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stageWrap">
      <div id="badge">CityBuilder <b>v16.0.9</b></div>
      <div id="hud">
        <button id="btnLog" class="btn">🧾 Log</button>
        <button id="btnCache" class="btn">🧹 Cache</button>
        <button id="btnInspector" class="btn">🧪 Inspector</button>
        <button id="btnEditor" class="btn">✏️ Editor</button>
        <button id="btnBuild" class="btn">🏗️ Bauen</button>
      </div>
      <canvas id="stage"></canvas>

      <!-- Build-Bar -->
      <div id="buildBar" aria-label="Bauen (v16.0.9)">
        <div id="buildRow">
          <!-- Buttons werden von ui-build.js gefüllt -->
        </div>
      </div>
    </div>

    <!-- Log-Dock -->
    <div id="logDock">
      <div id="logHeader">
        <span class="pill">Log</span>
        <button id="btnCopy"  class="btn">Log kopieren</button>
        <button id="btnClear" class="btn">Log leeren</button>
      </div>
      <div id="logBox" aria-live="polite"></div>
    </div>
  </div>

  <!-- Skripte mit Cache-Breaker -->
  <script src="./game.js?v=16.0.9"></script>
  <script src="./ui-build.js?v=16.0.9"></script>
  <script>
    // --- Bootstrapping der Seite ---
    window.addEventListener('load', () => {
      Game.logOK(`UI ready (index v16.0.9)`);
      // Default: kleine Karte starten, damit sofort etwas zu sehen ist.
      GameLoader.start('./assets/maps/map-mini.json').catch(err=>{
        Game.logERR('Autostart fehlgeschlagen: ' + err.message);
      });
    });

    // UI-Buttons
    btnLog.onclick = () => Game.toggleLog();
    btnClear.onclick = () => Game.clearLog();
    btnCopy.onclick = () => Game.copyLog();
    btnCache.onclick = () => Game.clearCaches();
    btnInspector.onclick = () => (window.GameInspector?.toggle ? window.GameInspector.toggle() : Game.logWARN('Inspector ist (noch) nicht eingebunden – window.GameInspector.toggle() fehlt.'));
    btnEditor.onclick = () => (window.GameEditor?.open ? window.GameEditor.open() : Game.logWARN('Editor ist (noch) nicht eingebunden – window.GameEditor.open() fehlt.'));
    btnBuild.onclick = () => GameUIBuild.toggle();

    // Expose Logbox to Game
    Game.__wireDOM({
      canvas: document.getElementById('stage'),
      logBox: document.getElementById('logBox'),
      buildBar: document.getElementById('buildBar'),
      buildRow: document.getElementById('buildRow'),
    });
  </script>
</body>
</html>
