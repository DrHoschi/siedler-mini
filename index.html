<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2419" />
  <title>Mini – v16.1.16</title>

  <!-- === Deine bestehenden Styles (Layout unverändert lassen) === -->
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/platform.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
  <link rel="stylesheet" href="./css/ios.css" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./assets/ui/ui-build.css" />

  <!-- Nur Styles für die kleinen Schwebe-Buttons (beeinflusst Start-Layout NICHT) -->
  <style>
    .cb-fab {
      position: fixed; z-index: 9000; width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20,20,20,.7); color:#fff; border:1px solid rgba(255,255,255,.12);
      box-shadow: 0 6px 16px rgba(0,0,0,.35);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      cursor: pointer; user-select: none; transition: transform .15s, opacity .15s;
    }
    .cb-fab:active { transform: scale(.96); }
    #btn-inspector { right: 12px; bottom: 12px; }
    #btn-build { left: 12px; bottom: 12px; opacity:0; pointer-events:none; }
    #btn-build.visible { opacity:1; pointer-events:auto; }
  </style>
</head>

<body>
  <!-- ======= Start-Fenster (Layout beibehalten) ======= -->
  <div id="start-panel" class="start-panel" role="dialog" aria-label="City Builder – Start">
    <div class="start-card">
      <div class="start-header">
        <h1 class="title">City-Builder – Start</h1>
        <span id="ui-version" class="muted">index <b>v16.1.16</b></span>
      </div>

      <div class="row">
        <label for="map-select">Karte wählen:</label>
        <div class="grow">
          <select id="map-select" class="input">
            <!-- Du kannst die Liste hier beliebig erweitern -->
            <option value="./assets/maps/map-mini.json">map-mini.json (16x10)</option>
            <option value="./assets/maps/map-pro.json">map-pro.json (20x12)</option>
            <option value="./assets/maps/map-test-all.json">map-test-all.json</option>
            <option value="./assets/maps/map-demo.json">map-demo.json</option>
          </select>
        </div>
      </div>

      <div class="hint">
        <b>Hinweis</b>
        <p>Spiel lädt die gewählte Karte nach „Start“.</p>
      </div>

      <div class="row buttons">
        <button id="btn-start" class="btn btn-primary">▶️ Start</button>
        <button id="btn-restart" class="btn">🔄 Neu-Start</button>
        <button id="btn-logcopy" class="btn">📋 Log kopieren</button>
      </div>

      <div class="row">
        <button id="btn-cache" class="btn">🧹 Cache-Booster</button>
        <small class="muted">Löscht Storage & Caches (hilft gegen Safari/GitHub-Cache).</small>
      </div>
    </div>
  </div>

  <!-- ======= Stage / Canvas (wie gehabt) ======= -->
  <canvas id="game" width="0" height="0"></canvas>

  <!-- ======= Schwebe-Buttons ======= -->
  <button id="btn-inspector" class="cb-fab" title="Inspector öffnen">🛠️</button>
  <button id="btn-build" class="cb-fab" title="Bau-Menü öffnen">🏗️</button>

  <!-- ======= Skripte (Reihenfolge beibehalten) ======= -->
  <script src="./assets/inspector/inspector.js"></script>
  <script src="./game.js"></script>
  <script src="./assets/ui/ui-build.js"></script>

  <!-- Kleine Brücke: stellt GameUI-Hooks bereit, ohne dein Layout zu ändern -->
  <script>
    // v16.1.16 – UI-Bridge & Start-Logik
    (function(){
      const V="v16.1.16";
      window.__cb = window.__cb || {};
      __cb.indexVersion = V;

      // ---- Logging-Bridge in den Inspector ----
      const log = {
        ok:  (m)=> window.Inspector?.log?.("ok", m)  || console.log(m),
        warn:(m)=> window.Inspector?.log?.("warn", m)|| console.warn(m),
        err: (m)=> window.Inspector?.log?.("err", m) || console.error(m)
      };
      log.ok(`UI bereit (index ${V})`);

      // ---- Buttons / UI-Refs ----
      const startPanel   = document.getElementById("start-panel");
      const btnStart     = document.getElementById("btn-start");
      const btnRestart   = document.getElementById("btn-restart");
      const btnLogCopy   = document.getElementById("btn-logcopy");
      const btnCache     = document.getElementById("btn-cache");
      const mapSelect    = document.getElementById("map-select");
      const btnInspector = document.getElementById("btn-inspector");
      const btnBuild     = document.getElementById("btn-build");

      // ---- Inspector öffnen/schließen ----
      btnInspector.addEventListener("click", () => {
        try {
          window.Inspector?.open?.();
        } catch(e){ log.err("Inspector konnte nicht geöffnet werden."); }
      });

      // ---- Build-Menu Hooks (deine bestehende UI) ----
      window.GameUI = window.GameUI || {};
      window.GameUI.openBuildMenu  = window.GameUI.openBuildMenu  || (function(){
        if (window.UIBuild?.open) { window.UIBuild.open(); log.ok("[ok] Bau-Menü geöffnet (ui-build.js)"); }
        else { log.warn("Bau-Menü ist (noch) nicht eingebunden – window.UIBuild.open() fehlt."); }
      });
      window.GameUI.closeBuildMenu = window.GameUI.closeBuildMenu || (function(){
        if (window.UIBuild?.close) { window.UIBuild.close(); log.ok("[ok] Bau-Menü geschlossen"); }
      });

      btnBuild.addEventListener("click", () => window.GameUI.openBuildMenu());

      // ---- Start-Flow ----
      let starting = false;
      async function startGame(selectedMap){
        // Warte, bis GameLoader.start verfügbar ist (Engine warm werden lassen)
        const t0 = performance.now();
        for (let i=0; i<40; i++){         // ~2s bei 50ms
          if (window.GameLoader?.start) break;
          await new Promise(r=>setTimeout(r,50));
        }
        if (!window.GameLoader?.start) {
          log.err("GameLoader.start ist nicht verfügbar – game.js / Engine noch nicht initialisiert?");
          return;
        }

        try {
          log.ok(`Start gedrückt → ${selectedMap}`);
          window.GameLoader.start(selectedMap);   // deine echte Engine-Funktion
          log.ok(`GameLoader.start ${selectedMap}`);
        } catch (e){
          log.err("Fehler beim Start: " + (e?.message||e));
          return;
        }

        // UI auf Spielbetrieb umschalten
        startPanel.style.display = "none";
        btnBuild.classList.add("visible");
      }

      // Button: Start
      btnStart.addEventListener("click", () => {
        if (starting) return;
        starting = true;
        const map = mapSelect.value || "./assets/maps/map-mini.json";
        startGame(map).finally(()=> starting=false);
      });

      // Button: Neu-Start (nur UI/Storage, kein Layout-Change)
      btnRestart.addEventListener("click", () => {
        try {
          localStorage.clear(); sessionStorage.clear();
          caches?.keys?.().then(keys=>keys.forEach(k=>caches.delete(k)));
        } catch {}
        log.ok("Neu-Start angefordert");
        // Startfenster bleibt sichtbar; Benutzer wählt selbst wieder „Start“.
      });

      // Button: Log kopieren
      btnLogCopy.addEventListener("click", async () => {
        try {
          const text = window.Inspector?.getLogText?.() || "[Kein Inspector-Log verfügbar]";
          await navigator.clipboard.writeText(text);
          log.ok("Log in Zwischenablage");
        } catch(e){ log.err("Log kopieren fehlgeschlagen."); }
      });

      // Button: Cache-Booster
      btnCache.addEventListener("click", async () => {
        try {
          localStorage.clear(); sessionStorage.clear();
          if (window.caches?.keys) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          log.ok("Cache/Storage geleert – Seite ggf. neu laden");
        } catch(e){ log.warn("Cache-Booster konnte nicht alles löschen."); }
      });

      // ---- Event-Bridges aus game.js ----
      window.addEventListener("cb:game-started", () => {
        log.ok("Event: cb:game-started empfangen");
        startPanel.style.display = "none";
        btnBuild.classList.add("visible");
      });

      // Fallback: Wenn game.js selbst signalisiert:
      if (window.GameUI?.onGameStarted) {
        try {
          window.GameUI.onGameStarted(() => {
            log.ok("Event-Hook (GameUI.onGameStarted) empfangen");
            startPanel.style.display = "none";
            btnBuild.classList.add("visible");
          });
        } catch {}
      }
    })();
  </script>

  <!-- Dein vorhandenes Boot/Main (so lassen, falls benötigt) -->
  <script src="./main.js"></script>
</body>
</html>
