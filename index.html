  <style>
    /* ===== Fehlerbanner (Import-/Netzwerkfehler) ===== */
    #boot-error {
      position: fixed; left: 0; right: 0; top: 0;
      background: #b00020; color: #fff; padding: 10px 14px;
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: none; z-index: 2147483601;
    }
    #boot-error b { font-weight: 700; }

    #start-splash .title{
      font: 600 20px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color: #f0e6d2; text-shadow: 0 2px 6px rgba(0,0,0,.6);
      letter-spacing: .04em;
    }
    html.splash-done #start-splash{ display:none; }

    /* ===== Safe Layering (übersteuert nichts am Layout deines Panels!) ===== */
    #game      { position:relative; z-index: 10; display:block; width:100%; height:100%; }
    #app-root  { position:relative; z-index: 20; }
    /* Startpanel selbst kommt aus ui/ui-start.js (Holzrahmen etc.) */
    #start-panel { z-index: 1030; } /* nur Ebene, KEIN display/background mehr! */

    /* ===== Inspector sichtbar / unsichtbar ===== */
    #inspector{ display:none !important; }
    #inspector[data-open="1"]{ display:block !important; position:fixed; inset:0; z-index:2147483600; }

    /* ===== FAB immer über allem ===== */
    #inspector-fab {
      position: fixed;
      left: 14px; bottom: 14px;
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(245,245,245,.08);
      border: 1px solid rgba(255,255,255,.15);
      backdrop-filter: blur(6px);
      display: grid; place-items: center;
      font: 20px/1.0 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color: #ddd; cursor: pointer;
      z-index: 2147483602; /* über Inspector */
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto;
    }
    #inspector-fab:active { transform: translateY(1px); }
    /* selbst wenn der Inspector offen ist → FAB bleibt */
    body.inspector-open #inspector-fab { opacity: 1; pointer-events: auto; }

    /* Optional: wenn du beim offenen Inspector den Canvas blocken willst */
    body.inspector-open #game { pointer-events:none; }
  
  /* ===== Startpanel: sicher über dem Canvas, ohne Layout-Override ===== */
  #ui-root{ position: relative; z-index: 1020; }

  <!-- ===== Zentraler Toggle-Controller (idempotent) ===== -->
  <script>
  (function InspectorToggleController(){
    if (window.__insp_toggle_wired) return;
    window.__insp_toggle_wired = true;
    window.INSP_AUTO_OPEN = false;

    const LOG = (...a)=> (window.CBLog?.info||console.log)('[insp-toggle]', ...a);
    let transitioning = false;
    const T_DEBOUNCE = 120;

    const host = ()=> document.getElementById('inspector');
    const isOpen = ()=> host()?.dataset.open === '1';

    function setOpenState(open){
      const el = host(); if(!el) return false;
      const target = open ? '1' : '0';
      if (el.dataset.open === target) return false;
      el.dataset.open = target;
      el.setAttribute('aria-hidden', open ? 'false' : 'true');
      document.body.classList.toggle('inspector-open', open);
      return true;
    }
    function open(detail={}){
      if (transitioning || isOpen()) return;
      transitioning = true;
      if (setOpenState(true)) {
        window.dispatchEvent(new CustomEvent('cb:insp:open', {detail}));
        LOG('open');
      }
      setTimeout(()=>transitioning=false, T_DEBOUNCE);
    }
    function close(){
      if (transitioning || !isOpen()) return;
      transitioning = true;
      if (setOpenState(false)) {
        window.dispatchEvent(new CustomEvent('cb:insp:close'));
        LOG('close');
      }
      setTimeout(()=>transitioning=false, T_DEBOUNCE);
    }
    function toggle(detail={}){ isOpen() ? close() : open(detail); }

    // Events von überall
    window.addEventListener('req:insp:open',  e => open(e?.detail||{}));
    window.addEventListener('req:insp:close', () => close());
    window.addEventListener('req:insp:toggle', e => toggle(e?.detail||{}));

    // Falls irgendein Build beim Ready „auto-open“ macht → sofort schließen
    window.addEventListener('cb:insp:ready', () => { if (isOpen()) close(); });

    // ESC schließt
    document.addEventListener('keydown', (ev)=>{ if(ev.key === 'Escape') close(); });

    // Backdrop-Klick schließt (falls Overlay einen Rand hat)
    document.addEventListener('click', (ev)=>{
      const el = host();
      if (!isOpen() || !el) return;
      // Falls dein Inspector eine Backdrop-Fläche hat (data-backdrop)
      if (ev.target && ev.target.getAttribute && ev.target.getAttribute('data-backdrop') === '1') {
        close();
      }
    });

    // FAB: Toggle
    document.getElementById('inspector-fab')?.addEventListener('click', () => {
      window.dispatchEvent(new CustomEvent('req:insp:toggle', { detail:{ tab:'logs' }}));
    });

    LOG('controller bereit');
  })();
  </script>

  <!-- ===== Smoke-Events + Splash ausblenden ===== -->
  <script>
    (function smoke(){
      const on = (n)=>window.addEventListener(n, e=>CBLog.info(`[event] ${n}`, e.detail));
      ['cb:ui-ready','cb:assets-ready','cb:registry:ready','cb:hud-ready','cb:build:ready','cb:game:start','cb:insp:ready','cb:path:overlay:ready'].forEach(on);
      window.addEventListener('cb:ui-ready', ()=> document.documentElement.classList.add('splash-done'), { once:true });
    })();
