    /* Splash/Startbild-Fallback: sichtbar bis cb:ui-ready */

    #start-splash{
      position: fixed; inset: 0;
      background: #111 center/cover no-repeat var(--start-bg);
      display: grid; place-items: center;
      z-index: 1000; /* unter Fehlerbanner, über Canvas */
    }
    #start-splash .title{
      font: 600 20px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;

      letter-spacing: .04em;

    html.splash-done #start-splash{ display:none; }

    /* Inspector „closed by default“ – Sicherheitsgurt */
    #inspector{ display:none !important; }

      background: rgba(245,245,245,.08);
      border: 1px solid rgba(255,255,255,.15);
      backdrop-filter: blur(6px);
      display: grid; place-items: center;
      font: 20px/1.0 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color: #ddd; cursor: pointer; z-index: 99998;
      -webkit-tap-highlight-color: transparent;
    }
    #inspector-fab:active { transform: translateY(1px); }

  <!-- =========================================================
       [7.1] Inspector: Hard-Close + FAB-Hook
       - Verhindert Auto-Open; Öffnen nur via req:insp:open (durch ⚙️)
       ========================================================= -->
  <script>
    (function inspectorGuardsAndFab(){
      const fab = document.getElementById('inspector-fab');

      // FAB öffnet den Inspector
      fab?.addEventListener('click', () => {
        window.dispatchEvent(new CustomEvent('req:insp:open', { detail:{ tab:'logs' }}));
      });

      // Sobald der Inspector "bereit" meldet, NICHT automatisch öffnen
      const close = () => window.dispatchEvent(new CustomEvent('cb:insp:close'));
      window.addEventListener('cb:insp:ready', close);

      // Einige Builds respektieren diese Flag explizit
      window.INSP_AUTO_OPEN = false;

      // Optional: FAB erst nach Game-Start anzeigen
      // window.addEventListener('cb:game:start', ()=> fab?.classList.remove('hidden'), { once:true });
    })();
  </script>

  <!-- =========================================================
       [8] OPTIONALE OVERLAYS (LAZY nach Game-Start)
       ========================================================= -->
  <script>
    (function setupLazyOverlays(){
      let pathOverlayLoaded = false;

      async function loadPathOverlay() {
        if (pathOverlayLoaded) return;
        pathOverlayLoaded = true;
        try {
          CBLog.info('[path] overlay lazy load (nach game:start)');
          await import('./core/path-overlay.js?v=25.11.02');
          window.dispatchEvent(new CustomEvent('cb:path:overlay:ready'));
          CBLog.ok('[path] overlay bereit');
        } catch (err) {
          console.error(err);
          CBLog.error('[path] overlay Ladefehler');
        }
      }

      // Erst laden, wenn das Spiel läuft – spart Init-Kosten
      window.addEventListener('cb:game:start', loadPathOverlay, { once: true });

      // Optional: Beim Öffnen des Pfade-Tabs sofort nachladen
      /*
      window.addEventListener('cb:insp:tab:change', (e)=>{
        if (e.detail && (e.detail.tab === 'Pfade' || e.detail.tab === 'paths')) {
          loadPathOverlay();
        }
      });
      */
    })();
  </script>

  <!-- =========================================================
       [9] SMOKE-TEST HILFE (Debug – kann drin bleiben)
       ========================================================= -->
  <script>
    (function smoke(){
      const on = (n)=>window.addEventListener(n, e=>CBLog.info(`[event] ${n}`, e.detail));
      ['cb:ui-ready','cb:assets-ready','cb:registry:ready','cb:hud-ready','cb:build:ready','cb:game:start','cb:insp:ready','cb:path:overlay:ready'].forEach(on);

      // Splash-Fallback ausblenden, wenn echtes Startpanel bereit ist
      window.addEventListener('cb:ui-ready', ()=>{
        document.documentElement.classList.add('splash-done');
      }, { once:true });
    })();
