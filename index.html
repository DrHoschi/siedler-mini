<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Siedler-Mini • v16.0.3</title>

  <!--
    index.html  •  v16.0.3
    Zweck:
      - Minimaler Boot-Screen mit Start/Editor
      - Robustes Logging (auch bei Fehlern VOR dem Spielstart)
      - Sichere Verknüpfung: Start-Button -> GameLoader.start(...)
      - Mobile-freundliche UI (Toast-Log unten)

    WICHTIG:
      - game.js muss NACH dieser Datei geladen sein und ein globales
        window.GameLoader Objekt (mit start(opts)) bereitstellen.
      - Map-URL ist standardmäßig ./assets/maps/map-mini.json
  -->

  <style>
    :root{
      --bg:#0f1614;         /* dunkler Rahmenhintergrund */
      --panel:#161f1d;      /* Dialog & Log */
      --panel-2:#0b1412;    /* Log-Hintergrund dunkler */
      --txt:#e6f0ec;
      --txt-dim:#a9b7b2;
      --accent:#4ea38b;     /* Buttons */
      --accent-2:#2b6c59;
      --ok:#6BE675; --warn:#E6D86B; --err:#FF6B6B;
    }

    html,body{height:100%;margin:0;background:#213f22;color:var(--txt);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;}
    #wrap{position:fixed;inset:0;display:grid;grid-template-rows:1fr auto;overflow:hidden;}

    /* Canvas (Spielfläche) — wird von game.js benutzt */
    #screen{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;}

    /* Start-Overlay */
    .center{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      background:linear-gradient(180deg,rgba(22,31,29,.96),rgba(11,20,18,.96));
      border:1px solid rgba(255,255,255,.06);
      box-shadow:0 20px 60px rgba(0,0,0,.45);
      border-radius:14px; width:min(90vw,560px); padding:20px 18px;
      backdrop-filter: blur(8px);
    }
    .title{display:flex;gap:.6rem;align-items:center;font-weight:700;font-size:22px;margin-bottom:.5rem}
    .title .badge{width:22px;height:22px;border-radius:50%;
      background:conic-gradient(from 0deg, #6be675, #4ea38b, #2b6c59, #6be675);
      box-shadow:0 0 0 2px rgba(0,0,0,.35) inset;
    }
    .sub{color:var(--txt-dim);font-size:13px;margin-bottom:14px}
    .row{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
    .btn{
      appearance:none;border:0;border-radius:12px;padding:10px 16px;font-weight:600;
      background:var(--accent);color:#0b1412;cursor:pointer;transition:.15s transform ease,.15s opacity;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn.secondary{background:#243331;color:var(--txt)}
    .ver{margin-top:10px;color:var(--txt-dim);font-size:12px}

    /* Log-Leiste */
    #logbar{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border-top:1px solid rgba(255,255,255,.05)}
    #logbox{
      flex:1;max-height:160px;overflow:auto;background:var(--panel-2);border-radius:12px;padding:12px;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:12px;white-space:pre-wrap
    }
    .chip{display:inline-flex;align-items:center;gap:.5rem;background:#1e2a28;border:1px solid rgba(255,255,255,.06);border-radius:999px;padding:8px 12px}
    .chip b{opacity:.85}
    .ghost{background:#1a2422;color:var(--txt);border:1px solid rgba(255,255,255,.08)}
    .right{margin-left:auto;display:flex;gap:10px}
    .tag-ok{color:var(--ok)} .tag-warn{color:var(--warn)} .tag-err{color:var(--err)}

    /* Backdrop-Bild (Start) – kann von game.js ausgeblendet werden */
    #backdrop{position:absolute;inset:0;background:#0b1412 url('./assets/ui/intro_fort.jpg') center/contain no-repeat; opacity:.18; transition:opacity .35s ease}
    .hide{opacity:0;pointer-events:none}
  </style>
</head>
<body>
<div id="wrap">
  <!-- Spielfeld -->
  <canvas id="screen" width="300" height="150" aria-label="Spielfeld"></canvas>

  <!-- Hintergrundmotiv (wird ausgeblendet) -->
  <div id="backdrop" aria-hidden="true"></div>

  <!-- Start-Overlay -->
  <section id="start" class="center" role="dialog" aria-modal="true" aria-labelledby="h1">
    <div class="title"><span class="badge" aria-hidden="true"></span><h1 id="h1" style="margin:0">Siedler-Mini</h1></div>
    <div class="sub">Neues Spiel starten? <span style="opacity:.6">(Map: <code>assets/maps/map-mini.json</code>)</span></div>
    <div class="row">
      <button id="btnStart" class="btn">Start</button>
      <button id="btnEditor" class="btn secondary">Editor öffnen</button>
    </div>
    <div class="ver">v16.0.3</div>
  </section>

  <!-- Log/Controls unten -->
  <footer id="logbar">
    <div class="chip"><b>Log</b> <span id="logCount">0</span></div>
    <button id="btnCopyLog" class="btn ghost">Log kopieren</button>
    <button id="btnClearLog" class="btn ghost">Log leeren</button>
    <div class="right">
      <button id="btnClearCache" class="btn ghost">Cache leeren</button>
    </div>
  </footer>
</div>

<!-- game.js MUSS nach dem DOM kommen -->
<script src="./game.js" defer></script>

<script>
/* ============================================================
   index.html v16.0.3 — Boot & UI-Glue
   ============================================================ */

(() => {
  "use strict";

  /* ---------- leichtgewichtige Log-Hilfe ---------- */
  const Log = {
    _buf: [],
    elBox: null,
    elCount: null,

    setup() {
      this.elBox   = document.createElement('div');
      this.elCount = document.getElementById('logCount');
      // Unser sichtbarer Container ist #logbox – legen wir jetzt an:
      const area = document.createElement('div');
      area.id = 'logbox';
      area.setAttribute('role','log');
      area.setAttribute('aria-live','polite');
      document.getElementById('logbar').appendChild(area);
      this.elBox = area;
    },

    _stamp(){ return new Date().toTimeString().slice(0,8); },

    add(kind, msg, src = "game") {
      const line = `[${this._stamp()}] (${src}) ${msg}`;
      this._buf.push({ kind, line });
      // einfache farbliche Markierung per Emoji
      const color =
        kind === "ok"   ? "tag-ok" :
        kind === "warn" ? "tag-warn" :
        kind === "err"  ? "tag-err" : "";
      const pretty = (kind === "ok" ? "✅ " : kind === "warn" ? "⚠️ " : kind === "err" ? "❌ " : "• ")
                     + line;
      const div = document.createElement('div');
      if (color) div.className = color;
      div.textContent = pretty;
      this.elBox.appendChild(div);
      this.elBox.scrollTop = this.elBox.scrollHeight;
      if (this.elCount) this.elCount.textContent = String(this._buf.length);
      // Zusätzlich in die echte Konsole
      (kind === "err" ? console.error : kind === "warn" ? console.warn : console.log)(line);
    },

    ok(m, s){ this.add("ok",   m, s); },
    info(m,s){ this.add("info", m, s); },
    warn(m,s){ this.add("warn", m, s); },
    err(m, s){ this.add("err",  m, s); },

    copy() {
      const text = this._buf.map(e => e.line).join("\n");
      navigator.clipboard?.writeText(text).then(
        () => this.ok("Log in Zwischenablage", "game"),
        () => this.warn("Konnte Log nicht kopieren", "game")
      );
    },
    clear(){
      this._buf = [];
      this.elBox.textContent = "";
      if (this.elCount) this.elCount.textContent = "0";
    }
  };

  /* ---------- globale Fehler in den Log schreiben ---------- */
  window.onerror = (msg, src, line, col, err) => {
    Log.err(`${msg} ${src? '('+src+':' + line + ':' + col + ')':''}`, "window.onerror");
  };
  window.onunhandledrejection = (ev) => {
    Log.err(`Unhandled promise rejection: ${ev.reason}`, "promise");
  };

  /* ---------- DOM ready ---------- */
  document.addEventListener("DOMContentLoaded", () => {
    Log.setup();
    Log.ok("UI ready (index v16.0.3)");

    const $ = (id) => document.getElementById(id);
    const startDlg   = $("start");
    const backdrop   = $("backdrop");
    const canvas     = $("screen");
    const btnStart   = $("btnStart");
    const btnEditor  = $("btnEditor");
    const btnCopyLog = $("btnCopyLog");
    const btnClear   = $("btnClearLog");
    const btnCache   = $("btnClearCache");

    /* ----- Buttons unten ----- */
    btnCopyLog.addEventListener("click", () => Log.copy());
    btnClear.addEventListener("click", () => Log.clear());
    btnCache.addEventListener("click", async () => {
      // leichter Cache-Nuke (ohne Service Worker): local/session + Hinweis
      try { localStorage.clear(); sessionStorage.clear(); } catch {}
      Log.warn("Cache/Storage gelöscht – Seite wird neu geladen …");
      // kleiner Delay für den Log-Eintrag
      setTimeout(() => location.reload(), 250);
    });

    /* ----- Editor (Hook/Stub) ----- */
    btnEditor.addEventListener("click", () => {
      Log.info("Editor öffnen (Hook – später verknüpfen)");
      alert("Editor-Start ist hier noch ein Platzhalter.");
    });

    /* ----- START ► GameLoader.start(...) robust verbinden ----- */
    btnStart.addEventListener("click", async () => {
      // 1) UI: Dialog zu, Backdrop weich ausblenden
      startDlg.classList.add("hide");
      backdrop.classList.add("hide");

      // 2) Debug-Log: Start init
      Log.info("GameLoader.start ./assets/maps/map-mini.json");

      // 3) Sicherstellen, dass GameLoader erreichbar ist
      const GL = window.GameLoader || window.gameLoader || null;
      if (!GL || typeof GL.start !== "function") {
        Log.err("GameLoader.start nicht verfügbar – stimmt game.js Version/Scope?");
        alert("Fehler beim Start: GameLoader.start ist nicht verfügbar (siehe Log).");
        // Sichtbarkeit des Dialogs wiederherstellen, damit man erneut starten kann
        startDlg.classList.remove("hide");
        backdrop.classList.remove("hide");
        return;
      }

      // 4) Start-Aufruf mit Fallback-Callbacks, die ebenfalls loggen
      try {
        await GL.start({
          canvas,
          mapUrl: "./assets/maps/map-mini.json",
          onReady: () => Log.ok("Game started"),
          onAtlas: (ok, w, h, note) => {
            if (ok) Log.ok(`Tileset (atlas) OK ${w}x${h}`);
            else    Log.warn(`Tileset Hinweis: ${note || 'kein Atlas genutzt'}`);
          },
          onMap: (info) => {
            // z.B. { width, height, tileSize, mode:'grid|layers' }
            if (info && info.width && info.height)
              Log.ok(`Map OK size ${info.width}x${info.height} tile ${info.tileSize ?? '?'}`);
            else
              Log.warn("Map geladen, aber Info unvollständig");
          },
          onError: (msg) => {
            Log.err(msg || "Unbekannter Fehler beim Start");
            alert("Fehler beim Start: " + (msg || "Unbekannt"));
            // Bei hartem Fehler: Start-Dialog wieder anzeigen
            startDlg.classList.remove("hide");
            backdrop.classList.remove("hide");
          }
        });
      } catch (e) {
        Log.err(String(e));
        alert("Fehler beim Start: " + e);
        startDlg.classList.remove("hide");
        backdrop.classList.remove("hide");
      }
    });

  });

  /* ---------- „script load ok“ Marker direkt beim Parsen ---------- */
  // Achtung: Dieser Log kommt, BEVOR DOMContentLoaded feuert – so sehen wir,
  // dass index.html wirklich lief und nicht im Cache hängt.
  // Der game.js Marker („script load ok game.js …“) kommt zusätzlich von game.js selbst.
  console.log("[index] parsed v16.0.3");
})();
</script>
</body>
</html>
