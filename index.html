<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CityBuilder • Start</title>

  <!-- Basestyles deines Projekts; belassen wie gehabt -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    /* ===== UI: Start-Fenster ===== */
    :root { --ui-v: "v16.1.7"; }
    .start-modal {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(720px, 92vw); background:#111a; backdrop-filter: blur(6px);
      border-radius: 14px; padding: 18px 18px 14px; color:#e9f1ea; box-shadow: 0 20px 60px #0007;
      border: 1px solid #ffffff22; z-index: 20;
    }
    .start-title { font-size: 20px; font-weight: 800; margin: 4px 0 14px; display:flex; gap:.6rem; align-items:center;}
    .chip { font-size: 12px; padding:.18rem .48rem; border-radius: 12px; background:#1f2b25; color:#bfe6ca; }
    .row { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
    .row + .row { margin-top:.6rem; }
    .row input, .row select { flex:1 1 auto; padding:.55rem .7rem; border-radius:10px; border:1px solid #ffffff26; background:#101814; color:#e7f4ea; height:40px;}
    .btn {
      border:1px solid #0000; border-radius:12px; padding:.55rem .9rem; font-weight:700; cursor:pointer;
      background:#1a2f24; color:#d9f7e2; transition:all .12s ease; height:40px;
    }
    .btn:disabled { opacity:.55; filter:saturate(.5); cursor:not-allowed; }
    .btn.primary { background:#2f8f56; }
    .btn.warn { background:#e7b10a; color:#222; }
    .btn.ghost { background:#1a2420; }
    .hint { opacity:.7; font-size: 13px; margin-top:.75rem;}
    .start-log { margin-top:.45rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
                 font-size:12px; padding:.4rem .6rem; background:#0b100e; color:#cfe9d6; border-radius:9px; border:1px solid #ffffff18; }
    .start-log.ok { color:#bff2c7; }
    .start-log.err { color:#ffb3b3; }

    /* ===== Floating Buttons ===== */
    .fab { position: fixed; bottom: 14px; width: 54px; height: 54px; border-radius: 50%;
           display:grid; place-items:center; box-shadow: 0 10px 25px #0008; z-index: 18;
           border: 1px solid #ffffff22; background:#101814e6; color:#e8f1eb; }
    .fab:hover { transform: translateY(-1px); }
    .fab-inspector { right: 14px; }   /* immer sichtbar */
    .fab-build { left: 14px; display:none; } /* erst nach Spielstart sichtbar */

    /* kleines Icon */
    .fab svg { width: 24px; height: 24px; opacity:.9; }

    /* Canvas-Container (deine Engine hängt hier ein) */
    #game-root { position: fixed; inset: 0; background:#0f281c; }

    /* Inspector-Vollflächenoverlay kommt aus inspector.js; hier nur Layer-Reihenfolge */
    #dev-inspector { z-index: 30; }

    /* iOS-Safe-Area etwas Abstand */
    .with-safe { padding-bottom: env(safe-area-inset-bottom, 0); }
  </style>
</head>

<body>
  <!-- Spielfläche / Canvas-Bereich -->
  <div id="game-root" class="with-safe"></div>

  <!-- ========== Start-Fenster ========== -->
  <section id="start-modal" class="start-modal" aria-modal="true" role="dialog">
    <div class="start-title">
      <span>City Builder · Start</span>
      <span class="chip">index <span id="index-ver"></span></span>
      <span class="chip">game.js: <span id="game-ver">unbekannt</span></span>
      <span class="chip">dpr: <span id="dpr"></span></span>
    </div>

    <!-- Kartenwahl -->
    <div class="row">
      <label style="min-width:120px">Karte auswählen:</label>
      <select id="map-select">
        <!-- Falls du weitere Maps willst, ergänze hier -->
        <option value="./assets/maps/map-mini.json">map-mini.json</option>
        <option value="./assets/maps/map-pro.json">map-pro.json</option>
      </select>
    </div>

    <!-- Start / Neu-Start -->
    <div class="row">
      <button id="btn-start" class="btn primary" disabled>▶ Start</button>
      <button id="btn-reset" class="btn warn">🗑 Neu-Start</button>
    </div>

    <!-- Booster / Log -->
    <div class="row">
      <button id="btn-cache" class="btn ghost">🧹 Cache-Booster</button>
      <button id="btn-copylog" class="btn ghost">📋 Log kopieren</button>
    </div>

    <div id="start-status" class="start-log">…</div>
    <div class="hint">Hinweis: Nach „Start“ verschwindet dieses Fenster automatisch.</div>
  </section>

  <!-- ===== Floating Buttons ===== -->
  <!-- Inspector: immer sichtbar, unten rechts -->
  <button id="btn-inspector" class="fab fab-inspector" title="Inspector öffnen/schließen" aria-label="Inspector">
    <!-- Schraubenschlüssel-Icon -->
    <svg viewBox="0 0 24 24"><path fill="currentColor"
      d="M22 19.59L17.42 15a7 7 0 0 1-9.9-9.9L10 7.58 7.59 10 14 16.41 16.41 14 21 18.59zM7 3a4 4 0 0 0-4 4 4 4 0 0 0 .59 2.09l-2.5 2.5a1 1 0 0 0 0 1.41l2 2a1 1 0 0 0 1.41 0l2.5-2.5A4 4 0 1 0 7 3z"/>
    </svg>
  </button>

  <!-- Build-Menü: unten links, erst nach Spielstart sichtbar -->
  <button id="btn-build" class="fab fab-build" title="Bau-Menü" aria-label="Bau-Menü">
    <!-- Hammer-Icon -->
    <svg viewBox="0 0 24 24"><path fill="currentColor"
      d="M2 21l9-9 3 3-9 9H2v-3zm13.7-12.3l-2.4-2.4 1.7-1.7c.4-.4 1-.4 1.4 0l1 1c.4.4.4 1 0 1.4l-1.7 1.7zM14 10l-3-3 2-2 3 3-2 2z"/></svg>
  </button>

  <!-- ===== Scripte =====
       Reihenfolge: Engine/Spiel –> UI (Build) –> Inspector –> Start-Logik
       Falls du weitere Scripte brauchst, binde sie hier ein.
  -->
  <script src="./app-v11.1r6.js"></script>
  <script src="./game.js"></script>

  <!-- UI (Bau-Menü) – deine bestehende Datei -->
  <script src="./ui-build.js"></script>

  <!-- Inspector (Vollflächen-Overlay) -->
  <script src="./inspector.js"></script>

  <!-- ===== Start/Boot-Logik und Glue-Code ===== -->
  <script>
  (function(){
    const INDEX_VERSION = 'v16.1.7';

    // --------- Mini-Logger (global, vom Inspector gelesen) ---------
    // usage: Log.ok('text'), Log.warn(...), Log.err(...), Log.info(...)
    window.Log = window.Log || (() => {
      const lines = [];
      const fmt = (t, tag, msg) => {
        const z = n => String(n).padStart(2,'0');
        const ts = `[${z(t.getHours())}:${z(t.getMinutes())}:${z(t.getSeconds())}]`;
        const icon = tag==='ok'?'✅ (ok)':tag==='warn'?'⚠️ (warn)':'❌ (err)';
        return `${ts} ${icon} ${msg}`;
      };
      const push = (tag, msg) => {
        const line = fmt(new Date(), tag, msg);
        lines.push(line); if(lines.length>600) lines.shift();
        window.dispatchEvent(new CustomEvent('cb:log-line', { detail:{ line }}));
        const c = tag==='err'?'error':(tag==='warn'?'warn':'log');
        console[c](line);
      };
      return {
        ok:  m => push('ok',   m),
        warn:m => push('warn', m),
        err: m => push('err',  m),
        info:m => push('ok',   m),
        dump:() => lines.slice(),
        clear(){ lines.length = 0; window.dispatchEvent(new Event('cb:log-clear')); },
        copy(){ navigator.clipboard?.writeText(lines.join('\n')); }
      };
    })();

    // --------- DOM-Refs ---------
    const $ = sel => document.querySelector(sel);
    const startModal = $('#start-modal');
    const indexVerEl = $('#index-ver');
    const gameVerEl  = $('#game-ver');
    const dprEl      = $('#dpr');
    const statusEl   = $('#start-status');
    const btnStart   = $('#btn-start');
    const btnReset   = $('#btn-reset');
    const btnCache   = $('#btn-cache');
    const btnCopyLog = $('#btn-copylog');
    const mapSelect  = $('#map-select');
    const btnInspector = $('#btn-inspector');
    const btnBuild   = $('#btn-build');

    // --------- Version/Meta anzeigen ---------
    indexVerEl.textContent = INDEX_VERSION;
    dprEl.textContent = String(window.devicePixelRatio || 1);

    // game.js kann (optional) Version global setzen
    if (window.Game && window.Game.version) gameVerEl.textContent = window.Game.version;

    Log.ok(`UI bereit (index ${INDEX_VERSION})`);

    // --------- Inspector-Button ----------
    btnInspector.addEventListener('click', () => {
      window.GameInspector?.toggle();
    });

    // --------- Build-Menü-Button (erst nach Spielstart sichtbar) ----------
    btnBuild.addEventListener('click', () => {
      if (!window.GameUI?.openBuildMenu) {
        Log.warn('Bau-Menü ist (noch) nicht eingebunden – window.GameUI.openBuildMenu() fehlt.');
        return;
      }
      window.GameUI.openBuildMenu();
    });

    // Sichtbarkeit steuern
    const showBuildButton = (yes) => {
      btnBuild.style.display = yes ? 'grid' : 'none';
    };
    showBuildButton(false);

    // --------- Cache-Booster ----------
    async function cacheBooster(){
      try {
        // SW abmelden
        if (navigator.serviceWorker) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        // Caches löschen
        if (window.caches) {
          const names = await caches.keys();
          await Promise.all(names.map(n => caches.delete(n)));
        }
        // Storage
        localStorage.clear(); sessionStorage.clear();
        Log.ok('Cache/Storage geleert – Seite ggf. neu laden');
      } catch(e){
        Log.err('Cache-Booster Fehler: ' + (e?.message||e));
      }
    }

    // --------- Engine-Readiness ----------
    let engineReady = false;
    let enginePollTimer = null;

    function setStatusOk(msg){ statusEl.className = 'start-log ok'; statusEl.textContent = msg; }
    function setStatusErr(msg){ statusEl.className = 'start-log err'; statusEl.textContent = msg; }
    function setStatus(msg){ statusEl.className = 'start-log'; statusEl.textContent = msg; }

    function checkEngineReadyOnce(){
      if (engineReady) return true;
      const ready = !!(window.GameLoader && typeof window.GameLoader.start === 'function');
      if (ready) {
        engineReady = true;
        btnStart.disabled = false;
        setStatusOk('Engine bereit. Du kannst starten.');
        Log.ok('Engine bereit (GameLoader.start verfügbar)');
        // game.js Version evtl. jetzt gesetzt
        if (window.Game?.version) gameVerEl.textContent = window.Game.version;
        if (enginePollTimer) { clearInterval(enginePollTimer); enginePollTimer = null; }
      }
      return ready;
    }

    // a) Event-basierter Hook (empfohlen)
    window.addEventListener('cb:engine-ready', () => {
      checkEngineReadyOnce();
    });

    // b) Fallback: kurzes Polling (max. 5s)
    let pollElapsed = 0;
    enginePollTimer = setInterval(() => {
      pollElapsed += 200;
      if (checkEngineReadyOnce()) return;
      if (pollElapsed >= 5000) {
        clearInterval(enginePollTimer); enginePollTimer = null;
        setStatusErr('Engine nicht bereit. game.js noch nicht initialisiert?');
        Log.warn('Engine noch nicht bereit – warte auf GameLoader.start …');
      }
    }, 200);

    // --------- Start / Reset / Buttons ----------
    btnStart.addEventListener('click', async () => {
      const mapPath = mapSelect.value || './assets/maps/map-mini.json';
      Log.ok(`Start gedrückt → ${mapPath}`);

      if (!checkEngineReadyOnce()){
        setStatusErr('GameLoader.start ist nicht verfügbar – game.js noch nicht initialisiert?');
        Log.err('GameLoader.start ist nicht verfügbar – game.js noch nicht initialisiert?');
        return;
      }

      try {
        const ok = await window.GameLoader.start(mapPath);
        if (ok === false) {
          setStatusErr('Start fehlgeschlagen (GameLoader.start → false).');
          Log.err('Start fehlgeschlagen: GameLoader.start → false');
          return;
        }
        // Erfolg: Events feuern (wie gewünscht)
        window.dispatchEvent(new CustomEvent('cb:game-started'));
        window.GameUI?.onGameStarted?.();

        // Start-UI schließen, Build-Button zeigen
        startModal.style.display = 'none';
        showBuildButton(true);
        setStatusOk('Game gestartet');
        Log.ok('Game gestartet');
      } catch(e){
        setStatusErr('Start fehlgeschlagen: ' + (e?.message||e));
        Log.err('Start fehlgeschlagen: ' + (e?.message||e));
      }
    });

    btnReset.addEventListener('click', () => {
      Log.ok('Neu-Start angefordert');
      try {
        // Wenn deine Engine einen Reset hat, rufe ihn hier:
        window.Game?.reset?.();
        // Start-Fenster wieder einblenden
        startModal.style.display = '';
        showBuildButton(false);
        // Status zurücksetzen
        btnStart.disabled = !engineReady;
        setStatus(engineReady ? 'Engine bereit. Du kannst starten.' : 'Warte auf Engine …');
      } catch(e){
        Log.warn('Neu-Start: Game.reset() nicht vorhanden.');
        startModal.style.display = '';
        showBuildButton(false);
      }
    });

    btnCache.addEventListener('click', cacheBooster);
    btnCopyLog.addEventListener('click', () => window.Log.copy());

    // UI-Init fertig
    if (engineReady) setStatusOk('Engine bereit. Du kannst starten.');
    else setStatus('Warte auf Engine …');
  })();
  </script>
</body>
</html>
