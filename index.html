<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2419" />
  <title>Mini – v16.1.19</title>

  <!-- === CBLog Fallback (stabil, idempotent) ================== -->
<script>
// Legt window.CBLog an, sammelt Logs & feuert Events früh.
(function(){
  if (window.CBLog && window.CBLog.__stable) return; // schon vorhanden
  const listeners = [];
  function emit(level, msg){
    try {
      const line = { t: Date.now(), level, msg };
      window.dispatchEvent(new CustomEvent('cb:log', { detail: line }));
      listeners.forEach(fn => { try{ fn(line); }catch(_){} });
      const c = (level==='err'?'error':level==='warn'?'warn':'log');
      (console[c]||console.log)(msg);
    } catch(_) {}
  }
  window.CBLog = {
    ok:   (m)=> emit('ok', m),
    warn: (m)=> emit('warn', m),
    err:  (m)=> emit('err', m),
    push: (lvl,m)=> emit(lvl||'log', m),
    on(fn){
      if (typeof fn==='function' && !listeners.includes(fn)) listeners.push(fn);
      return ()=>{ const i=listeners.indexOf(fn); if(i>=0) listeners.splice(i,1); };
    },
    __stable: true
  };
  // Erste sichtbare Zeile für dich (damit du sofort was siehst)
  emit('ok', `UI bereit (index v16.1.18)`);
})();
</script>
  
  <!-- Basis-Styles (deine bestehenden Dateien) -->
  <link rel="preload" href="./css/base.css" as="style" />
  <link rel="preload" href="./style.css" as="style" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Kleine Zusatz-Styles nur für Start-Panel & Floating-Buttons -->
  <style>
    /* --- Start-Panel-Container, zentriert --- */
    #start-panel {
      position: fixed;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: min(680px, 92vw);
      background: rgba(12, 24, 19, 0.95);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
      padding: 16px 16px 12px;
      color: #e9f6ee;
      font: 500 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      z-index: 7000;
    }
    #start-panel h1 {
      margin: 4px 0 12px;
      font-size: 22px;
      letter-spacing: .2px;
    }
    #start-meta { font-size: 12px; opacity: .7; margin-left: 8px; }
    .sp-row { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
    .sp-grow { flex: 1 1 auto; min-width: 120px; }
    select, button.sp-btn {
      height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12);
      background: #0f2019; color: #e9f6ee; padding: 0 12px; font-weight: 600;
    }
    button.sp-btn.primary { background: #1f6f4e; }
    button.sp-btn.warn    { background: #9a6a0f; }
    .sp-hint { opacity: .7; font-size: 12px; margin: 6px 2px 0; }

    /* Log im Startpanel (zum schnellen Debuggen) */
    #start-log {
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      padding: 8px 10px; margin-top: 10px;
      max-height: 28vh; overflow: auto; font: 600 13px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #dfffe8;
    }

    /* Floating Action Buttons (Inspector rechts unten, Bauen links unten) */
    .cb-fab{
      position: fixed; z-index: 9000; width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20,20,20,.7); color: #fff;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 6px 16px rgba(0,0,0,.35);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      cursor: pointer; user-select: none;
      transition: transform .15s ease, opacity .15s ease;
    }
    .cb-fab:active{ transform: scale(.96); }
    #btn-inspector{ right: 12px; bottom: 12px; }
    #btn-build{ left: 12px; bottom: 12px; opacity: 0; pointer-events: none; }
    #btn-build.visible{ opacity: 1; pointer-events: auto; }

    /* Build-Dock (unten, wird von ui-build.js genutzt) */
    #build-dock{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 8000; display: none;
      padding: 10px 12px;
      background: rgba(18,18,18,.85);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255,255,255,.08);
    }
    #build-dock.open{ display: block; }
  </style>
</head>

<body>
  <!-- ==== Start-Panel (sichtbar beim Laden) ==== -->
  <div id="start-panel" aria-label="City-Builder – Start">
    <h1>City-Builder – Start
      <small id="start-meta">
        <span id="meta-index">index v16.1.19</span>
        · <span id="meta-game">game.js: unbekannt</span>
        · <span id="meta-dpr">dpr: ?</span>
      </small>
    </h1>

    <!-- Karten-Auswahl + Start/Neu-Start -->
    <div class="sp-row">
      <label for="map-select" style="min-width:70px;">Karte:</label>
      <select id="map-select" class="sp-grow">
        <!-- Wichtig: bekannte Karten aufnehmen -->
        <option value="./assets/maps/map-mini.json">map-mini.json (16×10)</option>
        <option value="./assets/maps/map-pro.json">map-pro.json</option>
        <option value="./assets/maps/map-test-all.json">map-test-all.json</option>
        <option value="./assets/maps/map-demo.json">map-demo.json</option>
      </select>
      <button id="btn-start" class="sp-btn primary">▶︎ Start</button>
      <button id="btn-restart" class="sp-btn warn">♻︎ Neu-Start</button>
    </div>

    <!-- Tools: Cache-Booster + Log kopieren -->
    <div class="sp-row">
      <button id="btn-log-copy" class="sp-btn">📋 Log kopieren</button>
      <button id="btn-cache" class="sp-btn">🧹 Cache-Booster</button>
      <div class="sp-grow"></div>
    </div>

    <div class="sp-hint">Hinweis: Nach „Start“ verschwindet dieses Fenster automatisch.</div>

    <!-- Start-Log (sichtbar im Panel) -->
    <pre id="start-log"></pre>
  </div>

  <!-- ==== Game-Canvas ==== -->
  <canvas id="game" width="0" height="0"></canvas>

  <!-- ==== Floating Buttons ==== -->
  <button id="btn-inspector" class="cb-fab" title="Inspector">🛠️</button>
  <button id="btn-build" class="cb-fab" title="Bau-Menü">🏗️</button>

  <!-- ==== Build-Dock (unten) – Inhalt kommt aus ui-build.js ==== -->
  <div id="build-dock" aria-label="Bau-Menü"></div>

  <!-- ===== SCRIPTS: Reihenfolge ist wichtig! ===== -->

  <!-- Inspector (dein Plugin) -->
  <script src="./assets/inspector/inspector.js"></script>

  <!-- Spiel/Engine -->
  <script src="./game.js"></script>

  <!-- Bau-UI + Bridge (stellt window.GameUI.* bereit) -->
  <script src="./assets/ui/ui-build.js"></script>
  <script src="./assets/ui/ui-bridge.js"></script>

  <!-- Start/Boot-Logik (verkabelt Start-Panel, Buttons, Events) -->
  <script src="./main.js"></script>

  <!-- Index-Version → Log & Event für Inspector -->
  <script>
    (function(){
      const v = "v16.1.19";
      window.__cb = window.__cb || {};
      window.__cb.indexVersion = v;

      // DPR anzeigen
      const dpr = Math.max(1, Math.round((window.devicePixelRatio||1)*100)/100);
      document.getElementById('meta-dpr').textContent = 'dpr: ' + dpr;

      // UI-ready ins Log + Event
      if (window.CBLog && window.CBLog.ok) window.CBLog.ok(`UI bereit (index ${v})`);
      else console.log(`[index] UI bereit (${v})`);
      window.dispatchEvent(new CustomEvent('cb:ui-ready', { detail: { v } }));
    })();
  </script>
</body>
</html>
