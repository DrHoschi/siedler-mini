<!doctype html>
<!--
  Neue Siedler – Index
  Version: v17.8.2

  Lade-Reihenfolge (wichtig):
  Polyfill → Core → Overlay/Renderer → Bootstrap → UI → Inspector (split) → Boot-Compat

  WICHTIG:
  - Inspector bleibt der alte, laufende Split (core/logs/tests/resources/paths/overlay.hooks).
  - Neu: inspector.api-compat.js stellt sicher, dass GameUI.*Inspector NIE verloren geht.
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0d">
  <title>Neue Siedler</title>

  <!-- Styles (nur die aktuellen, keine alte style.css!) -->
  <!-- Start-Panel Styles -->
  <link rel="stylesheet" href="assets/ui/ui-start.css?v=17.8.10">
  <!-- BASE UI (Resets, Fonts, Layout) -->
  <link rel="stylesheet" href="css/base.css?v=20250914">
  <!-- Build-Menü Styles -->
  <link rel="stylesheet" href="assets/ui/ui-build.css?v=20250914">
  <!-- Inspector -->
  <link rel="stylesheet" href="assets/inspector/inspector.css?v=20250914">
 
  <style>
    html, body { height:100%; margin:0; background:#0b0f0d; }
    #game { display:block; width:100vw; height:100vh; touch-action:none; position:relative; z-index:0; }

    /* Floating Action Buttons (Bau/Inspector) */
    .ui-fab {
      position:fixed;
      z-index:2147483647 !important;
      pointer-events:auto !important;
    }
    #btn-build { left:16px; bottom:16px; }
    #btn-inspector { right:16px; bottom:16px; }
    .ui-fab button{
      width:52px; height:52px; border-radius:50%; border:none;
      background:rgba(30,30,30,.92); color:#fff; font-size:22px;
      box-shadow:0 10px 28px rgba(0,0,0,.35); backdrop-filter:blur(6px);
      cursor:pointer; pointer-events:auto !important;
    }
    /* Wenn das Bau-Dock offen ist, beide FABs anheben (Platz lassen) */
    body.has-build-open #btn-build,
    body.has-build-open #btn-inspector { bottom:240px; }
  </style>
</head>
<body>

  <!-- Bühne -->
  <canvas id="game" data-map="assets/maps/map-mini.json" aria-label="Spielfeld"></canvas>

  <!-- Build-Dock (unten andockend; per JS gefüllt) -->
  <div id="build-panel" aria-label="Bau-Menü"></div>

  <!-- Start-Panel -->
  <div id="start-panel" class="ui-start" aria-label="Startmenü">
    <div class="ui-start-bg" role="img" aria-label="Hintergrund"></div>
    <div class="ui-start-card" role="dialog" aria-modal="true">
      <h1>Neue Siedler</h1>
      <div class="actions">
        <button id="btnStartNew" class="btn main">Neues Spiel</button>
        <button id="btnStartResume" class="btn">Weiterspielen</button>
        <button id="btnStartReset" class="btn ghost">Reset</button>
        <button id="btnStartFullscreen" class="btn ghost">Fullscreen</button>
      </div>
    </div>
  </div>

  <!-- FABs -->
  <div id="btn-build" class="ui-fab" title="Bau-Menü öffnen/schließen">
    <button type="button" aria-label="Bau-Menü"
            onclick="try{GameUI?.toggleBuild();}catch(_){console.warn('[ui] Build-Toggle nicht verfügbar');}">🧱</button>
  </div>
  <div id="btn-inspector" class="ui-fab" title="Inspector öffnen/schließen">
    <button type="button" aria-label="Inspector"
            data-action="toggle-inspector"
            onclick="try{GameUI?.toggleInspector();}catch(_){console.warn('[ui] Inspector-Toggle nicht verfügbar');}">🛠</button>
  </div>

  <!-- Core + Polyfills -->
  <script src="assets/core/cblog.polyfill.js?v=1.2.2"></script>
  <script src="assets/core/core.env.js?v=17.8.2"></script>

  <!-- Asset-Layer -->
  <script src="assets/core/asset.js?v=17.8.7"></script>
  <script src="assets/core/build.assets.js?v=17.8.7"></script>

  <!-- Rest des Core-Stacks -->
  <script src="assets/core/registry.js?v=1.2.0"></script>
  <script src="assets/core/entities.registry.js?v=1.1.1"></script>
  <script src="assets/core/core.entities.js?v=17.6.2"></script>
  <script src="assets/core/core.production.js?v=17.8.2"></script>
  <script src="assets/core/core.pfglue.js?v=17.8.2"></script>
  <script src="assets/core/camera.js?v=17.9.5"></script>
  <script src="assets/core/core.map.js?v=17.9.1"></script>
  <script src="assets/core/core.input.js?v=17.8.2"></script>
  <script src="assets/core/carriers.js?v=17.8.2"></script>
  <script src="assets/core/overlay-hooks.js?v=17.8.2"></script>
  <script src="assets/core/core.render.js?v=17.9.5"></script>
  <script src="core/game.js?v=18.0.0"></script>
  <script src="assets/core/game.bootstrap.js?v=17.8.7"></script>
  <script src="assets/core/game.js?v=17.10.0"></script>
  
  <!-- Inspector (split) – genau diese Module -->
  <script defer src="assets/inspector/inspector.core.js?v=18.14.5"></script>
  <script defer src="assets/inspector/inspector.logs.js?v=18.14.4"></script>
  <script defer src="assets/inspector/overlay.hooks.js?v=1.4"></script>
  <script defer src="assets/inspector/inspector.paths.js?v=18.14.4"></script>
  <script defer src="assets/inspector/inspector.tests.js?v=18.14.4"></script>
  <script defer src="assets/inspector/inspector.resources.js?v=18.14.4"></script>

  <!-- >>> NEU: API-Compat Bridge (muss direkt nach den Inspector-Modulen) -->
  <!-- script defer src="assets/inspector/inspector.api-compat.js?v=1.0.0"></script -->
  <script defer src="assets/inspector/inspector.button-bind.js?v=1"></script>
  <!-- Legacy-Fassade -->
  <script defer src="game.js?v=17.8.2"></script>
  <script defer src="core/pathfinder.js?v=16.5.0"></script>

  <!-- UI -->
  <script defer src="assets/ui/ui-bridge.js?v=17.9.0"></script>
  <script defer src="assets/ui/ui-start.js?v=17.8.9"></script>
  <script defer src="assets/ui/ui-build.js?v=17.9.12"></script>

  <!-- Boot-Compat -->
  <script defer src="boot.compat.js?v=17.8.2"></script>

  <!-- Marker / Body-Klassen + Telemetrie -->
  <script>
    (function () {
      window.__cb = window.__cb || {};
      window.__cb.indexVersion = "v17.8.2";
      (window.CBLog?.info || console.log)("[index] UI bereit (v17.8.2)");

      // FAB-Abstand, wenn das Bau-Dock geöffnet ist (unterstützt beide Event-Varianten)
      function setOpen(){ document.body.classList.add('has-build-open'); }
      function setClose(){ document.body.classList.remove('has-build-open'); }
      window.addEventListener('cb:build:open',  setOpen);
      window.addEventListener('cb:build:close', setClose);
      window.addEventListener('cb:build-open',  setOpen);
      window.addEventListener('cb:build-close', setClose);
    })();
  </script>
</body>
</html>
