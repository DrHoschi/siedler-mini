<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2419" />
  <title>Mini – v16.1.16</title>

  <!-- Basis-Styles (deine bestehenden Dateien) -->
  <link rel="preload" href="./css/base.css" as="style" />
  <link rel="preload" href="./style.css" as="style" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Kleine Zusatz-Styles nur für die Schwebe-Buttons (Layout deines Startfensters bleibt unberührt) -->
  <style>
    .cb-fab {
      position: fixed;
      z-index: 9000;
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20,20,20,.7);
      box-shadow: 0 6px 16px rgba(0,0,0,.35);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff;
      user-select: none;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }
    .cb-fab:active { transform: scale(.96); }

    /* Links unten – erscheint erst nach Spielstart */
    #btn-build { left: 12px; bottom: 12px; opacity: 0; pointer-events: none; }
    #btn-build.visible { opacity: 1; pointer-events: auto; }

    /* Rechts unten – Inspector (dauerhaft sichtbar) */
    #btn-inspector { right: 12px; bottom: 12px; }
  </style>
</head>

<body>
  <!-- ===================== START-FENSTER =====================
       Layout deines Startfensters (IDs beibehalten):
       - #start-panel             : gesamtes Panel
       - #map-select              : <select> mit Karten
       - #btn-start               : Start
       - #btn-restart             : Neu-Start
       - #btn-copy-log            : Log kopieren
       - #btn-cache               : Cache-Booster
  -->
  <div id="start-panel" class="start-panel">
    <div class="start-title-row">
      <h1>City-Builder – Start</h1>
      <span class="version-badge">index <b>v16.1.16</b></span>
    </div>

    <div class="start-row">
      <label for="map-select">Karte:</label>
      <select id="map-select">
        <!-- Falls du die Liste serverseitig generierst: belassen.
             Ansonsten hier 3 Beispiele: -->
        <option value="./assets/maps/map-mini.json">map-mini.json (16x10)</option>
        <option value="./assets/maps/map-pro.json">map-pro.json (20x12)</option>
        <option value="./assets/maps/map-test-all.json">map-test-all.json</option>
      </select>
      <button id="btn-start" class="btn btn-primary">Start</button>
      <button id="btn-restart" class="btn">Neu-Start</button>
    </div>

    <div class="start-row">
      <button id="btn-copy-log" class="btn">📋 Log kopieren</button>
      <button id="btn-cache" class="btn">🧹 Cache-Booster</button>
    </div>

    <p class="start-hint">Hinweis: Nach „Start“ verschwindet dieses Fenster automatisch.</p>
  </div>

  <!-- Canvas/Stage – unverändert -->
  <canvas id="game" width="0" height="0"></canvas>

  <!-- Schwebe-Buttons -->
  <button id="btn-inspector" class="cb-fab" title="Inspector">🛠️</button>
  <button id="btn-build" class="cb-fab" title="Bau-Menü öffnen">🏗️</button>

  <!-- ===================== SCRIPTS ===================== -->

  <!-- Inspector (dein Pfad; hier: Assets-Variante) -->
  <script src="./assets/inspector/inspector.js"></script>

  <!-- Engine / Game -->
  <script src="./game.js"></script>

  <!-- Bau-Menü (deine bestehende Datei) -->
  <script src="./assets/ui/ui-build.js"></script>

  <!-- Bridge: stellt window.GameUI.* bereit (für Inspector & Buttons) -->
  <script src="./assets/ui/ui-bridge.js"></script>

  <!-- Start-Panel Logik (nur Wiring, keine Layout-Änderung) -->
  <script>
    (function () {
      const INDEX_V = "v16.1.16";
      window.__cb = window.__cb || {};
      window.__cb.indexVersion = INDEX_V;

      // UI ready ins Log
      try {
        if (window.CBLog?.ok) CBLog.ok(`UI bereit (index ${INDEX_V})`);
        else console.log(`[index ${INDEX_V}] UI bereit`);
        window.dispatchEvent(new CustomEvent('cb:ui-ready', { detail: { v: INDEX_V }}));
      } catch (_) {}

      // DOM refs
      const $panel     = document.getElementById('start-panel');
      const $map       = document.getElementById('map-select');
      const $btnStart  = document.getElementById('btn-start');
      const $btnRetry  = document.getElementById('btn-restart');
      const $btnCopy   = document.getElementById('btn-copy-log');
      const $btnCache  = document.getElementById('btn-cache');
      const $btnInsp   = document.getElementById('btn-inspector');
      const $btnBuild  = document.getElementById('btn-build');

      // Inspector öffnen/schließen (über globalen Hook des Inspectors)
      $btnInsp?.addEventListener('click', () => {
        try { window.GameInspector?.toggle?.(); } catch(_) {}
      });

      // Bau-Menü Button – öffnet via GameUI
      $btnBuild?.addEventListener('click', () => {
        try { window.GameUI?.openBuildMenu?.(); } catch(_) {}
      });

      // Nach Spielstart: Start-Panel schließen und Build-Button einblenden
      window.addEventListener('cb:game-started', () => {
        $panel?.classList.add('hidden');
        // Button anzeigen (Bridge sorgt parallel dafür)
        $btnBuild?.classList.add('visible');
      });

      // START drücken → GameLoader.start(map)
      function doStart() {
        const url = ($map?.value || './assets/maps/map-mini.json').trim();
        // Falls game.js noch nicht fertig ist, queued die Engine selbst.
        try {
          // Log für dich
          if (window.CBLog?.ok) CBLog.ok(`Start gedrückt → ${url}`);
          else console.log(`Start → ${url}`);
          window.GameLoader?.start?.(url);
        } catch (e) {
          (window.CBLog?.warn || console.warn)(`Engine noch nicht bereit – warte auf GameLoader.start …`);
          // Retry vom Inspector-Button möglich; hier keine Schleife.
        }
      }

      $btnStart?.addEventListener('click', doStart);

      // Neu-Start (Seite laden + Caches leeren via Hook vom Inspector)
      $btnRetry?.addEventListener('click', () => {
        try { window.CBTools?.requestHardReset?.(); } catch(_) {}
        location.reload();
      });

      // Log kopieren (vom Inspector bereitgestellt, sonst no-op)
      $btnCopy?.addEventListener('click', () => {
        try { window.CBTools?.copyLogToClipboard?.(); } catch(_) {}
      });

      // Cache-Booster (Inspector hook)
      $btnCache?.addEventListener('click', () => {
        try { window.CBTools?.clearCachesAndStorage?.(); } catch(_) {}
      });
    })();
  </script>
</body>
</html>
