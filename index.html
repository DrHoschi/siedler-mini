<!doctype html>
<!-- ============================================================================
     Datei   : index.html
     Projekt : Neue Siedler (Monolith)
     Version : v25.11.02-final (Lazy-Inspector + saubere Lade-Reihenfolge)
     Autor   : Mann + ChatGPT (GPT-5 Thinking)
     Zweck   : Start-Dokument. Lädt UI + Core in sinnhafter Reihenfolge:
               [0] HTML/CSS → [1] Boot → [2] Startpanel → [3] Assets → [4] Registry
               → [5] HUD/Build → [6] Game → [7] Inspector (lazy) → [8] optionale Overlays
     WICHTIG : - Startpanel ist zuerst sichtbar
               - Inspector wird NACH registry lazy nachgeladen
               - Alle Events/Logs folgen unseren Projektkonventionen
     ============================================================================ -->
<html lang="de" data-theme="dark">
<head>
  <!-- =========================================================
       [0] META / BASIS
       ---------------------------------------------------------
       - viewport + theme-color für Mobile
       - <meta name="robots"> optional, wenn Repo public
       ========================================================= -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f1f23">
  <meta name="robots" content="noindex,nofollow">
  <title>Neue Siedler</title>

  <!-- =========================================================
       [0] STYLES (Global → HUD/Build → Inspector-CSS)
       ---------------------------------------------------------
       Regeln:
       - ui.css = Grundlayout
       - ui-hud.css = Ressourcen-HUD (obere/seitliche Leiste)
       - ui-build.css = Baumenü & Kosten-Icons
       - Inspector-CSS kann schon im <head> geladen werden
         (damit beim Lazy-JS-Laden keine FOUC-Effekte auftreten)
       ========================================================= -->
  <link rel="stylesheet" href="ui/css/ui.css?v=25.11.02">
  <link rel="stylesheet" href="ui/css/ui-hud.css?v=25.11.02">
  <link rel="stylesheet" href="ui/css/ui-build.css?v=25.11.02">

  <!-- Inspector Styles (aktiv) -->
  <link rel="stylesheet" href="inspector/ui-inspector-v1.css?v=25.11.02">

  <!-- Inspector Styles (Varianten – bitte zum Testen so AUSKOMMENTIERT lassen) -->
  <!-- <link rel="stylesheet" href="ui/css/ui-inspector.css?v=25.11.02"> -->
  <!-- <link rel="stylesheet" href="ui/css/ui-inspector.clean.css?v=25.11.02"> -->
  <!-- <link rel="stylesheet" href="ui/css/ui-inspector.final.css?v=25.11.02"> -->

  <!-- Optional: Projekt-spezifische Layout-CSS (nur falls gebraucht) -->
  <!-- <link rel="stylesheet" href="ui/css/ui-layout.css?v=25.11.02"> -->

  <!-- =========================================================
       [0] BASIS-SCRIPTS (nur falls unbedingt nötig)
       ---------------------------------------------------------
       KEINE Inspector-JS hier! (wird lazy nach registry geladen)
       ========================================================= -->
  <script>
    // Kleiner, robuster Log-Wrapper (falls boot.js noch nicht da ist)
    window.CBLog = window.CBLog || {
      info:  (...a)=>console.log('[info]', ...a),
      warn:  (...a)=>console.warn('[warn]', ...a),
      error: (...a)=>console.error('[error]', ...a),
      ok:    (...a)=>console.log('[ok]', ...a)
    };
    document.addEventListener('DOMContentLoaded', ()=>CBLog.info('[index] DOM bereit'));
  </script>

  <style>
    /* Optional: Minimal-Error-Banner, falls Lazy-Loads fehlschlagen */
    #boot-error {
      position: fixed; left: 0; right: 0; top: 0;
      background: #b00020; color: #fff; padding: 10px 14px;
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: none; z-index: 99999;
    }
    #boot-error b { font-weight: 700; }
  </style>
</head>
<body>
  <!-- =========================================================
       [0] ROOT-KONTAINER + (optional) Fehlerbanner
       ========================================================= -->
  <div id="boot-error" role="alert" aria-live="assertive">
    <b>Fehler beim Nachladen</b> – Details in der Konsole prüfen (Netzwerk/404).
  </div>

  <!-- =========================================================
       [2] STARTPANEL / UI-SHELL
       ---------------------------------------------------------
       - Das konkrete Markup kommt aus ui/ui-start.js (generativ)
       - Stelle sicher, dass dein Startpanel zuerst sichtbar ist
       ========================================================= -->
  <div id="app-root">
    <!-- Platzhalter: UI/Startpanel & Canvas werden per JS eingefügt -->
    <noscript>Bitte JavaScript aktivieren.</noscript>
  </div>

  <!-- =========================================================
       [1] BOOT & EVENT-BUS
       ---------------------------------------------------------
       - Boot muss VOR allen anderen Modulen geladen werden
       - Stellt EventBus, globale Hooks & Basis-Logs
       ========================================================= -->
  <script src="core/boot.js?v=25.11.02"></script>

  <!-- =========================================================
       [2] UI: STARTPANEL (sichtbar zuerst)
       ---------------------------------------------------------
       - Erzeugt Start-Overlay, sendet cb:ui-ready
       ========================================================= -->
  <script src="ui/ui-start.js?v=25.11.02"></script>

  <!-- =========================================================
       [3] ASSETS (Loader – MUSS 'asset.js' Singular heißen)
       ---------------------------------------------------------
       - Lädt Bilder/JSON/Vektoren
       - Sendet cb:assets-ready {ok:true, counts:{...}}
       ========================================================= -->
  <script src="core/asset.js?v=25.11.02"></script>

  <!-- =========================================================
       [4] REGISTRY (Datenzusammenführung/Validierung)
       ---------------------------------------------------------
       - Liest data/*.json, prüft IDs, baut Maps
       - Sendet cb:registry:ready {version, counts:{...}}
       ========================================================= -->
  <script src="core/registry.js?v=25.11.02"></script>

  <!-- =========================================================
       [5] UI: HUD + BUILD
       ---------------------------------------------------------
       - HUD reagiert auf cb:res:change
       - Build-Dock rendert Kategorien/Buildings dynamisch
       ========================================================= -->
  <script src="ui/ui-hud.js?v=25.11.02"></script>
  <script src="ui/ui-build.js?v=25.11.02"></script>

  <!-- =========================================================
       [6] GAME (Map/Loop/World)
       ---------------------------------------------------------
       - Initialisiert Spiel und sendet cb:game:start
       ========================================================= -->
  <script src="core/game.js?v=25.11.02"></script>

  <!-- =========================================================
       [7] INSPECTOR (LAZY LOAD nach registry)
       ---------------------------------------------------------
       - Wir laden NUR CSS vorab. JS-Module werden dynamisch importiert,
         sobald cb:registry:ready gefeuert wurde. So sind alle Daten da.
       - Enthält: Host (core), Bridges, Tabs (logs/tests/resources/paths)
       - Optional: Editor-Tab später zuschaltbar
       ========================================================= -->
  <script>
    (function setupLazyInspector(){
      let loaded = false;

      function showBootError(msg){
        const b = document.getElementById('boot-error');
        if (!b) return;
        b.style.display = 'block';
        b.textContent = `Inspector-Ladefehler: ${msg}`;
      }

      async function loadInspector() {
        if (loaded) return;
        loaded = true;

        try {
          CBLog.info('[inspector] Lazy-Load beginnt (nach registry)');

          // Host + Bridges (aus deinem Inspektor.zip)
          await import('./inspector/inspector.core-v1.js');
          await import('./inspector/inspector.bridges-v1.js');

          // Standard-Tabs
          await import('./inspector/tabs.logs-v1.js');
          await import('./inspector/tabs.tests-v1.js');
          await import('./inspector/tabs.resources-v1.js');
          await import('./inspector/tabs.paths-v1.js');
             

          // Optional (jetzt auskommentiert lassen; später aktivieren)
          // await import('./ui/inspector/tabs.editor.js?v=25.11.02');

          // Signal „Inspector bereit“
          window.dispatchEvent(new CustomEvent('cb:insp:ready', { detail: { lazy:true, version:'v25.11.02' }}));
          CBLog.ok('[inspector] bereit (lazy)');
        } catch (err) {
          console.error(err);
          showBootError(err && err.message ? err.message : 'Unbekannter Fehler');
          CBLog.error('[inspector] Fehler beim Lazy-Load');
        }
      }

      // Load-Trigger: NACH REGISTRY
      window.addEventListener('cb:registry:ready', loadInspector, { once: true });

      // Optionaler Fallback: Wenn aus irgendeinem Grund „registry“ nicht kommt,
      // trotzdem nach ~5s versuchen (z. B. in Demo-Seiten)
      setTimeout(()=> {
        if (!loaded) {
          CBLog.warn('[inspector] Timeout-Fallback: versuche trotzdem Lazy-Load …');
          loadInspector();
        }
      }, 5000);
    })();
  </script>

  <!-- =========================================================
       [8] OPTIONALE OVERLAYS (LAZY nach Game-Start)
       ---------------------------------------------------------
       - Beispiel Path-Overlay: macht erst nach cb:game:start Sinn
       - Wird vom Inspector-Tab „Pfade“ getoggelt
       ========================================================= -->
  <script>
    (function setupLazyOverlays(){
      let pathOverlayLoaded = false;

      async function loadPathOverlay() {
        if (pathOverlayLoaded) return;
        pathOverlayLoaded = true;
        try {
          CBLog.info('[path] overlay lazy load (nach game:start)');
          await import('./core/path-overlay.js?v=25.11.02');
          window.dispatchEvent(new CustomEvent('cb:path:overlay:ready'));
          CBLog.ok('[path] overlay bereit');
        } catch (err) {
          console.error(err);
          CBLog.error('[path] overlay Ladefehler');
        }
      }

      // Läd das Overlay erst, wenn das Spiel läuft – spart Init-Kosten
      window.addEventListener('cb:game:start', loadPathOverlay, { once: true });

      // Zusätzlich: Wenn der Inspector-Tab „Pfade“ früh geöffnet wird,
      // kann man optional sofort nachladen (auskommentiert lassen, wenn nicht gewünscht)
      /*
      window.addEventListener('cb:insp:tab:change', (e)=>{
        if (e.detail && (e.detail.tab === 'Pfade' || e.detail.tab === 'Paths')) {
          loadPathOverlay();
        }
      });
      */
    })();
  </script>

  <!-- =========================================================
       [9] SMOKE-TEST HILFE (Debug – kann drin bleiben)
       ---------------------------------------------------------
       - Ein paar Kurz-Listener, damit man in der Konsole sieht,
         ob die Events korrekt fließen.
       ========================================================= -->
  <script>
    (function smoke(){
      const on = (n)=>window.addEventListener(n, e=>CBLog.info(`[event] ${n}`, e.detail));
      ['cb:ui-ready','cb:assets-ready','cb:registry:ready','cb:hud-ready','cb:build:ready','cb:game:start','cb:insp:ready','cb:path:overlay:ready'].forEach(on);
    })();
  </script>
</body>
</html>
