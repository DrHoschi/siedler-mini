<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Siedler‑Mini</title>

  <!--
    index.html v16.0.3
    Ziele:
      • GameLoader.start zuverlässig aufrufbar machen
      • Start-UI erst aktivieren, wenn game.js geladen ist
      • Robustere Logs + Copy/Paste + Cache-Leeren
      • Version im UI anzeigen
  -->

  <style>
    :root{
      --bg:#0e1311;
      --panel:#141b19;
      --panel2:#101614;
      --txt:#e8f2ed;
      --muted:#9fb2aa;
      --accent:#66d28f;
      --warn:#ffd666;
      --err:#ff6b6b;
      --okdot:#4ade80;
    }
    html,body{height:100%}
    body{
      margin:0; background:#203b1f; color:var(--txt);
      font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      overflow:hidden;
    }

    /* Backdrop Bild (Startscreen) */
    .backdrop{
      position:fixed; inset:0; display:grid; place-items:center;
      background:radial-gradient(ellipse at 50% 40%, #0b1a17 0%, #0a1513 40%, #090f0e 100%);
    }
    .backdrop__img{
      width:min(92vw,1100px); height:auto; border-radius:14px; box-shadow:0 30px 80px rgba(0,0,0,.5);
      user-select:none; pointer-events:none; opacity:.92;
    }

    /* Startcard */
    .card{
      position:fixed; inset:auto; left:50%; top:50%; transform:translate(-50%,-50%);
      width:min(92vw,700px); background:linear-gradient(180deg,var(--panel) 0%, var(--panel2) 100%);
      border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.55); padding:20px 22px 18px;
      border:1px solid #1d2623;
    }
    .card h1{margin:0 0 6px; font-size:32px; letter-spacing:.2px; display:flex; align-items:center; gap:.6rem}
    .led{width:.9rem; height:.9rem; border-radius:50%; background:var(--okdot); box-shadow:0 0 0 2px #0c1311 inset, 0 0 12px #3dd18f;}
    .sub{color:var(--muted); font-size:14px; margin-bottom:14px}
    .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .btn{
      appearance:none; border:0; padding:10px 16px; border-radius:12px; font-weight:600; cursor:pointer;
      background:#213a31; color:#e7fff3; box-shadow:0 2px 0 #0b1512 inset, 0 6px 14px rgba(0,0,0,.25);
      transition:.15s transform;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn--pri{background:#1f6b45}
    .btn--muted{background:#2a3431; color:#dfe9e4}
    .ver{margin-top:10px; color:var(--muted); font-size:12px}

    /* Canvas (Spielfeld) */
    #gameCanvas{
      position:fixed; inset:0; width:100vw; height:100vh; display:block;
      touch-action:manipulation; /* iOS */
    }

    /* Log-Dock (Inspector-Toast) */
    .dock{
      position:fixed; left:16px; right:16px; bottom:16px; display:flex; gap:12px; align-items:flex-end;
      pointer-events:none;
    }
    .dock > *{pointer-events:auto}
    .logpanel{
      flex:1; background:rgba(12,18,16,.75); border:1px solid #1b2421; border-radius:14px; padding:12px;
      backdrop-filter: blur(6px);
    }
    .logpanel pre{
      margin:10px 0 0; max-height:160px; overflow:auto; white-space:pre-wrap; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size:12px; line-height:1.35; color:#bfe9cc;
    }
    .chip{background:#0f1513; border:1px solid #1b2521; color:#d5e9df; padding:10px 14px; border-radius:12px; font-weight:600}
    .bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .bar .btn{background:#202a27}
    .ok::before,.warn::before,.err::before{
      content:""; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:.5em; vertical-align:-1px;
    }
    .ok::before{background:var(--accent)}
    .warn::before{background:var(--warn)}
    .err::before{background:var(--err)}
    .hidden{display:none}
  </style>
</head>
<body>

  <!-- Spielfeld -->
  <canvas id="gameCanvas" width="1024" height="768" aria-label="Spielanzeige"></canvas>

  <!-- Start-Hintergrund + Karte -->
  <div class="backdrop" id="backdrop">
    <img class="backdrop__img" alt="" src="./assets/tex/ui/fort_start.jpg" />
    <div class="card" id="startCard" role="dialog" aria-modal="true">
      <h1><span class="led" aria-hidden="true"></span> Siedler‑Mini</h1>
      <div class="sub">Neues Spiel starten? <span id="mapInfo" class="sub">(Map: assets/maps/map-mini.json)</span></div>
      <div class="row">
        <button id="btnStart" class="btn btn--pri">Start</button>
        <button id="btnEditor" class="btn btn--muted">Editor öffnen</button>
      </div>
      <div class="ver">v16.0.3</div>
    </div>
  </div>

  <!-- Log-Dock -->
  <div class="dock">
    <div class="chip" id="logCount">Log 0</div>
    <div class="bar">
      <button class="btn" id="btnCopyLog">Log kopieren</button>
      <button class="btn" id="btnClearLog">Log leeren</button>
      <button class="btn" id="btnClearCache">Cache leeren</button>
    </div>
    <div class="logpanel">
      <pre id="logOut"></pre>
    </div>
  </div>

  <!-- BootUI: kleines Logging- und Dialog-Helferlein -->
  <script>
  ;(function(){
    const out = document.getElementById('logOut');
    const cnt = document.getElementById('logCount');
    const lines = [];

    function stamp(){ return new Date().toTimeString().slice(0,8) }

    function write(kind, msg){
      const tag = kind==='ok' ? 'OK' : kind==='warn' ? 'WARN' : kind==='err' ? 'ERR' : 'game';
      const line = `[${stamp()}] (${tag}) ${msg}`;
      lines.push(line);
      out.textContent = lines.join("\n");
      cnt.textContent = `Log ${lines.length}`;
    }

    const BootUI = {
      ver: '16.0.3',
      log: (m)      => write('game', m),
      logOK: (m)    => write('ok',   m),
      logWarn: (m)  => write('warn', m),
      logErr: (m)   => write('err',  m),
      copyLog(){
        try{
          navigator.clipboard.writeText(lines.join("\n"));
          write('ok', 'Log in Zwischenablage');
        }catch(e){
          write('err', 'Clipboard fehlgeschlagen: '+ e);
        }
      },
      clearLog(){ lines.length = 0; out.textContent=''; cnt.textContent='Log 0'; },
      alert(msg){ window.alert(msg); },
      hideBackdrop(){ document.getElementById('backdrop')?.classList.add('hidden'); },
      showBackdrop(){ document.getElementById('backdrop')?.classList.remove('hidden'); },
    };

    window.BootUI = BootUI;
    BootUI.logOK('UI ready (index v'+BootUI.ver+')');

    // Buttons verdrahten
    document.getElementById('btnCopyLog').addEventListener('click', BootUI.copyLog);
    document.getElementById('btnClearLog').addEventListener('click', BootUI.clearLog);
    document.getElementById('btnClearCache').addEventListener('click', async () => {
      try{
        localStorage.clear();
        sessionStorage.clear();
        if ('caches' in window){ const keys = await caches.keys(); for (const k of keys) await caches.delete(k); }
        BootUI.logOK('Cache geleert (local/session/caches)');
      }catch(e){ BootUI.logWarn('Cache leeren: '+e); }
    });
  })();
  </script>

  <!-- game.js LADEN (defer) – muss VOR dem Boot-Skript kommen, damit GameLoader verfügbar ist -->
  <script src="./game.js?v=16.0.3" defer></script>

  <!-- Boot-Skript (verdrahtet Start/Editor und prüft GameLoader-Verfügbarkeit) -->
  <script>
  ;(function(){
    const $ = (id) => document.getElementById(id);

    // Warten bis DOM & alle deferred Skripte (inkl. game.js) fertig sind
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = $('gameCanvas');
      const startBtn = $('btnStart');
      const editorBtn = $('btnEditor');

      function canStart(){
        return !!(window.GameLoader && typeof window.GameLoader.start === 'function');
      }

      function startGame(){
        // Prüfen, ob GameLoader verfügbar
        if (!canStart()){
          BootUI.logErr('GameLoader.start ist nicht verfügbar – game.js noch nicht initialisiert?');
          BootUI.alert('Fehler beim Start: GameLoader.start ist nicht verfügbar (siehe Log).');
          return;
        }
        BootUI.log('GameLoader.start ./assets/maps/map-mini.json');
        try{
          window.GameLoader.start({
            canvas,
            mapUrl: './assets/maps/map-mini.json',
            onReady: () => BootUI.log('Game ready'),
          });
          BootUI.hideBackdrop();
        }catch(err){
          BootUI.logErr('Start-Exception: ' + err);
          BootUI.alert('Fehler beim Start: ' + err);
        }
      }

      startBtn.addEventListener('click', startGame);
      editorBtn.addEventListener('click', () => {
        BootUI.log('Editor öffnen (Hook – später verknüpfen)');
        BootUI.alert('Editor‑Start ist hier noch ein Platzhalter.');
      });

      // Sicherheit: Wenn game.js später init meldet, einmal den Status loggen
      window.addEventListener('GameLoaderReady', () => BootUI.logOK('GameLoader bereit'));

      // Optionaler Poll-Fallback (falls ein anderes Script GameLoader später setzt)
      let tries = 0;
      const iv = setInterval(() => {
        if (canStart()){
          BootUI.logOK('GameLoader.start gefunden');
          clearInterval(iv);
        }else if (++tries > 50){
          BootUI.logWarn('GameLoader.start nach 5s nicht gefunden (Start zeigt Hinweis).');
          clearInterval(iv);
        }
      }, 100);
    });
  })();
  </script>
</body>
</html>
