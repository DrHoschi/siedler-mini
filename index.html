<!doctype html>
<html lang="de">
<head>
  <!-- Siedler 2020 · CODE_STYLE · index.html v16.2.7 -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1610">
  <meta name="version" content="16.2.7">
  <title>Neue Siedler · Start (index v16.2.7)</title>
  <meta name="description" content="Neue Siedler · Mini City-Builder (Siedler 2020)">

  <!-- Basis-Styles (Pfad entspricht deinem Repo) -->
  <link rel="stylesheet" href="./css/base.css?v=16.2.7">
  <link rel="stylesheet" href="./css/platform.css?v=16.2.7">
  <link rel="stylesheet" href="./css/mobile.css?v=16.2.7">
  <link rel="stylesheet" href="./css/ios.css?v=16.2.7">
  <link rel="stylesheet" href="./css/android.css?v=16.2.7">
  <link rel="stylesheet" href="./css/desktop.css?v=16.2.7">
  <link rel="stylesheet" href="./styles.css?v=16.2.7">
  <link rel="stylesheet" href="./style.css?v=16.2.7">

  <!-- UI-Styles -->
  <link rel="stylesheet" href="./ui-start.css?v=16.2.7">
  <link rel="stylesheet" href="./ui-build.css?v=16.2.7">

  <link rel="manifest" href="./manifest.webmanifest?v=16.2.7">

  <style>
    /* Kleine Defaults, stören dein CSS nicht */
    html,body{height:100%;background:#0d392f;color:#e6f3ea;margin:0}
    #game{display:block;width:100vw;height:100vh}
    /* Fallback-Startpanel (wird von assets/ui/ui-start.js übernommen/gestylt) */
    #start-panel{
      position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
      min-width:300px;max-width:92vw;z-index:50;
      background:rgba(7,18,14,.85);border:1px solid rgba(255,255,255,.08);
      border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);
      backdrop-filter:saturate(1.2) blur(6px);
    }
    #start-panel h1{margin:.1rem 0 1rem;font-size:1.4rem}
    #start-panel .row{display:flex;gap:14px;align-items:center;margin:.6rem 0}
    #start-panel .row > *{flex:1}
    #start-panel select, #start-panel button{
      font:600 14px/1.1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding:.8rem 1rem;border-radius:12px;border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.06);color:#e6f3ea;letter-spacing:.02em
    }
    #start-panel .sub{opacity:.7;font:12px ui-monospace,Menlo,Consolas,monospace}
    #btn-inspector{position:fixed;right:.66rem;bottom:.66rem;z-index:99}
  </style>
</head>
<body>
  <!-- Spielfläche -->
  <canvas id="game" aria-label="Spielfläche" role="img"></canvas>

  <!-- Startpanel (Fallback). ui-start.js greift diese IDs auf. -->
  <section id="start-panel" aria-live="polite">
    <h1>City-Builder — Start <span class="sub" id="index-version">index v16.2.7</span></h1>
    <div class="sub" id="meta-line">unbekannt · dpr: <span id="dpr">?</span></div>

    <div class="row">
      <label for="map-select" style="min-width:64px">Karte:</label>
      <select id="map-select">
        <option value="./assets/maps/map-mini.json">map-mini.json (16×)</option>
        <option value="./assets/maps/map-pro.json">map-pro.json</option>
        <option value="./assets/maps/map-demo.json">map-demo.json</option>
      </select>
    </div>

    <div class="row">
      <button id="btn-start" aria-label="Start">▶ Start</button>
      <button id="btn-restart" aria-label="Neu-Start">↺ Neu-Start</button>
    </div>

    <div class="row">
      <button id="btn-cache" aria-label="Cache-Booster">🧹 Cache-Booster</button>
      <button id="btn-copylog" aria-label="Log kopieren">📋 Log kopieren</button>
    </div>

    <div class="row">
      <div id="start-log" class="sub">[–:–:–] OK UI bereit (index v16.2.7)</div>
    </div>
  </section>

  <!-- Inspector-Schalter (wird von inspector.js hübsch ersetzt) -->
  <button id="btn-inspector">Inspector</button>

  <!-- 0) SW/Caches einmalig leeren (außer ?keep-sw) -->
  <script>
  (function(){
    try{
      if('serviceWorker' in navigator && !location.search.includes('keep-sw')){
        navigator.serviceWorker.getRegistrations().then(rs=>{
          rs.forEach(r=>r.unregister());
          if(window.caches && caches.keys) caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)));
        });
      }
      // Version exportieren (für Logs/UI)
      window.__cb = window.__cb || {};
      window.__cb.indexVersion = "v16.2.7";
      document.getElementById('index-version').textContent = "index v16.2.7";
      document.getElementById('dpr').textContent = String(Math.round((window.devicePixelRatio||1)*10)/10);
      // Buttons: minimaler Fallback (falls ui-start.js noch nicht gebunden hat)
      var qs = s=>document.querySelector(s);
      (qs('#btn-start')||{}).onclick = function(){
        try{
          var map = (qs('#map-select')||{}).value || './assets/maps/map-mini.json';
          if (window.GameBoot && typeof GameBoot.start==='function'){ GameBoot.start(map); }
          else if (window.GameLoader && typeof GameLoader._start==='function'){ GameLoader._start(map); }
          (qs('#start-panel')||{}).style.display='none';
        }catch(e){ console.error(e); }
      };
      (qs('#btn-restart')||{}).onclick = function(){ location.reload(); };
      (qs('#btn-cache')||{}).onclick = function(){ location.href = location.pathname + '?keep-sw'; };
      (qs('#btn-copylog')||{}).onclick = function(){
        try{
          var t = (window.CBLog && CBLog.dump) ? CBLog.dump() : (console.history ? console.history.join('\n') : 'Log nicht verfügbar');
          navigator.clipboard && navigator.clipboard.writeText(t);
        }catch(_){}
      };
    }catch(e){ console.error(e); }
  })();
  </script>

  <!-- ===================== SCRIPT-REIHENFOLGE ===================== -->
  <!-- 1) Inspector + UI -->
  <script defer src="./inspector.js?v=16.2.7"></script>
  <!-- ui-bridge.js NICHT laden (war Quelle der 404/HTML-Antwort) -->
  <script defer src="./assets/ui/ui-start.js?v=16.2.7"></script>
  <script defer src="./assets/ui/ui-build.js?v=16.2.7"></script>

  <!-- 2) Boot -->
  <script defer src="./boot.js?v=16.2.7"></script>

  <!-- 3) Module/Compat -->
  <script type="module" src="./fullscreen.js?v=16.2.7"></script>

  <!-- 4) Core vor game.js -->
  <script defer src="./core/pathfinder.js?v=16.2.7"></script>
  <script defer src="./core/carriers.js?v=16.2.7"></script>

  <!-- 5) Spiel -->
  <script defer src="./game.js?v=16.2.7"></script>
  <script defer src="./main.js?v=16.2.7"></script>
  <!-- ============================================================= -->

  <noscript>Bitte JavaScript aktivieren, um „Neue Siedler“ zu spielen.</noscript>
</body>
</html>
