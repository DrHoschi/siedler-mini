<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2419" />
  <title>Mini – v16.1.18</title>

  <!-- Deine Basis-Styles (so lassen) -->
  <link rel="preload" href="./css/base.css" as="style" />
  <link rel="preload" href="./style.css" as="style" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Nur kleine Zusatz-Styles für FABs & Startpanel-Rahmen -->
  <style>
    /* ===== Floating Action Buttons (FABs) ===== */
    .cb-fab{
      position:fixed; z-index:9000; width:56px; height:56px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:rgba(20,20,20,.7); color:#fff; user-select:none; cursor:pointer;
      border:1px solid rgba(255,255,255,.12); box-shadow:0 6px 16px rgba(0,0,0,.35);
      -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
      transition:transform .15s ease, opacity .15s ease;
    }
    .cb-fab:active{ transform:scale(.96); }
    #btn-inspector{ right:12px; bottom:12px; }        /* immer sichtbar */
    #btn-build{ left:12px; bottom:12px; opacity:0; pointer-events:none; } /* erst nach Start */
    #btn-build.visible{ opacity:1; pointer-events:auto; }

    /* ===== Start-Panel (dein Layout bleibt, nur Hilfsrahmen) ===== */
    #start-panel{
      position:relative; z-index:1000;  /* über dem Canvas */
    }

    /* ===== Mini-Fallback-Inspector (falls assets/inspector/inspector.js fehlt) ===== */
    #cb-fallback-inspector{
      position:fixed; inset:0; background:rgba(8,8,8,.92);
      color:#cfe6d8; font:14px/1.4 ui-sans-serif,system-ui,Arial;
      z-index:9500; display:none;
    }
    #cb-fallback-inspector.open{ display:block; }
    #cbfi-head{
      display:flex; gap:8px; align-items:center; padding:10px;
      background:rgba(255,255,255,.06); border-bottom:1px solid rgba(255,255,255,.08);
    }
    #cbfi-head button{
      padding:8px 10px; border-radius:10px; border:1px solid rgba(255,255,255,.15);
      background:#182820; color:#cfe6d8; cursor:pointer;
    }
    #cbfi-log{ padding:12px; white-space:pre-wrap; overflow:auto; height:calc(100vh - 58px); }
  </style>
</head>

<body>
  <!-- ===== Start-Panel (DEINS) =====
       Layout bitte so lassen; IDs für JS wichtig.
  -->
  <div id="start-panel" aria-label="City-Builder Start">
    <div class="cb-start-card">
      <div class="cb-start-title">
        <strong>City-Builder – Start</strong>
        <span class="cb-badge">index <span id="badge-index">v16.1.18</span></span>
        <span class="cb-badge">game.js: <span id="badge-game">unbekannt</span></span>
        <span class="cb-badge">dpr: <span id="badge-dpr">?</span></span>
      </div>

      <label class="cb-label">Karte:</label>
      <div class="cb-row">
        <select id="map-select" class="cb-select">
          <!-- deine Maps (bekannt aus filelist) -->
          <option value="./assets/maps/map-mini.json">map-mini.json (16x10)</option>
          <option value="./assets/maps/map-pro.json">map-pro.json (20x12)</option>
          <option value="./assets/maps/map-test-all.json">map-test-all.json</option>
          <option value="./assets/maps/map-demo.json">map-demo.json</option>
        </select>

        <button id="btn-start" class="cb-btn cb-btn--primary">▶️ Start</button>
        <button id="btn-restart" class="cb-btn cb-btn--warn">♻️ Neu-Start</button>
      </div>

      <div class="cb-row">
        <button id="btn-copylog" class="cb-btn">🧾 Log kopieren</button>
        <button id="btn-cache" class="cb-btn">🧹 Cache-Booster</button>
      </div>

      <p class="cb-hint">Hinweis: Nach „Start“ verschwindet dieses Fenster automatisch.</p>

      <!-- Start-Panel Logausgabe (kleines Fensterchen wie bisher) -->
      <pre id="start-log" class="cb-log"></pre>
    </div>
  </div>

  <!-- ===== Canvas (deins) ===== -->
  <canvas id="game" width="0" height="0"></canvas>

  <!-- ===== Floating Buttons ===== -->
  <button id="btn-inspector" class="cb-fab" title="Inspector">🛠️</button>
  <button id="btn-build" class="cb-fab" title="Bau-Menü">🏗️</button>

  <!-- ===== Fallback-Inspector (nur wenn dein Inspector fehlt) ===== -->
  <div id="cb-fallback-inspector" aria-label="Inspector (Fallback)">
    <div id="cbfi-head">
      <strong>Inspector (Fallback)</strong>
      <button id="cbfi-copy">Log kopieren</button>
      <button id="cbfi-clear">Log leeren</button>
      <button id="cbfi-close">Schließen ✖</button>
    </div>
    <div id="cbfi-log"></div>
  </div>

  <!-- ===================== SCRIPTS ===================== -->

  <!-- 1) Dein Inspector (wenn vorhanden, wird er benutzt) -->
  <script src="./assets/inspector/inspector.js"></script>

  <!-- 2) Engine -->
  <script src="./game.js"></script>

  <!-- 3) Bau-Menü (deine Dateien) -->
  <script src="./assets/ui/ui-build.js"></script>
  <script src="./assets/ui/ui-bridge.js"></script>

  <!-- 4) Main/Boot (deins) -->
  <script src="./main.js"></script>

  <!-- 5) Index-Glue: Events, Buttons, Logging, Fallbacks -->
  <script>
  (function(){
    // ---------- Versionen/Basics ----------
    const INDEX_VERSION = 'v16.1.18';
    const dpr = (window.devicePixelRatio||1);
    document.getElementById('badge-index').textContent = INDEX_VERSION;
    document.getElementById('badge-dpr').textContent = String(dpr);

    // Ein zentrales, simples Log mit Spiegeln in Start-Panel & Fallback-Inspector
    const startLog = document.getElementById('start-log');
    const fb = {
      el: document.getElementById('cb-fallback-inspector'),
      log: document.getElementById('cbfi-log')
    };
    window.CBLog = {
      push(type,msg){ line(type,msg); },
      ok(msg){ line('ok',msg); },
      warn(msg){ line('warn',msg); },
      err(msg){ line('err',msg); }
    };
    function line(type, msg){
      const ts = new Date().toTimeString().slice(0,8);
      const icon = type==='ok'?'✅':type==='warn'?'⚠️':type==='err'?'❌':'LOG';
      const s = `[${ts}] ${icon} ${msg}\n`;
      try{ startLog.textContent += s; startLog.scrollTop = startLog.scrollHeight; }catch(_){}
      try{ fb.log.textContent += s; fb.log.scrollTop = fb.log.scrollHeight; }catch(_){}
      try{
        const fn = type==='err'?'error':type==='warn'?'warn':'log';
        console[fn](msg);
      }catch(_){}
    }

    // ---------- Buttons ----------
    const $ = (id)=>document.getElementById(id);
    const selMap = $('map-select');
    const btnStart = $('btn-start');
    const btnRestart = $('btn-restart');
    const btnCopyLog = $('btn-copylog');
    const btnCache = $('btn-cache');
    const btnInspector = $('btn-inspector');
    const btnBuild = $('btn-build');

    // Inspector-Button: echte API bevorzugen, sonst Fallback
    function openInspector(){
      if (window.GameInspector && typeof window.GameInspector.open==='function'){
        window.GameInspector.open();
      } else {
        fb.el.classList.add('open');
      }
    }
    btnInspector.addEventListener('click', openInspector);
    $('cbfi-close').addEventListener('click', ()=>fb.el.classList.remove('open'));
    $('cbfi-clear').addEventListener('click', ()=>{ fb.log.textContent=''; startLog.textContent=''; });
    $('cbfi-copy').addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(fb.log.textContent || startLog.textContent || '');
        CBLog.ok('Log in Zwischenablage');
      }catch(e){ CBLog.err('Clipboard-Fehler: '+e.message); }
    });

    // Build-Button: öffnet dein Bau-Menü (sofern vorhanden)
    btnBuild.addEventListener('click', ()=>{
      if (window.UIBuild && typeof window.UIBuild.open==='function'){
        window.UIBuild.open();
        CBLog.ok('Bau-Menü geöffnet (ui-build.js)');
      } else {
        CBLog.warn('Bau-Menü API nicht gefunden — erwarte globale Variable z.B. window.UIBuild');
      }
    });

    // ---------- Start / Neu-Start / Cache ----------
    btnStart.addEventListener('click', ()=>startSelectedMap());
    btnRestart.addEventListener('click', ()=>{ try{
      localStorage.clear(); sessionStorage.clear(); caches?.keys?.().then(keys=>keys.forEach(k=>caches.delete(k)));
    }catch(_){}
      CBLog.ok('Neu-Start angefordert');
      setTimeout(()=>startSelectedMap(true), 50);
    });
    btnCache.addEventListener('click', ()=>{
      try{
        localStorage.clear(); sessionStorage.clear(); caches?.keys?.().then(keys=>keys.forEach(k=>caches.delete(k)));
        CBLog.ok('Cache/Storage geleert – Seite ggf. neu laden');
      }catch(e){ CBLog.warn('Cache-Booster: '+e.message); }
    });
    btnCopyLog.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(startLog.textContent);
        CBLog.ok('Log in Zwischenablage');
      }catch(e){ CBLog.err('Clipboard-Fehler: '+e.message); }
    });

    async function startSelectedMap(fromRestart){
      const url = selMap.value;
      CBLog.ok(`Start gedrückt → ${url}`);
      // preferiere deine öffentliche Start-API
      const GL = window.GameLoader || {};
      // v16.1.16+ nutzt _start
      const startFn = GL._start || GL.start;
      if (typeof startFn !== 'function'){
        CBLog.warn('Engine noch nicht bereit – warte auf GameLoader.start …');
        // kurze Retry-Schleife
        let tries = 20;
        const t = setInterval(()=>{
          const f = (window.GameLoader||{})._start || (window.GameLoader||{}).start;
          tries--;
          if (typeof f==='function'){
            clearInterval(t);
            safeStart(f, url);
          } else if (tries<=0){
            clearInterval(t);
            CBLog.err('GameLoader.start ist nicht verfügbar – game.js / Engine noch nicht initialisiert?');
          }
        }, 150);
      } else {
        safeStart(startFn, url);
      }
    }

    async function safeStart(fn, url){
      try{
        await fn(url);
        // Panel ausblenden, Build-Button sichtbar
        document.getElementById('start-panel').style.display = 'none';
        btnBuild.classList.add('visible');
      }catch(e){
        CBLog.err('Start fehlgeschlagen: '+e.message);
      }
    }

    // ---------- Engine/Index Events ----------
    window.addEventListener('cb:engine-ready', (ev)=>{
      $('badge-game').textContent = ev?.detail?.v || 'unbekannt';
    });
    window.addEventListener('cb:game-started', ()=>{
      CBLog.ok('Event: cb:game-started empfangen');
      btnBuild.classList.add('visible');
    });

    // beim Laden Bescheid sagen
    CBLog.ok('UI bereit (index '+INDEX_VERSION+')');
    window.dispatchEvent(new CustomEvent('cb:ui-ready', {detail:{ v: INDEX_VERSION }}));
  })();
  </script>
</body>
</html>
