<!DOCTYPE html>
<html lang="de">
<head>
  <!--
  ============================================================
  Datei : index.html
  Projekt: Siedler-Mini
  Version: v16.1.21
  Zweck : Einstiegspunkt (DOM, Imports, Init-Events)
  ============================================================
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Siedler-Mini – v16.1.21</title>

  <!-- Basis-Styles -->
  <link rel="stylesheet" href="./css/base.css?v=16.1.21">
  <link rel="stylesheet" href="./css/platform.css?v=16.1.21">
  <link rel="stylesheet" href="./css/mobile.css?v=16.1.21">
  <link rel="stylesheet" href="./css/ios.css?v=16.1.21">

  <!-- UI: Start-Panel (eigene CSS-Datei) -->
  <link rel="stylesheet" href="./ui-start.css?v=16.1.21">

  <style>
    html,body{height:100%}
    body{margin:0;background:#093c2f;overflow:hidden}
    /* optional: Canvas sichtbar machen */
    canvas#game, canvas#stage { position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:10; background:transparent; }
  </style>
</head>
<body>
  <!-- DOM-Wurzel -->
  <div id="start-panel" aria-label="Startfenster"></div>
  <canvas id="game" aria-label="Spielfeld" width="0" height="0"></canvas>

  <!-- Inspector-FAB -->
  <button id="btn-inspector" aria-label="Inspektor öffnen"
    style="position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
           width:64px;height:64px;border-radius:50%;border:none;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);cursor:pointer;z-index:2001">🛠️</button>

  <!-- Core -->
  <script src="./core/asset.js?v=16.1.21" defer></script>
  <script src="./core/asset.items.js?v=16.1.21" defer></script>
  <script src="./core/terrain.js?v=16.1.21" defer></script>
  <script src="./core/actor.js?v=16.1.21" defer></script>

  <!-- Tools -->
  <script src="./tools/debug-tools.js?v=16.1.21" defer></script>
  <script src="./tools/dev-inspector.js?v=16.1.21" defer></script>

  <!-- UI -->
  <script src="./assets/ui/ui-start.js?v=16.1.21" defer></script>

  <!-- ⚠️ Nur EINE Build-UI laden: die neue mit Tabs/kleinen Thumbs -->
  <script src="./assets/ui/ui-build.js?v=16.1.8" defer></script>

  <!-- Game -->
  <script src="./boot.js?v=16.1.21" defer></script>
  <script src="./game.js?v=16.1.23" defer></script>
  <!-- Start-Bridge (stellt GameBoot.start/startGame bereit) -->
  <script src="./boot.compat.js?v=1" defer></script>

  <!-- Init + Diagnose + Fallback-Schließen -->
  <script>
  (function(){
    // Startfenster beim Spielstart schließen (echt + Fallback)
    function closeStartPanel(){
      var host = document.getElementById('start-panel');
      if (host) host.style.display = 'none';
      var bg = document.getElementById('cb-start-bg');
      if (bg && bg.parentNode) bg.parentNode.removeChild(bg);
    }
    window.addEventListener('cb:game-start', closeStartPanel);
    window.addEventListener('cb:game-started', closeStartPanel);

    // Inspector-FAB
    var fab = document.getElementById('btn-inspector');
    if (fab){
      fab.addEventListener('click', function(){
        if (window.GameInspector && typeof window.GameInspector.toggle==='function'){
          window.GameInspector.toggle();
        } else {
          console.warn('[diag] GameInspector.toggle() nicht verfügbar.');
        }
      });
    }

    // UI Ready -> Startpanel öffnen
    document.addEventListener('DOMContentLoaded', function(){
      window.__cb = window.__cb || {};
      window.__cb.indexVersion = "16.1.21";
      // Wenn ui-start.js nicht auto-öffnet, dann leicht verzögert probieren:
      setTimeout(function(){
        if (window.GameUI && typeof window.GameUI.openStartPanel === 'function'){
          try { window.GameUI.openStartPanel({ maps:[{label:'map-mini.json (16×)', url:'./assets/maps/map-mini.json'}] }); } catch(e){}
        }
      }, 120);
    });
  })();
  </script>
</body>
</html>
