<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Siedler-Mini – v16.0.4</title>

  <!--
    Siedler-Mini – INDEX v16.0.4
    - Start-UI mit Log-Konsole (✅⚠️❌)
    - Wartet robust auf window.GameLoader.start (Retry + Hinweis)
    - Cache leeren, Log kopieren/clearen
    - Version wird im UI angezeigt
  -->

  <style>
    :root{
      --bg:#0d1512;           /* dunkler Hintergrund */
      --panel:#121c19;        /* Paneel */
      --panel-2:#0f1916;      /* tieferes Paneel */
      --text:#dfe9e4;         /* Primärtext */
      --muted:#9fb2aa;        /* Sekundärtext */
      --ok:#35c46a;
      --warn:#e9b949;
      --err:#ff6b6b;
      --btn:#203a33;
      --btn-hi:#2b4d43;
      --chip:#0b1311;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:14px;
    }

    html,body{height:100%;background:var(--bg);color:var(--text);margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;}
    #app{position:relative;min-height:100%;display:grid;place-items:center;overflow:hidden;}
    canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}

    /* Start-Card */
    .start-card{
      position:relative;
      z-index:4;
      width:min(720px,calc(100% - 24px));
      background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0)) , var(--panel);
      border:1px solid rgba(255,255,255,.06);
      box-shadow:var(--shadow);
      border-radius:18px;
      padding:22px 22px 16px;
      backdrop-filter:saturate(140%) blur(6px);
    }
    .title-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .badge{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #8df5b1 0 40%, #0a4426 60%);}
    h1{font-size:32px;line-height:1;margin:0}
    .subtitle{color:var(--muted);font-size:14px}
    .actions{display:flex;gap:12px;margin:18px 0 8px}
    .btn{
      appearance:none;border:0;border-radius:12px;background:var(--btn);
      color:var(--text);padding:12px 18px;font-weight:600;letter-spacing:.2px;
    }
    .btn:hover{background:var(--btn-hi)}
    .btn.primary{background:#1f8a5f;}
    .btn.primary:hover{background:#1a774f;}
    .version{color:var(--muted);font-size:12px;margin-top:4px}

    /* Log-Toast unten */
    .log-dock{
      position:fixed;left:16px;right:16px;bottom:16px;z-index:5;
      display:flex;gap:12px;align-items:flex-end;pointer-events:none;
    }
    .log-panel{
      pointer-events:auto;
      background:var(--panel-2);border:1px solid rgba(255,255,255,.06);
      border-radius:var(--radius);box-shadow:var(--shadow);
      padding:14px;flex:1;min-height:92px;max-height:28vh;overflow:auto;
    }
    .log-toolbar{display:flex;gap:10px;margin-right:12px;pointer-events:auto;flex-wrap:wrap}
    .chip{background:var(--chip);border:1px solid rgba(255,255,255,.08);color:var(--text);
      padding:10px 14px;border-radius:12px;font-weight:600}
    .chip.small{padding:8px 12px;font-weight:700}
    .logline{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; white-space:pre-wrap;}
    .log-ok{color:var(--ok)}
    .log-warn{color:var(--warn)}
    .log-err{color:var(--err)}

    /* Dialog */
    dialog{
      border:0;border-radius:16px;padding:0;background:var(--panel);
      color:var(--text);box-shadow:var(--shadow);
    }
    dialog .dlg-body{padding:20px}
    dialog::backdrop{background:rgba(0,0,0,.55)}
    .dlg-actions{display:flex;justify-content:flex-end;gap:10px;padding:0 20px 16px}

    /* Backdrop Bild optional (kann entfernt/ersetzt werden) */
    .backdrop{
      position:absolute;inset:0;z-index:1;
      background:linear-gradient(#0b140f 10%, transparent 25%), url("./assets/tex/placeholder64.PNG");
      background-size:cover;
      opacity:.08;
    }

    @media (max-width:480px){
      h1{font-size:26px}
      .actions{gap:10px}
      .log-panel{max-height:34vh}
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game" width="0" height="0" aria-label="Spielfeld"></canvas>

    <!-- dezentes Hintergrundbild; wird ausgeblendet wenn das Spiel rendert -->
    <div class="backdrop" id="backdrop"></div>

    <!-- Startkarte -->
    <section class="start-card" id="startCard" role="dialog" aria-modal="true">
      <div class="title-row">
        <div class="badge" aria-hidden="true"></div>
        <h1>Siedler-Mini</h1>
      </div>
      <div class="subtitle">Neues Spiel starten? <span id="mapLabel">(Map: <code>assets/maps/map-mini.json</code>)</span></div>
      <div class="actions">
        <button class="btn primary" id="btnStart">Start</button>
        <button class="btn" id="btnEditor">Editor öffnen</button>
      </div>
      <div class="version">v16.0.4</div>
    </section>

    <!-- Log-Konsole unten -->
    <div class="log-dock" id="logDock" aria-live="polite">
      <div class="log-toolbar">
        <span class="chip small" id="logCount">Log 0</span>
        <button class="chip" id="btnCopy">Log kopieren</button>
        <button class="chip" id="btnClear">Log leeren</button>
        <button class="chip" id="btnCache">Cache leeren</button>
      </div>
      <div class="log-panel" id="logPanel" tabindex="0" aria-label="Debug-Log"></div>
    </div>

    <!-- Hinweisdialoge -->
    <dialog id="hintDialog">
      <div class="dlg-body" id="hintBody">–</div>
      <div class="dlg-actions">
        <button class="btn" id="dlgClose">Schließen</button>
      </div>
    </dialog>
  </div>

  <!-- Game-Script (defer), gibt global window.GameLoader.start -->
  <script defer src="./game.js"
          onload="BootLog.ok('game.js geladen')"
          onerror="BootLog.err('game.js konnte nicht geladen werden')"></script>

  <script>
  /* ============================
     Kleine Boot/Log-Hilfen
     ============================ */
  const BootLog = (() => {
    const el = {
      panel: document.getElementById('logPanel'),
      count: document.getElementById('logCount'),
    };
    const lines = [];
    const stamp = () => {
      const d = new Date();
      const pad = n => String(n).padStart(2,'0');
      return `[${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}]`;
    };
    const push = (cls, icon, msg) => {
      const line = `${stamp()} ${icon} ${msg}`;
      lines.push({ cls, line });
      const div = document.createElement('div');
      div.className = `logline ${cls}`;
      div.textContent = line;
      el.panel.appendChild(div);
      el.panel.scrollTop = el.panel.scrollHeight;
      el.count.textContent = `Log ${lines.length}`;
      console[cls==='log-err'?'error':cls==='log-warn'?'warn':'log'](line);
    };
    return {
      ok:   (m) => push('log-ok',   '✅', `(ok) ${m}`),
      warn: (m) => push('log-warn', '⚠️', `(warn) ${m}`),
      err:  (m) => push('log-err',  '❌', `(err) ${m}`),
      raw:  (m) => push('', '', m),
      copy: async () => {
        try {
          const text = lines.map(x=>x.line).join('\n');
          await navigator.clipboard.writeText(text);
          BootLog.ok('Log in Zwischenablage');
        } catch(e){ BootLog.err('Kopieren fehlgeschlagen'); }
      },
      clear: () => {
        lines.length = 0; el.panel.innerHTML=''; el.count.textContent='Log 0';
      }
    };
  })();

  /* ============================
     Start-UI & Aktionen
     ============================ */
  const q = (id)=>document.getElementById(id);
  const startCard = q('startCard');
  const backdrop  = q('backdrop');
  const canvasEl  = q('game');

  // Buttons
  q('btnCopy').addEventListener('click', ()=>BootLog.copy());
  q('btnClear').addEventListener('click', ()=>BootLog.clear());
  q('btnCache').addEventListener('click', async ()=>{
    try{
      localStorage.clear();
      sessionStorage.clear();
      if ('caches' in window){
        const keys = await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
      BootLog.ok('Cache/Storage geleert – Seite ggf. neu laden');
    }catch(e){ BootLog.err('Cache leeren fehlgeschlagen'); }
  });

  // kleiner Dialog-Helper
  const dlg = q('hintDialog'), dlgBody = q('hintBody');
  q('dlgClose').addEventListener('click', ()=>dlg.close());
  function hint(html){
    dlgBody.textContent = '';
    dlgBody.insertAdjacentHTML('afterbegin', html);
    dlg.showModal();
  }

  // Editor-Hook (Platzhalter)
  q('btnEditor').addEventListener('click', ()=>{
    BootLog.ok('Editor öffnen (Hook – später verknüpfen)');
    hint('<p>Editor-Start ist hier noch ein Platzhalter.</p>');
  });

  // Spiel starten
  q('btnStart').addEventListener('click', ()=>tryStart());

  // Versuch, GameLoader.start aufzurufen (mit kurzen Retries)
  async function tryStart(){
    const wantMap = 'assets/maps/map-mini.json';
    const tryMs   = [0, 250, 500, 1000, 1500, 2500];

    for (let i=0;i<tryMs.length;i++){
      await new Promise(r=>setTimeout(r, tryMs[i]));
      const fn = window.GameLoader && window.GameLoader.start;
      if (typeof fn === 'function'){
        BootLog.ok(`GameLoader.start ${wantMap}`);
        // Canvas grob initialisieren (Größe passt Game später an)
        resizeCanvasToView();
        startCard.style.display='none';
        backdrop.style.display='none';
        try{
          fn({
            canvas: canvasEl,
            mapUrl: wantMap,
            onReady: ()=>BootLog.ok('Game started')
          });
        }catch(e){
          BootLog.err(`Start-Fehler: ${e.message||e}`);
          hint(`<p><strong>❌ Fehler beim Start</strong><br>${String(e)}</p>`);
        }
        return;
      }
      if (i===2) BootLog.warn('GameLoader.start noch nicht verfügbar (Game initialisiert?)');
    }

    // nach allen Retries immer noch nicht da → Hinweis
    BootLog.err('GameLoader.start nicht gefunden – Start deaktiviert.');
    hint('<p><strong>❌ Fehler beim Start:</strong> <code>GameLoader.start</code> ist nicht verfügbar.<br>Ist <code>game.js</code> geladen?</p>');
  }

  function resizeCanvasToView(){
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio||1));
    const w = Math.floor(window.innerWidth  * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    canvasEl.width  = w; canvasEl.height = h;
    canvasEl.style.width  = '100%';
    canvasEl.style.height = '100%';
  }
  window.addEventListener('resize', resizeCanvasToView, {passive:true});

  // Boot-Meldungen
  BootLog.ok('UI ready (index v16.0.4)');
  </script>
</body>
</html>
