<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>City-Builder Mini — v16.1.13</title>

  <!-- =========================
       VERSION & BUILD INFO
       ========================= -->
  <meta name="app-version" content="16.1.13">

  <!-- Basis-Styles -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/mobile.css">
  <link rel="stylesheet" href="./css/ios.css">
  <link rel="stylesheet" href="./css/android.css">
  <link rel="stylesheet" href="./style.css">

  <!-- UI: Build-Menü Styles -->
  <link rel="stylesheet" href="./assets/ui/ui-build.css">

  <style>
    /* --- fester HUD-Layer für Tool-Buttons (nicht im Spiel-Canvas) --- */
    .hud-btn {
      position: fixed;
      z-index: 9999; /* über Canvas/Spiel */
      width: 56px; height: 56px;
      border-radius: 999px;
      border: none;
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
      background: #111; color: #fff;
      display: grid; place-items: center;
      font-size: 22px;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }
    #btnInspector { right: 12px; bottom: 12px; }
    #btnBuild     { left:  12px; bottom: 12px; }

    /* dezent, wenn disabled vor Start */
    .hud-btn[disabled] { opacity:.45 }

    /* Start-Fenster */
    #startScreen {
      position: fixed; inset: 0; z-index: 8000;
      display: grid; place-items: center;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(3px);
    }
    #startCard {
      width: min(560px, 92vw);
      background: #101214; color: #e6e6e6;
      border-radius: 12px; padding: 16px;
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
    }
    #startCard h1 { margin: 0 0 8px; font-size: 18px; }
    #startCard .row { display:flex; gap:8px; align-items:center; margin:6px 0; }
    #startCard select, #startCard button {
      height: 40px; border-radius: 8px; border: 1px solid #2a2f36;
      background:#161a1f; color:#e6e6e6; padding:0 10px;
    }
    #startCard button.primary { background:#2e7d32; border-color:#2e7d32; }
    #startCard .muted { opacity:.75; font-size:12px }

    /* Vollflächiger Inspector (wenn offen) */
    #inspectorPanel[open] {
      position: fixed; inset: 0; z-index: 12000;
      display:block;
      background:#0c0f12; color:#e6e6e6;
    }
    #inspectorPanel { display:none }
  </style>
</head>
<body>

  <!-- =========================
       SPIEL-CANVAS
       ========================= -->
  <canvas id="gameCanvas" aria-label="Spiel"></canvas>

  <!-- =========================
       START-SCREEN
       ========================= -->
  <section id="startScreen" aria-modal="true" role="dialog">
    <div id="startCard">
      <h1>City-Builder starten</h1>
      <div class="row">
        <label for="mapSelect">Karte:</label>
        <select id="mapSelect">
          <option value="./assets/maps/map-mini.json">map-mini.json</option>
          <option value="./assets/maps/map-pro.json">map-pro.json</option>
          <option value="./assets/maps/map-demo.json">map-demo.json</option>
          <option value="./assets/maps/map-test-all.json">map-test-all.json</option>
        </select>
      </div>
      <div class="row">
        <button id="btnStart" class="primary">Start</button>
        <button id="btnReset">Neu starten</button>
        <button id="btnClearCache">Cache leeren</button>
      </div>
      <div class="muted" id="startHint">v16.1.13 • tippe „Start“, dann wird die gewählte Karte geladen.</div>
    </div>
  </section>

  <!-- =========================
       INSPECTOR (vollflächig)
       ========================= -->
  <div id="inspectorPanel" hidden></div>

  <!-- =========================
       HUD BUTTONS
       ========================= -->
  <button id="btnBuild" class="hud-btn" title="Bau-Menü öffnen" disabled>🏗️</button>
  <button id="btnInspector" class="hud-btn" title="Inspector öffnen">🧰</button>

  <!-- =========================
       SCRIPTS (Reihenfolge!)
       ========================= -->
  <!-- Engine/Kern -->
  <script src="./boot.js"></script>
  <script src="./game.js"></script>

  <!-- Inspector (entwickler-HUD, immer verfügbar) -->
  <script src="./assets/inspector/inspector.js"></script>

  <!-- Build-UI (aktiviert sich nach Game-Start) -->
  <script src="./assets/ui/ui-build.js"></script>

  <script>
    // ===== Kleinster Log-Shim für UI/Inspector =====
    (function(){
      const q = (sel)=>document.querySelector(sel);
      const log = (lvl,msg)=>{
        // Inspector-Hook, falls vorhanden
        window.Inspector?.log?.(lvl, msg);
        // immer zusätzlich in die Konsole
        console[lvl === 'err' ? 'error' : (lvl==='warn'?'warn':'log')](`[${lvl}] ${msg}`);
      };

      // Versionen in den Log
      log('log', `✅ (ok) UI bereit (index v16.1.13)`);

      // ======= Start-Buttons =======
      const btnStart = q('#btnStart');
      const btnReset = q('#btnReset');
      const btnClear= q('#btnClearCache');
      const selMap  = q('#mapSelect');
      const startScreen = q('#startScreen');

      function requestStart() {
        const url = selMap.value;
        log('log', `✅ (ok) Start gedrückt → ${url}`);

        // Progress für Inspector/Log
        window.dispatchEvent(new CustomEvent('cb:start-progress', {detail:{percent:10, text:'Warte auf Engine …'}}));

        // Warten bis Engine GameLoader bereit meldet
        let waited = 0;
        const timer = setInterval(()=>{
          waited += 100;
          if (window.GameLoader?.start) {
            clearInterval(timer);
            window.dispatchEvent(new CustomEvent('cb:start-progress', {detail:{percent:40, text:'Engine bereit – initialisiere …'}}));
            try {
              window.GameLoader.start(url);
              window.dispatchEvent(new CustomEvent('cb:start-progress', {detail:{percent:60, text:'Starte Spiel …'}}));
              // Engine soll selbst „cb:game-started“ feuern; als Fallback tun wir es nach kurzer Zeit:
              setTimeout(()=>{
                window.dispatchEvent(new CustomEvent('cb:game-started'));
                window.dispatchEvent(new CustomEvent('cb:start-progress', {detail:{percent:90, text:'Karte laden …'}}));
                setTimeout(()=>{
                  window.dispatchEvent(new CustomEvent('cb:start-progress', {detail:{percent:100, text:'Spiel gestartet'}}));
                  log('log', `✅ (ok) Game gestartet`);
                  startScreen.style.display='none';
                }, 150);
              }, 150);
            } catch (e) {
              clearInterval(timer);
              log('err', `❌ (err) Start fehlgeschlagen: ${e?.message||e}`);
              window.dispatchEvent(new CustomEvent('cb:start-progress', {detail:{percent:0, text:'Fehler beim Start'}}));
            }
          } else if (waited >= 6000) {
            clearInterval(timer);
            log('err', `❌ (err) Timeout: Engine nicht bereit – game.js / Engine noch nicht initialisiert?`);
            window.dispatchEvent(new CustomEvent('cb:start-progress', {detail:{percent:0, text:'Fehler beim Start'}}));
          }
        },100);
      }

      btnStart.addEventListener('click', requestStart);
      btnReset.addEventListener('click', ()=>{ log('log', '✅ (ok) Neu-Start angefordert'); location.reload(); });
      btnClear.addEventListener('click', ()=>{
        try {
          localStorage?.clear?.(); sessionStorage?.clear?.();
          caches?.keys?.().then(keys=>Promise.all(keys.map(k=>caches.delete(k))));
          log('log', '✅ (ok) Cache/Storage geleert – Seite ggf. neu laden');
        } catch(e) {
          log('warn', '⚠️ (warn) Cache-Löschung ggf. unvollständig (Safari-iOS)');
        }
      });

      // Inspector öffnen/schließen
      const panel = q('#inspectorPanel');
      const btnInspector = q('#btnInspector');
      btnInspector.addEventListener('click', ()=>{
        panel.hidden = false;
        panel.setAttribute('open','');
        window.Inspector?.open?.();
      });

      // Bau-Menü Button (aktiviert sich nach Spielstart)
      const btnBuild = q('#btnBuild');
      btnBuild.addEventListener('click', ()=>{
        window.GameUI?.openBuildMenu?.() || window.dispatchEvent(new CustomEvent('cb:build-toggle'));
      });

      // Engine-Start-Signal -> Build-Button freischalten
      window.addEventListener('cb:game-started', ()=>{
        btnBuild.disabled = false;
      });
    })();
  </script>
</body>
</html>
