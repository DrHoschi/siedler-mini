<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!--
    Siedler-Mini — Start/Boot-Seite
    Version: v16.0.3 (Index)
    Ziel:
      - Game sauber starten, erst wenn game.js wirklich geladen ist
      - Deutliche Logs (OK/WARN/ERR), Kopieren, Leeren
      - Fallback-Hinweise, wenn GameLoader.start (noch) nicht vorhanden
      - Editor-Hook als Platzhalter
  -->

  <title>Siedler-Mini</title>

  <style>
    :root{
      --bg:#0f2012;           /* dunkles Grün */
      --panel:#101518;        /* UI-Panel-Hintergrund */
      --panel-2:#0b1013;
      --text:#e7f0ea;
      --text-dim:#a9b7ad;
      --brand:#2fe96b;        /* LED-Grün */
      --warn:#ffc042;
      --err:#ff6b6b;
      --ok:#7CFC90;
      --btn:#1c2a30;
      --btn-h:#1f333a;
      --ring: 0 0 0 2px rgba(47,233,107,.25), 0 8px 20px rgba(0,0,0,.35);
      --radius:16px;
      --radius-sm:12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body{
      height:100%;
      margin:0;
      background: radial-gradient(1200px 700px at 20% 0%, #17311d 0%, var(--bg) 60%, #0a140c 100%) fixed;
      color:var(--text);
      font-family:var(--sans);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* zartes Hintergrundbild (optional) – kann auch entfernt werden */
    .backdrop{
      position:fixed; inset:0;
      background:
        radial-gradient(1100px 700px at 70% 35%, rgba(255,255,255,.06), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.15));
      pointer-events:none;
      opacity:.95;
      transition:opacity .4s ease;
    }
    .backdrop.hidden{ opacity:0; }

    /* Container für Dialog */
    .boot-wrap{
      position:fixed; inset:0;
      display:grid; place-items:center;
      padding:24px;
    }

    .card{
      width:min(680px, calc(100vw - 32px));
      background:linear-gradient(180deg, var(--panel), var(--panel-2));
      border-radius:var(--radius);
      box-shadow:var(--ring);
      border:1px solid rgba(255,255,255,.06);
      overflow:hidden;
    }

    .card-head{
      display:flex; align-items:center; gap:12px;
      padding:20px 22px 8px;
      font-size:28px; font-weight:800; letter-spacing:.2px;
    }
    .led{
      width:14px; height:14px; border-radius:50%;
      background: radial-gradient(circle at 30% 35%, #fff, #bdf6d1 15%, var(--brand) 55%, #1ea74a 100%);
      box-shadow: 0 0 0 3px rgba(47,233,107,.18), 0 0 16px rgba(47,233,107,.45) inset;
      flex:0 0 14px;
    }

    .card-sub{
      color:var(--text-dim);
      padding:0 22px 10px;
      line-height:1.35;
    }
    .row{
      display:flex; gap:12px; align-items:center;
      padding:10px 22px 22px;
      flex-wrap:wrap;
    }

    .btn{
      appearance:none; border:0; cursor:pointer;
      background:var(--btn); color:var(--text);
      padding:14px 18px; border-radius:14px;
      font-weight:700;
      transition:transform .06s ease, background .12s ease, box-shadow .12s ease;
      box-shadow:inset 0 -1px 0 rgba(255,255,255,.05), 0 1px 0 rgba(0,0,0,.5);
      user-select:none;
    }
    .btn:hover{ background:var(--btn-h); }
    .btn:active{ transform:translateY(1px); }
    .btn.primary{ background:#2a5e3d; }
    .btn.primary:hover{ background:#2f6b45; }

    .muted{
      color:var(--text-dim);
      margin-left:auto; font-size:.9rem; padding-right:22px; padding-bottom:18px;
    }

    /* Log-Konsole (Toast-Leiste unten) */
    .logbar{
      position:fixed; left:12px; right:12px; bottom:12px;
      background: rgba(12,18,16,.78);
      border:1px solid rgba(255,255,255,.06);
      border-radius:var(--radius);
      backdrop-filter:saturate(120%) blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
      overflow:hidden;
    }
    .log-controls{
      display:flex; gap:12px; align-items:center;
      padding:14px 14px 8px 14px; flex-wrap:wrap;
    }
    .badge{
      display:inline-flex; align-items:center; justify-content:center;
      min-width:64px; height:42px; padding:0 14px;
      border-radius:12px; background:#0f1a16; color:#b6c6bd; font-weight:800;
      box-shadow: inset 0 -1px 0 rgba(255,255,255,.06);
    }
    .log-panel{
      max-height:min(32vh, 260px);
      overflow:auto; margin:8px 12px 14px;
      background:#0b130f; border:1px solid rgba(255,255,255,.06);
      border-radius:12px; padding:12px;
      font: 13px/1.45 var(--mono);
      color:#bfe9c9;
      white-space:pre-wrap;
    }
    .ok   { color:#9af7b3; }
    .warn { color:#ffd285; }
    .err  { color:#ff9e9e; }

    /* kleines Dialog für Alerts */
    dialog{
      border:0; padding:0; border-radius:14px;
      width:min(520px, calc(100vw - 32px));
      background:linear-gradient(180deg, var(--panel), var(--panel-2));
      color:var(--text);
      box-shadow: var(--ring);
    }
    dialog::backdrop{ background:rgba(0,0,0,.45); }
    .dlg-body{ padding:20px; }
    .dlg-actions{ display:flex; justify-content:flex-end; gap:12px; padding:0 20px 18px; }
  </style>
</head>

<body>

  <!-- dekorativer Hintergrund -->
  <div id="backdrop" class="backdrop"></div>

  <!-- Boot-UI -->
  <div class="boot-wrap">
    <div class="card" id="bootCard" aria-live="polite">
      <div class="card-head">
        <div class="led" aria-hidden="true"></div>
        <div>Siedler-Mini</div>
      </div>
      <div class="card-sub" id="subtitle">
        Neues Spiel starten? <span id="mapHint" style="opacity:.8">(Map: assets/maps/map-mini.json)</span>
      </div>
      <div class="row">
        <button class="btn primary" id="btnStart">Start</button>
        <button class="btn" id="btnEditor">Editor öffnen</button>
      </div>
      <div class="muted">v16.0.3</div>
    </div>
  </div>

  <!-- Log / Debug unten -->
  <div class="logbar">
    <div class="log-controls">
      <span class="badge" id="logCount">Log 0</span>
      <button class="btn" id="btnCopyLog">Log kopieren</button>
      <button class="btn" id="btnClearLog">Log leeren</button>
      <button class="btn" id="btnClearCache">Cache leeren</button>
    </div>
    <pre class="log-panel" id="logPanel" aria-live="polite"></pre>
  </div>

  <!-- kleiner Alert-Dialog -->
  <dialog id="alertDlg">
    <div class="dlg-body" id="alertText">Hinweis</div>
    <div class="dlg-actions">
      <button class="btn primary" id="alertClose">Schließen</button>
    </div>
  </dialog>

  <!-- ******************************************************************* -->
  <!--  Boot-Script (Index-Logik)                                          -->
  <!-- ******************************************************************* -->
  <script>
  (function(){
    'use strict';

    /* ------------------------------*
     * 1) Kleines Log-Framework
     * ------------------------------*/
    const logPanel = document.getElementById('logPanel');
    const logCountBadge = document.getElementById('logCount');
    let logCount = 0;
    const stamp = () => {
      const d = new Date();
      const pad = n => String(n).padStart(2,'0');
      return `[${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}]`;
    };
    function append(kind, msg){
      logCount++; logCountBadge.textContent = `Log ${logCount}`;
      const cls = kind==='ERR' ? 'err' : kind==='WARN' ? 'warn' : 'ok';
      logPanel.insertAdjacentHTML('beforeend', `${stamp()} <span class="${cls}">(${kind.toLowerCase()})</span> ${msg}\n`);
      logPanel.scrollTop = logPanel.scrollHeight;
    }
    const log = {
      ok:   (m)=>append('OK',   m),
      warn: (m)=>append('WARN', m),
      err:  (m)=>append('ERR',  m)
    };

    window.__INDEX_LOG__ = log; // optional: extern zugreifbar

    // Buttons: Kopieren / Leeren / Cache
    document.getElementById('btnCopyLog').addEventListener('click', async ()=>{
      try {
        await navigator.clipboard.writeText(logPanel.textContent || '');
        log.ok('Log in Zwischenablage');
      } catch(e){
        log.err('Kopieren fehlgeschlagen: ' + (e && e.message || e));
      }
    });
    document.getElementById('btnClearLog').addEventListener('click', ()=>{
      logPanel.textContent = ''; logCount=0; logCountBadge.textContent = 'Log 0';
    });
    document.getElementById('btnClearCache').addEventListener('click', async ()=>{
      try{
        // Service Worker & Cache API sauber leeren (sofern vorhanden)
        if ('caches' in window){
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        if ('serviceWorker' in navigator){
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        localStorage.clear(); sessionStorage.clear();
        log.ok('Cache/Storage geleert – Seite ggf. neu laden');
      }catch(e){
        log.warn('Cache leeren nicht vollständig möglich: ' + (e && e.message || e));
      }
    });

    // kleiner Alert-Helfer
    const alertDlg = document.getElementById('alertDlg');
    const alertText = document.getElementById('alertText');
    document.getElementById('alertClose').addEventListener('click', ()=>alertDlg.close());
    function showAlert(msg){
      alertText.textContent = msg;
      alertDlg.showModal();
    }

    /* ------------------------------*
     * 2) Lade-Überwachung für game.js
     * ------------------------------*/
    const VERSION = '16.0.3';
    const mapUrlDefault = 'assets/maps/map-mini.json';
    const btnStart = document.getElementById('btnStart');
    const btnEditor = document.getElementById('btnEditor');
    const subtitle = document.getElementById('subtitle');
    document.getElementById('mapHint').textContent = `(Map: ${mapUrlDefault})`;

    // Status melden
    log.ok(`UI ready (index v${VERSION})`);

    // game.js dynamisch laden (mit Cache-Buster)
    const scriptTag = document.createElement('script');
    scriptTag.src = `./game.js?v=${VERSION}`;
    scriptTag.defer = true;
    scriptTag.crossOrigin = 'anonymous';
    scriptTag.onload = ()=> {
      log.ok('game.js geladen');
      checkReady();   // nach onload direkt prüfen
    };
    scriptTag.onerror = ()=> {
      log.err('game.js konnte nicht geladen werden (Script-Error)');
      showAlert('Fehler beim Laden von game.js – bitte neu laden.');
    };
    document.head.appendChild(scriptTag);

    // Warten bis GameLoader.start verfügbar ist
    let readyTick = 0, readyTimer = null, readyFound = false;
    function checkReady(){
      readyFound = !!(window.GameLoader && typeof window.GameLoader.start === 'function');
      if (readyFound){
        btnStart.disabled = false;
        subtitle.innerHTML = `Neues Spiel starten? <span style="opacity:.8">(Map: ${mapUrlDefault})</span>`;
        if (readyTimer){ clearInterval(readyTimer); readyTimer=null; }
        return;
      }
      // max. 5s passiv warten, danach WARN ausgeben
      if (!readyTimer){
        readyTimer = setInterval(()=>{
          readyTick++;
          if (window.GameLoader && typeof window.GameLoader.start === 'function'){
            log.ok('GameLoader.start gefunden');
            btnStart.disabled = false;
            clearInterval(readyTimer); readyTimer = null; readyFound = true;
          } else if (readyTick === 5){
            log.warn('GameLoader.start nach 5s noch nicht verfügbar (Game initialisiert noch?).');
          } else if (readyTick > 12){ // ~12s – wir geben auf
            clearInterval(readyTimer); readyTimer=null;
            log.err('GameLoader.start nicht gefunden – Start deaktiviert.');
          }
        }, 1000);
      }
    }
    // Button zunächst deaktivieren bis ready
    btnStart.disabled = true;
    checkReady();

    /* ------------------------------*
     * 3) Start/Editor Buttons
     * ------------------------------*/
    btnStart.addEventListener('click', ()=>{
      if (!(window.GameLoader && typeof window.GameLoader.start === 'function')){
        log.err('GameLoader.start ist nicht verfügbar – game.js noch nicht initialisiert?');
        showAlert('Fehler beim Start: GameLoader.start ist nicht verfügbar (siehe Log).');
        return;
      }
      // Boot-Dialog ausblenden
      document.getElementById('bootCard').style.display = 'none';
      document.getElementById('backdrop').classList.add('hidden');

      // Canvas erstellen/finden
      let canvas = document.getElementById('gameCanvas');
      if (!canvas){
        canvas = document.createElement('canvas');
        canvas.id = 'gameCanvas';
        canvas.width = Math.floor(window.innerWidth * (window.devicePixelRatio||1));
        canvas.height = Math.floor(window.innerHeight * (window.devicePixelRatio||1));
        canvas.style.position = 'fixed';
        canvas.style.inset = '0';
        canvas.style.width = '100vw';
        canvas.style.height = '100vh';
        document.body.appendChild(canvas);
      }

      // Start aufrufen (mit Logs)
      try{
        log.ok(`GameLoader.start ${mapUrlDefault}`);
        window.GameLoader.start({
          canvas,
          mapUrl: `./${mapUrlDefault}`,
          onReady: ()=>log.ok('Game started')
        });
      }catch(e){
        log.err('Start-Fehler: ' + (e && e.message || e));
        showAlert('Fehler beim Start (Details im Log).');
      }
    });

    btnEditor.addEventListener('click', ()=>{
      // Platzhalter: Hier verkabeln wir später den Level-Editor
      log.ok('Editor öffnen (Hook – später verknüpfen)');
      showAlert('Editor-Start ist hier noch ein Platzhalter.');
    });

    /* ------------------------------*
     * 4) Resize: Canvas skaliert mit
     * ------------------------------*/
    window.addEventListener('resize', ()=>{
      const cvs = document.getElementById('gameCanvas');
      if (!cvs) return;
      const dpr = window.devicePixelRatio || 1;
      cvs.width  = Math.floor(window.innerWidth  * dpr);
      cvs.height = Math.floor(window.innerHeight * dpr);
      cvs.style.width = '100vw';
      cvs.style.height = '100vh';
    }, {passive:true});

  })();
  </script>
</body>
</html>
