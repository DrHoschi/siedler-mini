  <!-- Fallback-Inspector-Knopf (wird von inspector.js ersetzt) -->
  <button id="inspectorToggle" style="position:fixed;right:.5rem;bottom:.5rem;z-index:9999">Inspector</button>

  <!-- Diagnose-Overlay -->
  <div id="diagBadge" class="ok" hidden>
    <h3>Diagnose</h3>
    <pre id="diagLog">…</pre>
  </div>

  <!-- 0) Service-Worker + Caches deaktivieren (außer ?keep-sw) -->
  <script>
  (function(){
    // Diagnose-Funktionen
    var log = [];
    function note(s){ try{ log.push(s); }catch(e){} }
    window.__DIAG_NOTE__ = note;
    window.onerror = function(m,src,ln,col,err){ note("JS-Error: "+m+" @ "+(src||'')+":"+ln+":"+col); showDiagSoon(); };
    window.addEventListener('unhandledrejection', function(e){ note("Promise-Rejection: "+(e.reason && (e.reason.stack||e.reason.message) || e.reason)); showDiagSoon(); });

    function showDiagNow(){
      var el=document.getElementById('diagBadge'), pre=document.getElementById('diagLog');
      if(!el||!pre) return;
      el.hidden=false; el.classList.remove('ok');
      var checks=[];
      checks.push("URL: "+location.href);
      checks.push("keep-sw: "+location.search.includes('keep-sw'));
      checks.push("GameLoader: "+(!!window.GameLoader));
      checks.push("Game: "+(!!window.Game));
      checks.push("GameUI: "+(!!window.GameUI));
      checks.push("Inspector: "+(typeof window.CBInspectorReady!=='undefined' || !!document.querySelector('[data-inspector-ready]')));
      pre.textContent = (log.join("\n") + "\n" + checks.join("\n")).trim();
    }
    var showTimer=null;
    function showDiagSoon(){ if(showTimer) return; showTimer=setTimeout(showDiagNow, 300); }

    // SW killen, damit neue Dateien ziehen
    if ('serviceWorker' in navigator && !location.search.includes('keep-sw')) {
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ r.unregister(); });
        if (window.caches && caches.keys) {
          caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); });
        }
        note("SW: unregistered + caches cleared");
      }).catch(function(e){ note("SW-err: "+e); });
    }

    // Diagnose: wenn Engine/Spiel nicht in 2500ms pingt -> Overlay zeigen
    var okPing=false;
    function okMark(){ okPing=true; }
    window.addEventListener('cb:engine-ready', okMark, {once:true});
    window.addEventListener('cb:game-started', okMark, {once:true});
    setTimeout(function(){ if(!okPing){ note("Timeout: keine Engine/Game-Events"); showDiagNow(); } }, 2500);
  })();
  </script>
