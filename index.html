<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Siedler Mini – v16.1.14</title>

  <!--
    ─────────────────────────────────────────────────────────────────────────
    SIEDLER MINI – INDEX (v16.1.14)
    WICHTIG:
    • Diese Datei stellt das Start-Overlay, die Logik zum Spielstart,
      den Inspector-FAB (unten rechts), den Build-FAB (unten links) und
      die zentrale Log-Funktion bereit.
    • Reihenfolge der Skripte:
        1) game.js      → Engine / GameLoader (kann durch echte Engine ersetzt werden)
        2) inspector.js → Entwicklungs-Inspector (toggelbar)
    • Cache-Buster: setze ?v=16.1.14 an eigene Skripte, damit Safari/GitHub nicht hängen bleibt.
    • Events:
        - window.dispatchEvent(new CustomEvent('cb:game-started')) wenn Spiel läuft
        - Inspector hört auf 'cb:log' und 'cb:flush-log'
    ─────────────────────────────────────────────────────────────────────────
  -->

  <style>
    /* Grundlayout */
    html,body { margin:0; padding:0; height:100%; background:#0a0a0a; color:#e7e7e7; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #app { position:relative; height:100%; overflow:hidden; }

    /* Canvas Placeholder */
    #game-canvas { display:block; width:100%; height:100%; background:#113c28; }

    /* Start-Overlay */
    .start-overlay {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(10,10,10,0.92); z-index:20;
    }
    .start-card {
      width:min(640px, 92vw); max-height:90vh; overflow:auto;
      background:#181a1b; border:1px solid #2b2f31; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.5);
      padding:16px 16px 8px 16px;
    }
    .start-card h1 { margin:4px 0 8px; font-size:18px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .row + .row { margin-top:10px; }
    select, button {
      background:#222629; color:#e7e7e7; border:1px solid #343a3e; border-radius:10px;
      padding:10px 12px; font-size:15px;
    }
    button { cursor:pointer; }
    button.primary { background:#2e6f40; border-color:#3a8d55; }
    button.warn { background:#3a2d12; border-color:#7b5a20; }
    button.ghost { background:transparent; border-color:#343a3e; }
    .hint { font-size:12px; opacity:.8; }

    /* Floating Buttons (immer sichtbar) */
    .fab {
      position:absolute; width:48px; height:48px; border-radius:24px;
      display:flex; align-items:center; justify-content:center;
      background:#1f2326; border:1px solid #2f363a; color:#e7e7e7;
      box-shadow:0 6px 16px rgba(0,0,0,0.35); z-index:25; cursor:pointer; user-select:none;
    }
    .fab:hover { filter:brightness(1.05); }
    #btn-inspector { right:16px; bottom:16px; }
    #btn-build     { left:16px;  bottom:16px; display:none; } /* wird nach Spielstart eingeblendet */

    /* Toast oben/unten (hier nur Platzhalter, Inspector übernimmt Logs) */
    #toast { position:absolute; left:0; right:0; top:0; display:none; z-index:30; }

    /* Kleinere Geräte */
    @media (max-width: 600px) {
      .start-card { width:94vw; }
    }
  </style>
</head>
<body>
  <div id="app" data-version="16.1.14">
    <!-- Spiel-Fläche -->
    <canvas id="game-canvas" width="16" height="16" aria-label="Game Canvas"></canvas>

    <!-- Start-Overlay (Spiel starten / Karte wählen / Cache leeren) -->
    <div id="overlay" class="start-overlay" aria-modal="true" role="dialog">
      <div class="start-card">
        <h1>City-Builder starten <span class="hint">(index v16.1.14)</span></h1>

        <div class="row">
          <label for="map" style="min-width:140px">Karte:</label>
          <select id="map">
            <option value="./assets/maps/map-mini.json">map-mini.json</option>
            <option value="./assets/maps/map-pro.json">map-pro.json</option>
            <option value="./assets/maps/map-demo.json">map-demo.json</option>
            <option value="./assets/maps/map-test-all.json">map-test-all.json</option>
          </select>
          <button id="btn-start" class="primary">✅ Start</button>
          <button id="btn-reset" class="warn">♻️ Neu-Start</button>
          <button id="btn-copylog" class="ghost">📋 Log kopieren</button>
        </div>

        <div class="row">
          <button id="btn-clear-cache" title="LocalStorage + Caches löschen">🧹 Cache-Booster</button>
          <span class="hint">Löscht Storage & Caches (hilft gegen Safari/GitHub-Cache).</span>
        </div>
      </div>
    </div>

    <!-- Floating Action Buttons -->
    <button id="btn-inspector" class="fab" title="Inspector öffnen">🛠️</button>
    <button id="btn-build" class="fab" title="Bau-Menü öffnen">🏗️</button>

    <!-- Toast-Container (Platzhalter) -->
    <div id="toast"></div>
  </div>

  <!-- Skripte MIT Cache-Buster -->
  <script src="./game.js?v=16.1.14" defer></script>
  <script src="./assets/inspector/inspector.js?v=16.1.14" defer></script>

  <script>
  // ─────────────────────────────────────────────────────────────────────────
  // ZENTRALES LOGGING (v16.1.14)
  // • window.Log(type, msg)     → schreibt in Console + Inspector
  // • window.Log.ok/warn/err    → Helfer
  // • Puffer bis Inspector bereit ist
  // ─────────────────────────────────────────────────────────────────────────
  (function(){
    const buffer = [];
    let inspectorReady = false;

    function emitToInspector(record) {
      window.dispatchEvent(new CustomEvent('cb:log', { detail: record }));
    }

    function stamp() {
      const d = new Date();
      const pad = n => String(n).padStart(2,'0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function baseLog(type, msg) {
      const rec = { tstamp: stamp(), type, msg };
      // Konsole
      const tag = (type==='err'?'❌':type==='warn'?'⚠️':'✅');
      if (type==='err') console.error(`[${rec.tstamp}] ${tag} ${msg}`);
      else if (type==='warn') console.warn(`[${rec.tstamp}] ${tag} ${msg}`);
      else console.log(`[${rec.tstamp}] ${tag} ${msg}`);
      // Inspector (puffern bis bereit)
      if (inspectorReady) emitToInspector(rec); else buffer.push(rec);
      return rec;
    }

    window.Log = Object.assign(baseLog, {
      ok:  (m)=>baseLog('ok', m),
      warn:(m)=>baseLog('warn', m),
      err: (m)=>baseLog('err', m),
      flush: () => {
        buffer.splice(0).forEach(emitToInspector);
        window.dispatchEvent(new CustomEvent('cb:flush-log'));
      }
    });

    // Inspector signalisiert readiness
    window.addEventListener('inspector:ready', () => {
      inspectorReady = true;
      Log.ok(`Inspector bereit (inspector.js meldet v${window.GameInspector?.version ?? 'unbekannt'})`);
      window.Log.flush();
    });
  })();

  // ─────────────────────────────────────────────────────────────────────────
  // UI VERDRAHTUNG: Start-Overlay, Inspector-FAB, Build-FAB (v16.1.14)
  // ─────────────────────────────────────────────────────────────────────────
  (function(){
    const q = sel => document.querySelector(sel);
    const overlay   = q('#overlay');
    const btnStart  = q('#btn-start');
    const btnReset  = q('#btn-reset');
    const btnCopy   = q('#btn-copylog');
    const btnCache  = q('#btn-clear-cache');
    const selMap    = q('#map');
    const btnInsp   = q('#btn-inspector');
    const btnBuild  = q('#btn-build');

    const INDEX_VERSION = document.getElementById('app').dataset.version;

    // UI ready
    Log.ok(`UI bereit (index v${INDEX_VERSION})`);

    // Inspector FAB
    btnInsp.addEventListener('click', () => {
      if (window.GameInspector?.toggle) {
        window.GameInspector.toggle(true);
      } else {
        Log.warn('Inspector ist (noch) nicht eingebunden – window.GameInspector.toggle() fehlt.');
      }
    });

    // Build FAB (wird nach Game-Start eingeblendet)
    btnBuild.addEventListener('click', () => {
      if (window.GameUI?.openBuildMenu) {
        window.GameUI.openBuildMenu();
      } else {
        Log.warn('Bau-Menü ist (noch) nicht eingebunden – window.GameUI.openBuildMenu() fehlt.');
      }
    });

    // Start klick
    btnStart.addEventListener('click', () => {
      const map = selMap.value;
      Log.ok(`Start gedrückt → ${map}`);
      tryStart(map);
    });

    // Neu-Start
    btnReset.addEventListener('click', () => {
      Log.ok('Neu-Start angefordert');
      showOverlay(true);
      // Option: Engine zurücksetzen, falls vorhanden
      if (window.GameLoader?.reset) {
        try { window.GameLoader.reset(); } catch(e){}
      }
    });

    // Log kopieren
    btnCopy.addEventListener('click', async () => {
      try {
        const text = await window.GameInspector?.getLogText?.() ?? '(kein Text verfügbar – Inspector nicht bereit)';
        await navigator.clipboard.writeText(text);
        Log.ok('Log in Zwischenablage');
      } catch (e) {
        Log.err('Kopieren fehlgeschlagen (Clipboard API?)');
      }
    });

    // Cache-Booster
    btnCache.addEventListener('click', async () => {
      try {
        localStorage.clear(); sessionStorage.clear();
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        Log.ok('Cache/Storage geleert – Seite ggf. neu laden');
      } catch (e) {
        Log.warn('Cache-Booster: konnte nicht alles löschen.');
      }
    });

    // Spiel-startet → Overlay aus, Build-FAB an
    window.addEventListener('cb:game-started', () => {
      Log.ok('Event: cb:game-started empfangen');
      showOverlay(false);
      btnBuild.style.display = 'flex';
    });

    function showOverlay(show) {
      overlay.style.display = show ? 'flex' : 'none';
    }

    // Warten bis GameLoader.start verfügbar ist und dann starten
    async function tryStart(mapPath) {
      const MAX_MS = 5000, STEP = 200;
      const t0 = performance.now();
      while (!(window.GameLoader && typeof window.GameLoader.start === 'function')) {
        const dt = performance.now() - t0;
        if (dt > MAX_MS) {
          Log.err('GameLoader.start ist nicht verfügbar – game.js / Engine noch nicht initialisiert?');
          return;
        }
        Log.warn('Engine noch nicht bereit – warte auf GameLoader.start …');
        await new Promise(r => setTimeout(r, STEP));
      }
      try {
        Log.ok(`GameLoader.start ${mapPath}`);
        await window.GameLoader.start(mapPath);
        // Falls Engine selbst kein Event sendet, senden wir hier
        window.dispatchEvent(new CustomEvent('cb:game-started'));
      } catch (e) {
        Log.err(`Start fehlgeschlagen: ${e?.message ?? e}`);
      }
    }
  })();
  </script>
</body>
</html>
