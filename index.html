<!doctype html>
<html lang="de">
<head>
  <!-- =========================================================
       Projekt: City-Builder (Dev UI + Debug Panel)
       Datei:   index.html
       Version: v16.0.6
       Zweck:   Start-UI, Debug-Log, Inspector-Panel
       Autor:   (du + Assistent)
       Hinweis:
       - game.js wird mit defer geladen (sichert Lade-Reihenfolge).
       - Der Start-Button wird erst aktiviert, wenn game.js signalisiert,
         dass GameLoader bereit ist.
       ========================================================= -->

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>City Builder — v16.0.6</title>

  <style>
    /* ----------- Reset / Basics ----------- */
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #2f6f3a; /* grüner Dev-Hintergrund */
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #0b1c10;
    }

    /* ----------- UI Layer oben ---------- */
    .ui {
      position: fixed; inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      pointer-events: none; /* Elemente gezielt aktivieren */
    }

    .topbar {
      pointer-events: auto;
      background: rgba(245, 248, 250, 0.92);
      border-bottom: 1px solid #dbe5ea;
      padding: 10px 12px;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }

    .btn {
      appearance: none; border: 1px solid #b8c7cf; border-radius: 6px;
      background: #fff;
      padding: 8px 12px; cursor: pointer;
      font-weight: 600;
    }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

    .badge {
      font: 12px/1 monospace; padding: 4px 6px; border-radius: 4px;
      background: #eef5ff; color: #0b3d91; border: 1px solid #cfe2ff;
    }

    /* ----------- Log Panel ---------- */
    .log {
      pointer-events: auto;
      position: fixed; right: 12px; bottom: 12px;
      width: min(680px, 92vw); max-height: 48vh;
      background: rgba(255,255,255,0.95);
      border: 1px solid #dbe5ea; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      display: flex; flex-direction: column;
      overflow: hidden;
      backdrop-filter: saturate(1.2) blur(2px);
    }
    .log header {
      padding: 8px 10px; display: flex; align-items: center; gap: 8px;
      background: #f6fafc; border-bottom: 1px solid #e8f0f4;
    }
    .log header h3 { margin: 0; font-size: 13px; letter-spacing: .02em; color: #084c2e; }
    .log .tools { margin-left: auto; display: flex; gap: 6px; }
    .log pre {
      margin: 0; padding: 10px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap; overflow: auto; flex: 1; background: #fff;
    }

    .pill { padding: 4px 8px; border-radius: 999px; border: 1px solid #d0e3d7; background: #eff9f3; color: #0a5a36; font-weight: 700; }

    /* ----------- Start Overlay ---------- */
    .start-overlay {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.88));
      pointer-events: auto;
    }
    .start-card {
      width: min(520px, 92vw);
      background: #ffffff;
      border: 1px solid #dbe5ea; border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.16);
      padding: 18px;
      display: grid; gap: 12px;
    }
    .start-card h1 { margin: 0; font-size: 20px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .hint { font-size: 12px; color: #345; opacity: .85; }

    /* Canvas Platzhalter (das eigentliche Canvas legt game.js an) */
    #game-root { position: absolute; inset: 0; }
  </style>
</head>
<body>

  <!-- Haupt-Container, hier hängt das Spiel/Canvas dran -->
  <div id="game-root" role="main" aria-label="Game Root"></div>

  <!-- UI Layer -->
  <div class="ui" aria-hidden="false">

    <!-- Topbar / Controls -->
    <div class="topbar">
      <span class="badge" id="verBadge">index.html v16.0.6</span>
      <button class="btn" id="btnStart" disabled>🎮 Start</button>
      <div class="row">
        <button class="btn" id="btnCopyLog">📋 Log kopieren</button>
        <button class="btn" id="btnClearCache">🧹 Cache leeren</button>
        <button class="btn" id="btnInspector">🛠️ Inspector</button>
      </div>
    </div>

    <!-- Debug Log Panel -->
    <aside class="log" id="logPanel">
      <header>
        <h3>Debug-Log</h3>
        <span class="pill" id="envPill">✅ live</span>
        <div class="tools">
          <button class="btn" id="btnLogClear">🗑️</button>
          <button class="btn" id="btnLogHide">🙈</button>
        </div>
      </header>
      <pre id="logOut" aria-live="polite"></pre>
    </aside>

    <!-- Start-Overlay (verschwindet beim Start) -->
    <div class="start-overlay" id="startOverlay">
      <div class="start-card">
        <h1>City Builder — Dev Start</h1>
        <div class="hint">Wähle <code>map-mini.json</code> oder nutze Standard.</div>
        <div class="row">
          <select class="btn" id="mapSelect" style="min-width:220px">
            <option value="./assets/maps/map-mini.json">map-mini.json</option>
            <option value="./assets/maps/map-pro.json">map-pro.json</option>
            <option value="./assets/maps/map-demo.json">map-demo.json</option>
            <option value="./assets/maps/map-test-all.json">map-test-all.json</option>
          </select>
          <button class="btn" id="btnOverlayStart" disabled>🎮 Start mit Auswahl</button>
        </div>
        <div class="hint" id="startHint">⌛ Warte auf game.js…</div>
      </div>
    </div>

  </div>

  <!-- game.js (defer = erst nach HTML geparst) -->
  <script defer src="./game.js" data-version="16.0.6"></script>

  <!-- Boot-/UI-Script -->
  <script>
    (function(){
      // --------------------------- Versions + Log ---------------------------
      const INDEX_VERSION = "16.0.6";
      const logEl = document.getElementById('logOut');
      const startBtn = document.getElementById('btnStart');
      const overlay = document.getElementById('startOverlay');
      const overlayStartBtn = document.getElementById('btnOverlayStart');
      const startHint = document.getElementById('startHint');
      const mapSelect = document.getElementById('mapSelect');

      const ICON = { ok:"✅", warn:"⚠️", err:"❌", info:"ℹ️" };
      const logBuf = [];

      function now() {
        const d = new Date();
        return d.toTimeString().split(' ')[0];
      }
      function write(line) {
        logBuf.push(line);
        logEl.textContent = logBuf.join("\n");
        logEl.scrollTop = logEl.scrollHeight;
      }
      function log(level, msg) {
        const icon = ICON[level] || ICON.info;
        write(`[${now()}] ${icon} (${level}) ${msg}`);
      }

      // Initial UI-Log
      log("ok", `UI ready (index v${INDEX_VERSION})`);

      // --------------------------- Clipboard copy ---------------------------
      async function copyLog() {
        const text = logBuf.join("\n");
        try {
          await navigator.clipboard.writeText(text);
          log("ok", "Log in Zwischenablage");
        } catch(e) {
          // Fallback (unsichtbares Textarea)
          const ta = document.createElement("textarea");
          ta.value = text; document.body.appendChild(ta);
          ta.select(); document.execCommand("copy"); ta.remove();
          log("ok", "Log in Zwischenablage (Fallback)");
        }
      }

      // --------------------------- Cache/Storage wipe -----------------------
      async function clearCacheAndStorage() {
        try {
          // Cache Storage
          if (window.caches) {
            const names = await caches.keys();
            for (const n of names) await caches.delete(n);
          }
          // Local/Session
          localStorage.clear();
          sessionStorage.clear();
          // (optional) Service Worker Hinweis
          if (navigator.serviceWorker?.controller) {
            navigator.serviceWorker.controller.postMessage({type:"SW_CLEAR_HINT"});
          }
          log("ok", "Cache/Storage geleert – Seite ggf. neu laden");
        } catch(err) {
          log("err", `Cache leeren fehlgeschlagen: ${err.message||err}`);
        }
      }

      // --------------------------- Buttons binden ---------------------------
      document.getElementById('btnCopyLog').addEventListener('click', copyLog);
      document.getElementById('btnLogClear').addEventListener('click', () => { logBuf.length = 0; logEl.textContent = ""; });
      document.getElementById('btnLogHide').addEventListener('click', () => { document.getElementById('logPanel').style.display = 'none'; });
      document.getElementById('btnClearCache').addEventListener('click', clearCacheAndStorage);

      document.getElementById('btnInspector').addEventListener('click', () => {
        window.dispatchEvent(new CustomEvent('inspector:toggle'));
      });

      // --------------------------- Start Handling ---------------------------
      let gameReady = false;
      let startArmed = false;

      function armStartButtons(enable) {
        startBtn.disabled = !enable;
        overlayStartBtn.disabled = !enable;
        startArmed = enable;
        startHint.textContent = enable ? "Bereit. Du kannst starten." : "⌛ Warte auf game.js…";
      }

      // Versuch: nach 5s warnen, wenn GameLoader nicht da
      setTimeout(() => {
        if (!gameReady) {
          log("warn", "GameLoader.start nach 5s noch nicht verfügbar (Game initialisiert noch?).");
        }
      }, 5000);

      // Clicks
      function handleStartClick(mapPath) {
        if (!startArmed || !window.GameLoader || typeof window.GameLoader.start !== "function") {
          // Nur EIN Fehler pro Klickserie loggen (nicht spammen)
          log("err", "GameLoader.start ist nicht verfügbar – game.js noch nicht initialisiert?");
          return;
        }
        overlay.style.display = "none";
        log("ok", `GameLoader.start ${mapPath}`);
        try {
          window.GameLoader.start(mapPath);
          log("ok", "Game started");
        } catch(err) {
          log("err", `Start fehlgeschlagen: ${err.message||err}`);
        }
      }

      startBtn.addEventListener('click', () => handleStartClick("./assets/maps/map-mini.json"));
      overlayStartBtn.addEventListener('click', () => handleStartClick(mapSelect.value));

      // --------------------------- game.js Hooks ----------------------------
      // game.js feuert dieses Event, wenn GameLoader verfügbar ist
      window.addEventListener('game:ready', (ev) => {
        gameReady = true;
        const v = ev?.detail?.gameVersion || "unknown";
        log("ok", `game.js geladen (v${v})`);
        armStartButtons(true);
      });

      // Failsafe: falls game.js schon geladen war, bevor Listener hing
      if (window.GameLoader && typeof window.GameLoader.start === "function") {
        gameReady = true;
        log("ok", "game.js bereits geladen (late bind)");
        armStartButtons(true);
      }
    })();
  </script>
</body>
</html>
