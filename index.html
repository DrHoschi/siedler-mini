<!doctype html>
<html lang="de">
<head>
  <!--
    Projekt: City Builder (Dev UI)
    Datei: index.html
    Version: v16.0.8
    Zweck: Start-/Debug-UI, lädt game.js mit Cache-Buster und zeigt Log.
    Hinweise:
    - Bitte Version hier und in game.js immer synchron erhöhen.
    - Editor/Inspector sind optional; falls nicht eingebunden, bleiben Buttons inaktiv.
  -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Expires" content="0" />
  <title>City Builder — Dev UI v16.0.8</title>

  <style>
    :root{
      --bg:#0f172a;         /* slate-900 */
      --panel:#111827cc;    /* semi dark */
      --text:#e5e7eb;       /* gray-200 */
      --muted:#9ca3af;
      --ok:#16a34a;         /* green-600 */
      --warn:#f59e0b;       /* amber-500 */
      --err:#ef4444;        /* red-500 */
      --btn:#374151;        /* gray-700 */
      --btnH:#4b5563;
      --accent:#60a5fa;     /* blue-400 */
    }
    html,body{height:100%}
    body{
      margin:0;background:linear-gradient(120deg,#0b1223,#0f172a);
      color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      display:flex;flex-direction:column;
    }
    header{
      padding:12px 16px;background:#0b1223;border-bottom:1px solid #1f2937;
      display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    }
    header .title{font-weight:700;letter-spacing:.2px}
    header .ver{color:var(--muted)}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    button{
      appearance:none;border:1px solid #1f2937;border-radius:8px;
      background:var(--btn);color:var(--text);padding:8px 12px;
      cursor:pointer;font-weight:600
    }
    button:hover{background:var(--btnH)}
    button.primary{background:var(--accent);border-color:#60a5fa;color:#071428}
    button.primary:disabled{opacity:.5;cursor:not-allowed}
    main{display:grid;grid-template-columns:360px 1fr;gap:12px;padding:12px;flex:1;min-height:0}
    .panel{
      background:var(--panel);backdrop-filter:blur(8px);border:1px solid #1f2937;border-radius:12px;padding:12px;min-height:0
    }
    .panel h3{margin:.2rem 0 .8rem 0;font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
    #log{height:50vh;min-height:220px;overflow:auto;background:#0b1223;border-radius:8px;padding:8px;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;line-height:1.35}
    .line{white-space:pre}
    .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)}
    .controls{display:flex;gap:8px;flex-wrap:wrap}
    canvas{width:100%;height:100%;display:block;background:#114d2b}
    .hint{color:var(--muted);font-size:12px}
    @media (max-width: 900px){ main{grid-template-columns:1fr} #log{height:35vh} }
  </style>

  <script>
    // ---- Build/Version Info (vom Index aus sichtbar) ------------------------
    window.__BUILD__ = {
      indexVersion: "v16.0.8",
      startedAt: new Date().toISOString()
    };

    // ---- Mini Log-Framework --------------------------------------------------
    (function(){
      const sub = [];
      const bus = {
        emit(type, msg){
          const t = new Date();
          const hh = String(t.getHours()).padStart(2,'0');
          const mm = String(t.getMinutes()).padStart(2,'0');
          const ss = String(t.getSeconds()).padStart(2,'0');
          const ts = `[${hh}:${mm}:${ss}]`;
          let icon = "ℹ️", cls = "";
          if(type==="ok"){ icon="✅"; cls="ok"; }
          else if(type==="warn"){ icon="⚠️"; cls="warn"; }
          else if(type==="err"){ icon="❌"; cls="err"; }
          const text = `${ts} ${icon} (${type}) ${msg}`;
          sub.forEach(fn=>fn(text, cls));
          try { console[type==="err"?"error":type==="warn"?"warn":"log"](text); } catch(e){}
          (window.__LOG__ = window.__LOG__ || []).push(text);
        },
        on(fn){ sub.push(fn); }
      };
      window.__bus = bus;
    })();

    // ---- DOM Ready -----------------------------------------------------------
    document.addEventListener("DOMContentLoaded", () => {
      const logEl = document.getElementById("log");
      const btnStart = document.getElementById("btnStart");
      const btnCopy  = document.getElementById("btnCopy");
      const btnClear = document.getElementById("btnClear");
      const btnEditor= document.getElementById("btnEditor");
      const btnInsp  = document.getElementById("btnInspector");
      const mapSel   = document.getElementById("mapSel");

      // Log subscribe
      __bus.on((text, cls)=>{
        const d = document.createElement("div");
        d.className = `line ${cls||""}`;
        d.textContent = text;
        logEl.appendChild(d);
        logEl.scrollTop = logEl.scrollHeight;
      });

      __bus.emit("ok", `UI ready (index ${window.__BUILD__.indexVersion})`);

      // Buttons
      btnCopy.addEventListener("click", async ()=>{
        const all = (window.__LOG__||[]).join("\n");
        try {
          await navigator.clipboard.writeText(all);
          __bus.emit("ok", "Log in Zwischenablage");
        } catch(e){
          __bus.emit("err", "Clipboard-API fehlgeschlagen");
        }
      });

      btnClear.addEventListener("click", async ()=>{
        try {
          // local/session + SW cache best effort
          localStorage.clear(); sessionStorage.clear();
          if('caches' in window){
            const names = await caches.keys();
            await Promise.all(names.map(n=>caches.delete(n)));
          }
          __bus.emit("ok", "Cache/Storage geleert – Seite ggf. neu laden");
        } catch(e){
          __bus.emit("warn", "Cache leeren teilweise fehlgeschlagen");
        }
      });

      // Start Handler (wartet auf GameLoader.start)
      let starting = false;
      btnStart.addEventListener("click", async ()=>{
        if(starting) return;
        starting = true; btnStart.disabled = true;

        const want = mapSel.value || "./assets/maps/map-mini.json";
        __bus.emit("ok", `Start gedrückt → ${want}`);

        const awaitStart = async (timeoutMs=8000)=>{
          const t0 = performance.now();
          while(performance.now()-t0 < timeoutMs){
            if(window.GameLoader && typeof window.GameLoader.start === "function"){
              return window.GameLoader.start;
            }
            await new Promise(r=>setTimeout(r,100));
          }
          return null;
        };

        const startFn = await awaitStart();
        if(!startFn){
          __bus.emit("err", "GameLoader.start ist nicht verfügbar – game.js noch nicht initialisiert?");
          btnStart.disabled = false; starting = false; return;
        }
        try{
          __bus.emit("ok", `GameLoader.start ${want}`);
          await startFn(want);
          __bus.emit("ok", "Game started");
        }catch(err){
          __bus.emit("err", "Start fehlgeschlagen: " + (err?.message||err));
        }finally{
          btnStart.disabled = false; starting = false;
        }
      });

      // Editor/Inspector Buttons – optional
      btnEditor.addEventListener("click", ()=>{
        if(window.GameEditor && typeof window.GameEditor.open === "function"){
          window.GameEditor.open();
        } else {
          __bus.emit("warn","Editor ist (noch) nicht eingebunden – window.GameEditor.open() fehlt.");
        }
      });
      btnInsp.addEventListener("click", ()=>{
        if(window.GameInspector && typeof window.GameInspector.toggle === "function"){
          window.GameInspector.toggle();
        } else {
          __bus.emit("warn","Inspector ist (noch) nicht eingebunden – window.GameInspector.toggle() fehlt.");
        }
      });
    });
  </script>

  <!-- game.js mit Version-Query (Cache-Booster) -->
  <script src="./game.js?v=16.0.8" defer></script>
</head>
<body>
  <header>
    <div class="title">City Builder — Dev UI</div>
    <div class="ver">Index <strong>v16.0.8</strong></div>
    <div class="row" style="margin-left:auto">
      <button id="btnEditor" title="Editor öffnen">🛠️ Editor</button>
      <button id="btnInspector" title="Inspector umschalten">🔎 Inspector</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <h3>Aktionen</h3>
      <div class="controls">
        <select id="mapSel" title="Map wählen">
          <option value="./assets/maps/map-mini.json">map-mini.json</option>
          <option value="./assets/maps/map-demo.json">map-demo.json</option>
          <option value="./assets/maps/map-test-all.json">map-test-all.json</option>
          <option value="./assets/maps/map-pro.json">map-pro.json</option>
        </select>
        <button id="btnStart" class="primary">▶️ Start</button>
        <button id="btnCopy">📋 Log kopieren</button>
        <button id="btnClear">🧹 Cache leeren</button>
      </div>
      <p class="hint" style="margin-top:8px">
        Tipp: Wenn Versionen nicht aktualisieren, erst „🧹 Cache leeren“ und Seite neu laden.
      </p>

      <h3>Log</h3>
      <div id="log" aria-live="polite"></div>
    </div>

    <div class="panel" style="display:grid;grid-template-rows:auto 1fr;gap:8px;">
      <h3>Spiel</h3>
      <!-- Dein Canvas wird von game.js erzeugt/angepasst; dieses Element ist nur Fallback -->
      <canvas id="gameCanvas" width="1024" height="640"></canvas>
    </div>
  </main>
</body>
</html>
