<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2419" />
  <title>Mini – v16.1.19</title>

  <!-- Basis-Styles (deine bestehenden Dateien – UNVERÄNDERT lassen) -->
  <link rel="preload" href="./css/base.css" as="style" />
  <link rel="preload" href="./style.css" as="style" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Kleine Zusatz-Styles nur für die Schwebe-Buttons & Build-Dock (Layout des Start-Panels bleibt unberührt) -->
  <style>
    /* === Floating Buttons === */
    .cb-fab{
      position:fixed; z-index:9000; width:56px; height:56px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:rgba(20,20,20,.7); color:#fff; user-select:none; cursor:pointer;
      border:1px solid rgba(255,255,255,.12); box-shadow:0 6px 16px rgba(0,0,0,.35);
      -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
      transition:transform .15s ease, opacity .15s ease;
    }
    .cb-fab:active{ transform:scale(.96); }
    #btn-build{ left:12px; bottom:12px; opacity:0; pointer-events:none; }
    #btn-build.visible{ opacity:1; pointer-events:auto; }
    #btn-inspector{ right:12px; bottom:12px; } /* dein bestehender Inspector-Button (Icon bleibt) */

    /* === Bau-Menü Dock (wird von ui-build.js bestückt) === */
    #build-dock{
      position:fixed; left:0; right:0; bottom:0; z-index:8000; display:none;
      padding:10px 12px; background:rgba(18,18,18,.85);
      -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
      border-top:1px solid rgba(255,255,255,.08);
    }
    #build-dock.open{ display:block; }
    #build-dock .row{ display:flex; gap:10px; overflow:auto; }
    #build-dock .tool{
      min-width:90px; height:64px; border-radius:14px; border:1px solid rgba(255,255,255,.12);
      background:#0e1f18; color:#cfe6d8; display:flex; align-items:center; justify-content:center;
      padding:6px 10px; font-weight:600; white-space:nowrap;
    }
    #build-dock .tool.active{ outline:2px solid #4dd186; background:#153a2c; }
    #build-dock .tool img{ height:40px; object-fit:contain; pointer-events:none; }
  </style>
</head>

<body>
  <!-- === Start-Panel: DEINS; bitte so lassen. Nur die ID ist wichtig. === -->
  <div id="start-panel" aria-label="City-Builder Start">
    <!-- Dein existierendes Start-HTML bleibt hier 1:1 stehen (Karte wählen, Start, Neu-Start, Log kopieren, Cache-Booster, Hinweis …). -->
  </div>

  <!-- === Game-Canvas (deins) === -->
  <canvas id="game" width="0" height="0"></canvas>

  <!-- === Floating Buttons === -->
  <button id="btn-inspector" class="cb-fab" title="Inspector">🛠️</button>
  <button id="btn-build" class="cb-fab" title="Bau-Menü">🏗️</button>

  <!-- === Bau-Menü Dock (UI) – Inhalt füllt ui-build.js === -->
  <div id="build-dock" aria-label="Bau-Menü"></div>

  <!-- ===================== SCRIPTS (Reihenfolge ist wichtig!) ===================== -->

  <!-- 1) Inspector (dein vorhandener Pfad) -->
  <script src="./assets/inspector/inspector.js"></script>

  <!-- 2) Engine/Game (stellt GameLoader bereit) -->
  <script src="./game.js"></script>

  <!-- 3) Bau-Menü + Bridge (UI API) -->
  <script src="./assets/ui/ui-build.js"></script>
  <script src="./assets/ui/ui-bridge.js"></script>

  <!-- 4) Start/Boot-Logik: Verdrahtet Start-Buttons und wartet sauber auf GameLoader -->
  <script src="./main.js"></script>

  <!-- 5) Index-Version ins Log + Event (damit du im Log die Index-Version siehst) -->
  <script>
    (function(){
      const v="v16.1.19";
      window.__cb=window.__cb||{}; window.__cb.indexVersion=v;
      (window.CBLog?.ok||console.log)(`UI bereit (index ${v})`);
      window.dispatchEvent(new CustomEvent('cb:ui-ready',{detail:{v}}));
    })();
  </script>
</body>
</html>
