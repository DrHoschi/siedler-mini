<!doctype html>
<!--
  Neue Siedler – Index
  Version: v17.3.2
  CODE_STYLE:
    - ?v= Versionsanhang
    - Reihenfolge: Core → PF/Carriers → UI-Bridge → UI (Start/Build) → Inspector → Boot
    - Keine Altlasten (render.js NICHT mehr einbinden)
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0d">
  <title>Neue Siedler</title>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css?v=17.3.2">
  <link rel="stylesheet" href="ui-start.css?v=17.3.2">
  <link rel="stylesheet" href="assets/ui/ui-build.css?v=17.3.2">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    html, body { height:100%; margin:0; background:#0c120f; }
    #game { display:block; width:100vw; height:100vh; touch-action:none; }

    .ui-fab { position:fixed; z-index:100000; pointer-events:auto; user-select:none; }
    #btn-build { left:16px; bottom:16px; }
    #btn-inspector { right:16px; bottom:16px; }
    .ui-fab button{
      width:52px; height:52px; border-radius:50%; border:none;
      background:rgba(30,30,30,.92); color:#fff; font-size:22px;
      box-shadow:0 10px 28px rgba(0,0,0,.35); backdrop-filter:blur(6px);
      cursor:pointer;
    }
    body.has-build-open #btn-build,
    body.has-build-open #btn-inspector { bottom:240px; }
  </style>
</head>
<body>

  <!-- Bühne -->
  <canvas id="game" data-map="assets/maps/map-mini.json" aria-label="Spielfeld"></canvas>

  <!-- FABs -->
  <div id="btn-build" class="ui-fab" title="Bau-Menü öffnen/schließen">
    <button type="button" aria-label="Bau-Menü" onclick="try{GameUI?.toggleBuild();}catch(_){console.warn('[ui] Build-Toggle nicht verfügbar');}">🧱</button>
  </div>
  <div id="btn-inspector" class="ui-fab" title="Inspector öffnen/schließen">
    <button type="button" aria-label="Inspector" onclick="try{GameUI?.toggleInspector();}catch(_){console.warn('[ui] Inspector-Toggle nicht verfügbar');}">🛠</button>
  </div>

  <!-- Core -->
  <script src="assets/core/core.env.js?v=17.3.2"></script>
  <script src="assets/core/core.entities.js?v=17.3.2"></script>
  <script src="assets/core/core.render.js?v=17.3.2"></script>
  <script src="assets/core/core.production.js?v=17.3.2"></script>
  <script src="assets/core/core.pfglue.js?v=17.3.2"></script>
  <script src="assets/core/core.map.js?v=17.3.2"></script>
  <script src="assets/core/core.input.js?v=17.3.2"></script>
  <script src="assets/core/carriers.js?v=17.3.2"></script>
  <script src="assets/core/game.bootstrap.js?v=17.3.2"></script>

  <!-- Legacy-Fassade (falls noch genutzt) -->
  <script defer src="game.js?v=17.3.2"></script>
  <script defer src="core/pathfinder.js?v=16.5.0"></script>

  <!-- UI -->
  <script defer src="assets/ui/ui-bridge.js?v=17.3.2"></script>
  <script defer src="assets/ui/ui-start.js?v=17.3.2"></script>
  <script defer src="assets/ui/ui-build.js?v=17.3.2"></script>

  <!-- Inspector (Kombi Core+Tabs) -->
  <script defer src="assets/inspector/inspector.js?v=17.3.2"></script>

  <!-- Boot-Compat (nur Fallback, kein Doppelstart) -->
  <script defer src="boot.compat.js?v=17.3.2"></script>

  <!-- SW optional -->
  <script>
    (function(){
      if ('serviceWorker' in navigator){
        var keep = location.search.includes('keep-sw=1');
        if (keep){
          navigator.serviceWorker.register('sw.js?v=17.3.2').catch(e=>console.warn('[sw] reg fail:', e?.message));
        } else {
          navigator.serviceWorker.getRegistrations?.().then(list=>list.forEach(r=>r.unregister()));
        }
      }
      window.__cb = window.__cb||{}; window.__cb.indexVersion="v17.3.2";
      window.addEventListener('cb:build-open', ()=>document.body.classList.add('has-build-open'));
      window.addEventListener('cb:build-close', ()=>document.body.classList.remove('has-build-open'));
      console.log('UI bereit (index v17.3.2)');
    })();
  </script>
</body>
</html>
