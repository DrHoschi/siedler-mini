<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <title>CityBuilder v16.1.1</title>

  <!-- ===== Design / Grundlayout ===== -->
  <style>
    :root {
      --bg: #0e221a;
      --panel: #152d23c0;
      --text: #b7f7c6;
      --muted: #7cc598;
      --ok: #6ef19a;
      --warn: #ffd166;
      --err: #ff6b6b;
      --btn: #223a2e;
      --btn-hi: #2b4a3b;
      --radius: 14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(50% 50% at 50% 35%, #143424 0%, #0e221a 60%, #0a1b14 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #topbar {
      position: fixed; inset: 0 0 auto 0; height: 42px;
      display: flex; align-items: center; gap: 8px; padding: 6px 10px;
      background: linear-gradient(0deg, transparent, #0f2019aa);
      z-index: 30;
    }
    .chip {
      background: var(--panel); padding: 4px 10px; border-radius: 999px; font-size: 13px;
      border: 1px solid #1f3a2f; box-shadow: 0 0 0 1px #0a1611 inset;
    }
    .btn {
      background: var(--btn); border: 1px solid #244033;
      padding: 8px 12px; border-radius: var(--radius); color: var(--text);
      cursor: pointer; user-select: none;
    }
    .btn:hover { background: var(--btn-hi); }
    #logpanel {
      position: fixed; left: 12px; right: 12px; top: 56px; max-height: 46vh; overflow: auto;
      border-radius: var(--radius); background: var(--panel);
      border: 1px solid #1f3a2f; box-shadow: 0 8px 32px rgba(0,0,0,.25);
      padding: 12px; z-index: 25;
      font-family: var(--mono); font-size: 14px; line-height: 1.5;
      backdrop-filter: blur(6px);
    }
    #logpanel h3 { margin: 0 0 8px 0; font-weight: 700; letter-spacing: .2px; }
    #logtxt { white-space: pre-wrap; color: var(--text); }
    .logline.ok   { color: var(--ok); }
    .logline.warn { color: var(--warn); }
    .logline.err  { color: var(--err); }

    /* Spielfläche */
    #gamewrap {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
    }
    #game {
      display: block; max-width: 100%; max-height: 100%;
      image-rendering: pixelated; background: transparent;
    }

    /* Bau-Menü (unten andockend, per Button ein/aus) */
    #buildbar {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 10px; background: linear-gradient(0deg, #0f2019f0, #0f201900);
      z-index: 40; display: none;
    }
    #buildbar .grid {
      display: grid; gap: 10px; grid-template-columns: repeat(6, minmax(0,1fr));
      background: var(--panel); border: 1px solid #1f3a2f; border-radius: var(--radius); padding: 10px;
    }
    .tool {
      display: grid; place-items: center; gap: 6px; padding: 10px 6px;
      background: #0f241c; border: 1px solid #244033; border-radius: 10px;
      font-size: 13px; text-align: center; cursor: pointer;
    }
    .tool:active { transform: translateY(1px); }
    .tool .icon { font-size: 20px; }
    @media (orientation: portrait) {
      #logpanel { max-height: 38vh; }
      #buildbar .grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
    /* Schwebe-Log ein-/aus */
    .hidden { display: none !important; }
  </style>

  <!-- App-Versionsflag für Log -->
  <script>
    window.APP_VERSION = "v16.1.1";
  </script>
</head>
<body>
  <!-- Top-Bar -->
  <div id="topbar">
    <span class="chip">CityBuilder <strong id="badgeVer">v16.1.1</strong></span>
    <span class="chip" id="chipViewport">Viewport: -</span>
    <div style="flex:1"></div>
    <button class="btn" id="btnToggleLog">📜 Log</button>
    <button class="btn" id="btnClearCache">🧹 Cache</button>
    <button class="btn" id="btnInspector">🧪 Inspector</button>
    <button class="btn" id="btnEditor">📝 Editor</button>
    <button class="btn" id="btnBuild">🏗️ Bauen</button>
  </div>

  <!-- Logpanel -->
  <div id="logpanel">
    <h3>Log</h3>
    <div id="logtxt"></div>
    <div style="margin-top:8px; display:flex; gap:8px;">
      <button class="btn" id="btnCopy">Log kopieren</button>
      <button class="btn" id="btnClear">Log leeren</button>
    </div>
  </div>

  <!-- Spiel-Canvas -->
  <div id="gamewrap">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>

  <!-- Bau-Menü -->
  <div id="buildbar" aria-label="Bauen (v16.1.1)">
    <div class="grid">
      <div class="tool" data-tool="road"><div class="icon">🛣️</div>Straße</div>
      <div class="tool" data-tool="path"><div class="icon">🥾</div>Weg</div>
      <div class="tool" data-tool="bulldoze"><div class="icon">🔧</div>Abreißen</div>
      <div class="tool" data-tool="house"><div class="icon">🏠</div>Haus</div>
      <div class="tool" data-tool="factory"><div class="icon">🏭</div>Fabrik</div>
      <div class="tool" data-tool="cancel"><div class="icon">⛔</div>Abbrechen</div>
    </div>
  </div>

  <!-- ===== App-Skripte (Reihenfolge!) =====
       - ui-build.js: dein Bau-Menü
       - boot.js, game.js: deine eigentliche App
       - overlay-hooks.js: Add-on, das PathOverlay initialisiert und in Update/Render einhängt
  -->
  <script type="module" src="./ui-build.js"></script>
  <script type="module" src="./boot.js"></script>
  <script type="module" src="./game.js"></script>
  <script type="module" src="./core/overlay-hooks.js"></script>

  <!-- ===== Kleinzeug für Log/Bedienung ===== -->
  <script>
    const logEl = document.getElementById('logtxt');
    const vpEl  = document.getElementById('chipViewport');

    function log(kind, msg) {
      const icon = kind === 'ok' ? '✅' : kind === 'warn' ? '⚠️' : '❌';
      const cls  = kind === 'ok' ? 'ok' : kind === 'warn' ? 'warn' : 'err';
      const t = new Date().toTimeString().slice(0,8);
      const line = document.createElement('div');
      line.className = `logline ${cls}`;
      line.textContent = `[${t}] ${icon} (${kind}) ${msg}`;
      logEl.appendChild(line);
      logEl.parentElement.scrollTop = logEl.parentElement.scrollHeight;
      try { console[kind==='err'?'error':kind==='warn'?'warn':'log'](msg); } catch {}
    }
    window.__UILog = log;

    // UI boot
    (function uiInit(){
      document.getElementById('badgeVer').textContent = window.APP_VERSION;
      const dpr = Math.round(window.devicePixelRatio || 1);
      vpEl.textContent = `Viewport: ${window.innerWidth}x${window.innerHeight} dpr:${dpr}`;
      __UILog('ok', `UI ready (index ${window.APP_VERSION})`);
      // Buttons
      const panel = document.getElementById('logpanel');
      document.getElementById('btnToggleLog').onclick = () => panel.classList.toggle('hidden');
      document.getElementById('btnClear').onclick = () => { logEl.innerHTML = ''; };
      document.getElementById('btnCopy').onclick = async () => {
        const text = [...logEl.children].map(n=>n.textContent).join('\n');
        await navigator.clipboard.writeText(text);
        __UILog('ok','Log in Zwischenablage');
      };
      document.getElementById('btnClearCache').onclick = async () => {
        try {
          localStorage.clear();
          if ('caches' in window) { const keys = await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
          __UILog('ok','Cache/Storage geleert – Seite ggf. neu laden');
        } catch (e) {
          __UILog('warn','Cache-Leeren nicht vollständig verfügbar');
        }
      };
      document.getElementById('btnInspector').onclick = () => {
        if (window.GameInspector?.toggle) window.GameInspector.toggle();
        else __UILog('warn','Inspector ist (noch) nicht eingebunden – window.GameInspector.toggle() fehlt.');
      };
      document.getElementById('btnEditor').onclick = () => {
        if (window.GameEditor?.open) window.GameEditor.open();
        else __UILog('warn','Editor ist (noch) nicht eingebunden – window.GameEditor.open() fehlt.');
      };
      // Bau-Menü togglen
      const build = document.getElementById('buildbar');
      document.getElementById('btnBuild').onclick = () => {
        const s = build.style.display;
        build.style.display = (s === 'none' || !s) ? 'block' : 'none';
        __UILog('ok', s === 'none' || !s ? 'Bau-Menü geöffnet' : 'Bau-Menü geschlossen');
      };
      // Tools -> an Game weiterreichen
      build.addEventListener('click', e => {
        const t = e.target.closest('.tool');
        if (!t) return;
        const tool = t.dataset.tool;
        window.GameUI?.setTool?.(tool);
        __UILog('ok', `Tool gesetzt: ${tool}`);
      });
    })();
  </script>
</body>
</html>
