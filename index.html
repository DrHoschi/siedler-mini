<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>City Builder</title>

  <!-- Basis-Styles (deine bestehenden) -->
  <link rel="preload" href="./css/base.css" as="style" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./style.css" />

  <!-- UI-Startpanel & Buttons (kleines Inline-CSS, nur das Nötigste) -->
  <style>
    :root { --uiVer: "v16.1.8"; }
    .cb-fab { position: fixed; z-index: 60; width: 56px; height: 56px; border-radius: 50%;
      display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.35); }
    #cbBtnInspector { right: 16px; bottom: 16px; background:#1f2937; color:#fff; border:1px solid #0008; }
    #cbBtnBuild { left: 16px; bottom: 16px; background:#1f2937; color:#fff; border:1px solid #0008; display:none; }
    #cbStartPanel {
      position: fixed; inset: auto 0 0 0; /* mobil: unten andocken */
      margin: auto; max-width: 720px; transform: translateY(-10%);
      background:#0d1117; color:#e5e7eb; border-radius:16px; padding:18px 16px; z-index: 50;
      border:1px solid #0008; box-shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    @media (min-width: 700px) {
      #cbStartPanel { inset: 0; height: max-content; padding:22px 20px; }
    }
    .cb-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .cb-badge { font: 12px/1.8 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color:#cbd5e1; background:#111827; border:1px solid #0008; border-radius:10px; padding:2px 8px; }
    .cb-title { font: 20px/1.4 ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin:2px 0 8px; }
    .cb-input, .cb-btn {
      height: 44px; border-radius: 12px; border:1px solid #1118; background:#0b1220; color:#e5e7eb;
      padding:0 12px; font: 16px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .cb-input { flex:1 1 360px; }
    .cb-btn { display:inline-flex; align-items:center; gap:10px; cursor:pointer; }
    .cb-btn.primary { background:#16a34a; border-color:#065f46; }
    .cb-btn.warn    { background:#eab308; color:#1f2937; border-color:#92400e; }
    .cb-btn.ghost   { background:#111827; }
    .cb-help { opacity:.7; margin-top:8px; font-size: 14px; }
    /* kleiner Log-Slot unter dem Startpanel */
    #cbStartLog { margin-top:10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; }
    /* Platzhalter Canvas (dein Game-Canvas liegt in game.js) */
    #gameCanvas { position: fixed; inset: 0; width:100%; height:100%; display:block; background:#08260f; }
  </style>
</head>

<body>
  <!-- Spiel-Fläche -->
  <canvas id="gameCanvas"></canvas>

  <!-- Startpanel (verschwindet nach erfolgreichem Start) -->
  <section id="cbStartPanel" aria-live="polite">
    <div class="cb-row" style="justify-content:space-between; align-items:flex-end">
      <div>
        <div class="cb-title">City Builder · Start (<span class="cb-badge">index <span id="cbIndexVer">v16.1.8</span></span>)</div>
        <div class="cb-row" style="margin:6px 0 12px">
          <span class="cb-badge">game.js: <span id="cbGameVer">unbekannt</span></span>
          <span class="cb-badge">dpr: <span id="cbDpr">?</span></span>
        </div>
      </div>
    </div>

    <div class="cb-row" style="margin:6px 0 10px">
      <select id="cbMapSelect" class="cb-input" aria-label="Karte auswählen">
        <option value="./assets/maps/map-mini.json">map-mini.json (16×10)</option>
        <option value="./assets/maps/map-pro.json">map-pro.json (20×12)</option>
      </select>
      <button id="cbBtnStart" class="cb-btn primary">▶ Start</button>
      <button id="cbBtnHardReset" class="cb-btn warn">🗑 Neu-Start</button>
    </div>

    <div class="cb-row" style="margin:6px 0 10px">
      <button id="cbBtnCache" class="cb-btn ghost">🧹 Cache-Booster</button>
      <button id="cbBtnCopyLog" class="cb-btn ghost">📋 Log kopieren</button>
    </div>

    <div id="cbStartLog" aria-live="polite"></div>
    <div class="cb-help">Hinweis: Nach „Start“ verschwindet dieses Fenster automatisch.</div>
  </section>

  <!-- Inspector-Button (immer sichtbar, unten rechts) -->
  <button id="cbBtnInspector" class="cb-fab" title="Inspector öffnen/schließen">🛠</button>

  <!-- Bau-Menü-Button (links unten, erst nach Spielstart sichtbar) -->
  <button id="cbBtnBuild" class="cb-fab" title="Bau-Menü öffnen">🏗</button>

  <!-- ===== Engine / Module laden =====
       WICHTIG: game.js zuerst laden, damit GameLoader.start verfügbar wird.
       Danach Inspector & UI-Module. Alle sind 'defer', damit DOM steht. -->
  <script defer src="./game.js"></script>
  <script defer src="./assets/inspector/inspector.js"></script>
  <script defer src="./assets/ui/ui-build.js"></script>

  <!-- ===== Index-Controller (Start-Flow & Bridges) ===== -->
  <script>
  // -----------------------------------------
  //  Mini-Logger → leitet in den Inspector um
  // -----------------------------------------
  (function(){
    const q = (sel)=>document.querySelector(sel);
    const startLog = q('#cbStartLog');
    const push = (level, msg)=>{
      const time = new Date().toTimeString().slice(0,8);
      const line = `[${time}] ${level} ${msg}`;
      console[level==='❌ (err)'?'error':level==='⚠️ (warn)'?'warn':'log'](line);
      // im Startpanel zeigen
      if (startLog) startLog.textContent = line;
      // an Inspector broadcasten
      window.dispatchEvent(new CustomEvent('cb:log', { detail:{ level, msg, time }}));
    };
    window.CB_LOG = push;
  })();

  // -----------------------------------------
  //  Globale UI-Bridge (nur das nötigste)
  // -----------------------------------------
  window.GameUI = window.GameUI || {
    version: 'index v16.1.8',
    // wird von game.js aufgerufen ODER durch unser Fallback:
    onGameStarted(){
      try {
        document.querySelector('#cbStartPanel')?.remove();
        document.querySelector('#cbBtnBuild').style.display = 'flex';
      } catch(e){}
    },
    openBuildMenu(){
      // Hook in dein UI-Baumodul
      if (window.openBuildMenu) return window.openBuildMenu();
      CB_LOG('⚠️ (warn)', 'Bau-Menü ist (noch) nicht eingebunden – window.openBuildMenu() fehlt.');
    }
  };

  // -----------------------------------------
  //  Start-Flow
  // -----------------------------------------
  (function(){
    const $ = (s)=>document.querySelector(s);
    const btnStart = $('#cbBtnStart');
    const btnReset = $('#cbBtnHardReset');
    const btnCache = $('#cbBtnCache');
    const btnCopy  = $('#cbBtnCopyLog');
    const selMap   = $('#cbMapSelect');
    const dprEl    = $('#cbDpr');
    const gameVer  = $('#cbGameVer');

    // kleine Diagnose
    dprEl.textContent = window.devicePixelRatio || 1;
    CB_LOG('✅ (ok)', 'UI bereit ('+document.querySelector('#cbIndexVer').textContent+')');

    // Cache-Booster
    btnCache.addEventListener('click', async ()=>{
      try{
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        localStorage.clear(); sessionStorage.clear();
        CB_LOG('✅ (ok)', 'Cache/Storage geleert – Seite ggf. neu laden');
      }catch(e){
        CB_LOG('⚠️ (warn)', 'Cache-Booster: '+e.message);
      }
    });

    // Log kopieren (holt Text aus dem Inspector)
    btnCopy.addEventListener('click', async ()=>{
      try{
        const text = await (window.CB_EXPORT_LOG ? window.CB_EXPORT_LOG() : Promise.resolve('Inspector-Log nicht verfügbar.'));
        await navigator.clipboard.writeText(text);
        CB_LOG('✅ (ok)', 'Log in Zwischenablage');
      }catch(e){
        CB_LOG('⚠️ (warn)', 'Konnte Log nicht kopieren: '+e.message);
      }
    });

    // Harte Seite neu laden
    btnReset.addEventListener('click', ()=>{ CB_LOG('✅ (ok)','Neu-Start angefordert'); location.reload(); });

    // Start: warte bis GameLoader.start existiert, dann ausführen
    btnStart.addEventListener('click', ()=>{
      const mapUrl = selMap.value;
      CB_LOG('✅ (ok)', 'Start gedrückt → ' + mapUrl);

      let tries = 0;
      const t = setInterval(()=>{
        tries++;
        const fn = window.GameLoader && window.GameLoader.start;
        const ready = typeof fn === 'function';
        if (!ready) {
          if (tries === 1) CB_LOG('⚠️ (warn)', 'Engine noch nicht bereit – warte auf GameLoader.start …');
          if (tries > 200) { // ~20s Timeout
            clearInterval(t);
            CB_LOG('❌ (err)', 'GameLoader.start ist nicht verfügbar – game.js noch nicht initialisiert?');
          }
          return;
        }
        clearInterval(t);
        // Optionale Versionsabfrage, falls game.js eine Version exportiert
        try { if (window.Game && window.Game.version) gameVer.textContent = window.Game.version; } catch(e){}
        // Start versuchen:
        try {
          fn(mapUrl);
          CB_LOG('✅ (ok)', 'Game gestartet');
          // 1) empfohlenes Event für alle Listener
          window.dispatchEvent(new CustomEvent('cb:game-started'));
          // 2) kompatibel zu deiner UI-Bridge
          window.GameUI?.onGameStarted?.();
        } catch(e) {
          CB_LOG('❌ (err)', 'Start fehlgeschlagen: ' + (e && e.message ? e.message : e));
        }
      }, 100);
    });
  })();

  // -----------------------------------------
  //  Floating Buttons (Inspector & Build)
  // -----------------------------------------
  (function(){
    const btnInspector = document.querySelector('#cbBtnInspector');
    const btnBuild     = document.querySelector('#cbBtnBuild');

    btnInspector.addEventListener('click', ()=>{
      window.GameInspector?.toggle?.(); // im Inspector definiert
    });

    btnBuild.addEventListener('click', ()=>{
      window.GameUI.openBuildMenu();
    });

    // Falls game.js das Event selbst feuert:
    window.addEventListener('cb:game-started', ()=>{
      document.querySelector('#cbBtnBuild').style.display = 'flex';
    });
  })();
  </script>
</body>
</html>
