<!doctype html>
<html lang="de">
<head>
  <!-- =========================================================================
       Datei   : index.html (Root)
       Projekt : Neue Siedler
       Version : v1.0.3 (2025-09-28)
       Zweck   : Einstiegspunkt – Canvas + UI (Startfenster zuerst sichtbar)
       Hinweise:
         - CSS-Reihenfolge: ui.css (Basis) → Feature-CSS
         - Keine Autostarts: Spielbeginn nur per Button im Startpanel
  ========================================================================= -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neue Siedler – Epoche 1</title>

  <!-- ===== CSS: Basis + Komponenten ===== -->
  <link rel="stylesheet" href="ui/css/ui.css">
  <link rel="stylesheet" href="ui/css/ui-start.css">
  <link rel="stylesheet" href="ui/css/ui-hud.css">
  <link rel="stylesheet" href="ui/css/ui-build.css">
  <link rel="stylesheet" href="ui/css/ui-dialog.css">
  <link rel="stylesheet" href="ui/css/ui-tooltip.css">
  <link rel="stylesheet" href="ui/css/inspector.css">

  <!-- (Optional) globale Theme-Variablen -->
  <style>
    :root { --bg:#1e1e1e; --fg:#f0f0f0; --accent:#4da3ff; }
    html,body {
      margin:0; padding:0;
      background:var(--bg); color:var(--fg);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }
  </style>
</head>

<body>
  <!-- =========================================================================
       APP-CONTAINER
       Struktur:
         (A) Canvas (Spielfeld)
         (B) Start-Hintergrund + Startpanel
         (C) HUD (Ressourcen)
         (D) Build-Dock + Build-Button links unten
         (E) Inspector
  ========================================================================= -->
  <div id="app">

    <!-- (A) Canvas – Spielwelt. Größe wird per CSS/DPR skaliert -->
    <canvas
      id="game"
      width="1280"
      height="720"
      data-map="data/maps/map-mini.json">
    </canvas>

    <!-- (B1) Start-Hintergrund unter dem Panel, über Canvas -->
    <div id="bg-start"></div>

    <!-- (B2) Startpanel – Holz/Papier (helle Variante) -->
    <div id="start-panel" class="ui-panel ui-panel--light visible" aria-label="Startpanel">
      <h1>Neue Siedler</h1>
      <div class="actions">
        <button id="btn-new"        class="btn main">Neues Spiel</button>
        <button id="btn-continue"   class="btn ghost">Weiterspielen</button>
        <button id="btn-fullscreen" class="btn">Vollbild</button>
        <button id="btn-reset"      class="btn">Reset</button>
        <button id="btn-inspector"  class="btn">Inspector</button>
      </div>
    </div>

    <!-- (C) HUD – Ressourcenanzeige (dunkel) -->
    <div id="hud-top" class="ui-panel ui-panel--dark hidden" aria-label="Ressourcen-HUD"></div>

    <!-- (D1) Build-Dock – unten andocken (dunkel) -->
    <div id="build-dock" class="ui-panel ui-panel--dark hidden" aria-label="Baumenü-Dock"></div>

    <!-- (D2) Build-Button – links unten; öffnet/schließt das Dock -->
    <button id="btn-build-toggle" class="btn main"
            style="position:fixed; left:12px; bottom:12px; z-index:960;"
            aria-controls="build-dock" aria-expanded="false">
      Bauen
    </button>

    <!-- (E) Inspector – rechts (dunkel) -->
    <div id="inspector" class="ui-panel ui-panel--dark hidden" aria-label="Inspector"></div>
  </div>

  <!-- =========================================================================
       SCRIPTS – Reihenfolge: Core → UI → Tools
  ========================================================================= -->
  <!-- Core -->
  <script src="core/asset.js"></script>
  <script src="core/registry.js"></script>
  <script src="core/map-runtime.js"></script>
  <script src="core/unit-runtime.js"></script>
  <script src="core/game.js"></script>
  <script src="core/boot.js"></script>

  <!-- UI -->
  <script src="ui/ui-start.js"></script>
  <script src="ui/ui-hud.js"></script>
  <script src="ui/ui-build.js"></script>

  <!-- Inspector -->
  <script>window.ICONS = window.ICONS || {}; /* optional: ICONS.wood/.stone/.gold */</script>
  <script src="ui/inspector/inspector.core.js"></script>

  <!-- Debug / Tools -->
  <script src="tools/debug-tools.js"></script>

  <!-- =========================================================================
       Inline-Wiring – kleine, lokale Verknüpfungen
         • Inspector-Toggle
         • Fullscreen
         • Build-Button → cb:build:open/close
  ========================================================================= -->
  <script>
    // Inspector ein/aus
    document.getElementById('btn-inspector').addEventListener('click', () => {
      const insp = document.getElementById('inspector');
      insp.classList.toggle('hidden');
      window.dispatchEvent(new CustomEvent('req:inspector:toggle'));
    });

    // Vollbild umschalten
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });

    // Build-Button unten links → Dock öffnen/schließen
    (function(){
      const btn  = document.getElementById('btn-build-toggle');
      const dock = document.getElementById('build-dock');
      if (!btn || !dock) return;

      function openDock(){
        window.dispatchEvent(new CustomEvent('cb:build:open', { detail:{ from:'button' } }));
        btn.setAttribute('aria-expanded', 'true');
      }
      function closeDock(){
        window.dispatchEvent(new CustomEvent('cb:build:close', { detail:{ from:'button' } }));
        btn.setAttribute('aria-expanded', 'false');
      }

      btn.addEventListener('click', () => {
        const isHidden = dock.hasAttribute('hidden');
        (isHidden ? openDock : closeDock)();
      });

      // Wenn woanders geschlossen wird (ESC/Platzieren), ARIA syncen
      window.addEventListener('cb:build:close', () => btn.setAttribute('aria-expanded','false'));
      window.addEventListener('cb:build:open',  () => btn.setAttribute('aria-expanded','true'));
    })();
  </script>
</body>
</html>
