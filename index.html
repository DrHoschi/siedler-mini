<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CityBuilder • Start (v16.1.11)</title>

  <!-- Basis-Styles deines Projekts -->
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- UI-Build (deine Buttons/Startfenster etc.) – belassen wie gehabt -->
  <link rel="stylesheet" href="./assets/ui/ui-build.css" />

  <!-- (Optional) Plattform-/Geräte-Styles, falls vorhanden -->
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/platform.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
  <link rel="stylesheet" href="./css/ios.css" />
  <link rel="stylesheet" href="./css/android.css" />
  <link rel="stylesheet" href="./css/desktop.css" />
</head>
<body>

  <!--
    Start-Fenster & Spiel-Fläche:
    Deine vorhandenen UIs erzeugst du wie bisher in deinen JS-Dateien (ui-build.js etc.).
    Hier im HTML muss nichts Neues rein.
  -->

  <!-- Kern-Skripte deiner App – Reihenfolge wie gehabt -->
  <script defer src="./app-v11.1r6.js"></script>
  <script defer src="./boot.js"></script>
  <script defer src="./game.js"></script>
  <script defer src="./render.js"></script>
  <script defer src="./input.js"></script>
  <script defer src="./world.js"></script>
  <script defer src="./textures.js"></script>
  <script defer src="./unitLogic.js"></script>
  <script defer src="./ui-build.js"></script>
  <script defer src="./main.js"></script>

  <!-- Inspector: immer laden, Button rechts-unten anzeigen lassen -->
  <script
    defer
    src="./assets/inspector/inspector.js?v=16.1.11"
    onload="window.GameInspector?.mount?.({version:'16.1.11'})">
  </script>

  <!-- Fallback: Falls defer/onload in sehr altem Browser ausfällt -->
  <script>
    // v16.1.11 – Inspector-Fallback-Mount
    document.addEventListener('DOMContentLoaded', () => {
      try { window.GameInspector?.mount?.({version:'16.1.11'}); } catch(e){}
    });
  </script>
</body>
</html>
