<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>CityBuilder · Start (v16.1.10)</title>

  <!--
    CityBuilder Start-Screen + Dev-Buttons
    - Inspector-Button: immer sichtbar (unten rechts)
    - Bau-Menü-Button: erst nach „Game started“ sichtbar (unten links)
    - Robuster Start: wartet auf window.GameLoader.start, Timeout + Logs
    - Events: dispatch 'cb:game-started' + Call GameUI.onGameStarted(), falls vorhanden

    Wichtig: Bitte diese Reihenfolge der Skripte beibehalten.
    game.js liefert global GameLoader.start. ui-build.js liefert GameUI.openBuildMenu().
  -->

  <style>
    :root{
      --bg:#0f2c23; --panel:#0e1416; --panel2:#122126; --ok:#62e684; --warn:#ffcc66; --err:#ff6b6b;
      --btn:#1b3a33; --btnHi:#1f5b4a; --btnWarn:#ffcc00; --txt:#e8f3ef; --muted:#98b0a8;
      --glass: rgba(0,0,0,0.25); --blur: 10px;
    }
    html,body{margin:0;height:100%;background: radial-gradient(1200px 700px at 50% 20%, #1f4a3f 0%, #113529 45%, #092219 100%);}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--txt);}

    /* z-Layering */
    #startPanel{position:fixed;inset:auto 0 8vh 0;max-width:840px;margin:0 auto;padding:18px;z-index:20}
    #inspectorOverlay{position:fixed;inset:0;z-index:50;display:none}
    .floating{position:fixed;z-index:40}

    /* Startpanel */
    .card{
      background: linear-gradient(180deg, rgba(12,16,18,.9), rgba(12,16,18,.75));
      border-radius:14px; border:1px solid rgba(255,255,255,.07);
      box-shadow: 0 24px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(var(--blur));
    }
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .row + .row{margin-top:12px}
    h1{font-size:20px;margin:0 0 6px 0}
    .tag{display:inline-block;padding:.2em .55em;border-radius:999px;background:#0f2b24;color:#bfe8d6;font-size:12px;margin-right:6px}
    select{flex:1;min-width:260px;background:#0a1715;color:var(--txt);border:1px solid #223a33;border-radius:9px;padding:10px 12px}

    .btn{border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;cursor:pointer;
      background:var(--btn);color:var(--txt);transition:.15s;user-select:none}
    .btn:hover{filter:brightness(1.08)}
    .btn.primary{background:#1a5a47}
    .btn.go{background:#1e7a62}
    .btn.warn{background:var(--btnWarn);color:#09120f;border-color:#cda600}
    .btn.ghost{background:transparent;border-color:#2b3e37;color:#cde7dc}
    .btn.block{flex:1;text-align:center}
    .hint{color:var(--muted);font-size:13px;margin-top:8px}

    /* Floating Buttons (Inspector / Build) */
    #btnInspector{right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;
      background:#10181b;border:1px solid rgba(255,255,255,.06);box-shadow:0 10px 30px rgba(0,0,0,.35)}
    #btnInspector span{font-size:26px;display:block;text-align:center;line-height:56px}
    #btnBuild{left:16px;bottom:16px;display:none}
    #versionBadge{position:fixed;left:10px;top:10px;z-index:10;background:#10221d;border-radius:12px;padding:6px 10px;color:#bde7d6;font-size:12px;border:1px solid rgba(255,255,255,.07)}

    /* Inline log line (Startscreen) */
    #inlineLog{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;margin-top:10px;
      color:#cfe9df;background:rgba(0,0,0,.28);padding:8px 10px;border-radius:8px;border:1px dashed rgba(255,255,255,.08)}
    .logok{color:var(--ok)} .logwarn{color:var(--warn)} .logerr{color:var(--err)}

    /* Canvas Platzhalter – wird von game geresized */
    #gameRoot{position:fixed;inset:0;z-index:1}
  </style>
</head>
<body>

  <!-- Versionsanzeige oben links -->
  <div id="versionBadge">index v16.1.10</div>

  <!-- Spiel-Root (Canvas etc.) -->
  <div id="gameRoot"></div>

  <!-- Startpanel -->
  <section id="startPanel" class="card">
    <div style="padding:18px 18px 14px 18px">
      <h1>City Builder · Start
        <span class="tag" id="tagIndex">index v16.1.10</span>
        <span class="tag" id="tagGame">game.js: unbekannt</span>
        <span class="tag" id="tagDpr">dpr: ?</span>
      </h1>

      <div class="row">
        <label for="mapSel" style="min-width:110px;color:#b8d6cd">Karte auswählen</label>
        <select id="mapSel" aria-label="Karte">
          <!-- Falls du andere Maps willst, hier ergänzen -->
          <option value="./assets/maps/map-mini.json">map-mini.json (16×10)</option>
          <option value="./assets/maps/map-pro.json">map-pro.json (20×12)</option>
          <option value="./assets/maps/map-demo.json">map-demo.json</option>
          <option value="./assets/maps/map-test-all.json">map-test-all.json</option>
        </select>
        <button class="btn go" id="btnStart">▶ Start</button>
        <button class="btn warn" id="btnRestart">🗑 Neu-Start</button>
      </div>

      <div class="row">
        <button class="btn block" id="btnCache" title="Cache & Storage leeren">⚡ Cache-Booster</button>
        <button class="btn block" id="btnCopyLog" title="Log in Zwischenablage kopieren">📋 Log kopieren</button>
      </div>

      <div id="inlineLog" aria-live="polite"></div>
      <div class="hint">Hinweis: Nach „Start“ verschwindet dieses Fenster automatisch.</div>
    </div>
  </section>

  <!-- Floating: Inspector (immer sichtbar) -->
  <button id="btnInspector" class="floating" aria-label="Inspector öffnen"><span>🛠️</span></button>

  <!-- Floating: Bau-Menü (erst nach Game-Start sichtbar) -->
  <button id="btnBuild" class="floating btn primary">🏗️ Bau-Menü</button>

  <!-- Inspector-Overlay wird in inspector.js erzeugt -->
  <!-- =========  Skripte  ========= -->
  <!-- Dev/Inspector -->
  <script src="./assets/inspector/inspector.js?v=16.1.10" defer></script>
  <!-- Bau-Menü / UI-Hooks -->
  <script src="./ui-build.js?v=16.1.10" defer></script>
  <!-- Game Engine -->
  <script src="./game.js?v=16.1.10" defer></script>
  <!-- Optionales Boot (falls vorhanden, harmless wenn leer) -->
  <script src="./boot.js?v=16.1.10" defer></script>

  <script>
  // ==== Startscreen-Controller (v16.1.10) ===================================
  (function(){
    const $ = sel => document.querySelector(sel);
    const mapSel = $('#mapSel');
    const startPanel = $('#startPanel');
    const tagGame = $('#tagGame');
    const tagDpr = $('#tagDpr');
    const inlineLog = $('#inlineLog');
    const btnStart = $('#btnStart');
    const btnRestart = $('#btnRestart');
    const btnCache = $('#btnCache');
    const btnCopyLog = $('#btnCopyLog');
    const btnInspector = $('#btnInspector');
    const btnBuild = $('#btnBuild');

    // --- kleines Log-Framework (spielt in Inspector hinein) -----------------
    const Log = (function(){
      const buf = [];
      const stamp = () => new Date().toTimeString().slice(0,8);
      const push = (type, msg) => {
        const line = `[${stamp()}] ${msg}`;
        console[type === 'err' ? 'error' : (type === 'warn' ? 'warn' : 'log')](line);
        buf.push({type, line});
        inlineLog.innerHTML = `<span class="log${type==='err'?'err':type==='warn'?'warn':'ok'}">${line}</span>`;
        // an Inspector weiterreichen (wenn vorhanden)
        window.GameInspector?.appendLog?.(type, line);
      };
      return {
        ok:(m)=>push('ok', `✅ (ok) ${m}`),
        warn:(m)=>push('warn', `⚠️ (warn) ${m}`),
        err:(m)=>push('err', `❌ (err) ${m}`),
        copy: async()=>{
          const text = buf.map(x=>x.line).join('\n');
          try{ await navigator.clipboard.writeText(text); Log.ok('Log in Zwischenablage'); }
          catch(e){ Log.err('Kopieren fehlgeschlagen'); }
        },
        clear:()=>{ buf.length=0; inlineLog.textContent=''; },
        getAll:()=>buf.map(x=>x.line).join('\n')
      };
    })();
    window.GameLog = Log; // global für inspector.js

    // DPI anzeigen
    function updateDPR(){ tagDpr.textContent = `dpr: ${Math.round(devicePixelRatio*10)/10}`; }
    updateDPR(); addEventListener('resize', updateDPR);

    // Game-Version (sofern game.js sie setzt)
    if (window.Game && window.Game.version){
      tagGame.textContent = `game.js v${window.Game.version}`;
    }

    // ---- Cache-Booster ------------------------------------------------------
    async function cacheBooster(){
      try{
        if ('caches' in window){ for (const k of await caches.keys()) await caches.delete(k); }
        localStorage.clear(); sessionStorage.clear();
        // SW deregistrieren (falls vorhanden)
        if (navigator.serviceWorker){
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) await r.unregister();
        }
        Log.ok('Cache/Storage geleert – Seite ggf. neu laden');
      }catch(e){ Log.err('Cache-Booster Fehler'); }
    }

    // ---- Engine-Warten: stellt sicher, dass GameLoader.start existiert -----
    function waitForEngine(maxMs = 5000){
      return new Promise((resolve, reject)=>{
        if (window.GameLoader?.start){
          tagGame.textContent = window.Game?.version ? `game.js v${window.Game.version}` : 'game.js bereit';
          return resolve();
        }
        Log.warn('Engine noch nicht bereit – warte auf GameLoader.start …');
        const t0 = performance.now();
        const id = setInterval(()=>{
          if (window.GameLoader?.start){
            clearInterval(id);
            tagGame.textContent = window.Game?.version ? `game.js v${window.Game.version}` : 'game.js bereit';
            return resolve();
          }
          if (performance.now() - t0 > maxMs){
            clearInterval(id);
            return reject(new Error('Timeout'));
          }
        }, 100);
      });
    }

    // ---- Start-Handler ------------------------------------------------------
    async function doStart(){
      const map = mapSel.value;
      Log.ok(`Start gedrückt → ${map}`);
      try{
        await waitForEngine(6000);
      }catch(e){
        Log.err('Timeout: Engine nicht bereit – game.js / Engine noch nicht initialisiert?');
        return;
      }
      try{
        // Start des Spiels
        window.GameLoader.start(map);
        Log.ok('Game gestartet');
        // Events für UI/Overlays
        window.dispatchEvent(new CustomEvent('cb:game-started', {detail:{map}}));
        window.GameUI?.onGameStarted?.();
        // UI umschalten
        startPanel.style.display = 'none';
        btnBuild.style.display = 'inline-block';
      }catch(e){
        Log.err('GameLoader.start schlug fehl');
      }
    }

    // ---- Buttons verdrahten -------------------------------------------------
    btnStart.addEventListener('click', doStart);
    btnRestart.addEventListener('click', ()=>{ Log.ok('Neu-Start angefordert'); location.reload(); });
    btnCache.addEventListener('click', cacheBooster);
    btnCopyLog.addEventListener('click', ()=>Log.copy());

    // Inspector auf/zu (Button unten rechts)
    btnInspector.addEventListener('click', ()=>window.GameInspector?.open?.());

    // Bau-Menü Button (erst nach Start sinnvoll)
    btnBuild.addEventListener('click', ()=>{
      if (window.GameUI?.openBuildMenu){
        window.GameUI.openBuildMenu();
        Log.ok('Bau-Menü geöffnet');
      }else{
        Log.warn('Bau-Menü ist (noch) nicht eingebunden – window.GameUI.openBuildMenu() fehlt.');
      }
    });

    // Falls das Game selbst „cb:game-started“ feuert, hier auch UI umschalten:
    window.addEventListener('cb:game-started', ()=>{
      startPanel.style.display = 'none';
      btnBuild.style.display = 'inline-block';
      Log.ok('Signal empfangen: cb:game-started');
    });

    // Initial-Logs
    Log.ok('UI bereit (index v16.1.10)');
  })();
  </script>
</body>
</html>
