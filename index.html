  <!-- ================== SCRIPT-REIHENFOLGE (wichtig!) ================== -->
  <!-- 0) NOTFALL: Service Worker deaktivieren (außer ?keep-sw) -->
  <script>
  (function(){
    if ('serviceWorker' in navigator && !location.search.includes('keep-sw')) {
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ r.unregister(); });
        // Zusätzlich alle Caches leeren (nur falls vorhanden)
        if (window.caches && caches.keys) {
          caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); });
        }
      });
    }
  })();
  </script>
