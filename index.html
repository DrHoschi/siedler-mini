<!-- ============================================================================
     Datei: index.html (Root)
     Projekt: Neue Siedler
     Version: v18.0.2 (2025-09-22)
     Zweck:
       - Zentrale Einstiegspunkt: Core + UI + Inspector
       - Respektiert Standards: Startfenster zuerst, Debug-Tools drin lassen, Farbschema
     Struktur:
       HEAD  : Meta + UI-CSS
       BODY  : #app, Canvas, Startpanel, HUD, Build-Dock, Inspector
       SCRIPTS (Order!): Core → UI-Infra → UI-Daten → UI-Panels → Tools → Inline-Wiring
     ============================================================================ -->

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Neue Siedler</title>

  <!-- ================= UI: Styles (Dark-Theme & Module) ================= -->
  <link rel="stylesheet" href="ui/css/ui.css"/>
  <link rel="stylesheet" href="ui/css/ui-build.css"/>
  <link rel="stylesheet" href="ui/css/ui-hud.css"/>
  <link rel="stylesheet" href="ui/css/ui-dialog.css"/>
  <link rel="stylesheet" href="ui/css/ui-tooltip.css"/>
  <link rel="stylesheet" href="ui/css/ui-notify.css"/>
  <style>
    /* Kleines Root-Setup – kollisionsarm */
    html,body { background:#000; }
    #app { position:relative; width:100vw; height:100vh; overflow:hidden; }
    canvas#view { position:absolute; inset:0; width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <!-- ========================== Root App Container =========================== -->
  <div id="app" aria-label="Spielansicht">
    <canvas id="view" width="1280" height="720"></canvas>

    <!-- Startpanel: immer zuerst sichtbar; UI blendet es nach Aktion aus -->
    <div id="start-panel" class="ui-panel" role="dialog" aria-label="Startmenü">
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <h1>Neue Siedler</h1>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          <button id="btn-new">Neues Spiel</button>
          <button id="btn-continue">Weiterspielen</button>
          <button id="btn-reset">Reset</button>
          <button id="btn-fullscreen">Vollbild</button>
          <button id="btn-open-insp">Inspector</button>
          <button data-open-editors>Editoren</button>
        </div>
      </div>
    </div>

    <!-- HUD (Top-Leiste) -->
    <div id="hud" class="ui-panel" style="display:none"></div>

    <!-- Build-Dock (unten) -->
    <div id="build-dock" class="ui-panel" style="display:none" aria-label="Bauen">
      <div id="build-wrap" class="wrap" role="list"></div>
    </div>

    <!-- Inspector (Fallback-Panel; echte UI kommt aus ui-inspector.js) -->
    <div id="inspector" class="ui-panel" style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%); width:70%; max-width:900px;">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>Inspector</strong>
        <button id="insp-close" aria-label="Inspector schließen">×</button>
      </div>
      <div id="insp-tabs" style="display:flex;gap:6px;margin:8px 0">
        <button data-tab="Logs">Logs</button>
        <button data-tab="Tests">Tests</button>
        <button data-tab="Ressourcen">Ressourcen</button>
        <button data-tab="Pfade">Pfade</button>
        <button data-tab="Editor">Editoren</button>
      </div>
      <div id="insp-content" class="ui-panel"></div>
    </div>
  </div>

  <noscript>Bitte JavaScript aktivieren.</noscript>

  <!-- ================================ SCRIPTS ================================ -->
  <!-- ---- Core zuerst ------------------------------------------------------- -->
  <script src="core/boot.js"></script>
  <script src="core/asset.js"></script>
  <script src="core/registry.js"></script>
  <script src="core/game.js"></script>
  <script src="core/path-overlay.js"></script>

  <!-- ---- UI-Infrastruktur -------------------------------------------------- -->
  <script src="ui/ui-events.js"></script>
  <script src="ui/ui-inspector-bridge.js"></script>
  <script src="ui/ui-build.categories.js"></script>

  <!-- ---- UI-Panels --------------------------------------------------------- -->
  <script src="ui/ui-start.js"></script>
  <script src="ui/ui-hud.js"></script>
  <script src="ui/ui-dialog.js"></script>
  <script src="ui/ui-tooltip.js"></script>
  <script src="ui/ui-notify.js"></script>
  <script src="ui/ui-build.js"></script>
  <script src="ui/ui-inspector.js"></script>

  <!-- ---- Tools & Debug (bleiben drin) ------------------------------------- -->
  <script src="tools/debug-tools.js"></script>

  <!-- ---- Inline-Wiring (Events/Buttons, minimal, ohne Business-Logik) ----- -->
  <script>
  (function(){
    'use strict';

    // Utility: emit (nutzt UIEvents wenn vorhanden)
    function emit(name, detail){ (window.UIEvents?.emit||((n,d)=>window.dispatchEvent(new CustomEvent(n,{detail:d}))))(name, detail); }

    // UI ready → optional Log
    window.addEventListener('cb:ui:ready', (ev)=>console.log('[index] UI ready', ev?.detail||{}));

    // Assets/Registry ready → optional Log
    window.addEventListener('cb:assets-ready', ()=>console.log('[index] Assets ready'));
    window.addEventListener('cb:registry:ready', ()=>console.log('[index] Registry ready'));

    // Game start → HUD & BuildDock sichtbar
    window.addEventListener('cb:game-start', ()=>{
      document.getElementById('hud').style.display='block';
      document.getElementById('build-dock').style.display='block';
    });

    // Startpanel-Buttons
    document.getElementById('btn-new')?.addEventListener('click', ()=>emit('req:game:new',{}));
    document.getElementById('btn-continue')?.addEventListener('click', ()=>emit('req:game:continue',{}));
    document.getElementById('btn-reset')?.addEventListener('click', ()=>emit('req:game:reset',{}));
    document.getElementById('btn-fullscreen')?.addEventListener('click', ()=>{
      const el=document.documentElement; if(el.requestFullscreen) el.requestFullscreen();
      emit('req:ui:fullscreen',{});
    });

    // Inspector öffnen/schließen
    document.getElementById('btn-open-insp')?.addEventListener('click', ()=>{
      if(window.UIInspector?.open){ window.UIInspector.open('Logs'); }
      else { document.getElementById('inspector').style.display='block'; }
    });
    document.getElementById('insp-close')?.addEventListener('click', ()=>{
      document.getElementById('inspector').style.display='none';
    });

    // Global: ESC → Build-Cancel (und ggf. Dialoge schließen)
    window.addEventListener('keydown', (ev)=>{
      if(ev.key==='Escape'){
        emit('req:build:cancel',{reason:'esc'});
        window.UINotify?.push?.('Bauen abgebrochen (ESC)','info');
      }
    });
  })();
  </script>
</body>
</html>
