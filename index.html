<!doctype html>
<html lang="de">
<head>
  <!--
    Projekt: City/Builder Prototype
    Datei:   index.html
    Version: v16.0.7
    Zweck:   Minimaler Launcher/Overlay + Log/Tools (Clipboard/Cache)
    Hinweise:
      - game.js wird mit Cache-Buster geladen (?v=VERSION)
      - Editor/Inspector-Hooks sind optional (wenn Dateien fehlen, nur Warn-Log)
      - Status-Icons in Logs: ✅ ok, ⚠️ warn, ❌ err
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>City Builder v16.0.7</title>
  <style>
    :root{
      --bg:#0f1316; --fg:#e7edf3; --muted:#a7b0bb;
      --ok:#2ecc71; --warn:#f1c40f; --err:#e74c3c;
      --panel:#161b20; --btn:#1f2730; --btnh:#2a3642; --accent:#3aa3ff;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);}

    /* Fullscreen game area (canvas lives in game.js) */
    #game-root{position:fixed;inset:0;background:#184d2a;}

    /* Overlay UI */
    #overlay{
      position:fixed; inset:auto 0 0 0; /* bottom bar */
      background:linear-gradient(180deg, transparent, rgba(0,0,0,.35) 16%, rgba(0,0,0,.6) 55%);
      padding:12px 12px 10px; display:flex; flex-direction:column; gap:10px;
      pointer-events:none; /* inner panels re-enable */
    }
    .panel{
      background:var(--panel); border:1px solid #26313d; border-radius:10px;
      padding:10px; pointer-events:auto;
      box-shadow:0 6px 16px rgba(0,0,0,.25);
    }
    .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
    button{
      appearance:none; background:var(--btn); color:var(--fg);
      border:1px solid #2a3642; border-radius:8px; padding:8px 12px;
      font-weight:600; cursor:pointer;
    }
    button:hover{background:var(--btnh)}
    button[disabled]{opacity:.55; cursor:not-allowed}
    .badge{font:600 12px/1 var(--sans); color:#9fb2c6; padding:2px 6px; background:#1b2430; border:1px solid #2a3442; border-radius:999px}
    .sep{flex:1 1 auto}
    .link{color:var(--accent); text-decoration:none}
    .log{
      max-height:30vh; overflow:auto; background:#0f1419; border:1px solid #25303b;
      border-radius:8px; padding:8px; font:12px/1.4 var(--mono);
      white-space:pre-wrap; word-break:break-word;
    }
    .line{display:block}
    .ok   {color:var(--ok)}
    .warn {color:var(--warn)}
    .err  {color:var(--err)}

    /* Compact on phones */
    @media (max-width:780px){
      #overlay{padding:8px}
      .log{max-height:28vh}
      button{padding:7px 10px}
    }
  </style>
  <script>
    // ---- Config & helpers ---------------------------------------------------
    window.APP = window.APP || {};
    APP.VERSION = "16.0.7";
    APP.DEFAULT_MAP = "assets/maps/map-mini.json";

    function ts(){ // hh:mm:ss
      const d=new Date(); return "["+
        d.toTimeString().slice(0,8)+"]";
    }
    const $ = (sel)=>document.querySelector(sel);

    (function setupLogger(){
      const el = ()=>$('.log');
      const push = (cls, icon, msg)=>{
        const line = document.createElement('span');
        line.className = `line ${cls}`;
        line.textContent = `${ts()} ${icon} ${msg}`;
        el().appendChild(line);
        el().scrollTop = el().scrollHeight;
      };
      APP.log = {
        ok:   (m)=>push('ok','✅ (ok)',   m),
        warn: (m)=>push('warn','⚠️ (warn)', m),
        err:  (m)=>push('err','❌ (err)', m),
      };
      // Expose for game.js to call (optional)
      window.UI_LOG = APP.log;
    })();

    // ---- Clipboard & Cache tools -------------------------------------------
    async function copyLog(){
      const text = Array.from(document.querySelectorAll('.log .line'))
        .map(n=>n.textContent).join("\n");
      try{
        await navigator.clipboard.writeText(text);
        APP.log.ok("Log in Zwischenablage");
      }catch(e){
        APP.log.err("Kopieren fehlgeschlagen: "+(e?.message||e));
      }
    }

    async function clearCaches(){
      try{
        // local/session storage
        localStorage.clear(); sessionStorage.clear();
        // Cache Storage (service worker caches, falls vorhanden)
        if('caches' in window){
          const names = await caches.keys();
          await Promise.all(names.map(n=>caches.delete(n)));
        }
        APP.log.ok("Cache/Storage geleert – Seite ggf. neu laden");
      }catch(e){
        APP.log.warn("Cache nicht vollständig geleert: "+(e?.message||e));
      }
    }

    // ---- Boot & UI wiring ---------------------------------------------------
    document.addEventListener('DOMContentLoaded', ()=>{
      $('.badge.ver').textContent = "index v"+APP.VERSION;

      // Buttons
      $('#btn-start').addEventListener('click', async ()=>{
        await startGame();
      });
      $('#btn-copy').addEventListener('click', copyLog);
      $('#btn-clear').addEventListener('click', clearCaches);

      // Optional hooks
      $('#btn-editor').addEventListener('click', ()=>{
        if(window.GameEditor?.open){ window.GameEditor.open(); }
        else APP.log.warn("Editor ist (noch) nicht eingebunden – window.GameEditor.open() fehlt.");
      });
      $('#btn-inspector').addEventListener('click', ()=>{
        if(window.GameInspector?.toggle){ window.GameInspector.toggle(); }
        else APP.log.warn("Inspector ist (noch) nicht eingebunden – window.GameInspector.toggle() fehlt.");
      });

      APP.log.ok(`UI ready (index v${APP.VERSION})`);
      // Falls game.js bereits da ist, bestätigt es gleich seine Version.
    });

    async function startGame(){
      const want = APP.DEFAULT_MAP;
      APP.log.ok(`GameLoader.start ${want}`);
      // Warte-Schleife bis game.js initialisiert ist:
      const deadline = Date.now()+6000;
      while(Date.now()<deadline && !(window.GameLoader && typeof GameLoader.start==='function')){
        await new Promise(r=>setTimeout(r, 120));
      }
      if(!(window.GameLoader && typeof GameLoader.start==='function')){
        APP.log.err("GameLoader.start ist nicht verfügbar – game.js noch nicht initialisiert?");
        return;
      }
      try{
        await window.GameLoader.start(want);
        APP.log.ok("Game started");
      }catch(err){
        APP.log.err("Start-Fehler: "+(err?.message||err));
        console.error(err);
      }
    }
  </script>
</head>
<body>
  <!-- Game mount -->
  <div id="game-root"></div>

  <!-- Overlay UI -->
  <div id="overlay">
    <div class="panel">
      <div class="row">
        <span class="badge ver">index v?.?.?</span>
        <span class="sep"></span>
        <button id="btn-start">▶️ Start</button>
        <button id="btn-editor">🛠️ Editor</button>
        <button id="btn-inspector">🔎 Inspector</button>
        <button id="btn-copy">📋 Log kopieren</button>
        <button id="btn-clear">🧹 Cache leeren</button>
      </div>
    </div>
    <div class="panel">
      <div class="log" aria-live="polite" aria-label="Debug Log"></div>
    </div>
  </div>

  <!-- game.js (mit Cache-Buster per Version) -->
  <script>
    // Wir hängen game.js dynamisch an, damit wir die Version ins ?v=… einbetten können.
    (function(){
      const s = document.createElement('script');
      s.defer = true;
      s.src = `./game.js?v=${encodeURIComponent(APP.VERSION)}`;
      s.onload = ()=> APP.log.ok(`game.js geladen, game.js v${window.GAME_VERSION||'unbekannt'}`);
      s.onerror= ()=> APP.log.err("game.js konnte nicht geladen werden");
      document.head.appendChild(s);
    })();
  </script>

  <!-- Optionale Hooks (nur wenn vorhanden) -->
  <script defer src="./editor.hook.js?v=1"></script>
  <script defer src="./inspector.hook.js?v=1"></script>
</body>
</html>
