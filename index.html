<!doctype html>
<html lang="de">
<head>
  <!-- ===================================================================
       City Builder – App Shell (Index)
       Version: v16.1.10
       Zweck:
         - Start-Overlay (Map wählen, Start/Neu-Start)
         - Inspector-Button (unten rechts, always-on)
         - Bau-Menü-Button (unten links, erst nach Spielstart)
         - Cache-Booster (Storage + Cache API)
         - Zentrales Logging (✅⚠️❌) -> Inspector + Konsole
       WICHTIG:
         - Alle Pfade zeigen auf bereits vorhandene Dateien im Repo
         - Diese Datei ist für 1:1 Copy&Paste gedacht
       =================================================================== -->

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>City Builder – v16.1.10</title>

  <!-- Basistyle: einfache, robuste UI-Elemente (keine Frameworks) -->
  <style>
    :root {
      --z-overlay: 9000;
      --z-inspector: 9500;
      --z-fab: 9800;
      --gap: 10px;
      --btn: 48px;
      --shadow: 0 6px 20px rgba(0,0,0,.25);
      --bg-panel: rgba(10,12,14,.92);
      --bg-chip: rgba(255,255,255,.9);
      --ok:   #1f9d55;
      --warn: #d39e00;
      --err:  #d64545;
    }
    html, body {
      margin:0; padding:0; height:100%; background:#0d1810; color:#e9f1ea;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    /* Canvas-Füller: euer Renderer positioniert sein Canvas meist selbst,
       wir stellen nur sicher, dass Platz ist. */
    #game-root { position:relative; width:100%; height:100%; overflow:hidden; }

    /* --------- Floating Action Buttons --------- */
    .fab {
      position: fixed; width: var(--btn); height: var(--btn); border-radius: 50%;
      border: 0; cursor: pointer; box-shadow: var(--shadow);
      background: var(--bg-chip); color:#111; font-weight:600;
      display: grid; place-items: center;
      bottom: var(--gap); z-index: var(--z-fab);
      user-select: none;
    }
    .fab:active { transform: translateY(1px) scale(.98); }

    /* Inspector-Button: immer sichtbar (unten rechts) */
    #btn-inspector { right: var(--gap); }

    /* Bau-Menü-Button: erscheint erst nach Game-Start (unten links) */
    #btn-build { left: var(--gap); display:none; }

    /* Cache-Button: nur im Startoverlay sichtbar */
    #btn-cache { right: calc(var(--gap) + var(--btn) + 8px); }

    /* --------- Start Overlay --------- */
    #start-overlay {
      position: fixed; inset: 0; z-index: var(--z-overlay);
      display: grid; place-items: center;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,.08), rgba(0,0,0,.88) 55%), #0b1410;
      backdrop-filter: blur(2px);
    }
    #start-panel {
      width: min(720px, 92vw);
      border-radius: 14px;
      background: var(--bg-panel);
      box-shadow: var(--shadow);
      padding: 16px;
      display: grid; gap: 12px;
    }
    #start-panel header {
      display:flex; align-items:center; justify-content:space-between;
    }
    .tag { font-size: 12px; opacity:.8 }
    .row { display:flex; gap:8px; flex-wrap: wrap; align-items:center; }
    select, button, .chip {
      background: var(--bg-chip); color:#111;
      border-radius: 10px; border:0; padding:10px 12px; font-weight:600;
    }
    select { min-width: 220px; }
    button.primary { background:#e9f1ea; }
    .chip { display:inline-flex; align-items:center; gap:6px; }
    .chip small { opacity:.7; font-weight:700; letter-spacing:.02em; }

    /* --------- Inspector Fullscreen Container --------- */
    #inspector-host {
      position: fixed; inset:0; z-index: var(--z-inspector);
      display:none; /* per JS togglen */
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(2px);
    }
    /* Optional: Vollfläche reservieren, euer inspector.js rendert hinein */
    #inspector-mount {
      position:absolute; inset:0;
      background: #0d0f12;
      border-top: 1px solid rgba(255,255,255,.05);
    }

    /* --------- Log-Toast (Statusleiste) – bleibt am Rand (oben/unten/links/rechts) --------- */
    #status-toasts {
      position: fixed; left:50%; transform: translateX(-50%);
      bottom: calc(var(--btn) + 14px); z-index: var(--z-fab);
      display:flex; flex-direction:column; gap:8px; align-items:center;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: var(--bg-chip); color:#111; padding:8px 12px; border-radius: 10px;
      box-shadow: var(--shadow); font-size: 14px; font-weight:600;
    }
    .ok   { border-left: 6px solid var(--ok); }
    .warn { border-left: 6px solid var(--warn); }
    .err  { border-left: 6px solid var(--err); }
    .muted { opacity:.88; font-weight:500; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <!-- Container für euer Spiel (Canvas, etc.) -->
  <div id="game-root"></div>

  <!-- ========== Start-Overlay (Map-Auswahl + Start/Neu-Start + Cache) ========== -->
  <div id="start-overlay" aria-modal="true" role="dialog">
    <div id="start-panel">
      <header>
        <h3 style="margin:0">City Builder – Start</h3>
        <div class="tag">index <strong>v16.1.10</strong></div>
      </header>

      <!-- Map-Auswahl -->
      <div class="row">
        <label for="map-select">Karte wählen:</label>
        <select id="map-select">
          <!-- WICHTIG: Diese Liste kann bei Bedarf erweitert werden -->
          <option value="./assets/maps/map-mini.json">map-mini.json (16x10)</option>
          <option value="./assets/maps/map-pro.json">map-pro.json (20x12)</option>
          <option value="./assets/maps/map-test-all.json">map-test-all.json (Test)</option>
          <option value="./assets/maps/map-demo.json">map-demo.json (Demo)</option>
        </select>
        <span class="chip"><small>Hinweis</small> Spiel lädt die gewählte Karte nach „Start“</span>
      </div>

      <!-- Aktionen -->
      <div class="row">
        <button id="btn-start" class="primary">▶️ Start</button>
        <button id="btn-restart">🔄 Neu-Start</button>
        <button id="btn-copylog">📋 Log kopieren</button>

        <!-- Cache-Booster: bewusst im Overlay gelassen, damit man ihn vor Start bequem erreicht -->
        <button id="btn-cache" title="Cache/Storage leeren">🧹 Cache-Booster</button>
      </div>
    </div>
  </div>

  <!-- ========== Inspector-Host (fullscreen) – inspector.js rendert hier hinein ========== -->
  <div id="inspector-host">
    <div id="inspector-mount"></div>
  </div>

  <!-- ========== Floating Buttons ========== -->
  <button id="btn-build" class="fab" title="Bau-Menü">🧰</button>
  <button id="btn-inspector" class="fab" title="Inspector öffnen/schließen">🧪</button>

  <!-- ========== Status-Toast-Stapel ========== -->
  <div id="status-toasts" aria-live="polite"></div>

  <!-- ===================================================================
       Skripte laden
       Reihenfolge:
         1) game.js  – Engine & GameLoader.start
         2) inspector.js – Inspector/UI für Logs & Dev-Tools
         3) ui-build.js – Bau-Menü (GameUI.*)
         4) Inline App-Binder – Buttons, Start-Flow, Logging, Events
      =================================================================== -->

  <!-- 1) Engine / Spiel-Logik -->
  <script src="./game.js"></script>

  <!-- 2) Inspector (euer vorhandenes Modul) -->
  <script src="./assets/inspector/inspector.js"></script>

  <!-- 3) Bau-Menü / UI-Komponenten -->
  <script src="./assets/ui/ui-build.js"></script>

  <!-- 4) Inline-App-Kleber: Versionierung, Logging, Start, Buttons -->
  <script>
  (function(){
    'use strict';

    /* ================================================================
       Version & einfache App-Info
       ================================================================ */
    const INDEX_VERSION = 'v16.1.10';

    /* ================================================================
       DOM-Refs
       ================================================================ */
    const $root      = document.getElementById('game-root');
    const $overlay   = document.getElementById('start-overlay');
    const $mapSelect = document.getElementById('map-select');
    const $btnStart  = document.getElementById('btn-start');
    const $btnRestart= document.getElementById('btn-restart');
    const $btnCopyLog= document.getElementById('btn-copylog');
    const $btnCache  = document.getElementById('btn-cache');
    const $btnBuild  = document.getElementById('btn-build');
    const $btnInspector = document.getElementById('btn-inspector');
    const $inspHost  = document.getElementById('inspector-host');
    const $inspMount = document.getElementById('inspector-mount');
    const $toasts    = document.getElementById('status-toasts');

    /* ================================================================
       Logging (✅⚠️❌) – Konsole + Inspector + Toast
       Inspector-Hook: window.Inspector?.log(level, message)
       Level: 'ok' | 'warn' | 'err'
       ================================================================ */
    function toast(msg, level='ok', ttl=2600) {
      const div = document.createElement('div');
      div.className = `toast ${level}`;
      div.textContent = msg;
      $toasts.appendChild(div);
      setTimeout(()=>div.remove(), ttl);
    }
    function logToInspector(level, message) {
      try { window.Inspector?.log?.(level, message); } catch(_) {}
    }
    function logOK(msg){ console.log(`[ok] ${msg}`);   logToInspector('ok',   msg); toast(`✅ ${msg}`,'ok'); }
    function logWarn(msg){ console.warn(`[warn] ${msg}`); logToInspector('warn', msg); toast(`⚠️ ${msg}`,'warn'); }
    function logErr(msg){ console.error(`[err] ${msg}`);  logToInspector('err',  msg); toast(`❌ ${msg}`,'err', 3600); }

    // Begrüßung / Version
    logOK(`UI bereit (index ${INDEX_VERSION})`);

    /* ================================================================
       Utility: auf GameLoader.start warten (Engine-Init)
       ================================================================ */
    async function waitForGameLoader(timeoutMs=8000, stepMs=120){
      const t0 = performance.now();
      while (performance.now() - t0 < timeoutMs) {
        if (window.GameLoader && typeof window.GameLoader.start === 'function') return true;
        await new Promise(r=>setTimeout(r, stepMs));
      }
      return false;
    }

    /* ================================================================
       Start/Restart/Map-Load
       - Schließt Overlay nach Start
       - Dispatch cb:game-started (sobald erfolgreich)
       ================================================================ */
    async function startGame(selectedMap) {
      const ok = await waitForGameLoader(8000);
      if (!ok) {
        logWarn('Engine noch nicht bereit – warte auf GameLoader.start …');
      }
      if (!window.GameLoader?.start) {
        logErr('GameLoader.start ist nicht verfügbar – game.js / Engine noch nicht initialisiert?');
        return;
      }
      const mapPath = selectedMap || $mapSelect.value;
      logOK(`Start gedrückt → ${mapPath}`);
      try {
        // Optional: UI-Hinweis, dass Map geladen wird
        logOK(`Map laden → ${mapPath}`);
        await window.GameLoader.start(mapPath);
        logOK(`Game gestartet (${mapPath})`);

        // Bau-Menü-Button aktivieren (erst ab Spielstart sichtbar)
        $btnBuild.style.display = 'grid';

        // Events für externe Hooks (wie besprochen)
        window.dispatchEvent(new CustomEvent('cb:game-started'));
        try { window.GameUI?.onGameStarted?.(); } catch(_) {}

        // Start-Overlay nach erfolgreichem Start ausblenden
        $overlay.style.display = 'none';
      } catch (e) {
        logErr(`Start fehlgeschlagen: ${e?.message || 'Unbekannter Fehler'}`);
      }
    }

    // Neu-Start: Nur Overlay zeigen + ggf. Spiel zurücksetzen (leichtgewichtig)
    function requestRestart() {
      // Wenn game.js eine Reset-API hat, hier aufrufen:
      try { window.Game?.reset?.(); } catch(_) {}
      $overlay.style.display = 'grid';
      logOK('Neu-Start angefordert');
    }

    /* ================================================================
       Cache-Booster: LocalStorage + Cache API leeren
       ================================================================ */
    async function clearCacheAndStorage() {
      try {
        localStorage.clear();
        sessionStorage.clear();
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        // optional: Service Worker unregistern (falls vorhanden)
        if (navigator.serviceWorker) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        logOK('Cache/Storage geleert – Seite ggf. neu laden');
      } catch (e) {
        logErr(`Cache-Booster Fehler: ${e?.message || e}`);
      }
    }

    /* ================================================================
       Inspector: öffnen/schließen (Vollfläche)
       - Inspector rendert in #inspector-mount (per inspector.js)
       - Button rechts unten toggelt
       ================================================================ */
    function openInspector() {
      $inspHost.style.display = 'block';
      try { window.Inspector?.open?.($inspMount); } catch(_) {}
      logOK(`Inspector geöffnet (${window.Inspector?.version ? 'inspector.js '+window.Inspector.version : 'Version unbekannt'})`);
    }
    function closeInspector() {
      $inspHost.style.display = 'none';
      try { window.Inspector?.close?.(); } catch(_) {}
      logOK('Inspector geschlossen');
    }
    function toggleInspector() {
      const isOpen = $inspHost.style.display === 'block';
      if (isOpen) closeInspector(); else openInspector();
    }

    /* ================================================================
       Bau-Menü: über Button links unten toggeln
       - Verwendet euer vorhandenes API in assets/ui/ui-build.js
       ================================================================ */
    function toggleBuildMenu() {
      try {
        // Falls es eine spezifische Toggle-API gibt:
        if (typeof window.GameUI?.toggleBuildMenu === 'function') {
          window.GameUI.toggleBuildMenu();
          return;
        }
        // Sonst best effort:
        const opened = window.GameUI?.isBuildMenuOpen?.() === true;
        if (opened) {
          window.GameUI?.closeBuildMenu?.();
          logOK('Bau-Menü geschlossen (ui-build.js)');
        } else {
          window.GameUI?.openBuildMenu?.();
          logOK('Bau-Menü geöffnet (ui-build.js)');
        }
      } catch (e) {
        logWarn('Bau-Menü ist (noch) nicht eingebunden – window.GameUI.* fehlt.');
      }
    }

    /* ================================================================
       Events verkabeln
       ================================================================ */
    $btnStart.addEventListener('click', ()=> startGame());
    $btnRestart.addEventListener('click', requestRestart);
    $btnCopyLog.addEventListener('click', ()=> {
      try { window.Inspector?.copyLog?.(); logOK('Log in Zwischenablage'); }
      catch(_) { logWarn('Inspector.copyLog nicht verfügbar'); }
    });
    $btnCache.addEventListener('click', clearCacheAndStorage);

    $btnInspector.addEventListener('click', toggleInspector);
    $inspHost.addEventListener('click', (ev)=>{
      // Klick auf den verdunkelten Bereich schließt den Inspector
      if (ev.target === $inspHost) closeInspector();
    });

    $btnBuild.addEventListener('click', toggleBuildMenu);

    // Spielstart-Event von der Engine (falls game.js es selbst dispatcht)
    window.addEventListener('cb:game-started', ()=> {
      logOK('Event: cb:game-started empfangen');
      // Sicherstellen, dass der Bau-Menü-Button sichtbar ist:
      $btnBuild.style.display = 'grid';
    });

    /* ================================================================
       Optional: Auto-Start falls gewünschte Query (z.B. ?autostart=map-mini.json)
       ================================================================ */
    const usp = new URLSearchParams(location.search);
    const auto = usp.get('autostart');
    if (auto) {
      // Map-Auswahl auf Query anpassen und sofort starten
      for (const opt of $mapSelect.options) {
        if (opt.value.endsWith(auto)) { $mapSelect.value = opt.value; break; }
      }
      startGame($mapSelect.value);
    }

  })();
  </script>
</body>
</html>
