<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neue Siedler</title>

  <!-- Styles -->
  <link rel="stylesheet" href="assets/ui/ui-start.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="assets/ui/ui-build.css">
  <link rel="stylesheet" href="assets/inspector/inspector.css">

  <style>
    html, body { height:100%; margin:0; background:#0b0f0d; }
    #game { width:100vw; height:100vh; display:block; }

    .ui-fab { position:fixed; z-index:2147483647; }
    #btn-build { left:16px; bottom:16px; }
    #btn-inspector { right:16px; bottom:16px; }
    .ui-fab button {
      width:52px; height:52px; border-radius:50%; border:none;
      background:rgba(30,30,30,.92); color:#fff; font-size:22px;
    }
    body.has-build-open #btn-build,
    body.has-build-open #btn-inspector { bottom:240px; }
  </style>
</head>
<body>

  <canvas id="game" data-map="assets/maps/map-mini.json"></canvas>
  <div id="build-dock" class="ui-build-dock"></div>

  <div id="start-panel" class="ui-start">
    <div class="ui-start-card">
      <h1>Neue Siedler</h1>
      <button id="btnStartNew">Neues Spiel</button>
      <button id="btnStartResume">Weiterspielen</button>
      <button id="btnStartReset">Reset</button>
      <button id="btnStartFullscreen">Fullscreen</button>
    </div>
  </div>

  <!-- FABs -->
  <div id="btn-build" class="ui-fab">
    <button onclick="GameUI.toggleBuild()">🧱</button>
  </div>
  <div id="btn-inspector" class="ui-fab">
    <button onclick="GameUI.toggleInspector()">🛠</button>
  </div>

  <!-- Core -->
  <script src="assets/core/cblog.polyfill.js"></script>
  <script src="assets/core/core.env.js"></script>
  <script src="assets/core/asset.js"></script>
  <script src="assets/core/build.assets.js"></script>
  <script src="assets/core/registry.js"></script>
  <script src="assets/core/entities.registry.js"></script>
  <script src="assets/core/core.entities.js"></script>
  <script src="assets/core/core.production.js"></script>
  <script src="assets/core/core.pfglue.js"></script>
  <script src="assets/core/camera.js"></script>
  <script src="assets/core/core.map.js"></script>
  <script src="assets/core/core.input.js"></script>
  <script src="assets/core/carriers.js"></script>
  <script src="assets/core/overlay-hooks.js"></script>
  <script src="assets/core/core.render.js"></script>
  <script src="core/game.js"></script>
  <script src="assets/core/game.bootstrap.js"></script>
  <script src="assets/core/game.js"></script>

  <!-- Inspector (ALT aktiv) -->
  <script defer src="assets/ui/ui-inspector.js"></script>

  <!-- Inspector (NEU – Split, für später) -->
  <!--
  <script defer src="assets/inspector/inspector.core.js"></script>
  <script defer src="assets/inspector/inspector.logs.js"></script>
  <script defer src="assets/inspector/inspector.tests.js"></script>
  <script defer src="assets/inspector/inspector.resources.js"></script>
  <script defer src="assets/inspector/inspector.paths.js"></script>
  <script defer src="assets/inspector/overlay.hooks.js"></script>
  -->

  <!-- UI -->
  <script defer src="assets/ui/ui-bridge.js"></script>
  <script defer src="assets/ui/ui-start.js"></script>
  <script defer src="assets/ui/ui-build.js"></script>

  <script defer src="boot.compat.js"></script>
</body>
</html>
