<!doctype html>
<html lang="de">
<head>
  <!-- =========================================================================
       Datei: index.html (Root)
       Projekt: Neue Siedler
       Version: v1.0.2 (2025-09-28)
       Zweck: Einstiegspunkt für Spiel + UI (Startfenster zuerst sichtbar)
  ========================================================================= -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neue Siedler – Epoche 1</title>

  <!-- ==================== CSS ==================== -->
  <link rel="stylesheet" href="ui/css/ui.css">
  <link rel="stylesheet" href="ui/css/ui-start.css">
  <link rel="stylesheet" href="ui/css/ui-hud.css">
  <link rel="stylesheet" href="ui/css/ui-build.css">
  <link rel="stylesheet" href="ui/css/ui-place.css">          <!-- CSS (nach ui-build.css / ui-hud.css) -->
  <link rel="stylesheet" href="ui/css/ui-dialog.css">
  <link rel="stylesheet" href="ui/css/ui-tooltip.css">
  <link rel="stylesheet" href="ui/css/inspector.css">

  <!-- Optional: globale Variablen / Darkmode -->
  <style>
    :root { --bg:#1e1e1e; --fg:#f0f0f0; --accent:#4da3ff; }
    html,body {
      margin:0; padding:0;
      background:var(--bg); color:var(--fg);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }
  </style>
</head>

<body>
  <!-- =========================================================================
       DOM-STRUKTUR: Sichtbare Container
  ========================================================================= -->
  <div id="app">

    <!-- Spielfeld -->
    <canvas
      id="game"
      width="1280"
      height="720"
      data-map="data/maps/map-mini.json"></canvas>

    <!-- Start-Hintergrund (unter Panel, über Canvas) -->
    <div id="bg-start"></div>

    <!-- Startpanel (Holz/Papier hell) -->
    <div id="start-panel" class="ui-panel ui-panel--light visible">
      <h1>Neue Siedler</h1>
      <div class="actions">
        <button id="btn-new"        class="btn main">Neues Spiel</button>
        <button id="btn-continue"   class="btn ghost">Weiterspielen</button>
        <button id="btn-fullscreen" class="btn">Vollbild</button>
        <button id="btn-reset"      class="btn">Reset</button>
        <button id="btn-inspector"  class="btn">Inspector</button>
      </div>
    </div>

    <!-- HUD (Holz/Papier dunkel) -->
   <!-- <div id="hud-top" class="ui-panel ui-panel--dark hidden"></div> -->
    <!-- HUD-Container (Look via ui.css + ui/css/ui-hud.css) -->
   <div id="hud-top" class="ui-panel hidden" aria-label="Ressourcen-HUD"></div>
  
    <!-- Build-Dock (Holz/Papier dunkel) -->
    <div id="build-dock" class="ui-panel ui-panel--dark hidden"></div>

    <!-- Inspector (Holz/Papier dunkel) -->
    <div id="inspector" class="ui-panel ui-panel--dark hidden"></div>
  </div>

<button id="btn-build" class="ui-btn-build" aria-expanded="false">Bauen</button>
<aside id="build-panel" class="build-panel" hidden></aside>
  
  <!-- =========================================================================
       SCRIPTS: Reihenfolge Core → UI → Tools
  ========================================================================= -->
  <!-- Core -->
  <script src="core/asset.js"></script>
  <script src="core/registry.js"></script>
  <script src="core/map-runtime.js"></script>
  <script src="core/unit-runtime.js"></script>
  <script src="core/game.js"></script>
  <script src="core/boot.js"></script>

  <!-- UI -->
  <script src="ui/ui-start.js"></script>
  <script src="ui/ui-hud.js"></script>
  <script src="ui/ui-build.categories.js"></script>
  <!-- Button + Dock bleiben wie gehabt -->
  <script src="ui/ui-build.toggle.js"></script>
  <script src="ui/ui-build.js"></script>
  <script src="ui/ui-place.js"></script> <!-- UI-Module (nach ui/ui-build.js) -->

  <!-- Inspector -->
  <script>window.ICONS = window.ICONS || {};</script>
  <script src="ui/inspector/inspector.core.js"></script>

  <!-- Debug / Tools -->
  <script src="tools/debug-tools.js"></script>

  <!-- Inline-Wiring (klein & selbsterklärend) -->
  <script>
    document.getElementById('btn-inspector').addEventListener('click', () => {
      document.getElementById('inspector').classList.toggle('hidden');
      window.dispatchEvent(new CustomEvent('req:inspector:toggle'));
    });
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });
  </script>
</body>
</html>
