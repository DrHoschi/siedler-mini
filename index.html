<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2419" />
  <title>Mini – v16.1.16</title>

  <!-- Basis-Styles (deine bestehenden Dateien) -->
  <link rel="preload" href="./css/base.css" as="style" />
  <link rel="preload" href="./style.css" as="style" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Kleine Zusatz-Styles nur für die Schwebe-Buttons (ohne Layout zu verändern) -->
  <style>
    .cb-fab {
      position: fixed; z-index: 9000;
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20,20,20,.7);
      box-shadow: 0 6px 16px rgba(0,0,0,.35);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff; user-select: none; cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }
    .cb-fab:active { transform: scale(.96); }
    #btn-build { left: 12px; bottom: 12px; opacity: 0; pointer-events: none; }
    #btn-build.visible { opacity: 1; pointer-events: auto; }
    #btn-inspector { right: 12px; bottom: 12px; } /* vorhandener Style kompatibel */
  </style>
</head>

<body>
  <!-- =======================================================================================
       START-PANEL: Bitte deinen vorhandenen Start-Dialog hier drin belassen.
       Wichtig ist nur die ID (#start-panel), die Buttons & Events fassen wir unten ab.
       ======================================================================================= -->
  <div id="start-panel" aria-label="City-Builder Start">
    <!-- Dein bestehendes Start-HTML: Karte auswählen, Start, Neu-Start, Log kopieren, Cache-Booster -->
    <!-- NICHT angefasst – du kannst deine aktuelle Markup-Struktur hier beibehalten -->
  </div>

  <!-- Canvas/Stage – wie gehabt (ID/Tag so gelassen) -->
  <canvas id="game" width="0" height="0"></canvas>

  <!-- Floating Action Buttons -->
  <button id="btn-inspector" class="cb-fab" title="Inspector">🛠️</button>
  <button id="btn-build" class="cb-fab" title="Bau-Menü öffnen">🏗️</button>

  <!-- ===================== SCRIPTS ===================== -->

  <!-- Inspector (dein File-Pfad unverändert) -->
  <script src="./assets/inspector/inspector.js"></script>

  <!-- Engine / Game -->
  <script src="./game.js"></script>

  <!-- Bau-Menü-UI (deine bestehende Datei) -->
  <script src="./assets/ui/ui-build.js"></script>

  <!-- UI-Bridge: kleine, sichere Hülle für globale Hooks + Buttons (kein Layout-Touch) -->
  <script>
  (function(){
    const INDEX_VERSION = 'v16.1.16';
    window.__cb = window.__cb || {};
    window.__cb.indexVersion = INDEX_VERSION;

    // ---------- Inspector-Button ----------
    const btnInspector = document.getElementById('btn-inspector');
    btnInspector?.addEventListener('click', () => {
      // Dein Inspector exportiert global `Inspector.open()`; fallback: Event
      (window.Inspector && typeof Inspector.open === 'function')
        ? Inspector.open()
        : window.dispatchEvent(new CustomEvent('cb:inspector-toggle'));
    });

    // ---------- Build-Button (wird erst nach Spielstart sichtbar) ----------
    const btnBuild = document.getElementById('btn-build');
    function showBuildBtn(){ btnBuild?.classList.add('visible'); }
    function hideBuildBtn(){ btnBuild?.classList.remove('visible'); }

    // Sanfter Bridge-Schutz: wenn GameUI (noch) nicht da ist, lege No-Op an, damit keine Warns entstehen
    window.GameUI = window.GameUI || {};
    window.GameUI.openBuildMenu  = window.GameUI.openBuildMenu  || function(){ console.log('[ui-bridge] openBuildMenu (noop)'); };
    window.GameUI.closeBuildMenu = window.GameUI.closeBuildMenu || function(){ console.log('[ui-bridge] closeBuildMenu (noop)'); };

    btnBuild?.addEventListener('click', () => {
      try { window.GameUI.openBuildMenu?.(); } catch(_) {}
    });

    // ---------- Start-Panel Verdrahtung ----------
    // Erwartet: deine Start-Buttons feuern folgende Events/Calls:
    // - dispatchEvent('cb:ui-request-start', {detail:{mapPath}})
    // - GameServices.requestReset(), GameServices.clearCaches(), Inspector.logCopy() etc.
    const startPanel = document.getElementById('start-panel');

    // Fallback: wenn Start-Button ein data-map trägt, reagieren wir automatisch
    startPanel?.addEventListener('click', (ev)=>{
      const t = ev.target;
      if (!t) return;
      // Start
      if (t.matches('[data-action="start"]')) {
        const sel = startPanel.querySelector('[data-map-select]');
        const mapPath = (sel && sel.value) || './assets/maps/map-mini.json';
        window.dispatchEvent(new CustomEvent('cb:ui-request-start', { detail:{ mapPath }}));
        // UI ruft selbst GameLoader.start(); falls nicht, tun wir es zur Sicherheit:
        if (window.GameLoader?.start) window.GameLoader.start(mapPath);
      }
      // Neu-Start
      if (t.matches('[data-action="restart"]')) {
        window.GameServices?.requestReset?.();
      }
      // Cache-Booster
      if (t.matches('[data-action="cache"]')) {
        window.GameServices?.clearCaches?.();
      }
      // Log kopieren – deine Inspector-Implementierung hat dafür i.d.R. eine Funktion
      if (t.matches('[data-action="copy-log"]')) {
        try { window.Inspector?.copyLog?.(); } catch(_){}
      }
    });

    // ---------- Reaktionen auf Spielstart ----------
    window.addEventListener('cb:game-started', () => {
      showBuildBtn();               // Button einblenden
      startPanel?.setAttribute('hidden','hidden'); // dein Startfenster weg, sobald Spiel läuft
    });

    console.log('[index %s] UI bereit', INDEX_VERSION);
    window.dispatchEvent(new CustomEvent('cb:ui-ready', { detail: { v: INDEX_VERSION }}));
  })();
  </script>
</body>
</html>
