<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2419" />
  <title>Mini – v16.1.17</title>

  <!-- Basis-Styles (DEINE bestehenden Dateien – NICHT ändern) -->
  <link rel="preload" href="./css/base.css" as="style" />
  <link rel="preload" href="./style.css" as="style" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Nur Zusatz-Styles für Schwebe-Buttons & Build-Dock
       -> beeinflusst NICHT dein Start-Layout -->
  <style>
    /* === Floating Buttons (Inspector rechts unten, Build links unten) === */
    .cb-fab{
      position: fixed;
      z-index: 9000;
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20,20,20,.7);
      color: #fff; user-select: none; cursor: pointer;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 6px 16px rgba(0,0,0,.35);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: transform .15s ease, opacity .15s ease;
    }
    .cb-fab:active{ transform: scale(.96); }
    /* Build-Button: erscheint erst NACH Game-Start */
    #btn-build{ left: 12px; bottom: 12px; opacity: 0; pointer-events: none; }
    #btn-build.visible{ opacity: 1; pointer-events: auto; }
    /* Inspector-Button: dauerhaft sichtbar (deine Position beibehalten) */
    #btn-inspector{ right: 12px; bottom: 12px; }

    /* === Build-Dock (Bau-Menü unten, von ui-build.js bestückt) === */
    #build-dock{
      position: fixed; left: 0; right: 0; bottom: 0;
      z-index: 8000; display: none;
      padding: 10px 12px;
      background: rgba(18,18,18,.85);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255,255,255,.08);
    }
    #build-dock.open{ display: block; }
    #build-dock .row{ display: flex; gap: 10px; overflow-x: auto; }
    #build-dock .tool{
      min-width: 90px; height: 64px; border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: #0e1f18; color: #cfe6d8;
      display: flex; align-items: center; justify-content: center;
      padding: 6px 10px; font-weight: 600; white-space: nowrap;
    }
    #build-dock .tool.active{ outline: 2px solid #4dd186; background: #153a2c; }
    #build-dock .tool img{ height: 40px; object-fit: contain; pointer-events: none; }
  </style>
</head>

<body>
  <!-- =========================================================
       START-PANEL (DEINS) – Layout UNVERÄNDERT
       Wichtig ist nur die ID #start-panel, damit main.js es findet.
       ========================================================= -->
  <div id="start-panel" aria-label="City-Builder Start">
    <!-- Dein bestehendes Start-HTML (Karte wählen, Start, Neu-Start, Log kopieren, Cache-Booster, Hinweis …) -->
  </div>

  <!-- Game-Canvas (dein Canvas; wird in game.js skaliert) -->
  <canvas id="game" width="0" height="0"></canvas>

  <!-- Floating Buttons -->
  <button id="btn-inspector" class="cb-fab" title="Inspector">🛠️</button>
  <button id="btn-build" class="cb-fab" title="Bau-Menü">🏗️</button>

  <!-- Bau-Menü Dock (UI-Container; Inhalt liefert ui-build.js) -->
  <div id="build-dock" aria-label="Bau-Menü">
    <!-- ui-build.js füllt hier die Tool-Leiste -->
  </div>

  <!-- ===================== SCRIPTS =====================
       REIHENFOLGE IST WICHTIG:
       1) Inspector (für Logs & Start-Phase)
       2) Engine (game.js) -> stellt GameLoader bereit
       3) UI-Build (deine Bau-Menü-Logik)
       4) UI-Bridge (kleiner Kleber: Buttons + globale Hooks)
       5) main.js (dein Start/Boot – nutzt die obigen Hooks)
       =================================================== -->

  <!-- 1) Inspector (dein vorhandener Pfad) -->
  <script src="./assets/inspector/inspector.js"></script>

  <!-- 2) Engine -->
  <script src="./game.js"></script>

  <!-- 3) Bau-Menü (dein bestehendes UI) -->
  <script src="./assets/ui/ui-build.js"></script>

  <!-- 4) Bridge: stellt globale API bereit, die main.js erwartet.
         - window.GameUI.openBuildMenu()
         - window.GameUI.closeBuildMenu()
         - window.GameUI.setTool(name)
         - reagiert auf Events und zeigt/versteckt den Bau-Button -->
  <script>
  (function(){
    const log = (t)=> (window.CBLog?.ok||console.log)(t);

    // Minimal-Bridge-Objekt nur, falls nicht schon vorhanden:
    window.GameUI = window.GameUI || {};

    // Referenzen
    const btnBuild   = document.getElementById('btn-build');
    const buildDock  = document.getElementById('build-dock');

    // Hooks für main.js / Inspector
    window.GameUI.openBuildMenu  = function(){
      if (!buildDock) return;
      buildDock.classList.add('open');
      (window.CBLog?.ok||console.log)('[ok] Bau-Menü geöffnet (ui-bridge)');
      // Falls dein ui-build.js eigene Routine hat, hier aufrufen:
      try { window.UIBuild?.open?.(); } catch(_) {}
    };
    window.GameUI.closeBuildMenu = function(){
      if (!buildDock) return;
      buildDock.classList.remove('open');
      try { window.UIBuild?.close?.(); } catch(_) {}
    };
    window.GameUI.setTool = function(name){
      try { window.UIBuild?.setTool?.(name); } catch(_) {}
    };

    // Build-Button zeigt/verbirgt das Dock
    if (btnBuild){
      btnBuild.addEventListener('click', ()=>{
        if (buildDock.classList.contains('open')) {
          window.GameUI.closeBuildMenu();
        } else {
          window.GameUI.openBuildMenu();
        }
      });
    }

    // Nach Game-Start: Build-Button einblenden
    window.addEventListener('cb:game-started', ()=>{
      if (btnBuild){
        btnBuild.classList.add('visible');
        log('onGameStarted: Bau-Button aktiviert');
      }
    });

    // Vorsorglich: bei UI-ready einmal melden
    log('UI-Bridge bereit');
  })();
  </script>

  <!-- 5) Dein Start/Boot -->
  <script src="./main.js"></script>

  <!-- Index-Version ins Log + Event für den Inspector -->
  <script>
    (function(){
      const v = "v16.1.17";
      window.__cb = window.__cb || {};
      window.__cb.indexVersion = v;
      (window.CBLog?.ok||console.log)(`UI bereit (index ${v})`);
      window.dispatchEvent(new CustomEvent('cb:ui-ready', { detail: { v }}));
    })();
  </script>
</body>
</html>
