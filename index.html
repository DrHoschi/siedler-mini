<!doctype html>
<html lang="de">
<head>
  <!--
    Projekt: Siedler-Mini
    Datei:   index.html
    Version: v16.1.1
    Zweck:   UI-Shell, Log-Overlay, Build-FAB, Start-Flow & Cache-Tools
    Hinweise:
      - Start ist erst aktiv, wenn game.js "bereit" meldet.
      - Alle Logs zeigen die jeweilige Dateiversion mit an.
      - Cache-Busting via ?v=VERSION an allen Skript- & Asset-URLs.
  -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a1a0f" />
  <title>Siedler-Mini v16.1.1</title>
  <style>
    :root {
      --bg:#0f2618; --bg2:#153121; --panel:#0d1f15; --txt:#e6ffee;
      --ok:#32d26a; --warn:#f8d059; --err:#ff6b6b; --muted:#9ec3ae;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 14px;
      --gap: 12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    html,body{height:100%;margin:0;background:radial-gradient(1200px 600px at 50% -200px,#0b1d13 30%,#0a1a0f), var(--bg); color:var(--txt);}
    *{box-sizing:border-box}
    .wrap{min-height:100%; display:flex; flex-direction:column}
    header{position:fixed; inset:0 0 auto 0; padding:16px; pointer-events:none}
    .hud{display:flex; gap:10px; align-items:center; pointer-events:auto}
    .chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08); padding:8px 12px; border-radius:999px; font-weight:600; box-shadow:var(--shadow)}
    .btn{background:linear-gradient(#244e38,#1b3c2b); border:1px solid #204531; color:var(--txt); padding:10px 14px; border-radius:999px; font-weight:700; cursor:pointer; box-shadow:var(--shadow)}
    .btn[disabled]{opacity:.5; cursor:not-allowed}
    .grid{flex:1; display:flex; align-items:center; justify-content:center; padding:80px 16px 120px}
    canvas#game{display:block; width:100%; max-width:min(1400px, 96vw); aspect-ratio: 16 / 10; background:#244e38; border-radius:var(--radius); box-shadow:var(--shadow)}
    /* Log */
    #logPanel{position:fixed; right:16px; bottom:16px; width:min(560px, 92vw); max-height:min(52vh, 520px); overflow:auto; background:rgba(6,14,10,.85); border:1px solid rgba(255,255,255,.08); padding:12px; border-radius:16px; backdrop-filter:blur(6px); box-shadow:var(--shadow)}
    #logPanel.hidden{display:none}
    .logline{font-family:var(--mono); font-size:13px; line-height:1.45; white-space:pre-wrap}
    .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)} .muted{color:var(--muted)}
    .toolbar{display:flex; gap:8px; margin:8px 0 6px}
    .tbtn{background:#183626; border:1px solid #204a34; color:var(--txt); padding:6px 10px; border-radius:10px; cursor:pointer}
    /* Floating Build-Button */
    #fabBuild{position:fixed; right:16px; bottom:calc(16px + 0px); width:56px; height:56px; border-radius:50%; display:grid; place-items:center; font-size:22px}
    /* Bottom Build-Bar */
    #buildBar{position:fixed; left:0; right:0; bottom:0; background:linear-gradient(#0d2016,#0a1a10); border-top:1px solid rgba(255,255,255,.07); padding:10px 10px 14px; display:none; gap:10px; align-items:center; box-shadow:var(--shadow)}
    #buildBar.open{display:flex; flex-wrap:wrap; justify-content:center}
    .tool{min-width:120px; display:flex; align-items:center; gap:8px; justify-content:center; padding:10px 12px; border-radius:12px; background:#173c29; border:1px solid #205238; cursor:pointer}
    .tool.active{outline:2px solid #58e29a}
    .spacer{flex:1}
    /* Status dot */
    .dot{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; box-shadow:0 0 0 2px rgba(0,0,0,.35) inset}
    .dot.ok{background:#39d27c} .dot.off{background:#777}
    /* Mobile helpers */
    @media (max-width: 640px){ .tool{min-width:94px; font-size:14px} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="hud">
        <span id="statusChip" class="chip"><span class="dot off" id="dot"></span>CityBuilder <strong id="ver">v16.1.1</strong></span>
        <button id="btnStart" class="btn" disabled>Start</button>
        <button id="btnInspector" class="btn">Inspector</button>
        <button id="btnEditor" class="btn">Editor</button>
        <button id="btnLog" class="btn">Log</button>
        <button id="btnCache" class="btn">Cache</button>
      </div>
    </header>

    <div class="grid">
      <canvas id="game" width="1280" height="800" aria-label="Game Canvas"></canvas>
    </div>

    <!-- Log Panel -->
    <div id="logPanel" class="hidden" aria-live="polite">
      <div class="toolbar">
        <button class="tbtn" id="btnCopy">Log kopieren</button>
        <button class="tbtn" id="btnClear">Log leeren</button>
        <div class="spacer"></div>
        <span class="muted" id="logMeta"></span>
      </div>
      <div id="log"></div>
    </div>

    <!-- Floating Build Action Button -->
    <button id="fabBuild" class="btn" title="Bauen">🛠️</button>

    <!-- Build Bar -->
    <div id="buildBar" role="group" aria-label="Bauen">
      <button class="tool" data-tool="road">🛣️ Straße</button>
      <button class="tool" data-tool="path">🚶 Weg</button>
      <button class="tool" data-tool="bulldoze">🧹 Abreißen</button>
      <button class="tool" data-tool="house">🏠 Haus</button>
      <button class="tool" data-tool="factory">🏭 Fabrik</button>
      <div class="spacer"></div>
      <button class="tool" data-tool="cancel">⛔ Abbrechen</button>
    </div>
  </div>

  <!-- UI-Skripte (mit Cache-Busting) -->
  <script>
    // ---- Globale Versionen (werden im Log genutzt)
    window.__VERSIONS__ = {
      index: "v16.1.1",
      game:  "v16.1.1",
      ui:    "v16.1.1"
    };
  </script>
  <script src="./ui-build.js?v=16.1.1" defer></script>
  <script src="./game.js?v=16.1.1" defer></script>
  <script>
    // ------------------------------------------------------------
    // index bootstrap v16.1.1
    // ------------------------------------------------------------
    (function(){
      const $ = sel => document.querySelector(sel);
      const logEl = $("#log");
      const logMeta = $("#logMeta");
      const dot = $("#dot");
      const btnStart = $("#btnStart");
      const btnLog = $("#btnLog");
      const btnCopy = $("#btnCopy");
      const btnClear = $("#btnClear");
      const btnCache = $("#btnCache");
      const btnEditor = $("#btnEditor");
      const btnInspector = $("#btnInspector");
      const panel = $("#logPanel");
      const buildBar = $("#buildBar");
      const fabBuild = $("#fabBuild");
      const ver = window.__VERSIONS__;

      const now = ()=> new Date().toTimeString().slice(0,8);
      const line = (cls, icon, msg) => {
        const p = document.createElement("div");
        p.className = `logline ${cls}`;
        p.textContent = `[${now()}] ${icon} ${msg}`;
        logEl.appendChild(p);
        panel.scrollTop = panel.scrollHeight;
      };
      const ok  = m=>line("ok","✅ (ok) ",m);
      const warn= m=>line("warn","⚠️ (warn) ",m);
      const err = m=>line("err","❌ (err) ",m);
      const muted= m=>line("muted","ℹ️ ",m);

      function setReady(on){
        btnStart.disabled = !on;
        dot.classList.toggle("ok", !!on);
        dot.classList.toggle("off", !on);
      }

      function copyLog(){
        const txt = [...logEl.querySelectorAll(".logline")].map(n=>n.textContent).join("\n");
        navigator.clipboard.writeText(txt).then(()=>ok("Log in Zwischenablage"));
      }

      function clearAllCaches(){
        // Local/session storage
        try { localStorage.clear(); sessionStorage.clear(); } catch(e){}
        // Cache Storage (Service Worker Caches)
        if (window.caches) caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))));
        ok("Cache/Storage geleert – Seite ggf. neu laden");
      }

      // Panel toggle
      $("#btnLog").addEventListener("click", ()=> panel.classList.toggle("hidden"));
      btnCopy.addEventListener("click", copyLog);
      btnClear.addEventListener("click", ()=>{ logEl.innerHTML=""; });
      btnCache.addEventListener("click", clearAllCaches);

      // Build bar toggle
      fabBuild.addEventListener("click", ()=>{
        buildBar.classList.toggle("open");
        if (buildBar.classList.contains("open")) ok("Bau-Menü geöffnet");
        else ok("Bau-Menü geschlossen");
      });

      // Tools
      buildBar.addEventListener("click",(e)=>{
        const btn = e.target.closest(".tool");
        if(!btn) return;
        buildBar.querySelectorAll(".tool").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        const tool = btn.dataset.tool;
        ok(`Tool gesetzt: ${tool}`);
        if (window.UI && window.UI.setTool) window.UI.setTool(tool);
      });

      // Editor / Inspector Hooks – funktionieren, sobald game.js sie anbietet
      btnEditor.addEventListener("click", ()=>{
        if (window.GameEditor?.open) { window.GameEditor.open(); ok("Editor geöffnet"); }
        else warn("(Dummy) Editor.open() – echtes Modul noch nicht eingebunden.");
      });
      btnInspector.addEventListener("click", ()=>{
        if (window.GameInspector?.toggle) { const st = window.GameInspector.toggle(); ok(`Inspector: ${st?'an':'aus'}`); }
        else warn("(Dummy) Inspector.toggle() – echtes Modul noch nicht eingebunden.");
      });

      // Start-Button Logik
      async function waitFor(fn, ms=7000, step=50){
        const t0 = performance.now();
        return new Promise(res=>{
          const id = setInterval(()=>{
            if (fn()){ clearInterval(id); res(true); }
            else if (performance.now()-t0>ms){ clearInterval(id); res(false); }
          }, step);
        });
      }
      btnStart.addEventListener("click", async ()=>{
        const map = "./assets/maps/map-mini.json";
        ok(`Start gedrückt → ${map}`);
        const ready = await waitFor(()=>window.GameLoader && typeof window.GameLoader.start==="function", 7000);
        if(!ready){ err("GameLoader.start ist nicht verfügbar – game.js noch nicht initialisiert?"); return; }
        ok(`GameLoader.start ${map}`);
        try{
          await window.GameLoader.start(map);
        }catch(e){
          console.error(e);
          err("Start fehlgeschlagen: Unbekannter Fehler");
        }
      });

      // Boot-Meldungen
      ok(`UI ready (index ${ver.index})`);
      logMeta.textContent = `index ${ver.index} | ui-build ${ver.ui} | game ${ver.game}`;

      // Auf game.js warten -> Start freigeben
      (async ()=>{
        const ready = await waitFor(()=>window.GameReady === true, 7000);
        if(ready){ ok(`game.js initialisiert (Index meldet ${ver.game})`); setReady(true); }
        else { warn("GameLoader.start nach 5s noch nicht verfügbar (Game initialisiert noch?)."); }
      })();
    })();
  </script>
</body>
</html>
