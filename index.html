<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Siedler Mini – v16.1.2</title>

  <!--
    Projekt: Siedler Mini
    Datei: index.html
    Version: v16.1.2
    Zweck:
      - Start-UI, Log, Inspector-Dock, Build-UI
      - Responsive Toast-Statusleiste (HF: oben/unten, QF: links/rechts)
    Wichtig:
      - Alle JS/CSS mit ?v={VERSION} gegen Safari-Cache
      - Editor/Inspector lassen sich einklappen
  -->

  <!-- Basis-Styles -->
  <link rel="stylesheet" href="./css/base.css?v=16.1.2">
  <link rel="stylesheet" href="./assets/ui/ui-build.css?v=16.1.2">

  <style>
    /* ===== Inline-Ergänzungen für v16.1.2 (knapp gehalten) ===== */

    :root{
      --ui-bg: rgba(0,0,0,.5);
      --ui-pill: rgba(20,30,24,.7);
      --ui-green: #41e07a;
      --ui-yellow: #ffd65a;
      --ui-red: #ff6b6b;
      --white: #fff;
    }

    /* Toast/Status: HF oben/unten; QF links/rechts */
    .toast-rail {
      position: fixed;
      z-index: 50;
      display: flex;
      gap: .5rem;
      padding: .5rem;
      pointer-events: none; /* Einzel-Items sind klickbar */
    }
    .toast { 
      pointer-events: auto;
      background: var(--ui-pill);
      color: #cfe;
      padding: .4rem .6rem;
      border-radius: .6rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: .9rem;
      white-space: nowrap;
    }

    /* Hochformat: oben fix (du kannst bottom:0 für unten wählen) */
    @media (orientation: portrait){
      .toast-rail { top: env(safe-area-inset-top); left: 0; right: 0; justify-content: center; }
    }
    /* Querformat: links als vertikale Leiste */
    @media (orientation: landscape){
      .toast-rail { top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); flex-direction: column; }
    }

    /* Log-Panel */
    #logPanel {
      position: fixed; right: .75rem; bottom: .75rem; left: .75rem;
      max-height: 36vh; overflow: auto; padding: .75rem 1rem;
      background: rgba(0,0,0,.35); color: #9f9; border-radius: 1rem;
      font-family: ui-monospace, monospace; line-height: 1.35;
    }
    #logPanel small { opacity: .65 }
    .pill { display:inline-flex; align-items:center; gap:.35rem; padding:.25rem .55rem; border-radius:999px; }
    .pill.ok { background: rgba(65,224,122,.15); }
    .pill.warn { background: rgba(255,214,90,.15); }
    .pill.err { background: rgba(255,107,107,.15); }

    /* Canvas-Fit */
    #gameRoot { position: fixed; inset: 0; }
    canvas { display:block; width:100%; height:100%; }

    /* Floating Build-Button (öffnet/ schließt Bau-Menü) */
    #btnBuild {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 60;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--ui-green); color:#032; font-weight: 700;
      display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.35);
    }

    /* Inspector-Dock (Test-Cockpit) */
    #inspectorDock {
      position: fixed; top: env(safe-area-inset-top); right: .5rem; z-index: 70;
      width: min(380px, 92vw); max-height: 80vh; overflow:auto;
      background: rgba(15,25,20,.92); color:#def; border-radius: .8rem;
      padding: .8rem; backdrop-filter: blur(8px); display: none;
    }
    #inspectorDock.open { display:block; }
    #inspectorDock h3 { margin:.2rem 0 .6rem; font-size: 1.05rem; }
    #inspectorDock .row { display:flex; gap:.5rem; flex-wrap:wrap; margin:.5rem 0; }
    #inspectorDock button, #inspectorDock select {
      background: #2a3; color:#021; border:none; padding:.5rem .65rem; border-radius:.5rem;
    }
    #inspectorDock .row .ghost { background:#223; color:#9ad; }

    /* Build-Buttons: weißer BG für nicht freigestellte Icons */
    .build-btn {
      background: #fff;            /* <— wichtig für deine PNGs */
      border-radius: .75rem;
      border: 1px solid rgba(0,0,0,.2);
      width: 90px; height: 74px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:.25rem; box-shadow: 0 6px 14px rgba(0,0,0,.15);
    }
    .build-btn img { width: 56px; height: 56px; object-fit: contain; }
    .build-btn small { font-size: .7rem; color:#123; }
  </style>
</head>

<body>
  <!-- Status/Toast-Leiste -->
  <div class="toast-rail" id="toastRail">
    <div class="toast" id="toastVersion">UI v16.1.2</div>
  </div>

  <!-- Spiel-Root -->
  <div id="gameRoot">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>

  <!-- Log -->
  <div id="logPanel" aria-live="polite">
    <div><span class="pill ok">✅ ok</span> UI ready (index v16.1.2)</div>
  </div>

  <!-- Floating Buttons -->
  <button id="btnBuild" title="Bauen">🏗️</button>
  <button id="btnInspector" style="position:fixed;left:1rem;bottom:1rem;z-index:60;width:56px;height:56px;border-radius:50%;background:#8af;color:#013;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.35);" title="Inspector umschalten">🛠️</button>

  <!-- Inspector-Dock (Test-Cockpit) -->
  <section id="inspectorDock" role="dialog" aria-label="Inspector">
    <h3>Inspector / Test-Cockpit (v16.1.2)</h3>
    <div class="row">
      <button id="btnStartMini">Start map-mini.json</button>
      <button id="btnStartPro" class="ghost">Start map-pro.json</button>
      <button id="btnClearCache">Cache leeren</button>
      <button id="btnCopyLog" class="ghost">Log kopieren</button>
    </div>
    <div class="row">
      <button id="btnOpenBuild">Bau-Menü öffnen</button>
      <button id="btnCloseBuild" class="ghost">Bau-Menü schließen</button>
    </div>
    <div class="row">
      <label>Ressourcen:</label>
      <button data-r="+100">+100</button>
      <button data-r="+1000" class="ghost">+1000</button>
      <button data-r="max">∞</button>
      <button data-r="zero" class="ghost">0</button>
    </div>
    <div class="row">
      <small>Alle Tools & Booster für Tests hier bündeln, damit die Spieloberfläche frei bleibt.</small>
    </div>
  </section>

  <!-- ===== Scripts (mit Versionstoken) ===== -->
  <script>
    // Kleine Hilfen global (Version + Cache-Token + Log + Toast)
    const APP_VERSION = "16.1.2";
    const VER_QS     = `?v=${APP_VERSION}-${Date.now().toString(36)}`;

    const $ = sel => document.querySelector(sel);
    function logOk(msg){ appendLog(`✅ (ok) ${msg}`); }
    function logWarn(msg){ appendLog(`⚠️ (warn) ${msg}`); }
    function logErr(msg){ appendLog(`❌ (err) ${msg}`); }
    function appendLog(text){
      const p = document.createElement("div");
      p.textContent = `[${new Date().toTimeString().slice(0,8)}] ${text}`;
      $("#logPanel").appendChild(p);
      $("#logPanel").scrollTop = $("#logPanel").scrollHeight;
    }
    function toast(text){ $("#toastVersion").textContent = text; }

    // Inspector-Dock togglen
    $("#btnInspector").addEventListener("click", () => {
      $("#inspectorDock").classList.toggle("open");
    });

    // Cache-Booster (Storage + SW + Caches)
    async function clearAllCaches(){
      try {
        localStorage.clear(); sessionStorage.clear();
        if ('caches' in window){
          const names = await caches.keys();
          await Promise.all(names.map(n => caches.delete(n)));
        }
        if ('serviceWorker' in navigator){
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) await r.unregister();
        }
        logOk("Cache/Storage geleert – Seite ggf. neu laden");
      } catch(e){
        logWarn("Cache-Leeren: " + e.message);
      }
    }
    $("#btnClearCache").addEventListener("click", clearAllCaches);
    $("#btnCopyLog").addEventListener("click", async () => {
      await navigator.clipboard.writeText($("#logPanel").innerText);
      logOk("Log in Zwischenablage");
    });
  </script>

  <!-- Core + Game (mit Token) -->
  <script src="./core/asset.js?v=16.1.2"></script>
  <script src="./core/overlay-hooks.js?v=16.1.2"></script>
  <script src="./core/path-overlay.js?v=16.1.2"></script>
  <script src="./game.js?v=16.1.2"></script>

  <!-- UI-Build & Lumberjack (mit Token) -->
  <script src="./assets/ui/ui-build.js?v=16.1.2"></script>
  <script src="./buildings.lumberjack.js?v=16.1.2"></script>

  <script>
    // ===== Page-Wiring (nur Index-seitig, rest in ui-build.js / game.js) =====
    window.addEventListener("load", () => {
      toast(`UI v${APP_VERSION}`);
      logOk(`UI ready (index v${APP_VERSION})`);

      // Build-FAB
      $("#btnBuild").addEventListener("click", () => window.UI?.toggleBuildMenu?.());

      // Inspector-Start-Buttons
      $("#btnStartMini").addEventListener("click", () => window.GameLoader?.start?.("./assets/maps/map-mini.json"));
      $("#btnStartPro").addEventListener("click", () => window.GameLoader?.start?.("./assets/maps/map-pro.json"));

      // Ressourcen-Knöpfe
      $("#inspectorDock").addEventListener("click", ev => {
        const v = ev.target?.dataset?.r;
        if(!v) return;
        window.GameDebug?.grantResources?.(v);
      });
    });
  </script>
</body>
</html>
