name: Build Monolith

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  monolith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Monolith (ohne Archiv, ohne Bilder)
        run: |
          out="MONOLITH.txt"
          echo "<!-- Monolith Export $(date -u) -->" > $out
          echo "" >> $out
          
          # Alle relevanten Textdateien sammeln (inkl. assets/)
          find . -type f \
            \( -name "*.html" -o -name "*.js" -o -name "*.css" \
               -o -name "*.json" -o -name "*.yml" -o -name "*.yaml" \
               -o -name "*.md" -o -name "*.mmd" -o -name "*.txt" \
               -o -name "*.jonson" -o -name "filelist.*" \) \
            ! -path "./Archiv/*" \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            | sort \
            | while read file; do
                echo "===================================================================" >> $out
                echo "DATEI: $file" >> $out
                echo "===================================================================" >> $out
                cat "$file" >> $out
                echo -e "\n\n" >> $out
              done

      - name: Upload Monolith Artifact
        uses: actions/upload-artifact@v4
        with:
          name: monolith-export
          path: MONOLITH.txt
