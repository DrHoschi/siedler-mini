name: Build Monolith

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  monolith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Monolith (ohne Archiv, ohne Bilder)
        shell: bash
        run: |
          set -euo pipefail
          OUT="MONOLITH.txt"
          TMP="$(mktemp)"

          {
            echo "<!-- Monolith Export $(date -u) -->"
            echo
          } > "$TMP"

          # Alle relevanten Textdateien sammeln (inkl. assets/),
          # aber Archiv, .git, .github und die AUSGABEDATEI selbst ausschließen.
          find . -type f \
            \( -name "*.html" -o -name "*.js"    -o -name "*.css" \
               -o -name "*.json" -o -name "*.yml" -o -name "*.yaml" \
               -o -name "*.md"   -o -name "*.mmd" -o -name "*.txt" \
               -o -name "*.jonson" -o -name "filelist.*" \) \
            ! -path "./Archiv/*" \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -path "./$OUT" \
            | LC_ALL=C sort \
            | while IFS= read -r file; do
                {
                  echo "==================================================================="
                  echo "DATEI: $file"
                  echo "==================================================================="
                  # CRLF säubern, falls vorhanden
                  sed 's/\r$//' "$file"
                  echo
                  echo
                } >> "$TMP"
              done

          mv "$TMP" "$OUT"

      - name: Upload Monolith Artifact
        uses: actions/upload-artifact@v4
        with:
          name: monolith-export
          path: MONOLITH.txt
