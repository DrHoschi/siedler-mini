name: Build Monolith

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  monolith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Monolith (alles außer Bilder/Icons; Archiv ausgeschlossen)
        shell: bash
        run: |
          set -euo pipefail
          OUT="MONOLITH.txt"
          TMP="$(mktemp)"

          {
            echo "<!-- Monolith Export $(date -u) -->"
            echo
          } > "$TMP"

          # Alle Dateien aufnehmen – außer:
          #  • Archiv/, .git/, .github/
          #  • die Ausgabedatei selbst
          #  • Bilder/Icons (png|jpg|jpeg|gif|webp|avif|svg|ico|icns|bmp|tif|tiff)
          find . -type f \
            ! -path "./Archiv/*" \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -path "./${OUT}" \
            ! -iname "*.png"  ! -iname "*.jpg"  ! -iname "*.jpeg" \
            ! -iname "*.gif"  ! -iname "*.webp" ! -iname "*.avif" \
            ! -iname "*.svg"  ! -iname "*.ico"  ! -iname "*.icns" \
            ! -iname "*.bmp"  ! -iname "*.tif"  ! -iname "*.tiff" \
            | LC_ALL=C sort \
            | while IFS= read -r file; do
                {
                  echo "==================================================================="
                  echo "DATEI: $file"
                  echo "==================================================================="
                  # Windows-CRLF säubern; Binärdateien (falls vorhanden) werden dennoch 1:1 ausgegeben.
                  sed 's/\r$//' "$file" || cat "$file"
                  echo
                  echo
                } >> "$TMP"
              done

          mv "$TMP" "$OUT"

      - name: Upload Monolith Artifact
        uses: actions/upload-artifact@v4
        with:
          name: monolith-export
          path: MONOLITH.txt
