name: CI & Diagnose
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node einrichten
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        continue-on-error: true

      # Lints (optional – falls ESLint/Stylelint konfiguriert)
      - run: npm run lint --if-present
      - run: npm run stylelint --if-present

      # kleine „Smoke“-Tests für Inspector & CBLog
      - name: Run unit/e2e tests
        run: npm test --if-present

      # Statische Checks auf deine Schlüsseldateien
      - name: Inspect critical files
        run: |
          echo "## Inspector file summary" > diag.md
          for f in \
            assets/inspector/inspector.core.js \
            assets/inspector/inspector.logs.js \
            assets/inspector/inspector.build.js \
            assets/inspector/inspector.paths.js \
            assets/inspector/inspector.tests.js \
            assets/inspector/inspector.css \
            assets/core/cblog.polyfill.js \
            assets/ui/ui-bridge.js \
            index.html
          do
            echo -e "\n### $f" >> diag.md
            test -f "$f" && (echo "\`\`\`js" >> diag.md; sed -n '1,120p' "$f" >> diag.md; echo "\n\`\`\`" >> diag.md) || echo "_missing_" >> diag.md
          done
          echo -e "\n---\nBuild done: $(date -u +%FT%TZ)" >> diag.md

      # Artefakte anhängen (damit ich sie öffnen kann)
      - uses: actions/upload-artifact@v4
        with:
          name: inspector-diagnostics
          path: |
            diag.md
            assets/inspector/**
            assets/core/cblog.polyfill.js
            assets/ui/ui-bridge.js
            index.html

  pr-comment:
    needs: build-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inspector-diagnostics
          path: diag
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('diag/diag.md','utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
