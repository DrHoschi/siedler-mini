name: CI Baseline
on:
  push:
    paths: ["src/**", "tools/**", "package.json", "index.html", ".github/workflows/ci.yml", "docs/DEVELOPMENT_WORKFLOW_CURRENT.md"]
  pull_request:
    branches: [main]
    paths: ["src/**", "tools/**", "package.json", "index.html", ".github/workflows/ci.yml", "docs/DEVELOPMENT_WORKFLOW_CURRENT.md"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: Clean Runtime + CR/IM Regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run IM-18A + frozen predecessor regression
        shell: bash
        run: |
          set -o pipefail
          (npm run ci && node src/dev/cr-31-freeze-gate.node.js && node src/dev/cr-32a-self-test.node.js && node src/dev/cr-32b-self-test.node.js && node src/dev/cr-32c-self-test.node.js && node src/dev/im-13-freeze-gate.node.js && node src/dev/im-16a-self-test.node.js && node src/dev/im-16b-self-test.node.js && node src/dev/im-16c-self-test.node.js && node src/dev/im-16d-self-test.node.js && node src/dev/im-16e-self-test.node.js && node src/dev/im-16f-self-test.node.js && node src/dev/im-16g-self-test.node.js && node src/dev/im-17a-self-test.node.js && node src/dev/im-17b-self-test.node.js && node src/dev/im-17c-self-test.node.js && node src/dev/im-17d-self-test.node.js && node src/dev/im-17e-self-test.node.js && node src/dev/im-17f-self-test.node.js && node src/dev/im-17g-self-test.node.js && node src/dev/im-18a-self-test.node.js) 2>&1 | tee ci-baseline.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-baseline-${{ github.sha }}
          path: ci-baseline.log
          retention-days: 7
