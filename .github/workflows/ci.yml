name: CI Baseline
on:
  push:
    paths: ["src/**", "tools/**", "package.json", "index.html", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["src/**", "tools/**", "package.json", "index.html", ".github/workflows/ci.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: Clean Runtime + CR Regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run CR-19B Deterministic Reservation Arbitration gate + CR-19A and CR-18 frozen regression
        shell: bash
        run: |
          set -o pipefail
          (npm run ci && node src/dev/cr-18-freeze-gate.node.js && node src/dev/cr-19a-self-test.node.js && node src/dev/cr-19b-self-test.node.js) 2>&1 | tee ci-baseline.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-baseline-${{ github.sha }}
          path: ci-baseline.log
          retention-days: 7
