name: CI Baseline
on:
  push:
    paths: ["src/**", "tools/**", "package.json", "index.html", ".github/workflows/ci.yml", "docs/**", "README.md", "core/**", "data/**", "demo/**", "qa/**", "schemas/**", "ui/**"]
  pull_request:
    branches: [main]
    paths: ["src/**", "tools/**", "package.json", "index.html", ".github/workflows/ci.yml", "docs/**", "README.md", "core/**", "data/**", "demo/**", "qa/**", "schemas/**", "ui/**"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: Pre-CR22 Final Cleanup Regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run full modular regression and Pre-CR22 cleanup gates
        shell: bash
        run: |
          set -o pipefail
          (npm run ci && node src/dev/cr-21-freeze-gate.node.js && node src/dev/pre-cr22-cleanup-file-gate.node.js && node src/dev/pre-cr22-final-cleanup-gate.node.js) 2>&1 | tee ci-baseline.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-baseline-${{ github.sha }}
          path: ci-baseline.log
          retention-days: 7
