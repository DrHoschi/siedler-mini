name: Build Split Monolith

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  monolith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Split Monolith (Code + Docs)
        shell: bash
        run: |
          set -euo pipefail

          OUT_CODE="MONOLITH_CODE.txt"
          OUT_DOC="MONOLITH_DOC.txt"

          TMP_CODE="$(mktemp)"
          TMP_DOC="$(mktemp)"

          echo "<!-- Monolith Code Export $(date -u) -->" > "$TMP_CODE"
          echo "<!-- Monolith Docs Export $(date -u) -->" > "$TMP_DOC"

          echo >> "$TMP_CODE"
          echo >> "$TMP_DOC"

          # CODE-Dateien sammeln
          find . -type f \
            \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" \) \
            ! -path "./Archiv/*" ! -path "./.git/*" ! -path "./.github/*" \
            ! -iname "*.png" ! -iname "*.jpg" ! -iname "*.jpeg" ! -iname "*.gif" \
            ! -iname "*.webp" ! -iname "*.avif" ! -iname "*.svg" ! -iname "*.ico" \
            ! -iname "*.icns" ! -iname "*.bmp" ! -iname "*.tif" ! -iname "*.tiff" \
            | LC_ALL=C sort \
            | while IFS= read -r file; do
                {
                  echo "==================================================================="
                  echo "DATEI: $file"
                  echo "==================================================================="
                  sed 's/\r$//' "$file" || cat "$file"
                  echo
                  echo
                } >> "$TMP_CODE"
              done

          # DOKUMENTATION-Dateien sammeln
          find . -type f \
            \( -name "*.md" -o -name "*.mmd" -o -name "*.txt" \
               -o -name "*.yml" -o -name "*.yaml" -o -name "*.jonson" -o -name "filelist.*" \) \
            ! -path "./Archiv/*" ! -path "./.git/*" ! -path "./.github/*" \
            | LC_ALL=C sort \
            | while IFS= read -r file; do
                {
                  echo "==================================================================="
                  echo "DATEI: $file"
                  echo "==================================================================="
                  sed 's/\r$//' "$file" || cat "$file"
                  echo
                  echo
                } >> "$TMP_DOC"
              done

          mv "$TMP_CODE" "$OUT_CODE"
          mv "$TMP_DOC" "$OUT_DOC"

          # ZIP mit beiden Dateien erzeugen
          zip MONOLITH_EXPORT.zip "$OUT_CODE" "$OUT_DOC"

      - name: Upload Monolith Artifact
        uses: actions/upload-artifact@v4
        with:
          name: monolith-split-export
          path: MONOLITH_EXPORT.zip
