name: Code Snapshot

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.webp"
      - "**/*.gif"
      - "**/*.mp3"
      - "**/*.wav"
      - "**/*.mp4"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare metadata
        id: meta
        shell: bash
        run: |
          echo "commit=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          mkdir -p snapshots

      - name: Collect tracked text/code files
        shell: bash
        run: |
          git ls-files \
            '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' \
            '*.json' '*.jsonc' '*.md' '*.html' '*.css' \
            '*.yml' '*.yaml' '*.toml' '*.ini' '*.txt' '*.dot' \
            ':!:assets/**' ':!:snapshots/**' \
            > snapshots/_files.list
          echo "Collected $(wc -l < snapshots/_files.list) files"

      - name: Build monolith
        shell: bash
        run: |
          MONO="snapshots/CODES_MONOLITH_${{ steps.meta.outputs.commit }}-${{ steps.meta.outputs.date }}.txt"
          {
            echo "# Neue Siedler – Code Snapshot"
            echo "Commit: ${{ github.sha }}"
            echo "UTC: ${{ steps.meta.outputs.date }}"
            echo
            echo "## Files"
            sed 's/^/- /' snapshots/_files.list
            echo
            echo "## Contents"
            while IFS= read -r file; do
              echo
              echo "--------------------------------------------------------------------------------"
              echo "### FILE: $file"
              echo "--------------------------------------------------------------------------------"
              sed -e 's/\r$//' "$file"
            done < snapshots/_files.list
          } > "$MONO"

      - name: Build ZIP
        shell: bash
        run: |
          ZIP="snapshots/CODES_${{ steps.meta.outputs.commit }}-${{ steps.meta.outputs.date }}.zip"
          zip -q -@ "$ZIP" < snapshots/_files.list

      - name: Build manifest
        shell: bash
        run: |
          MANIFEST="snapshots/manifest_${{ steps.meta.outputs.commit }}-${{ steps.meta.outputs.date }}.json"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, statSync, writeFileSync } from 'node:fs';
          const list = readFileSync('snapshots/_files.list', 'utf8').split('\n').filter(Boolean);
          const data = list.map(file => ({
            file,
            size: statSync(file).size,
            sha256: createHash('sha256').update(readFileSync(file)).digest('hex')
          }));
          const commit = process.env.COMMIT;
          const date = process.env.DATE;
          writeFileSync(`snapshots/manifest_${commit}-${date}.json`, JSON.stringify(data, null, 2) + '\n');
          NODE
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
          DATE: ${{ steps.meta.outputs.date }}

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-snapshot-${{ steps.meta.outputs.commit }}-${{ steps.meta.outputs.date }}
          path: |
            snapshots/CODES_*.zip
            snapshots/CODES_MONOLITH_*.txt
            snapshots/manifest_*.json
          retention-days: 14
