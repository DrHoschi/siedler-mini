name: Export simple file list

on:
  workflow_dispatch: {}   # manuell starten
  push:                   # optional: bei jedem Push mitlaufen lassen
    branches: ["**"]

permissions: {}

jobs:
  filelist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build file list (exclude .github/ and Archiv/)
        shell: bash
        run: |
          set -euo pipefail
          # Liste aller Dateien, aber:
          #  - ohne .git/, .github/, Archiv/ (sowie archiv/, archive/)
          #  - nur relative Pfade, sortiert
          find . -type f \
            ! -path './.git/*' \
            ! -ipath './.github/*' \
            ! -ipath './Archiv/*' \
            ! -ipath './archiv/*' \
            ! -ipath './archive/*' \
            -printf '%P\n' \
          | sort > filelist.txt

      - name: Upload artifact (filelist.txt)
        uses: actions/upload-artifact@v4
        with:
          name: filelist
          path: filelist.txt
          if-no-files-found: error
