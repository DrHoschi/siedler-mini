<!-- ============================================================================
     Datei: index.html (HUD-Einbindung)
     Projekt: Neue Siedler
     Version: v1.0.0 (2025-10-13)
     Zweck : HUD-Leiste oben/seitlich andocken, 9-Slice-Rahmen für Ressourcenzellen
     Struktur: (#app) → #hud-bar (fixed) → .hud-strip → .hud-cell* + Pfeile
============================================================================ -->
<body>
  <div id="app">
    <!-- HUD-Leiste -->
    <div id="hud-bar" class="hud--portrait">
      <button class="hud-nav hud-nav--left" aria-label="links">&#9664;</button>

      <div class="hud-strip" id="hud-strip" tabindex="0">
        <!-- Zellen werden von ui/ui-hud.js gerendert -->
      </div>

      <button class="hud-nav hud-nav--right" aria-label="rechts">&#9654;</button>
    </div>

    <!-- Dein übriger Game-Content (Canvas etc.) -->
    <canvas id="game"></canvas>
  </div>

  <!-- Styles (bitte in ui/css/ui-hud.css ablegen) -->
  <link rel="stylesheet" href="ui/css/ui-hud.css">

  <!-- HUD Logik -->
  <script type="module" src="ui/ui-hud.js"></script>
</body>
